:root{
  --paper:#fff;--desk:#e4e4e0;--ink:#141414;--ink-2:#4a4a4a;--hair:#c9c9c4;--pen:#1b2f8a;--red:#c4161c;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:1.875rem;
}
*{box-sizing:border-box;border-radius:0}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.45 Archivo,Arial,Helvetica,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 20px 72px;background:var(--paper);min-height:100dvh}
@media (min-width:800px){body{background:var(--desk)}main{padding:48px 60px 96px}}
h1,h2,h3,legend,.cond{font-stretch:75%;font-weight:700}h1,h2,h3,.stem{text-wrap:balance}
h1{font-size:var(--t-xl);line-height:1.1;margin:0 0 6px}
h2{font-size:var(--t-l);margin:32px 0 8px}
h3{font-size:var(--t-m);font-stretch:100%;margin:20px 0 4px}
h1:focus,legend:focus,.note:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
.pen{stroke:var(--pen);stroke-width:2.6;fill:none;stroke-linecap:round}
.red{stroke:var(--red);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

button{font:600 1rem/1.2 Archivo,Arial,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);padding:11px 20px;min-height:44px;cursor:pointer}
button.p{background:var(--ink);color:var(--paper)}
button.l{border:0;padding:11px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:disabled{color:#767676;border-color:#767676;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);font-size:var(--t-s)}
.top b{font-stretch:75%;font-size:var(--t-m)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--red);font-weight:800}

/* cover page */
.cover{border-bottom:2px solid var(--ink);padding-bottom:14px}
.rules{margin:8px 0;padding-left:20px}.rules li{margin:4px 0}
.papers{border-top:2px solid var(--ink);margin-top:8px}
.papers button{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ink);padding:14px 0;font-weight:400}
.papers button b{font-stretch:75%;font-size:var(--t-l);font-weight:700}
.papers button span{grid-column:1;color:var(--ink-2);font-size:var(--t-s)}
.papers button i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:var(--t-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.papers button:hover:not(:disabled) b{text-decoration:underline}
.papers button:disabled b{color:#767676}

/* the answer box, used for answers and for filters */
fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.qn{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px}
.qn .cond{font-size:var(--t-l)}
.stem{font-size:var(--t-m);font-weight:600;font-stretch:100%;margin:6px 0 10px;white-space:pre-wrap}
.o{display:grid;grid-template-columns:24px 1fr 28px;gap:0 12px;align-items:start;padding:10px 0;position:relative;cursor:pointer}
.o input{position:absolute;left:0;top:10px;width:24px;height:24px;margin:0;opacity:0;cursor:pointer}
.box{width:24px;height:24px;border:1.5px solid var(--ink);position:relative;margin-top:1px;background:var(--paper)}
.box .x{position:absolute;inset:-5px;width:32px;height:32px;display:none}
.o input:checked + .box .x{display:block}
.o input:focus-visible + .box{outline:3px solid var(--pen);outline-offset:3px}
.o input:disabled{cursor:default}
.box .ring{position:absolute;inset:-10px;width:42px;height:42px}
.o small{display:block;color:var(--red);font-weight:600;font-size:var(--t-xs)}
.o .mk{width:26px;height:28px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 24px}
.cols .o{grid-template-columns:24px 1fr}

.note{border-left:2.5px solid var(--red);padding:2px 0 2px 12px;margin:14px 0 0 36px;font-size:var(--t-s)}
.note .s{display:block;margin-top:4px;font-size:var(--t-xs)}
.flag{border:1.5px solid var(--ink);padding:8px 12px;margin:12px 0 0 36px;font-size:var(--t-s)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}

details{margin-top:28px;border-top:1px solid var(--hair)}
summary{cursor:pointer;padding:12px 0;font-size:var(--t-s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:4px 0 16px}
.grid button{padding:0;min-height:40px;font-size:var(--t-s);font-weight:400;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);font-weight:700}
.grid .cur{outline:3px solid var(--pen);outline-offset:2px}

.score{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.score .n{font:400 5rem/1 "Reenie Beanie","Segoe Print",cursive;color:var(--red);position:relative;padding:4px 22px 0}
.score .n svg{position:absolute;inset:-4px 0;width:100%;height:calc(100% + 8px)}
table{border-collapse:collapse;width:100%;font-size:var(--t-s)}
td,th{border-bottom:1px solid var(--hair);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{border-bottom:1.5px solid var(--ink);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;white-space:nowrap}
.rev{border-top:2px solid var(--ink);margin-top:24px}

.tabs{display:flex;flex-wrap:wrap;gap:0 18px;border-bottom:2px solid var(--ink);margin-top:12px}
.tabs label{padding:10px 0 8px;cursor:pointer;border-bottom:4px solid transparent;font-size:var(--t-s);position:relative}
.tabs input{position:absolute;opacity:0}
.tabs label:has(input:checked){border-bottom-color:var(--ink);font-weight:700}
.tabs label:has(input:focus-visible){outline:3px solid var(--pen);outline-offset:2px}
.notes{overflow-wrap:break-word}
.notes h1{font-size:var(--t-xl);margin-top:24px}
.notes h2{border-top:1px solid var(--ink);padding-top:14px}
.notes table{display:block;overflow-x:auto;margin:10px 0}
.notes li{margin:3px 0}
.notes code{font-size:.9em}
</style>
</head>

ions.", "source": "Lecture 1 slide 15", "flag": "", "kind": "lecture"}, {"id": "w01-028", "week": 1, "topic": "Assessment", "type": "single", "q": "What percentage of the module mark is the in-class test (Component 1)?", "options": ["40%", "80%", "10%", "20%", "30%"], "answer": [3], "explain": "Component 1 is a one hour in class test worth 20%, held in the week 10 lecture.", "source": "Seminar 1 slide 10", "flag": "The slide says the in-class test is one hour in the week 10 lecture, but the real test is described as 50 minutes.", "kind": "seminar"}, {"id": "w01-029", "week": 1, "topic": "Assessment", "type": "single", "q": "Which statement below is NOT correct about the module assessment?", "options": ["The individual report carries an appendix of 400-500 words", "The report is submitted via Canvas", "The in-class test is in the week 10 lecture", "The individual report is worth 20% and the in-class test 80%", "The individual report is 2000 words"], "answer": [3], "explain": "Component 1 is the in-class test at 20%. Component 2 is the Individual Report of 2000 words at 80%, plus a 400-500 word appendix, submitted via Canvas.", "source": "Seminar 1 slide 10", "flag": "The slide says the in-class test is one hour in the week 10 lecture, but the real test is described as 50 minutes.", "kind": "seminar"}, {"id": "w01-030", "week": 1, "topic": "Assessment", "type": "single", "q": "How long is the appendix that accompanies the 2000 word individual report?", "options": ["1000 words", "500-1000 words", "400-500 words", "200-300 words", "100-200 words"], "answer": [2], "explain": "Component 2 is the Individual Report of 2000 words plus a 400-500 word appendix.", "source": "Seminar 1 slide 10", "flag": "", "kind": "seminar"}, {"id": "w01-031", "week": 1, "topic": "Assessment", "type": "single", "q": "Which element of the individual report carries the largest share of the marks (before weighting)?", "options": ["Research and evidence presented (15%)", "Content/breadth of topic, kedIn profile", "Avoid sharing source code publicly", "Create a GitHub profile and share your source code"], "answer": [0, 1, 2, 4, 6], "explain": "The recommended activities are a LinkedIn or ResearchGate profile, a GitHub profile, Latex instead of MS Word, a Unix based OS and open source software.", "source": "Seminar 1 slide 14", "flag": "", "kind": "seminar"}, {"id": "w01-035", "week": 1, "topic": "Assessment", "type": "single", "q": "Is the following statement correct? The individual report is a 2000 word report on the topic of your choice.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "The slide says \"2000 word report on the topic of your choice.\"", "source": "Seminar 1 slide 11", "flag": "", "kind": "seminar"}, {"id": "w01-036", "week": 1, "topic": "GDPR principles", "type": "multi", "q": "Under Article 5 of the GDPR, personal data shall be:", "options": ["processed only with the explicit consent of the individual", "kept in an identifiable form for no longer than is necessary", "adequate, relevant and limited to what is necessary", "accurate and, where necessary, kept up to date", "processed lawfully, fairly and in a transparent manner in relation to individuals", "collected for specified, explicit and legitimate purposes", "processed in a manner that ensures appropriate security"], "answer": [1, 2, 3, 4, 5, 6], "explain": "Article 5, points a to f, lists these six principles. Explicit consent is not a principle, because it is only one lawful basis.", "source": "ICO overview p5", "flag": "", "kind": "reading"}, {"id": "w01-037", "week": 1, "topic": "GDPR principles", "type": "single", "q": "What is the most significant addition to the principles under the GDPR compared with the DPA?", "options": ["The data portability principle", "The accountability principle", "The data minimisation principle", "The right to be forgotten"], "answer": [1], "explain": "'The most significant addition is the accountability principle.'", "source": "ICO overview p5", "flag": "", "kind": "reading"}, {"id": "w01-038", "week": 1, "topic": "GDPR principles", "type": "single", "q": "Article 5(2) says that who shall be responsible for, and be able to demonstrate, compliance with the principles?", "options": ["The controller", "The data subject", "The data protection officer", "The ICO", "The processor"], "answer": [0], "explain": "'the controller shall be responsible for, and be able to demonstrate, compliance with the principles.'", "source": "ICO overview p5", "flag": "", "kind": "reading"}, {"id": "w01-039", "week": 1, "topic": "GDPR scope", "type": "single", "q": "Is the following statement correct? Under the GDPR, the processor says how and why personal data is processed, and the controller acts on the processor's behalf.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "The controller says how and why personal data is processed. The processor acts on the controller's behalf.", "source": "ICO overview p3", "flag": "", "kind": "reading"}, {"id": "w01-040", "week": 1, "topic": "GDPR scope", "type": "multi", "q": "The GDPR does not apply to which of the following?", "options": ["Processing for national security purposes", "Organisations outside the EU that offer goods or services to EU citizens", "Processing covered by the Law Enforcement Directive", "Processing carried out by individuals purely for personal/household activities", "Processors acting on behalf of a controller"], "answer": [0, 2, 3], "explain": "The GDPR excludes processing under the Law Enforcement Directive, national security processing, and purely personal or household activities. Non-EU organisations offering goods or services to EU citizens are covered.", "source": "ICO overview p3", "flag": "", "kind": "reading"}, {"id": "w01-041", "week": 1, "topic": "GDPR scope", "type": "single", "q": "Which of the following is given as an example of an online identifier that can be personal data under the GDPR?", "options": ["An IP address", "A postcode", "A job title", "A company name"], "answer": [0], "explain": "'information such as an online identifier - eg an IP address - can be personal data.'", "source": "ICO overview p4", "flag": "", "kind": "reading"}, {"id": "w01-042", "week": 1, "topic": "GDPR scope", "type": "single", "q": "Which statement below is NOT correct about special categories of personal data?", "options": ["Personal data relating to criminal convictions and offences are included in the special categories", "They specifically include genetic and biometric data where processed to uniquely identify an individual", "Sensitive personal data is referred to as special categories of personal data (Article 9)", "Criminal convictions data attract similar extra safeguards under Article 10"], "answer": [0], "explain": "Criminal convictions and offences data are not in the special categories, but similar extra safeguards apply under Article 10.", "source": "ICO overview p4", "flag": "", "kind": "reading"}, {"id": "w01-043", "week": 1, "topic": "Lawful basis", "type": "multi", "q": "Which of the following are legal bases for processing personal data under Article 6(1)?", "options": ["Performance of a contract with the data subject", "Compliance with a legal obligation", "Performance of a task carried out in the public interest", "Commercial advantage of the controller", "Legitimate interests pursued by the controller or a third party", "Protecting the vital interests of a data subject or another person", "Consent of the data subject"], "answer": [0, 1, 2, 4, 5, 6], "explain": "Article 6, paragraph 1, points a to f, lists consent, contract, legal obligation, vital interests, public task and legitimate interests.", "source": "ICO overview p7", "flag": "", "kind": "reading"}, {"id": "w01-044", "week": 1, "topic": "Lawful basis", "type": "single", "q": "Is the following statement correct? The legitimate interests condition is available to processing carried out by public authorities in the performance of their tasks.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "The note says this condition is not available to processing carried out by public authorities in the performance of their tasks.", "source": "ICO overview p7", "flag": "", "kind": "reading"}, {"id": "w01-045", "week": 1, "topic": "Consent", "type": "multi", "q": "Which of the following are requirements for consent under the GDPR?", "options": ["It must be verifiable, with a record of how and when it was given", "Silence can constitute consent", "It must be freely given, specific, informed and an unambiguous indication of wishes", "Pre-ticked boxes are sufficient", "Individuals can withdraw it at any time", "It requires some form of clear affirmative action"], "answer": [0, 2, 4, 5], "explain": "Silence, pre-ticked boxes and inactivity do not count as consent. Consent must be verifiable and can be withdrawn at any time.", "source": "ICO overview p8-9", "flag": "", "kind": "reading"}, {"id": "w01-046", "week": 1, "topic": "Children", "type": "single", "q": "Under the GDPR, parental/guardian consent for access to online services is required for children aged 16 and under. What is the lowest age a member state may set in law?", "options": ["12", "14", "15", "13"], "answer": [3], "explain": "Member states may set a lower age in law \"as long as it is not below 13\".", "source": "ICO overview p9", "flag": "Real GDPR Article 8 says \"below 16\", so 16 counts as adult, while the ICO text says \"aged 16 and under\". Follow the ICO wording.", "kind": "reading"}, {"id": "w01-047", "week": 1, "topic": "Children", "type": "single", "q": "Is the following statement correct? Parental/guardian consent is not required where the processing is related to preventative or counselling services offered directly to a child.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "'Parental/guardian consent is not required where the processing is related to preventative or counselling services offered directly to a child.'", "source": "ICO overview p9", "flag": "", "kind": "reading"}, {"id": "w01-048", "week": 1, "topic": "Individual rights", "type": "single", "q": "How many rights for individuals does the GDPR list in its overview?", "options": ["Seven", "Eight", "Six", "Five", "Ten"], "answer": [1], "explain": "The list runs from 1. be informed to 8. rights in relation to automated decision making and profiling.", "source": "ICO overview p11", "flag": "", "kind": "reading"}, {"id": "w01-049", "week": 1, "topic": "Individual rights", "type": "multi", "q": "Which of the following are rights provided to individuals by the GDPR?", "options": ["The right to financial compensation for every breach", "The right of access", "The right to erasure", "The right to data portability", "The right to be informed", "The right to restrict processing", "The right to rectification"], "answer": [1, 2, 3, 4, 5, 6], "explain": "The listed rights are to be informed, access, rectification, erasure, restrict processing, data portability, object, and rights on automated decision making and profiling.", "source": "ICO overview p11", "flag": "", "kind": "reading"}, {"id": "w01-050", "week": 1, "topic": "Right of access", "type": "single", "q": "Under the GDPR, within what time must a subject access request be answered?", "options": ["Without delay and at the latest within one month of receipt", "Within 30 working days", "Within three months", "Within 40 days", "Within 20 working days"], "answer": [0], "explain": "'Information must be provided without delay and at the latest within one month of receipt.'", "source": "ICO overview p12", "flag": "", "kind": "reading"}, {"id": "w01-051", "week": 1, "topic": "Right of access", "type": "single", "q": "By how long can the period for complying with a complex or numerous subject access request be extended?", "options": ["A further one month", "A further 20 working days", "A further two months", "A further three months"], "answer": [2], "explain": "'You will be able to extend the period of compliance by a further two months where requests are complex or numerous.'", "source": "ICO overview p12", "flag": "", "kind": "reading"}, {"id": "w01-052", "week": 1, "topic": "Right of access", "type": "single", "q": "Which fee for dealing with a subject access request was removed by the GDPR?", "options": ["The 10 pound fee", "The 25 pound fee", "The 5 pound fee", "The 50 pound fee"], "answer": [0], "explain": "The text says \"The removal of the 10 pound subject access fee is a significant change from the existing rules under the DPA.\"", "source": "ICO overview p12", "flag": "The pound sign is garbled in the extract, so it is read as 10 pounds from context.", "kind": "reading"}, {"id": "w01-053", "week": 1, "topic": "Right of access", "type": "multi", "q": "Where a subject access request is manifestly unfounded or excessive, in particular because it is repetitive, an organisation can:", "options": ["ignore the request without telling the individual", "charge a reasonable fee taking into account the administrative costs", "refuse to respond", "extend the deadline by six months"], "answer": [1, 2], "explain": "You can charge a reasonable fee or refuse to respond. If you refuse, you must explain why and tell the person about the right to complain.", "source": "ICO overview p12-13", "flag": "", "kind": "reading"}, {"id": "w01-054", "week": 1, "topic": "Right to be informed", "type": "multi", "q": "The information supplied about the processing of personal data must be:", "options": ["supplied only on request", "limited to the controller's name", "free of charge", "concise, transparent, intelligible and easily accessible", "written in clear and plain language, particularly if addressed to a child"], "answer": [2, 3, 4], "explain": "The information must be concise, transparent, intelligible and easily accessible. It must also be in clear plain language and free of charge.", "source": "ICO overview p14", "flag": "", "kind": "reading"}, {"id": "w01-055", "week": 1, "topic": "Right to be informed", "type": "single", "q": "When data is not obtained directly from the data subject, when must the privacy information be provided at the latest (absent other triggers)?", "options": ["Within three months", "Within a reasonable period of having obtained the data (within one month)", "At the time the data are obtained", "Within 72 hours"], "answer": [1], "explain": "When data is not obtained directly, the privacy information is due within a reasonable period of having obtained the data, and within one month.", "source": "ICO overview p15", "flag": "", "kind": "reading"}, {"id": "w01-056", "week": 1, "topic": "Right to erasure", "type": "single", "q": "Is the following statement correct? The right to erasure is an absolute right to be forgotten.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "'The right to erasure does not provide an absolute right to be forgotten.'", "source": "ICO overview p18", "flag": "", "kind": "reading"}, {"id": "w01-057", "week": 1, "topic": "Right to erasure", "type": "multi", "q": "In which of the following situations does the right to erasure apply?", "options": ["The data is processed to exercise freedom of expression and information", "The data was unlawfully processed", "The data is processed in relation to information society services offered to a child", "The individual objects and there is no overriding legitimate interest", "The individual withdraws consent", "The data is no longer necessary for the purpose it was collected", "The data must be erased to comply with a legal obligation"], "answer": [1, 2, 3, 4, 5, 6], "explain": "These six circumstances are listed. Freedom of expression is a ground to refuse erasure.", "source": "ICO overview p18", "flag": "", "kind": "reading"}, {"id": "w01-058", "week": 1, "topic": "Right to erasure", "type": "multi", "q": "An organisation can refuse to comply with a request for erasure where the data is processed for which of the following reasons?", "options": ["For archiving, scientific research, historical research or statistical purposes", "To comply with a legal obligation for a public interest task or official authority", "The individual has withdrawn consent", "To exercise the right of freedom of expression and information", "For public health purposes in the public interest", "For the exercise or defence of legal claims", "The data is no longer necessary for its original purpose"], "answer": [0, 1, 3, 4, 5], "explain": "The refusal grounds are freedom of expression, legal obligation or public interest task, public health, archiving, research and statistics, and legal claims.", "source": "ICO overview p18", "flag": "", "kind": "reading"}, {"id": "w01-059", "week": 1, "topic": "Right to restrict", "type": "single", "q": "When processing is restricted under the GDPR, what is the organisation permitted to do with the personal data?", "options": ["Transfer it freely to third countries", "Delete it immediately", "Store it but not further process it", "Process it for any purpose after one month"], "answer": [2], "explain": "'When processing is restricted, you are permitted to store the personal data, but not further process it.'", "source": "ICO overview p20", "flag": "", "kind": "reading"}, {"id": "w01-060", "week": 1, "topic": "Data portability", "type": "multi", "q": "The right to data portability only applies:", "options": ["to manual paper records", "to personal data an individual has provided to a controller", "where processing is based on legitimate interests", "when processing is carried out by automated means", "where processing is based on the individual's consent or for the performance of a contract"], "answer": [1, 3, 4], "explain": "Portability applies to data provided to a controller, based on consent or contract, by automated means.", "source": "ICO overview p21", "flag": "", "kind": "reading"}, {"id": "w01-061", "week": 1, "topic": "Data portability", "type": "single", "q": "Which of the following is given as an example of an open format for data portability?", "options": ["JPEG images", "Word documents", "CSV files", "PDF files"], "answer": [2], "explain": "'You must provide the personal data in a structured, commonly used and machine readable form. Open formats include CSV files.'", "source": "ICO overview p21", "flag": "", "kind": "reading"}, {"id": "w01-062", "week": 1, "topic": "Right to object", "type": "single", "q": "Is the following statement correct? An organisation may refuse an objection to direct marketing if it can show compelling legitimate grounds.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "For direct marketing you must stop as soon as you receive an objection. There are no exemptions or grounds to refuse.", "source": "ICO overview p23", "flag": "", "kind": "reading"}, {"id": "w01-063", "week": 1, "topic": "Automated decisions", "type": "multi", "q": "Where a decision is based on automated processing and has a legal or similarly significant effect, individuals must be able to:", "options": ["obtain human intervention", "demand the decision-maker's source code", "obtain an explanation of the decision and challenge it", "have the decision automatically reversed", "express their point of view"], "answer": [0, 2, 4], "explain": "The GDPR requires the ability to obtain human intervention, express a view, and obtain an explanation and challenge the decision.", "source": "ICO overview p25", "flag": "", "kind": "reading"}, {"id": "w01-064", "week": 1, "topic": "Automated decisions", "type": "multi", "q": "The GDPR defines profiling as automated processing to evaluate personal aspects of an individual, in particular to analyse or predict their:", "options": ["reliability", "religious beliefs", "economic situation", "location", "performance at work", "movements", "health"], "answer": [0, 2, 3, 4, 5, 6], "explain": "The listed aspects are performance at work, economic situation, health, personal preferences, reliability, behaviour, location and movements.", "source": "ICO overview p25-26", "flag": "", "kind": "reading"}, {"id": "w01-065", "week": 1, "topic": "Accountability", "type": "single", "q": "Above what number of employees must an organisation maintain additional internal records of its processing activities?", "options": ["250", "500", "1000", "50", "100"], "answer": [0], "explain": "The text says \"if your organisation has more than 250 employees, you must maintain additional internal records of your processing activities.\"", "source": "ICO overview p28", "flag": "The ICO text says \"more than 250\" and \"less than 250\", which leaves exactly 250 unaddressed.", "kind": "reading"}, {"id": "w01-066", "week": 1, "topic": "Accountability", "type": "multi", "q": "Which of the following are measures listed for data protection by design and by default?", "options": ["Creating and improving security features on an ongoing basis", "Data minimisation", "Pseudonymisation", "Transparency", "Allowing individuals to monitor processing"], "answer": [0, 1, 2, 3, 4], "explain": "Measures could include these five.", "source": "ICO overview p27-28", "flag": "", "kind": "reading"}, {"id": "w01-067", "week": 1, "topic": "DPIA", "type": "multi", "q": "Which of the following are processing likely to result in a high risk, so a DPIA is needed?", "options": ["Large scale, systematic monitoring of public areas (CCTV)", "Processing that uses no new technology and carries low risk", "Keeping a small staff telephone list", "Systematic and extensive processing activities, including profiling, with legal or similarly significant effects", "Large scale processing of special categories of data or criminal convictions data"], "answer": [0, 3, 4], "explain": "High risk includes systematic and extensive profiling, large scale special category data, and large scale CCTV monitoring.", "source": "ICO overview p29", "flag": "", "kind": "reading"}, {"id": "w01-068", "week": 1, "topic": "DPO", "type": "multi", "q": "Under the GDPR, an organisation must appoint a data protection officer (DPO) if it:", "options": ["has more than 250 employees", "processes any children's data", "is a public authority (except courts acting in their judicial capacity)", "carries out large scale processing of special categories of data or data about criminal convictions", "carries out large scale systematic monitoring of individuals"], "answer": [2, 3, 4], "explain": "A DPO is required for public authorities, large scale systematic monitoring, and large scale special category/criminal data.", "source": "ICO overview p30", "flag": "", "kind": "reading"}, {"id": "w01-069", "week": 1, "topic": "DPO", "type": "single", "q": "To which level of the organisation must the data protection officer report?", "options": ["The supervisory authority", "The head of HR", "The IT manager", "The highest management level (board level)"], "answer": [3], "explain": "'The DPO reports to the highest management level of your organisation - ie board level.'", "source": "ICO overview p31", "flag": "", "kind": "reading"}, {"id": "w01-070", "week": 1, "topic": "DPO", "type": "multi", "q": "Which of the following are minimum tasks of the DPO defined in Article 39?", "options": ["Be the first point of contact for supervisory authorities and for individuals", "Approve every marketing campaign", "Monitor compliance, including training staff and conducting internal audits", "Act as the processor for the organisation", "Inform and advise the organisation and employees about their obligations"], "answer": [0, 2, 4], "explain": "The Article 39 tasks are to inform and advise, monitor compliance including training, audits and DPIA advice, and be the first point of contact.", "source": "ICO overview p30-31", "flag": "", "kind": "reading"}, {"id": "w01-071", "week": 1, "topic": "Breach notification", "type": "single", "q": "Within how many hours of becoming aware of a notifiable personal data breach must it be reported to the supervisory authority?", "options": ["48 hours", "24 hours", "72 hours", "7 days"], "answer": [2], "explain": "'A notifiable breach has to be reported to the relevant supervisory authority within 72 hours of the organisation becoming aware of it.'", "source": "ICO overview p36", "flag": "", "kind": "reading"}, {"id": "w01-072", "week": 1, "topic": "Breach notification", "type": "multi", "q": "A personal data breach means a breach of security leading to the:", "options": ["unauthorised disclosure of personal data", "loss of personal data", "unauthorised access to personal data", "destruction of personal data", "alteration of personal data", "publication of a privacy notice"], "answer": [0, 1, 2, 3, 4], "explain": "'destruction, loss, alteration, unauthorised disclosure of, or access to, personal data'.", "source": "ICO overview p35", "flag": "", "kind": "reading"}, {"id": "w01-073", "week": 1, "topic": "Breach notification", "type": "single", "q": "Is the following statement correct? Individuals must be notified directly of a breach where it is likely to result in a high risk to their rights and freedoms.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "'Where a breach is likely to result in a high risk ... you must notify those concerned directly.'", "source": "ICO overview p35", "flag": "", "kind": "reading"}, {"id": "w01-074", "week": 1, "topic": "Fines", "type": "single", "q": "What is the maximum fine given for failing to notify a breach when required to do so?", "options": ["Up to 5 million Euros or 1 per cent of global turnover", "Up to 10 million Euros or 2 per cent of global turnover", "Up to 20 million Euros or 4 per cent of global turnover", "Up to 1 million Euros or 2 per cent of global turnover"], "answer": [1], "explain": "For failing to notify a breach, the text gives \"a significant fine up to 10 million Euros or 2 per cent of your global turnover\".", "source": "ICO overview p36", "flag": "Real GDPR has a higher tier of 20 million Euros or 4 per cent for other infringements, but the ICO overview only gives 10 million and 2 per cent here.", "kind": "reading"}, {"id": "w01-075", "week": 1, "topic": "Codes of conduct", "type": "single", "q": "How long is a certification under an approved GDPR certification mechanism valid for at most?", "options": ["Five years", "Two years", "Three years", "One year"], "answer": [2], "explain": "'Any certification will be valid for a maximum of three years.'", "source": "ICO overview p33", "flag": "", "kind": "reading"}, {"id": "w01-076", "week": 1, "topic": "Codes of conduct", "type": "single", "q": "What does EDPB stand for, the body that must approve cross-border codes of conduct?", "options": ["European Digital Protection Board", "European Data Privacy Bureau", "Economic Data Protection Body", "European Data Protection Board"], "answer": [3], "explain": "Codes must be approved by the supervisory authority and, where processing is cross-border, by the European Data Protection Board, the EDPB.", "source": "ICO overview p32", "flag": "", "kind": "reading"}, {"id": "w01-077", "week": 1, "topic": "Data transfers", "type": "multi", "q": "Which of the following can provide adequate safeguards for transferring personal data outside the EU?", "options": ["Binding corporate rules", "A legally binding agreement between public authorities or bodies", "Compliance with an approved code of conduct", "Certification under an approved certification mechanism", "Standard data protection clauses adopted by the Commission", "The organisation's own assessment of adequacy", "A verbal assurance from the recipient"], "answer": [0, 1, 2, 3, 4], "explain": "Article 46 safeguards include these. The GDPR limits transfers based only on your own assessment of adequacy.", "source": "ICO overview p37-38", "flag": "", "kind": "reading"}, {"id": "w02-001", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which statement below is NOT correct?", "options": ["Sensitive personal data includes political opinions and sexual preferences.", "Sensitive personal data includes racial or ethnical origins and religious believes.", "Sensitive personal data means any raw facts gathered about someone or something.", "Sensitive personal data includes physical or mental health and criminal records."], "answer": [2], "explain": "Raw facts gathered about someone or something is the definition of data. Sensitive personal data is personal data related to racial or ethnical origins, religious believes, political opinions, physical/mental health, sexual preferences, criminal records.", "source": "Lecture 2 slide 7", "flag": "", "kind": "lecture"}, {"id": "w02-002", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which statement below is NOT correct?", "options": ["Personal data is data about a living person who can be identified from the data.", "Personal data is data about human beings.", "Processing is anything you do with personal data, such as hold, store, gather, delete or modify.", "Personal data is data about a person who has died and cannot be identified from the data."], "answer": [3], "explain": "Personal data is data about a living person who can be identified from the data. These are human beings.", "source": "Lecture 2 slide 7", "flag": "", "kind": "lecture"}, {"id": "w02-003", "week": 2, "topic": "Data Protection", "type": "single", "q": "Does the Data Protection Act 2018 include GDPR?", "options": ["No, the two are completely unrelated", "Yes, it includes GDPR", "Only for data held in manual records", "No, GDPR replaced the DPA 2018 entirely"], "answer": [1], "explain": "The slide states that the Data Protection Act 2018 'includes GDPR', and that you should read the DPA 2018 alongside GDPR.", "source": "Lecture 2 slide 22", "flag": "Slide says DPA 2018 'includes' GDPR. In real law the DPA 2018 supplements and tailors the GDPR rather than containing it. Follow the slide.", "kind": "lecture"}, {"id": "w02-004", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which body enforces the Data Protection Act in the UK?", "options": ["The Mailing Preference Service", "The Data Protection Register", "The Information Commissioner (ICO)", "The Federal Trade Commission (FTC)"], "answer": [2], "explain": "The Information Commissioner, the ICO, enforces the DPA in the UK.", "source": "Lecture 2 slide 9", "flag": "", "kind": "lecture"}, {"id": "w02-005", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? Personal Data shall not be transferred to a country outside the EEA unless that country ensures an adequate level of protection for the rights and freedoms of data subjects in relation to the processing of personal data.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "This is Principle 8, Transfer Abroad, quoted from the slide.", "source": "Lecture 2 slide 19", "flag": "", "kind": "lecture"}, {"id": "w02-006", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? Personal data shall be adequate, relevant and excessive in relation to the purposes for which they are processed.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "Principle #3 says adequate, relevant and NOT excessive.", "source": "Lecture 2 slide 15", "flag": "", "kind": "lecture"}, {"id": "w02-007", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? Personal data shall be obtained for one or more specified and lawful purposes, and may be further processed in any manner the controller chooses.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "Principle 2 says the data shall not be further processed in any manner incompatible with that purpose or those purposes.", "source": "Lecture 2 slide 14", "flag": "", "kind": "lecture"}, {"id": "w02-008", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? Putting personal data on the internet counts as a world-wide transfer.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "The Principle 8 slide says \"putting on the internet = world-wide transfer\".", "source": "Lecture 2 slide 19", "flag": "", "kind": "lecture"}, {"id": "w02-009", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which principle number covers the transfer of personal data abroad?", "options": ["Principle 6", "Principle 8", "Principle 5", "Principle 7"], "answer": [1], "explain": "Principle 8 covers Transfer Abroad. Principle 7 is security, Principle 6 is the rights of a data subject and Principle 5 is retention.", "source": "Lecture 2 slide 19", "flag": "", "kind": "lecture"}, {"id": "w02-010", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which principle covers the rights of a data subject?", "options": ["Principle 4", "Principle 8", "Principle 6", "Principle 2"], "answer": [2], "explain": "Principle 6 covers the rights of a data subject. Principles 1-5, 7 and 8 are obligations on Data Controllers.", "source": "Lecture 2 slide 20", "flag": "", "kind": "lecture"}, {"id": "w02-011", "week": 2, "topic": "Data Protection", "type": "single", "q": "Under the DPA principles, which set of principles places obligations on Data Controllers?", "options": ["Principles 1-4 and 6-8", "Principle 6 only", "Principles 1-6 only", "Principles 1-5, 7 and 8"], "answer": [3], "explain": "Principles 1-5, 7 and 8 are the obligations on Data Controllers. The rights of Data Subjects are Principle 6.", "source": "Lecture 2 slide 11", "flag": "", "kind": "lecture"}, {"id": "w02-012", "week": 2, "topic": "Data Protection", "type": "single", "q": "Under Principle 6, a data subject can normally access data held on them within how many days, and with a fee of up to what?", "options": ["14 days, no fee", "40 days, fee up to £10", "28 days, fee up to £50", "30 days, fee up to £5"], "answer": [1], "explain": "The slide says you can \"access any data held on you, normally within 40 days, and fee up to £10\".", "source": "Lecture 2 slide 20", "flag": "The slide figures differ from current law, where the GDPR gives one month and is normally free. Follow the slide.", "kind": "lecture"}, {"id": "w02-013", "week": 2, "topic": "Data Protection", "type": "single", "q": "According to the lecture, in which year was the Data Protection Act first passed?", "options": ["1994", "1998", "1984", "2018"], "answer": [2], "explain": "The slide says \"Data Protection Act 1984. Updated in 1998, 2018.\"", "source": "Lecture 2 slide 6", "flag": "Slide 5 lists the DPA as 1994, 1998 and 2018, while slide 6 says 1984. Slide 6 is the explicit history, so slide 5 may be a typo.", "kind": "lecture"}, {"id": "w02-014", "week": 2, "topic": "Data Protection", "type": "single", "q": "In what year is the General Data Protection Regulation dated in the lecture?", "options": ["1998", "2018", "2000", "2016"], "answer": [3], "explain": "The IT law list and the DP overview give \"GDPR 2016\" and \"General Data Protection Regulation 2016\".", "source": "Lecture 2 slide 5, 6", "flag": "", "kind": "lecture"}, {"id": "w02-015", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which Act is dated 1990 in the lecture's list of IT law?", "options": ["Data Protection Act", "Computer Misuse Act (CMA)", "Freedom of Information Act (FOI)", "Regulation of Investigatory Powers Act (RIPA)"], "answer": [1], "explain": "The slide dates are CMA 1990, FOI 2000, RIPA 2018, and DPA 1994, 1998 and 2018.", "source": "Lecture 2 slide 5", "flag": "The slide dates RIPA as 2018, which differs from real law where it is 2000. Follow the slide.", "kind": "lecture"}, {"id": "w02-016", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which year is given for the Freedom of Information Act in the lecture?", "options": ["2018", "1990", "1998", "2000"], "answer": [3], "explain": "The slide says \"Freedom of Information, FOI 2000\".", "source": "Lecture 2 slide 5", "flag": "", "kind": "lecture"}, {"id": "w02-017", "week": 2, "topic": "Data Protection", "type": "single", "q": "Who is a Data Controller?", "options": ["The body that enforces the Act in the UK", "Anyone contracted to do some data processing under another's instructions", "The person(s) or organisation who holds the data or controls the processing", "The individual who is the subject of personal data"], "answer": [2], "explain": "The Data Controller is the person or organisation who holds the data or controls the processing. The second option describes the Data Processor and the first describes the Data Subject.", "source": "Lecture 2 slide 8", "flag": "", "kind": "lecture"}, {"id": "w02-018", "week": 2, "topic": "Data Protection", "type": "single", "q": "Who is a Data Processor?", "options": ["The individual who is the subject of personal data", "The person who runs the public Register", "Anyone in an organisation contracted to do some data processing under the data controller's instructions", "The person or organisation who controls the processing"], "answer": [2], "explain": "The Data Processor is anyone in an organisation contracted to do some data processing under the data controller's instructions.", "source": "Lecture 2 slide 8", "flag": "", "kind": "lecture"}, {"id": "w02-019", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which of the following is NOT an exemption listed in the lecture?", "options": ["National security", "Journalistic, literature or artistic purposes", "Prevention and detection of crime", "Direct marketing by the data controller"], "answer": [3], "explain": "The listed exemptions are National Security, Personal, Domestic and Recreational usage, Prevention and detection of crime, Journalistic, literature or artistic purposes, and where another statute authorises disclosure.", "source": "Lecture 2 slide 21", "flag": "", "kind": "lecture"}, {"id": "w02-020", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which of the following is NOT something a Data Controller must notify the Information Commissioner about under the DPA 1998?", "options": ["The salaries of the staff who process the data", "What types of information are held for what purposes", "Who the information is obtained from", "Who the information is disclosed to"], "answer": [0], "explain": "Notification covers types of information held for what purposes, obtained from WHO, disclosed to WHO.", "source": "Lecture 2 slide 10", "flag": "", "kind": "lecture"}, {"id": "w02-021", "week": 2, "topic": "Data Protection", "type": "single", "q": "Sending unsolicited emails to individual consumers is an offence against which regulations?", "options": ["Privacy and Electronic Communications Regulations (PECR)", "Regulation of Investigatory Powers Act", "Computer Misuse Act 1990", "Freedom of Information Act 2000"], "answer": [0], "explain": "SPAM to individual consumers, and not to businesses, is an offence against PECR, which the ICO regulates.", "source": "Lecture 2 slide 26", "flag": "", "kind": "lecture"}, {"id": "w02-022", "week": 2, "topic": "Data Protection", "type": "single", "q": "In the lecture, what does 'compliance' mean?", "options": ["Registering annually with the ICO", "Just enough to comply with the law", "Good understanding within the law", "Going beyond the law to protect all data"], "answer": [1], "explain": "\"Compliance\" means just enough to comply with the law. \"Best practice\" means a good understanding within the law.", "source": "Lecture 2 slide 11", "flag": "", "kind": "lecture"}, {"id": "w02-023", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which statement about the main improvements in GDPR is NOT correct?", "options": ["Consent is now opt-in, and evidence must be kept.", "Consent is now opt-out and may be implied.", "The data controller must be able to demonstrate compliance.", "The data controller is clearly responsible for compliance."], "answer": [1], "explain": "GDPR brings accountability principles and a higher standard for consent, which is opt-in with evidence kept.", "source": "Lecture 2 slide 23", "flag": "", "kind": "lecture"}, {"id": "w02-024", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? GDPR has extraterritorial effect, so any UK company doing business with the EU will still need to comply.", "options": ["Correct", "Not correct"], "answer": [0], "explain": "The post-Brexit slide says GDPR has extraterritorial effect, so non-EU countries are also affected.", "source": "Lecture 2 slide 24", "flag": "", "kind": "lecture"}, {"id": "w02-025", "week": 2, "topic": "Data Protection", "type": "single", "q": "Is the following statement correct? After Brexit, UK companies doing business with the EU no longer need to comply with GDPR.", "options": ["Correct", "Not correct"], "answer": [1], "explain": "Any UK company doing business with the EU will still need to comply.", "source": "Lecture 2 slide 24", "flag": "", "kind": "lecture"}, {"id": "w02-026", "week": 2, "topic": "Data Protection", "type": "single", "q": "Where is the Information Commissioner's Office based, according to the lecture?", "options": ["Manchester", "Cambridge", "London", "Wilmslow, Cheshire"], "answer": [3], "explain": "The ICO address is Wycliffe House, Water Lane, Wilmslow, Cheshire, SK9 5AF.", "source": "Lecture 2 slide 25", "flag": "", "kind": "lecture"}, {"id": "w02-027", "week": 2, "topic": "Data Protection", "type": "single", "q": "What penalty does the lecture say you face if you are not exempt and don't follow the law?", "options": ["You will be penalised (fines/imprisonment)", "Temporary suspension from the Register", "A written warning only", "Loss of the right to hold personal data for one year"], "answer": [0], "explain": "The summary says that if you are not exempt and don't follow the law, you will be penalised with fines or imprisonment.", "source": "Lecture 2 slide 27", "flag": "", "kind": "lecture"}, {"id": "w02-028", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which statement about Principle #7 (Security) is NOT correct?", "options": ["Appropriate technical and operational measures shall be taken.", "It applies only to data held on paper.", "Measures are taken against accidental loss, or destruction of, or damage to, personal data.", "Measures are taken against unauthorised or unlawful processing of personal data."], "answer": [1], "explain": "Principle #7 requires appropriate technical and operational measures against unauthorised or unlawful processing and against accidental loss, destruction or damage.", "source": "Lecture 2 slide 18", "flag": "", "kind": "lecture"}, {"id": "w02-029", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which statement about Principle #5 is correct?", "options": ["Personal data shall be kept indefinitely if it is secure.", "Personal data shall be kept for at least five years.", "Personal data shall be accurate and where necessary kept up to date.", "Personal data shall not be kept any longer than is necessary for the purpose(s) it is processed."], "answer": [3], "explain": "Principle #5 is retention. 'Accurate and kept up to date' is Principle #4.", "source": "Lecture 2 slide 17", "flag": "", "kind": "lecture"}, {"id": "w02-030", "week": 2, "topic": "Data Protection", "type": "single", "q": "Which principle states that personal data shall be accurate and where necessary kept up to date?", "options": ["Principle 3", "Principle 4", "Principle 5", "Principle 1"], "answer": [1], "explain": "Principle #4.", "source": "Lecture 2 slide 16", "flag": "", "kind": "lecture"}, {"id": "w02-031", "week": 2, "topic": "Data Protection", "type": "single", "q": "How does the lecture describe the data covered by the DPA 1998?", "options": ["Only manual records", "Personal data held or processed in automated form AND some manual records", "Only data held in automated form", "Only data about businesses"], "answer": [1], "explain": "The DPA 1998 covers personal data held or processed in automated form AND some manual records.", "source": "Lecture 2 slide 9", "flag": "", "kind": "lecture"}, {"id": "w02-032", "week": 2, "topic": "Data Protection", "type": "single", "q": "Who maintains the register that data controllers appear on?", "options": ["The data processor", "The Mailing Preference Service", "The Federal Trade Commission", "The Information Commissioner's Office (ICO)"], "answer": [3], "explain": "The ICO page lists \"The Data Protection Register\" for data controllers. The DPA 1998 slide says controllers notify the Information Commissioner and are published on a public Register.", "source": "Lecture 2 slide 10, 25", "flag": "", "kind": "lecture"}, {"id": "w02-033", "week": 2, "topic": "Data Protection", "type": "multi", "q": "DPA Principle #1 states personal data shall be processed fairly and lawfully. Which of the following are included in Principle #1 as conditions for processing personal data?", "options": ["with consent", "to perform a contract with the individual", "carry out a public function under statutory powers", "to protect the vital interests of the data subject", "to maximise the controller's commercial profit", "pursue legitimate interests of the data controller unless prejudicial to the interests of the data subject", "under a legal obligation"], "answer": [0, 1, 2, 3, 5, 6], "explain": "Slide 12 lists consent, contract, legal obligation, vital interests, public function under statutory powers, and legitimate interests of the controller unless prejudicial.", "source": "Lecture 2 slide 12", "flag": "", "kind": "lecture"}, {"id": "w02-034", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are conditions for processing SENSITIVE data under Principle #1?", "options": ["necessary under a legal obligation in the context of employment", "pursue the legitimate commercial interests of the data controller", "for racial or ethnic monitoring", "necessary for medical purposes, undertaken by a health professional", "where the information has been deliberately made public by the data subject", "with implied consent", "with explicit consent"], "answer": [0, 2, 3, 4, 6], "explain": "Sensitive data needs extra care and higher security. The conditions include explicit consent, employment legal obligation, made public by the data subject, medical purposes by a health professional, and racial or ethnic monitoring, among others.", "source": "Lecture 2 slide 13", "flag": "", "kind": "lecture"}, {"id": "w02-035", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Under Principle #6, which rights does the data subject have?", "options": ["to be paid a fee by the controller for holding their data", "to compensation for damage or damage and distress in (mis)use of personal data", "to know the purpose(s) for which personal data is held", "to request an assessment of whether the DPA is being complied with", "to have incorrect information corrected", "not to receive direct marketing", "to access any data held on them"], "answer": [1, 2, 3, 4, 5, 6], "explain": "Slide 20 lists these rights. There is no right to payment for holding data.", "source": "Lecture 2 slide 20", "flag": "", "kind": "lecture"}, {"id": "w02-036", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Under Principle #6, which rights does the data subject have?", "options": ["to have incorrect information erased if the data controller won't correct it", "to appoint the data processor for the data controller", "to prevent processing which causes substantial damage or substantial distress", "an explanation behind the logic of automated decisions", "to have any dispute over correctness recorded and visible with the record", "to set the annual fee for the Register"], "answer": [0, 2, 3, 4], "explain": "All of the first four appear on slide 20.", "source": "Lecture 2 slide 20", "flag": "", "kind": "lecture"}, {"id": "w02-037", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are exemptions under the DPA?", "options": ["Prevention and detection of crime", "Where another statute authorises disclosure", "Commercial research for profit", "National Security", "Direct marketing", "Personal, Domestic and Recreational usage"], "answer": [0, 1, 3, 5], "explain": "The exemptions are National Security, Personal, Domestic and Recreational usage, Prevention and detection of crime, Journalistic, literature or artistic purposes, and where another statute authorises disclosure.", "source": "Lecture 2 slide 21", "flag": "", "kind": "lecture"}, {"id": "w02-038", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are exemptions under the DPA?", "options": ["Where another statute authorises disclosure", "Journalistic, literature or artistic purposes", "National Security", "Prevention and detection of crime", "Personal, Domestic and Recreational usage"], "answer": [0, 1, 2, 3, 4], "explain": "All five are listed on the exemptions slide.", "source": "Lecture 2 slide 21", "flag": "", "kind": "lecture"}, {"id": "w02-039", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Principle #7 (Security) requires appropriate technical and operational measures against which of the following?", "options": ["unauthorised or unlawful processing of personal data", "destruction of or damage to personal data", "accidental loss of personal data", "lawful disclosure to the data subject"], "answer": [0, 1, 2], "explain": "Principle 7 requires measures against unauthorised or unlawful processing, and against accidental loss of, destruction of, or damage to personal data.", "source": "Lecture 2 slide 18", "flag": "", "kind": "lecture"}, {"id": "w02-040", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Under the DPA 1998, which of the following was a Data Controller obligated to do?", "options": ["appoint the Information Commissioner", "follow the 8 Data Protection Principles", "pay an annual fee", "be published on the public Register", "notify the Information Commissioner"], "answer": [1, 2, 3, 4], "explain": "Slide 10 lists notify the Information Commissioner, public Register, follow 8 principles, annual fee.", "source": "Lecture 2 slide 10", "flag": "", "kind": "lecture"}, {"id": "w02-041", "week": 2, "topic": "Data Protection", "type": "multi", "q": "What must a Data Controller notify the Information Commissioner about?", "options": ["who it is disclosed to", "for what purposes it is held", "what types of information are held", "who it is obtained from"], "answer": [0, 1, 2, 3], "explain": "Notification covers what TYPES of information are held, for what PURPOSES, who it is obtained from and who it is disclosed to.", "source": "Lecture 2 slide 10", "flag": "", "kind": "lecture"}, {"id": "w02-042", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following appear in the lecture's list of IT law?", "options": ["Data Protection Act", "Intellectual Property Law", "GDPR", "Freedom of Information", "Regulation of Investigatory Powers Act", "Computer Misuse Act"], "answer": [0, 1, 2, 3, 4, 5], "explain": "All six are on the I.T. Law slide.", "source": "Lecture 2 slide 5", "flag": "", "kind": "lecture"}, {"id": "w02-043", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which are direct mail opt-out services named in the lecture?", "options": ["Email Preference service", "Telephone Preference service", "Mailing Preference service", "Doorstep Preference service", "Fax Preference service"], "answer": [1, 2, 4], "explain": "The direct mail opt-out services are the Mailing, Fax and Telephone Preference services.", "source": "Lecture 2 slide 26", "flag": "", "kind": "lecture"}, {"id": "w02-044", "week": 2, "topic": "Data Protection", "type": "multi", "q": "By the end of the lesson, you should be able to do which of the following?", "options": ["describe the obligations of Data Controllers", "describe the EIGHT data protection principles", "recall data protection definitions", "outline data protection exemptions", "describe the Computer Misuse Act offences", "outline the scope of the Data Protection Act 2018"], "answer": [0, 1, 2, 3, 5], "explain": "Learning objectives slide.", "source": "Lecture 2 slide 3", "flag": "", "kind": "lecture"}, {"id": "w02-045", "week": 2, "topic": "Data Protection", "type": "multi", "q": "According to the lecture, what do the data protection laws outline?", "options": ["the rights you have about your data", "the 'privacy' you can expect around data storage", "the price organisations may charge for storing data", "the responsibilities others have to look after it carefully"], "answer": [0, 1, 3], "explain": "Slide 6 says data protection laws outline the rights you have about YOUR data, the responsibilities others have to look after it carefully, and the \"privacy\" you can expect around data storage.", "source": "Lecture 2 slide 6", "flag": "", "kind": "lecture"}, {"id": "w02-046", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are main improvements in GDPR?", "options": ["consent may be implied from silence", "consent is now opt-in", "evidence of consent must be kept", "the data controller must be able to demonstrate compliance", "the data controller is clearly responsible for compliance"], "answer": [1, 2, 3, 4], "explain": "The main improvements are accountability principles and a higher standard for consent, which is opt-in with evidence kept.", "source": "Lecture 2 slide 23", "flag": "", "kind": "lecture"}, {"id": "w02-047", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are examples of 'processing' personal data?", "options": ["store", "delete", "hold", "gather", "modify"], "answer": [0, 1, 2, 3, 4], "explain": "Processing is anything you do with personal data, such as hold, store, gather, delete and modify.", "source": "Lecture 2 slide 7", "flag": "", "kind": "lecture"}, {"id": "w02-048", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which of the following are categories of sensitive personal data?", "options": ["racial or ethnical origins", "political opinions", "religious believes", "home address", "sexual preferences", "criminal records", "physical or mental health"], "answer": [0, 1, 2, 4, 5, 6], "explain": "Sensitive personal data covers racial or ethnical origins, religious believes, political opinions, physical or mental health, sexual preferences and criminal records.", "source": "Lecture 2 slide 7", "flag": "", "kind": "lecture"}, {"id": "w02-049", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which statements about SPAM in the lecture are correct?", "options": ["SPAM might also fall into the DPA 2018", "PECR is regulated by the ICO", "Sending unsolicited emails to individual consumers is an offence against PECR", "The offence applies to emails sent to businesses"], "answer": [0, 1, 2], "explain": "SPAM to individual consumers, and not to businesses, is an offence against PECR, which the ICO regulates. It might also fall into the DPA 2018.", "source": "Lecture 2 slide 26", "flag": "", "kind": "lecture"}, {"id": "w02-050", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Which statements about GDPR after Brexit are correct?", "options": ["UK organisations need to comply with GDPR", "GDPR has extraterritorial effect", "Non-EU countries are not affected by GDPR", "GDPR applies to all EU countries and citizens", "A UK company doing business with the EU still needs to comply"], "answer": [0, 1, 3, 4], "explain": "Slide 24.", "source": "Lecture 2 slide 24", "flag": "", "kind": "lecture"}, {"id": "w02-051", "week": 2, "topic": "Data Protection", "type": "multi", "q": "Why does the lecture say you should be interested in data protection?", "options": ["You need to know where to go for cribed as sensitive and nervous versus secure and confident.", "source": "Seminar 2 slide 5", "flag": "", "kind": "seminar"}, {"id": "w02-060", "week": 2, "topic": "Cambridge Analytica seminar", "type": "single", "q": "Which statement about the Big Five traits is NOT correct?", "options": ["Agreeableness is described as friendly/compassionate vs. challenging/detached.", "Extraversion is described as friendly/compassionate vs. challenging/detached.", "Openness to experience is described as inventive/curious vs. consistent/cautious.", "Conscientiousness is described as efficient/organized vs. easy-going/careless."], "answer": [1], "explain": "Extraversion is outgoing and energetic versus solitary and reserved. Friendly and compassionate versus challenging and detached describes Agreeableness.", "source": "Seminar 2 slide 5", "flag": "", "kind": "seminar"}, {"id": "w02-061", "week": 2, "topic": "Assessment", "type": "multi", "q": "Which statements about the module assessment are correct?", "options": ["Part 2 is a 2000-word individual report worth 80%", "Part 1 is an in-class test worth 20%", "The report is submitted via CANVAS", "It is one single graded assessment element (Element 010)", "The report is submitted by email"], "answer": [0, 1, 2, 3], "explain": "Slide 14.", "source": "Seminar 2 slide 14", "flag": "", "kind": "seminar"}, {"id": "w02-062", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "How many Facebook users' personally identifiable information was given to Cambridge Analytica, according to the article?", "options": ["More than 230 million", "More than 87 million", "More than 50 million", "More than 8.7 million"], "answer": [1], "explain": "Facebook gave access to PII of more than 87 million users to Cambridge Analytica.", "source": "Reading (Isaak and Hanna 2018) page 56", "flag": "", "kind": "reading"}, {"id": "w02-063", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "In 2013, researchers at which institution analysed volunteers' Facebook personality tests?", "options": ["Stanford University", "University of Cambridge's Psychometrics Centre", "Synopsys", "Global Science Research"], "answer": [1], "explain": "In 2013 researchers at the University of Cambridge's Psychometrics Centre analysed the results of volunteers who took a personality test on Facebook.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-064", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "How many US participants did the 2013 Cambridge research draw in?", "options": ["350,000", "35,000", "87 million", "3.5 million"], "answer": [0], "explain": "The research drew in 350,000 US participants. The figure of 3.5 million is Kosinski's later sample base.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-065", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "What does GSR stand for in the article?", "options": ["General Social Research", "Global Science Research", "Global Security Reporting", "Government Survey Registry"], "answer": [1], "explain": "A second research project was reportedly started by Global Science Research, GSR, in cooperation with Cambridge Analytica.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-066", "week": 2, "topic": "Cambridge Analytica", "type": "multi", "q": "Which platforms did GSR use for its personality quiz?", "options": ["Qualtrics", "Amazon's Mechanical Turk", "SurveyMonkey", "Google Forms"], "answer": [0, 1], "explain": "The quiz ran on Amazon's Mechanical Turk platform and Qualtrics, a survey platform.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-067", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "Until when did the Facebook Open API give access to users' friends' data, according to the article?", "options": ["2011", "December 2015", "May 2015", "April 2018"], "answer": [2], "explain": "Access to friends' data was available through the Facebook Open API until May 2015.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-068", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "How many data points on how many US adults did Cambridge Analytica build?", "options": ["5,000+ data points on 350,000 US adults", "50,000 data points on 2.3 million US adults", "5,000+ data points on 230 million US adults", "500 data points on 87 million US adults"], "answer": [2], "explain": "'5,000+ data points on 230 million US adults'.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-069", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "What was 'Project Alamo'?", "options": ["A Facebook privacy law proposed by Senator Klobuchar", "A targeted-messaging campaign paired with OCEAN analysis, used for the election campaign of President Trump", "The FTC investigation of Facebook", "The GSR quiz run on Mechanical Turk"], "answer": [1], "explain": "The OCEAN analysis was paired with targeted messages in 'Project Alamo', employed for the election campaign of President Trump.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-070", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "Facebook was being investigated by the FTC for violating what?", "options": ["The GDPR", "A 2013 privacy bill", "The CONSENT Act", "A 2011 consent decree"], "answer": [3], "explain": "Facebook is being investigated by the Federal Trade Commission, the FTC, for violating a 2011 consent decree.", "source": "Reading (Isaak and Hanna 2018) page 57", "flag": "", "kind": "reading"}, {"id": "w02-071", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "Which senators put forward the CONSENT Act (S.2639)?", "options": ["Richard Blumenthal and Amy Klobuchar", "Amy Klobuchar and Ted Cruz", "Richard Blumenthal and Ed Markey", "Mark Zuckerberg and Amy Klobuchar"], "answer": [2], "explain": "The CONSENT Act, S.2639, comes from Senators Richard Blumenthal of Connecticut and Ed Markey of Massachusetts, both Democrats.", "source": "Reading (Isaak and Hanna 2018) page 59", "flag": "", "kind": "reading"}, {"id": "w02-072", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "Which bill was introduced by Senator Amy Klobuchar?", "options": ["Social Media Privacy Protection and Consumer Rights Act of 2018 (S.2728)", "CONSENT Act (S.2639)", "Data Protection Act 2018", "California privacy bill"], "answer": [0], "explain": "S.2728 was introduced by Senator Amy Klobuchar, a Democrat from Minnesota.", "source": "Reading (Isaak and Hanna 2018) page 59", "flag": "", "kind": "reading"}, {"id": "w02-073", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "The California privacy bill adds limits on selling data on users younger than what age?", "options": ["13", "21", "16", "18"], "answer": [2], "explain": "The bill adds limits to selling data on users younger than 16 years of age.", "source": "Reading (Isaak and Hanna 2018) page 59", "flag": "", "kind": "reading"}, {"id": "w02-074", "week": 2, "topic": "Cambridge Analytica", "type": "multi", "q": "Which of the following are the four headings of the core principles of privacy and data protection in the article?", "options": ["Control", "Encryption", "Retention", "Notification", "Disclosure for users", "Public transparency"], "answer": [0, 3, 4, 5], "explain": "The headings are Public transparency, Disclosure for users, Control and Notification.", "source": "Reading (Isaak and Hanna 2018) page 58-59", "flag": "", "kind": "reading"}, {"id": "w02-075", "week": 2, "topic": "Cambridge Analytica", "type": "multi", "q": "Which of the following does the CONSENT Act require or do?", "options": ["bans all sale of user data", "explicit opt-in consent before platforms use, share or sell PII", "new reporting requirements in case of a data breach", "requires the FTC to establish privacy protections for customers of online edge providers", "explicit notification any time data is gathered, shared or sold to a third party"], "answer": [1, 2, 3, 4], "explain": "The bill requires explicit opt-in consent and notification, adds breach reporting, and requires the FTC to establish privacy protections.", "source": "Reading (Isaak and Hanna 2018) page 59", "flag": "", "kind": "reading"}, {"id": "w02-076", "week": 2, "topic": "Cambridge Analytica", "type": "single", "q": "As few as how many voters in a few states are said to be enough to tip election results with individualised messages?", "options": ["100,000", "3.5 million", "350,000", "87 million"], "answer": [0], "explain": "Tipping the scale in a few states with as few as 100,000 voters is sufficient to impact election results.", "source": "Reading (Isaak and Hanna 2018) page 58", "flag": "", "kind": "reading"}, {"id": "w03-001", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which Act gives the right to access information held by public authorities in the course of their carrying out public functions?", "options": ["Data Protection Act 1998", "Regulation of Investigatory Powers Act 2000", "Freedom of Information Act 2000", "Human Rights Act 1998"], "answer": [2], "explain": "The Freedom of Information Act 2000 gives \"The right to access information held by public authorities, in the course of their carrying out public functions.\"", "source": "Lecture 3 slide 8", "flag": "", "kind": "lecture"}, {"id": "w03-002", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "The Freedom of Information Act 2000 is supervised by which body?", "options": ["The Information Commissioner's Office (ICO)", "The Home Office", "The Cabinet Office", "The Information Rights Tribunal"], "answer": [0], "explain": "The Information Commissioner's Office, the ICO, supervises the Act.", "source": "Lecture 3 slide 10", "flag": "Slide 14 mentions an Information Rights Tribunal that can consider the passage of time, but slide 10 names the ICO as supervisor.", "kind": "lecture"}, {"id": "w03-003", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Is the following statement correct? 'If the public interest in disclosure outweighs the public interest of maintaining an exemption to disclosure, the ICO may rule that material has to be disclosed.'", "options": ["Correct", "Not correct"], "answer": [0], "explain": "The slide says that if the public interest in disclosure outweighs the public interest of maintaining an exemption, the information commissioner may rule that material has to be disclosed.", "source": "Lecture 3 slide 16", "flag": "", "kind": "lecture"}, {"id": "w03-004", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Is the following statement correct? 'The FOI Act 2000 gives people access to their own personal data, such as their health records or credit reference file.'", "options": ["Correct", "Not correct"], "answer": [1], "explain": "The Act does not give people access to their own personal data such as their health records or credit reference file.", "source": "Lecture 3 slide 11", "flag": "", "kind": "lecture"}, {"id": "w03-005", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Information held by Scottish public authorities is covered by which Act?", "options": ["Freedom of Information (Scotland) Act 2000", "Data Protection (Scotland) Act 2002", "Freedom of Information (Scotland) Act 2002", "Freedom of Information (Scotland) Act 1998"], "answer": [2], "explain": "Scotland has its own Act, the Freedom of Information Scotland Act 2002, which covers information held by Scottish public authorities.", "source": "Lecture 3 slide 10", "flag": "", "kind": "lecture"}, {"id": "w03-006", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Under FOI 2000, within how many working days must a public authority supply information, unless more time is needed to consider the public interest test or a possible exemption?", "options": ["10", "20", "30", "40"], "answer": [1], "explain": "Must supply info within 20 working days unless more time needed to consider public interest test / possible exemption.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-007", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which statement below is NOT correct about a public authority's obligations under FOI 2000?", "options": ["It has a duty to 'advise and assist' the requestor in formulating requests.", "It can refuse vexatious or repeated requests.", "It must publish and update a 'publication scheme'.", "It must supply information within 40 working days in every case."], "answer": [3], "explain": "The limit is 20 working days, and longer only to consider the public interest test or a possible exemption. It is not 40.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-008", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which statement below is NOT correct about public interest under FOI 2000?", "options": ["It means what interests the public.", "It means transparency of decision making.", "It means accountability of public funds.", "It includes plausible suspicion of wrongdoing."], "answer": [0], "explain": "Public interest 'does not mean what interests the public'.", "source": "Lecture 3 slide 13", "flag": "", "kind": "lecture"}, {"id": "w03-009", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Under which law can you request information that organisations hold about you?", "options": ["Data Protection Act", "Freedom of Information Act 2000", "Environmental Information Regulations", "Regulation of Investigatory Powers Act 2000"], "answer": [0], "explain": "The Data Protection Act covers information organisations hold about you.", "source": "Lecture 3 slide 17", "flag": "", "kind": "lecture"}, {"id": "w03-010", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Under which law would you request environmental information?", "options": ["Data Protection Act", "Freedom of Information Act 2000", "Human Rights Act 1998", "Environmental Information Regulations"], "answer": [3], "explain": "The Environmental Information Regulations cover environmental information.", "source": "Lecture 3 slide 17", "flag": "", "kind": "lecture"}, {"id": "w03-011", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Who can (could) override the Information Commissioner's decision on disputed information with a veto?", "options": ["A Cabinet Minister", "The Prime Minister", "The Courts", "The ICO's internal review panel"], "answer": [0], "explain": "The IC has an absolute right to see the disputed information and make a judgement. A Cabinet Minister can, or could, override this decision with a veto.", "source": "Lecture 3 slide 18", "flag": "The slide wording \"can, could\" suggests the veto power may no longer apply.", "kind": "lecture"}, {"id": "w03-012", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which of the following is the correct order of the appeals route listed for FOI?", "options": ["Information Commissioner, Internal Departmental Review, Courts", "Courts, Information Commissioner, Internal Departmental Review", "Internal Departmental Review, Information Commissioner, Courts", "Internal Departmental Review, Courts, Information Commissioner"], "answer": [2], "explain": "The appeals route is Internal Departmental Review, then Information Commissioner, then Courts.", "source": "Lecture 3 slide 18", "flag": "", "kind": "lecture"}, {"id": "w03-013", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which of the following is the Information Commissioner responsible to enforce?", "options": ["Computer Misuse Act 1990"

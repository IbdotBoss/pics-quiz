["Uphold the reputation and good standing of BCS", "Only undertake work that is within their professional competence", "Develop their professional knowledge, skills and competence on a continuing basis", "Avoid injuring others, their property, reputation, or employment by false or malicious or negligent action or inaction", "Reject and not make any offer of bribery or unethical inducement", "Ensure they have knowledge and understanding of Legislation and comply with it", "Respect and value alternative viewpoints and seek, accept and offer honest criticisms of work"], "answer": [1, 2, 3, 4, 5, 6], "explain": "This is on slide 19. \"Uphold the reputation and good standing of BCS\" is in Duty to the Profession.", "source": "Lecture 9 (Professionalism) slide 19", "flag": "", "kind": "lecture"}, {"id": "w09-039", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Under 'Duty to Relevant Authority', what shall a BCS member do?", "options": ["Seek to improve professional standards through participation in their development", "Promote the inclusion of all sectors in society", "Not misrepresent or withhold information on the performance of products, systems or services", "Carry out professional responsibilities with due care and diligence", "Accept professional responsibility for their work", "Seek to avoid any situation that may give rise to a conflict of interest with their Authority"], "answer": [2, 3, 4, 5], "explain": "Slide 20. The last two belong to Duty to the Profession and Public Interest.", "source": "Lecture 9 (Professionalism) slide 20", "flag": "", "kind": "lecture"}, {"id": "w09-040", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Under 'Duty to the Profession', what shall a BCS member do?", "options": ["Accept professional responsibility for their work", "Accept their personal duty to uphold the reputation of the profession", "Uphold the reputation and good standing of BCS", "Reject any offer of bribery", "Act with integrity and respect in professional relationships with all members of BCS and members of other professions", "Seek to improve professional standards through participation in their development, use and enforcement"], "answer": [1, 2, 4, 5], "explain": "Slide 21. The last two belong to Duty to Relevant Authority and Professional Competence and Integrity.", "source": "Lecture 9 (Professionalism) slide 21", "flag": "", "kind": "lecture"}, {"id": "w09-041", "week": 9, "topic": "Professionalism", "type": "multi", "q": "On which grounds does the BCS Code of Conduct say you must not discriminate?", "options": ["Political party", "Sexual orientation", "Marital status", "Nationality", "Level of income", "Age or disability", "Religion"], "answer": [1, 2, 3, 5, 6], "explain": "Without discrimination on the grounds of sex, sexual orientation, marital status, nationality, colour, race, ethnic origin, religion, age or disability, or of any other condition or requirement.", "source": "Lecture 9 (Professionalism) slide 18", "flag": "", "kind": "lecture"}, {"id": "w09-042", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following are ACM Code of Ethics general ethical principles?", "options": ["Honour confidentiality", "Contribute to society and to human well-being, acknowledging that all people are stakeholders in computing", "Respect privacy", "Be honest and trustworthy", "Be fair and take action not to discriminate", "Respect the work required to produce new ideas, inventions, creative works, and computing artefacts", "Avoid harm"], "answer": [0, 1, 2, 3, 4, 5, 6], "explain": "Slide 22 lists these seven.", "source": "Lecture 9 (Professionalism) slide 22", "flag": "", "kind": "lecture"}, {"id": "w09-043", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following are ACM professional responsibilities?", "options": ["Design and implement systems that are robustly and usably secure", "Be fair and take action not to discriminate", "Accept and provide appropriate professional review", "Know and respect existing rules pertaining to professional work", "Strive to achieve high quality in both the processes and products of professional work", "Honour confidentiality", "Perform work only in areas of competence"], "answer": [0, 2, 3, 4, 6], "explain": "This is on slide 23. The last two options are general ethical principles on slide 22.", "source": "Lecture 9 (Professionalism) slide 22-23", "flag": "", "kind": "lecture"}, {"id": "w09-044", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which are listed under 'Other Professional Bodies for IT'?", "options": ["IEEE", "CISCO", "OWASP", "CREST", "ACM"], "answer": [0, 1, 2, 3, 4], "explain": "IEEE and ACM are on slide 15, and OWASP, CISCO and CREST are on slide 24.", "source": "Lecture 9 (Professionalism) slide 15, 24", "flag": "", "kind": "lecture"}, {"id": "w09-045", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which are listed as UK professional bodies for IT?", "options": ["IEEE", "IET", "ACM", "OWASP", "BCS"], "answer": [1, 4], "explain": "The UK professional bodies for IT are BCS and IET. IEEE and ACM appear under \"Other Professional Bodies\".", "source": "Lecture 9 (Professionalism) slide 13, 15", "flag": "", "kind": "lecture"}, {"id": "w09-046", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which founding years are correct according to the slides?", "options": ["BCS: 1957", "IEEE: 1946", "ACM: 1947", "IET: 2006"], "answer": [0, 1, 2, 3], "explain": "Slides 13 and 15.", "source": "Lecture 9 (Professionalism) slide 13, 15", "flag": "", "kind": "lecture"}, {"id": "w09-047", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which founding years are correct according to the slides?", "options": ["BCS: 2006", "IEEE: 1957", "ACM: 1947", "IET: 1946", "BCS: 1957"], "answer": [2, 4], "explain": "BCS is 1957, ACM is 1947, IEEE is 1946 and IET is 2006.", "source": "Lecture 9 (Professionalism) slide 13, 15", "flag": "", "kind": "lecture"}, {"id": "w09-048", "week": 9, "topic": "Professionalism", "type": "multi", "q": "How can you protect yourself as a professional, according to the slides?", "options": ["Professional indemnity insurance", "CPD (Continuing Professional Development)", "Work only on safety critical systems", "Avoid giving advice", "Rely on common sense alone"], "answer": [0, 1], "explain": "To protect yourself as a professional, the slides give professional indemnity insurance and CPD.", "source": "Lecture 9 (Professionalism) slide 12", "flag": "", "kind": "lecture"}, {"id": "w09-049", "week": 9, "topic": "Professionalism", "type": "multi", "q": "When does the lecture say it matters that we are IT professionals?", "options": ["Only when working abroad", "When we are designing safety critical systems", "Only when handling payment card data", "When we give advice", "Only when working for the public sector"], "answer": [1, 3], "explain": "Does it matter if we are IT professionals? What about when we give advice? What about when we are designing safety critical systems?", "source": "Lecture 9 (Professionalism) slide 10", "flag": "", "kind": "lecture"}, {"id": "w09-050", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following pairings of trade and professional are given in the lecture?", "options": ["Plumbers vs. Mechanical engineers", "Electricians vs. Electrical engineers", "Computer programmer vs. Software Engineer", "Electricians vs. Civil engineers", "Builders vs. Civil engineers", "Cisco hardware installer vs. Cisco Certified Engineer", "Plumbers vs. Software Engineer"], "answer": [0, 1, 2, 4, 5], "explain": "Slides 5 and 7.", "source": "Lecture 9 (Professionalism) slide 5, 7", "flag": "", "kind": "lecture"}], "notes": [{"week": 0, "html": "<h1 id=\"cheat-sheet\">Cheat sheet<\/h1>\r\n<p>This sheet comes from the lecture slides and the 2024-25 paper. The\r\ntest is marked against the slides, so where a slide differs from current\r\nlaw the sheet gives the slide's version and marks it <em>slide<\/em>.<\/p>\r\n<h2 id=\"where-the-2024-25-papers-40-questions-came-from\">Where the\r\n2024-25 paper's 40 questions came from<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Lecture<\/th>\r\n<th>Questions<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Data Protection (week 2)<\/td>\r\n<td>11<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Computer Misuse Act, PCI DSS and cyber bodies (weeks 7-8)<\/td>\r\n<td>14<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Freedom of Information and privacy (week 3)<\/td>\r\n<td>8<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>System Failures (week 5)<\/td>\r\n<td>3<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Ethics (week 6)<\/td>\r\n<td>2<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Introduction (week 1)<\/td>\r\n<td>1<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Set reading (ICO overview of the GDPR)<\/td>\r\n<td>1<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>No question came from Sustainability or Professionalism that year.\r\nOne paper cannot tell you what this year's will cover.<\/p>\r\n<h2 id=\"acts-and-years\">Acts and years<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Law<\/th>\r\n<th>Year<\/th>\r\n<th>One-line hook<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Data Protection Act<\/td>\r\n<td>1984, updated 1998 and 2018<\/td>\r\n<td>8 principles; enforced by the ICO<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>GDPR<\/td>\r\n<td>2016<\/td>\r\n<td>Included in the DPA 2018 <em>slide<\/em>; consent is opt-in<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Computer Misuse Act<\/td>\r\n<td>1990<\/td>\r\n<td>Sections 1, 2, 3, 3ZA, 3A<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Freedom of Information Act<\/td>\r\n<td>2000<\/td>\r\n<td>Right to information held by public authorities<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Freedom of Information (Scotland) Act<\/td>\r\n<td>2002<\/td>\r\n<td>Scottish public authorities<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Regulation of Investigatory Powers Act (RIPA)<\/td>\r\n<td>2000<\/td>\r\n<td>Lawful interception of computer, telephone and post<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Human Rights Act<\/td>\r\n<td>1998<\/td>\r\n<td>Defend rights in UK courts; based on the ECHR<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Fraud Act<\/td>\r\n<td>2006<\/td>\r\n<td>May be easier to prove than the CMA<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>PECR<\/td>\r\n<td>no year given<\/td>\r\n<td>Spam to individual consumers is an offence; regulated by the\r\nICO<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<p>The Data Protection lecture's list of laws gives RIPA as 2018 and the\r\nDPA as \"1994, 1998, 2018\". Every other slide says RIPA 2000 and DPA\r\n1984.<\/p>\r\n<h2 id=\"acronyms\">Acronyms<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Acronym<\/th>\r\n<th>Stands for<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>DPA<\/td>\r\n<td>Data Protection Act<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>GDPR<\/td>\r\n<td>General Data Protection Regulation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>FOI<\/td>\r\n<td>Freedom of Information<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>EIR<\/td>\r\n<td>Environmental Information Regulations<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>CMA<\/td>\r\n<td>Computer Misuse Act<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>RIPA<\/td>\r\n<td>Regulation of Investigatory Powers Act<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>PECR<\/td>\r\n<td>Privacy and Electronic Communications Regulations<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>ICO<\/td>\r\n<td>Information Commissioner's Office<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>EEA<\/td>\r\n<td>European Economic Area<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>ECHR<\/td>\r\n<td>European Convention on Human Rights<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>PCI DSS<\/td>\r\n<td>Payment Card Industry Data Security Standard<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>SOX<\/td>\r\n<td>Sarbanes Oxley (EuroSOX is the EU equivalent)<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NCA<\/td>\r\n<td>National Crime Agency<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NCCU<\/td>\r\n<td>National Cyber Crime Unit<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>ROCU<\/td>\r\n<td>Regional Organised Crime Unit<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>GCHQ<\/td>\r\n<td>Government Communications Head Quarters<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NCSC<\/td>\r\n<td>National Cyber Security Centre<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NIST<\/td>\r\n<td>National Institute for Standards and Technology<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>OWASP<\/td>\r\n<td>Open Web Application Security Project<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>BCS<\/td>\r\n<td>British Computer Society (The Chartered Institute for IT)<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>IET<\/td>\r\n<td>Institution of Engineering and Technology<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>IEEE<\/td>\r\n<td>Institute for Electrical and Electronic Engineers<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>ACM<\/td>\r\n<td>Association of Computer Machinery <em>slide wording<\/em><\/td>\r\n<\/tr>\r\n<tr>\r\n<td>CPD<\/td>\r\n<td>Continuing Professional Development<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>IPCC<\/td>\r\n<td>International Panel on Climate Change <em>slide wording<\/em><\/td>\r\n<\/tr>\r\n<tr>\r\n<td>PUE<\/td>\r\n<td>Power Usage Effectiveness = total facility power / IT equipment\r\npower<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"numbers\">Numbers<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Number<\/th>\r\n<th>What it is<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>8<\/td>\r\n<td>Data protection principles<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>40 days, up to £10<\/td>\r\n<td>Subject access under Principle 6 <em>slide<\/em><\/td>\r\n<\/tr>\r\n<tr>\r\n<td>16<\/td>\r\n<td>Under this age, online services on consent need a parent or\r\nguardian's authorisation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>20 working days<\/td>\r\n<td>FOI deadline (the paper's wrong option said 30)<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>5<\/td>\r\n<td>Sections of the CMA listed: 1, 2, 3, 3ZA, 3A<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>2 / 5 / 10 years<\/td>\r\n<td>CMA prison terms for S1 / S2 / S3. S1 was 6 months before<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>6<\/td>\r\n<td>PCI DSS goals<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>6<\/td>\r\n<td>Causes of system failure<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>4<\/td>\r\n<td>Classifications of failure: process, correspondence, interaction,\r\nexpectation<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>3<\/td>\r\n<td>Types of failure: partial, total, catastrophic<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>5<\/td>\r\n<td>Key areas of the module: Legal, Social, Ethical, Systems,\r\nProfessional<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>5<\/td>\r\n<td>Steps before an ethical decision<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>4<\/td>\r\n<td>Sections of the BCS Code of Conduct<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>1957 / 2006 / 1946 / 1947<\/td>\r\n<td>BCS / IET / IEEE / ACM founded<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>100,000 / 150,000 / over 100,000 / 75,000<\/td>\r\n<td>BCS / IET / IEEE / ACM members (approx.)<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>8 January 1989<\/td>\r\n<td>Kegworth: 47 of 126 passengers lost, Boeing 737-400, M1<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>28 March 1979<\/td>\r\n<td>Three Mile Island<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>6<\/td>\r\n<td>People overdosed by Therac-25<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"who-does-what\">Who does what<\/h2>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Body<\/th>\r\n<th>Job, in the slide's words<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>ICO<\/td>\r\n<td>Independent authority. Enforces the DPA, supervises FOI, regulates\r\nPECR. Report a DPA/GDPR breach here. Lost card data is declared here\r\ntoo<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NCCU<\/td>\r\n<td>They are the police. Part of the NCA. Work with ROCUs. Respond to\r\nthreats; collaborate with partners to reduce cyber crime<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>GCHQ<\/td>\r\n<td>Protect the UK (with law enforcement and other intelligence\r\nagencies). Defend Government systems from cyber threat<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NCSC<\/td>\r\n<td>Protect UK critical services from cyber attacks. Manage major\r\nincidents. Improve the security of the UK Internet<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>NIST<\/td>\r\n<td>Non-regulatory US agency. Test and set standards for technology\r\nincluding security<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>OWASP<\/td>\r\n<td>Global not-for-profit supporting application security. Research,\r\npen-testing, education<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>CREST<\/td>\r\n<td>Not-for-profit representing the information security industry.\r\nResearch, pen-testing, education (\"CyberEssentials\")<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Action Fraud<\/td>\r\n<td>Where you report a cybercrime<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h2 id=\"lists-to-know-word-for-word\">Lists to know word for word<\/h2>\r\n<h3 id=\"eight-data-protection-principles\">Eight data protection\r\nprinciples<\/h3>\r\n<ol type=\"1\">\r\n<li>Processed fairly and lawfully.<\/li>\r\n<li>Obtained only for one or more specified and lawful purposes, and not\r\nfurther processed in a way incompatible with them.<\/li>\r\n<li>Adequate, relevant and not excessive.<\/li>\r\n<li>Accurate and where necessary kept up to date.<\/li>\r\n<li>Not kept longer than necessary.<\/li>\r\n<li>Processed in line with the rights of data subjects.<\/li>\r\n<li>Kept secure with technical and operational measures.<\/li>\r\n<li>Not transferred outside the EEA without adequate protection.<\/li>\r\n<\/ol>\r\n<p>Principles 1 to 5, 7 and 8 are obligations on data controllers.\r\nPrinciple 6 is the rights of data subjects.<\/p>\r\n<h3 id=\"principle-1-grounds\">Principle 1 grounds<\/h3>\r\n<ul>\r\n<li>Consent<\/li>\r\n<li>Perform a contract with the individual<\/li>\r\n<li>Legal obligation<\/li>\r\n<li>Protect the vital interests of the data subject<\/li>\r\n<li>Public function under statutory powers<\/li>\r\n<li>Legitimate interests of the data controller unless prejudicial to\r\nthe data subject<\/li>\r\n<\/ul>\r\n<h3 id=\"principle-6-rights\">Principle 6 rights<\/h3>\r\n<ul>\r\n<li>Access, normally within 40 days for a fee of up to £10<\/li>\r\n<li>Know the purposes<\/li>\r\n<li>Have incorrect information corrected or erased<\/li>\r\n<li>Have a dispute recorded<\/li>\r\n<li>Explanation of the logic of automated decisions<\/li>\r\n<li>Request an assessment of compliance<\/li>\r\n<li>Compensation<\/li>\r\n<li>Prevent processing causing substantial damage or distress<\/li>\r\n<li>Not to receive direct marketing<\/li>\r\n<\/ul>\r\n<h3 id=\"dpa-exemptions\">DPA exemptions<\/h3>\r\n<ul>\r\n<li>National security<\/li>\r\n<li>Personal, domestic and recreational usage<\/li>\r\n<li>Prevention and detection of crime<\/li>\r\n<li>Journalistic, literature or artistic purposes<\/li>\r\n<li>Where another statute authorises disclosure<\/li>\r\n<\/ul>\r\n<h3 id=\"who-you-can-ask-under-foi\">Who you can ask under FOI<\/h3>\r\n<ul>\r\n<li>Parliament<\/li>\r\n<li>Government departments and other public bodies and committees<\/li>\r\n<li>Local councils<\/li>\r\n<li>Schools, colleges and universities<\/li>\r\n<li>Health trusts, hospitals and doctors' surgeries<\/li>\r\n<li>Publicly owned companies<\/li>\r\n<li>Publicly funded museums<\/li>\r\n<li>The police<\/li>\r\n<\/ul>\r\n<p>Private companies and privately funded museums are the usual wrong\r\noptions.<\/p>\r\n<h3 id=\"foi-absolute-exemptions\">FOI absolute exemptions<\/h3>\r\n<ul>\r\n<li>National security<\/li>\r\n<li>Prevention, detection of crime<\/li>\r\n<li>Taxation<\/li>\r\n<li>Judicial, at the court's discretion<\/li>\r\n<li>Regulatory authorities<\/li>\r\n<li>Advice to ministers<\/li>\r\n<li>Information accessible by other means<\/li>\r\n<\/ul>\r\n<h3 id=\"foi-qualified-exemptions\">FOI qualified exemptions<\/h3>\r\n<ul>\r\n<li>International relations<\/li>\r\n<li>Relations within the UK<\/li>\r\n<li>The country's economic interests<\/li>\r\n<li>Law enforcement<\/li>\r\n<li>Audit functions<\/li>\r\n<li>Effective conduct of public affairs<\/li>\r\n<li>Health and safety<\/li>\r\n<li>Commercial interests<\/li>\r\n<\/ul>\r\n<h3 id=\"foi-obligations\">FOI obligations<\/h3>\r\n<ul>\r\n<li>Communicate all information unless exempted<\/li>\r\n<li>DPA rights prevail<\/li>\r\n<li>Duty to say whether information is held<\/li>\r\n<li>Right is to recorded information, not the document<\/li>\r\n<li>Advise and assist<\/li>\r\n<li>Publication scheme<\/li>\r\n<li>Can refuse vexatious or repeated requests<\/li>\r\n<li>20 working days<\/li>\r\n<\/ul>\r\n<h3 id=\"cma-sections\">CMA sections<\/h3>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Section<\/th>\r\n<th>Offence<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>1<\/td>\r\n<td>Unauthorised access to computer material<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>2<\/td>\r\n<td>Unauthorised access with intent to commit or facilitate further\r\noffences<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>3<\/td>\r\n<td>Unauthorised acts with intent to impair, or recklessness as to\r\nimpairing, the operation of a computer<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>3ZA<\/td>\r\n<td>Unauthorised acts causing, or creating risk of, serious damage<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>3A<\/td>\r\n<td>Making, supplying or obtaining articles for use in an offence<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h3 id=\"problems-prosecuting-under-the-cma\">Problems prosecuting under\r\nthe CMA<\/h3>\r\n<ul>\r\n<li>Proving access was unauthorised, for section 1<\/li>\r\n<li>Proving intent for section 2, or malicious intent for section 3<\/li>\r\n<li>Proof of offence, such as logs and audit trails, and that the\r\ncomputer was working properly<\/li>\r\n<li>Proof the defendant was the perpetrator<\/li>\r\n<li>Technical detail baffling judge or jury<\/li>\r\n<li>Other Acts may be easier to prove<\/li>\r\n<\/ul>\r\n<h3 id=\"cyber-dependent-crime\">Cyber-dependent crime<\/h3>\r\n<p>These crimes are only possible through ICT. The device is both the\r\ntool and the target. The slide's examples are hacking, defacing a\r\nwebsite, DoS and malware.<\/p>\r\n<h3 id=\"cyber-enabled-crime\">Cyber-enabled crime<\/h3>\r\n<p>Traditional crime scaled up by ICT.<\/p>\r\n<ul>\r\n<li>Economic crime, such as fraud, piracy, IP theft and forgery<\/li>\r\n<li>Online marketplaces for illegal items<\/li>\r\n<li>Offensive communication, such as cyberbullying and social media<\/li>\r\n<li>Cyberstalking<\/li>\r\n<li>Child sexual offences<\/li>\r\n<li>Extreme publications<\/li>\r\n<\/ul>\r\n<h3 id=\"pci-dss-goals\">PCI DSS goals<\/h3>\r\n<ul>\r\n<li>Build and maintain a secure network<\/li>\r\n<li>Protect cardholder data<\/li>\r\n<li>Maintain a vulnerability management program<\/li>\r\n<li>Implement strong access control measures<\/li>\r\n<li>Regularly monitor and test networks<\/li>\r\n<li>Maintain an information security policy<\/li>\r\n<\/ul>\r\n<p>The standard sets out ways to protect card holder data, securely\r\ntransfer it, and monitor your own network. It says do NOT use\r\nvendor-supplied defaults.<\/p>\r\n<h3 id=\"law-ethics-policy\">Law, ethics, policy<\/h3>\r\n<p>Ethics define socially acceptable behaviours and come from moral\r\nattitudes or customs. They can be universal.<\/p>\r\n<p>Laws are rules that mandate or prohibit behaviour. They are drawn\r\nfrom ethics, carry the authority of a governing body, and tend to be\r\nlocal.<\/p>\r\n<p>Policy is guidelines describing acceptable and unacceptable\r\nbehaviour, with penalties for non-compliance.<\/p>\r\n<p>The slide says ignoring a policy is acceptable and ignoring a law is\r\nunacceptable.<\/p>\r\n<h3 id=\"causes-of-system-failure\">Causes of system failure<\/h3>\r\n<ul>\r\n<li>Poor development practices<\/li>\r\n<li>Incorrect assumptions<\/li>\r\n<li>Poor user interface<\/li>\r\n<li>Faulty hardware<\/li>\r\n<li>Inadequate user training, or user error<\/li>\r\n<li>Poor fit between system and organisation<\/li>\r\n<\/ul>\r\n<h3 id=\"safety-critical-systems\">Safety critical systems<\/h3>\r\n<ul>\r\n<li>Fail-safe failure modes<\/li>\r\n<li>Graceful degradation on failure of a sub-system<\/li>\r\n<li>Multiple backups using DISSIMILAR systems, hardware and\r\nsoftware<\/li>\r\n<li>Rigorous testing<\/li>\r\n<li>Rigorous external independent oversight<\/li>\r\n<\/ul>\r\n<h3 id=\"reasons-for-failure\">Reasons for failure<\/h3>\r\n<ul>\r\n<li>People, through poor training, not following procedures, and\r\nstress<\/li>\r\n<li>Organisational culture, meaning blame, unreasonable deadlines,\r\nfailure being too expensive to contemplate, and top management kept in\r\nthe dark<\/li>\r\n<li>No clear responsibility for dealing with failure<\/li>\r\n<li>Large projects have a momentum of their own<\/li>\r\n<li>Failures of regulators<\/li>\r\n<\/ul>\r\n<h3 id=\"before-an-ethical-decision\">Before an ethical decision<\/h3>\r\n<ul>\r\n<li>Clearly identify all the facts<\/li>\r\n<li>Define the areas of potential conflict<\/li>\r\n<li>Identify the stakeholders<\/li>\r\n<li>List all options<\/li>\r\n<li>List the consequences of the actions<\/li>\r\n<\/ul>\r\n<p>Then decide.<\/p>\r\n<h3 id=\"ethical-principles\">Ethical principles<\/h3>\r\n<table>\r\n<thead>\r\n<tr>\r\n<th>Principle<\/th>\r\n<th>What it says<\/th>\r\n<th>Attributed to<\/th>\r\n<\/tr>\r\n<\/thead>\r\n<tbody>\r\n<tr>\r\n<td>Utilitarianism<\/td>\r\n<td>Take the decision for the greatest good of everyone<\/td>\r\n<td><\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Risk aversion<\/td>\r\n<td>Take the decision that causes least harm<\/td>\r\n<td><\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Rule of Universality<\/td>\r\n<td>If the action is not right for everyone, it is not right for\r\nanyone<\/td>\r\n<td>Kant, 1724-1804<\/td>\r\n<\/tr>\r\n<tr>\r\n<td>Rule of Change<\/td>\r\n<td>If an action cannot be taken repeatedly, it is not right to take it\r\nat all<\/td>\r\n<td>Descartes, 1596-1650<\/td>\r\n<\/tr>\r\n<\/tbody>\r\n<\/table>\r\n<h3 id=\"ethical-consultant-in-it\">Ethical consultant in IT<\/h3>\r\n<ul>\r\n<li>Takes assignments only where they can confidently predict they can\r\nhelp<\/li>\r\n<li>Professionally qualified and keeps up CPD<\/li>\r\n<li>Guides or mentors junior consultants<\/li>\r\n<li>Has professional indemnity and public liability insurance<\/li>\r\n<li>Subscribes to a professional body with a code of conduct<\/li>\r\n<li>Supports that body with time or pro bono consulting<\/li>\r\n<\/ul>\r\n<h3 id=\"bcs-code-of-conduct\">BCS Code of Conduct<\/h3>\r\n<ol type=\"1\">\r\n<li>Public Interest<\/li>\r\n<li>Professional Competence and Integrity<\/li>\r\n<li>Duty to Relevant Authority<\/li>\r\n<li>Duty to the Profession<\/li>\r\n<\/ol>\r\n<h2 id=\"questions-worth-asking-the-tutor\">Questions worth asking the\r\ntutor<\/h2>\r\n<p>The 2024-25 paper and the slides leave these seven points\r\nunsettled.<\/p>\r\n<ol type=\"1\">\r\n<li><strong>Levels of offence in the CMA.<\/strong> The slides list five\r\nsections and give penalties for three. Is the expected answer 3 or\r\n5?<\/li>\r\n<li><strong>Who holds the right to access information under\r\nFOI.<\/strong> The paper's wording could mean the public authorities or\r\nthe members of the public.<\/li>\r\n<li><strong>Hacking as an offence under other laws.<\/strong> Does RIPA\r\n2000 count? The hacking slide does not name it.<\/li>\r\n<li><strong>What the ICO enforces.<\/strong> Is it the DPA 2018 only, or\r\nGDPR 2016 as well?<\/li>\r\n<li><strong>Bodies that prevent cyber threat and reduce\r\ncybercrime.<\/strong> Does the NCA count alongside the NCCU and\r\nGCHQ?<\/li>\r\n<li><strong>Project scale as a reason for system failure.<\/strong> The\r\nslide says \"large projects have a momentum of their own\". Does \"project\r\nscale is too large\" count as the same point?<\/li>\r\n<li><strong>How choose-all questions are marked.<\/strong> Is it all or\r\nnothing, are there part marks, and does a wrong tick lose marks?<\/li>\r\n<\/ol>\r\n"}, {"week": 1, "html": "<h1 id=\"week-1-notes\">Week 1 notes<\/h1>\r\n<p>Slide numbers for the lecture are the page numbers printed on the\r\nslides (s1 = title slide).<\/p>\r\n<h2 id=\"lecture-1-module-introduction-l1\">Lecture 1: Module Introduction\r\n(L1)<\/h2>\r\n<ul>\r\n<li>Module: MOD002647, \"Professional Issues: Computing and Society\"\r\n(PiSoC). Lecture #1: Module Introduction (L1 s1)<\/li>\r\n<li>Aim (L1 s2, s3): \"To provide an understanding of the issues,\r\nopportunities and problems, which have arisen as a result of the\r\ncomputerization of wide areas of human activity.\"<\/li>\r\n<li>Slide 3 asks \"Why is this important?\" (L1 s3)<\/li>\r\n<li>Professional issues impact society (L1 s4): diagram with the\r\nINDIVIDUAL inside SOCIETY, surrounded by Laws, Technology, Markets,\r\nSocial Norms. Source: adapted from Adams and McCrindle (2008), Pandora's\r\nBox, p7.<\/li>\r\n<li>Lesson outcomes (L1 s5), by the end of the lesson:\r\n<ol type=\"1\">\r\n<li>Explain the module learning outcomes<\/li>\r\n<li>Explain the five key themes of the module<\/li>\r\n<li>Understand where to go for more information on canvas<\/li>\r\n<li>Start to understand the requirements for assessment<\/li>\r\n<\/ol><\/li>\r\n<li>Learning outcomes, Knowledge and Understanding (L1 s6):\r\n<ol type=\"1\">\r\n<li>Explain and lead discussion on an approved topic on social,\r\nprofessional, legal or ethical aspects of computing and IT.<\/li>\r\n<li>Appreciate complexities of, criticise and contribute to discussions\r\nlead by others on social, professional, legal and ethical aspects of\r\ncomputing and IT.<\/li>\r\n<\/ol><\/li>\r\n<li>Learning outcomes, Intellectual, Practical, Affective and\r\nTransferrable Skills (L1 s7):\r\n<ul>\r\n<li>items 1 and 2 are blank in the extract<\/li>\r\n<li><ol start=\"3\" type=\"1\">\r\n<li>Give a professional presentation and stimulate discussion, comparing\r\nand contrasting key issues.<\/li>\r\n<\/ol><\/li>\r\n<li><ol start=\"4\" type=\"1\">\r\n<li>Critically appraise and evaluate own and other's work.<\/li>\r\n<\/ol><\/li>\r\n<\/ul><\/li>\r\n<li>5 key areas of this module (L1 s8): Legal, Social, Ethical, Systems,\r\nProfessional<\/li>\r\n<li>Why should I care? (L1 s9):\r\n<ul>\r\n<li>you may need to advise others as to what is legal (or illegal)<\/li>\r\n<li>you may need to assert your own rights<\/li>\r\n<li>you need to know where to go for further advice<\/li>\r\n<\/ul><\/li>\r\n<li>Legal issues (L1 s10): Data protection; Freedom of information;\r\nComputer misuse; Computer crime; ...<\/li>\r\n<li>Social issues (L1 s11): Technology trends; Social implications;\r\nDigital divide; Social access; Workplace / home; ...<\/li>\r\n<li>Ethical issues (L1 s12): Privacy / surveillance; Censorship; Freedom\r\nof speech; Whistle blowing; Equality of opportunity; ...<\/li>\r\n<li>System failures (L1 s13): Complexity; Organizational; Management;\r\nImpact; System design and life cycle; ...<\/li>\r\n<li>Professionalism (L1 s14): Codes of conduct; Professional bodies; Why\r\nit matters; ...<\/li>\r\n<li>How are you going to work? (L1 s15)\r\n<ul>\r\n<li>Computer Scientist viewpoint throughout: research, evidence,\r\ncritical evaluation, modeling, prediction; compliance and best\r\npractice<\/li>\r\n<li>Collaborative working: using resources on Canvas, reading etc.; with\r\nfellow students through discussion and presentations<\/li>\r\n<\/ul><\/li>\r\n<li>Canvas (L1 s16), Canvas example (L1 s17), \"Lots of reading...\" (L1\r\ns18): image-only, no text.<\/li>\r\n<li>Note: slide 8 says \"Systems\" but slide 13 heading says \"System\r\nFailures\"; slide 14 heading is \"Professionalism\" while slide 8 says\r\n\"Professional\".<\/li>\r\n<\/ul>\r\n<h2 id=\"seminar-1-introduction-s1\">Seminar 1: Introduction (S1)<\/h2>\r\n<p>Slides 1 to 9 are images only (no text extracted). Slides 16 to 18\r\nare image/blank.<\/p>\r\n<ul>\r\n<li>Assessment Outline (S1 s10): one single fine graded assessment,\r\nElement 010\r\n<ul>\r\n<li>Component 1: one hour in class test, 20% (in week 10 lecture)<\/li>\r\n<li>Component 2: Individual Report (2000 words), 80%, [+400-500 words\r\nappendix], submission via Canvas<\/li>\r\n<\/ul><\/li>\r\n<li>Assessment: Individual Report, weighting 80% (S1 s11): 2000 word\r\nreport on the topic of your choice. Marks allocation before weighting:\r\n<ul>\r\n<li>Overview/Introduction 15%<\/li>\r\n<li>THREE issues 3 x 5% (= 15%)<\/li>\r\n<li>Content/breadth of topic, analysis and depth of argument 30%<\/li>\r\n<li>Research and evidence presented 15%<\/li>\r\n<li>Presentation (structure and flow) 15%<\/li>\r\n<li>Conclusion 10%<\/li>\r\n<\/ul><\/li>\r\n<li>Some of last year's report topics (S1 s12): Wikileaks and the\r\nfreedom of Information; Should cryptocurrencies be regulated?; Effects\r\nof Linking Accounts; Internet Free Speech; Autonomous Vehicles: Friend\r\nor Foe?; Saudi Arabia grants Sophia by Hanson the first robotic\r\ncitizenship; Google What they do with our information; Amazon/Netflix -\r\nhas the telly had its day?<\/li>\r\n<li>Questions to help find topics (S1 s13): consequences of a business\r\nworld with \"too much information\"; easy access to data makes us\r\nintellectually lazy? effect on education systems; Can we do AI? Should\r\nwe do AI? What are the ethical implications?; IoT: comfortable life at\r\nthe cost of losing privacy? trust machines/sensors?<\/li>\r\n<li>Recommended Professional Learning and Activities (S1 s14):\r\n<ul>\r\n<li>Create a LinkedIn Profile; similarly a ResearchGate profile\r\n(researchers, PG students); create your GitHub profile (Computer Science\r\nand related fields), share source code in GitHub<\/li>\r\n<li>Use Professional Tools: Latex (e.g. online latex, overleaf) instead\r\nof MS Word for papers, reports, thesis (CS researchers / PG students);\r\nUnix based OS instead of Windows (SysAdmins, Programmers); open source\r\nsoftware instead of commercial software (Researchers, Scientific\r\nSoftware Developers); identify professional tools in your own area<\/li>\r\n<\/ul><\/li>\r\n<li>Recap group discussion, 15 minutes (S1 s15): Why is Professional\r\nIssues important? How is it relevant to your course? What are the 5 key\r\nareas of the module?<\/li>\r\n<\/ul>\r\n<h2 id=\"ico-overview-of-the-gdpr-ico\">ICO: Overview of the GDPR\r\n(ICO)<\/h2>\r\n<p>Document version dated 07 July 2016, version 1.0.25. Written when\r\nGDPR was due in force 25 May 2018 and before the Brexit outcome was\r\nsettled.<\/p>\r\n<h3 id=\"introduction-and-scope-ico-p3-4\">Introduction and scope (ICO\r\np3-4)<\/h3>\r\n<ul>\r\n<li>Compared against the UK Data Protection Act 1998 (DPA) (ICO p3).\r\nReferendum on EU membership: 23 June 2016 (ICO p3). GDPR expected in\r\nforce in UK 25 May 2018 (ICO p3).<\/li>\r\n<li>New features named: breach notification and data portability (ICO\r\np3).<\/li>\r\n<li>GDPR applies to controllers and processors (ICO p3).\r\n<ul>\r\n<li>Controller says how and why personal data is processed; processor\r\nacts on the controller's behalf (ICO p3)<\/li>\r\n<li>Processors have specific legal obligations, e.g. maintain records of\r\npersonal data and processing activities; significantly more legal\r\nliability for a breach; new under GDPR (ICO p3)<\/li>\r\n<li>Controllers are not relieved of obligations when a processor is\r\ninvolved; must ensure contracts with processors comply (ICO p3)<\/li>\r\n<\/ul><\/li>\r\n<li>Applies to organisations operating within the EU and organisations\r\noutside the EU that offer goods or services to EU citizens (ICO p3)<\/li>\r\n<li>Does not apply to: processing covered by the Law Enforcement\r\nDirective; processing for national security purposes; processing by\r\nindividuals purely for personal/household activities (ICO p3-4)<\/li>\r\n<li>Personal data: definition more detailed; online identifier, e.g. an\r\nIP address, can be personal data (ICO p4)<\/li>\r\n<li>Applies to automated personal data and manual filing systems where\r\npersonal data are accessible according to specific criteria (ICO\r\np4)<\/li>\r\n<li>Pseudonymised (e.g. key-coded) data can fall within scope depending\r\non how difficult it is to attribute the pseudonym to an individual (ICO\r\np4)<\/li>\r\n<li>Sensitive personal data = \"special categories of personal data\"\r\n(Article 9); include genetic and biometric data where processed to\r\nuniquely identify an individual (ICO p4)<\/li>\r\n<li>Criminal convictions and offences data are not special categories\r\nbut similar extra safeguards apply (Article 10) (ICO p4)<\/li>\r\n<\/ul>\r\n<h3 id=\"principles-ico-p5\">Principles (ICO p5)<\/h3>\r\n<ul>\r\n<li>New accountability requirement is the most significant addition; no\r\nprinciples on individuals' rights or overseas transfers (those are\r\nChapter III and Chapter V) (ICO p5)<\/li>\r\n<li>Article 5: personal data shall be:\r\n<ul>\r\n<li>(a) processed lawfully, fairly and in a transparent manner in\r\nrelation to individuals<\/li>\r\n<li>(b) collected for specified, explicit and legitimate purposes and\r\nnot further processed in a manner that is incompatible with those\r\npurposes (archiving in the public interest, scientific or historical\r\nresearch, statistical purposes not incompatible)<\/li>\r\n<li>(c) adequate, relevant and limited to what is necessary in relation\r\nto the purposes<\/li>\r\n<li>(d) accurate and, where necessary, kept up to date; inaccurate data\r\nerased or rectified without delay<\/li>\r\n<li>(e) kept in a form which permits identification of data subjects for\r\nno longer than is necessary<\/li>\r\n<li>(f) processed in a manner that ensures appropriate security,\r\nincluding protection against unauthorised or unlawful processing and\r\nagainst accidental loss, destruction or damage, using appropriate\r\ntechnical or organisational measures<\/li>\r\n<\/ul><\/li>\r\n<li>Article 5(2): \"the controller shall be responsible for, and be able\r\nto demonstrate, compliance with the principles.\"<\/li>\r\n<\/ul>\r\n<h3 id=\"lawful-processing-ico-p7-8\">Lawful processing (ICO p7-8)<\/h3>\r\n<ul>\r\n<li>Need a legal basis before processing; document it; basis affects\r\nindividuals' rights (e.g. consent gives stronger rights such as\r\ndeletion) (ICO p7)<\/li>\r\n<li>Member states may add specific provisions for Articles 6(1)(c) and\r\n(e); relevant to public authorities and highly regulated sectors (ICO\r\np7)<\/li>\r\n<li>Lawfulness of processing conditions (ICO p7):\r\n<ul>\r\n<li>6(1)(a) Consent of the data subject<\/li>\r\n<li>6(1)(b) necessary for performance of a contract with the data\r\nsubject or to take steps to enter into a contract<\/li>\r\n<li>6(1)(c) necessary for compliance with a legal obligation<\/li>\r\n<li>6(1)(d) necessary to protect the vital interests of a data subject\r\nor another person<\/li>\r\n<li>6(1)(e) necessary for performance of a task carried out in the\r\npublic interest or in the exercise of official authority vested in the\r\ncontroller<\/li>\r\n<li>6(1)(f) necessary for the legitimate interests pursued by the\r\ncontroller or a third party, except where overridden by the interests,\r\nrights or freedoms of the data subject. Not available to processing by\r\npublic authorities in the performance of their tasks.<\/li>\r\n<\/ul><\/li>\r\n<li>Special category conditions, Article 9(2) (ICO p8): (a) explicit\r\nconsent; (b) employment, social security or social protection law, or\r\ncollective agreement; (c) vital interests where data subject physically\r\nor legally incapable of consent; (d) not-for-profit body with political,\r\nphilosophical, religious or trade union aim (members/former members\r\nonly, no disclosure to third party without consent); (e) manifestly made\r\npublic by the data subject; (f) establishment, exercise or defence of\r\nlegal claims or courts acting in judicial capacity; (g) substantial\r\npublic interest on basis of Union or Member State law; (h) preventative\r\nor occupational medicine, assessing working capacity, medical diagnosis,\r\nhealth or social care; (i) public interest in public health; (j)\r\narchiving in public interest, scientific and historical research,\r\nstatistical purposes (Article 89(1))<\/li>\r\n<\/ul>\r\n<h3 id=\"consent-ico-p8-9\">Consent (ICO p8-9)<\/h3>\r\n<ul>\r\n<li>Both <code>consent' and <\/code>explicit consent' must be freely\r\ngiven, specific, informed and an unambiguous indication of wishes (ICO\r\np8)<\/li>\r\n<li>Requires clear affirmative action. Silence, pre-ticked boxes or\r\ninactivity do not constitute consent (ICO p8)<\/li>\r\n<li>Must be verifiable: keep a record of how and when consent was given\r\n(ICO p9)<\/li>\r\n<li>Right to withdraw consent at any time (ICO p9)<\/li>\r\n<li>Existing consent under DPA or EC Data Protection Directive\r\n(95/46/EC) need not be refreshed if it meets GDPR standard (Recital 171)\r\n(ICO p9)<\/li>\r\n<li>If the standard cannot be met: find an alternative legal basis or\r\ncease / not start the processing (ICO p9)<\/li>\r\n<\/ul>\r\n<h3 id=\"children-ico-p9\">Children (ICO p9)<\/h3>\r\n<ul>\r\n<li>Privacy notice for services offered directly to a child must be\r\nclear, plain, understandable by a child<\/li>\r\n<li>Information society service (online services targeted at children)\r\nneeds parent or guardian consent<\/li>\r\n<li>Parental/guardian consent required for children aged 16 and under;\r\nmember states may lower the age in law, not below 13<\/li>\r\n<li>Information society services = most internet services provided at\r\nthe user's request and for remuneration<\/li>\r\n<li>Protection particularly significant for marketing and creating\r\nonline profiles<\/li>\r\n<li>Parental consent not required for preventative or counselling\r\nservices offered directly to a child<\/li>\r\n<\/ul>\r\n<h3 id=\"individuals-rights-ico-p11\">Individuals' rights (ICO p11)<\/h3>\r\n<p>The GDPR provides these rights: 1. right to be informed; 2. right of\r\naccess; 3. right to rectification; 4. right to erasure; 5. right to\r\nrestrict processing; 6. right to data portability; 7. right to object;\r\n8. rights in relation to automated decision making and profiling. (Eight\r\nrights.)<\/p>\r\n<h3 id=\"right-of-access-ico-p12-13\">Right of access (ICO p12-13)<\/h3>\r\n<ul>\r\n<li>Entitled to: confirmation that data is being processed; access to\r\npersonal data; other supplementary information (largely the privacy\r\nnotice information, Article 15)<\/li>\r\n<li>Purpose: so individuals are aware of and can verify the lawfulness\r\nof processing (Recital 63)<\/li>\r\n<li>Copy free of charge; the 10 pound subject access fee under DPA\r\nremoved (shown as a garbled character in the extract). Reasonable fee\r\nallowed when request manifestly unfounded or excessive (particularly\r\nrepetitive), or for further copies; fee based on administrative\r\ncost<\/li>\r\n<li>Time: without delay and at the latest within one month of receipt;\r\nextend by a further two months if complex or numerous; inform the\r\nindividual within one month and explain why<\/li>\r\n<li>Manifestly unfounded or excessive: charge a reasonable fee or refuse\r\nto respond; if refusing, explain why, inform of right to complain to the\r\nsupervisory authority and to a judicial remedy, without undue delay and\r\nat the latest within one month<\/li>\r\n<li>Verify identity using \"reasonable means\"; electronic request gets\r\ncommonly used electronic format<\/li>\r\n<li>Best practice: remote access to a secure self-service system\r\n(Recital 63)<\/li>\r\n<li>Large amounts of data: may ask individual to specify the\r\ninformation; no exemption for large amounts<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-be-informed-ico-p14-15\">Right to be informed (ICO\r\np14-15)<\/h3>\r\n<ul>\r\n<li>Obligation to provide `fair processing information', typically a\r\nprivacy notice; transparency<\/li>\r\n<li>Information must be concise, transparent, intelligible and easily\r\naccessible; written in clear and plain language, particularly if\r\naddressed to a child; free of charge<\/li>\r\n<li>Information to supply: identity and contact details of controller\r\n(and representative) and the data protection officer; purpose and legal\r\nbasis; legitimate interests; categories of personal data; recipients;\r\ntransfers to third country and safeguards; retention period; existence\r\nof each data subject right; right to withdraw consent; right to lodge a\r\ncomplaint with a supervisory authority; source of the data and whether\r\npublicly accessible; whether provision is statutory or contractual and\r\nconsequences of failing to provide; existence of automated decision\r\nmaking including profiling<\/li>\r\n<li>When: data obtained directly: at the time the data are obtained. Not\r\nobtained directly: within a reasonable period, within one month; if used\r\nto communicate with the individual, at the latest at first\r\ncommunication; if disclosure to another recipient envisaged, at the\r\nlatest before the data are disclosed<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-rectification-ico-p17\">Right to rectification (ICO\r\np17)<\/h3>\r\n<ul>\r\n<li>Entitled to rectification if data inaccurate or incomplete<\/li>\r\n<li>Inform third parties it was disclosed to, where possible; tell\r\nindividuals about those third parties where appropriate<\/li>\r\n<li>Respond within one month; extend by two months if complex; if not\r\nacting, explain why and inform of right to complain to supervisory\r\nauthority and judicial remedy<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-erasure-ico-p18-19\">Right to erasure (ICO p18-19)<\/h3>\r\n<ul>\r\n<li>Also known as \"the right to be forgotten\"; not absolute<\/li>\r\n<li>Applies where: no longer necessary for original purpose; individual\r\nwithdraws consent; individual objects and no overriding legitimate\r\ninterest; unlawfully processed; must be erased to comply with legal\r\nobligation; processed in relation to offer of information society\r\nservices to a child<\/li>\r\n<li>DPA limited erasure to processing causing unwarranted and\r\nsubstantial damage or distress; GDPR has no such threshold<\/li>\r\n<li>Can refuse where processed: to exercise right of freedom of\r\nexpression and information; to comply with legal obligation for public\r\ninterest task or official authority; for public health purposes in the\r\npublic interest; archiving in public interest, scientific research,\r\nhistorical research or statistical purposes; exercise or defence of\r\nlegal claims<\/li>\r\n<li>Children: special attention where child gave consent and later\r\nrequests erasure (regardless of age at time of request), esp. social\r\nnetworks and forums (Recital 65)<\/li>\r\n<li>Must inform third parties of erasure unless impossible or\r\ndisproportionate effort; online organisations that made data public must\r\ntell other processors to erase links, copies or replication<\/li>\r\n<li>Example: search engine delists results; media publisher need not\r\nerase article if freedom of expression exemption applies<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-restrict-processing-ico-p20\">Right to restrict\r\nprocessing (ICO p20)<\/h3>\r\n<ul>\r\n<li>Similar to DPA right to `block' or suppress; may store data but not\r\nfurther process; retain just enough to ensure restriction respected<\/li>\r\n<li>Required when: individual contests accuracy (restrict until\r\nverified); individual objected and you are considering whether\r\nlegitimate grounds override; processing unlawful and individual opposes\r\nerasure and requests restriction; you no longer need the data but\r\nindividual needs it for a legal claim<\/li>\r\n<li>Inform third parties unless impossible or disproportionate; inform\r\nindividuals when lifting a restriction<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-data-portability-ico-p21-22\">Right to data portability\r\n(ICO p21-22)<\/h3>\r\n<ul>\r\n<li>Obtain and reuse personal data for own purposes across different\r\nservices; move, copy or transfer easily from one IT environment to\r\nanother<\/li>\r\n<li>Example: midata (UK banking), personal current account customers\r\naccess transactional data, upload to price comparison website<\/li>\r\n<li>Applies only: to personal data an individual has provided to a\r\ncontroller; where processing is based on consent or for performance of a\r\ncontract; when processing is by automated means<\/li>\r\n<li>Provide in structured, commonly used and machine readable form; open\r\nformats include CSV files; free of charge<\/li>\r\n<li>May need to transmit directly to another organisation if technically\r\nfeasible; not required to adopt compatible systems<\/li>\r\n<li>Consider other individuals' rights if data concerns more than one\r\nindividual<\/li>\r\n<li>Respond without undue delay and within one month; extend by two\r\nmonths if complex or numerous; inform within one month<\/li>\r\n<li>Article 29 Working Party to publish guidance<\/li>\r\n<\/ul>\r\n<h3 id=\"right-to-object-ico-p23-24\">Right to object (ICO p23-24)<\/h3>\r\n<ul>\r\n<li>Right to object to: processing based on legitimate interests or task\r\nin public interest/official authority (including profiling); direct\r\nmarketing (including profiling); processing for scientific/historical\r\nresearch and statistics<\/li>\r\n<li>Legitimate interests / public task: objection must be on \"grounds\r\nrelating to his or her particular situation\"; stop unless compelling\r\nlegitimate grounds that override, or for establishment, exercise or\r\ndefence of legal claims<\/li>\r\n<li>Inform of right to object \"at the point of first communication\" and\r\nin privacy notice; \"explicitly brought to the attention of the data\r\nsubject and shall be presented clearly and separately from any other\r\ninformation\"<\/li>\r\n<li>Direct marketing: stop as soon as you receive an objection; no\r\nexemptions or grounds to refuse; deal with at any time and free of\r\ncharge<\/li>\r\n<li>Research: need \"grounds relating to his or her particular\r\nsituation\"; if processing necessary for public interest task, no need to\r\ncomply<\/li>\r\n<li>Online processing: must offer a way to object online<\/li>\r\n<\/ul>\r\n<h3 id=\"automated-decision-making-and-profiling-ico-p25-26\">Automated\r\ndecision making and profiling (ICO p25-26)<\/h3>\r\n<ul>\r\n<li>Right not to be subject to a decision when it is based on automated\r\nprocessing and produces a legal effect or similarly significant\r\neffect<\/li>\r\n<li>Must ensure individuals can: obtain human intervention; express\r\ntheir point of view; obtain an explanation of the decision and challenge\r\nit<\/li>\r\n<li>Does not apply if decision: necessary for entering into or\r\nperformance of a contract; authorised by law (e.g. fraud or tax evasion\r\nprevention); based on explicit consent<\/li>\r\n<li>Profiling: any form of automated processing intended to evaluate\r\ncertain personal aspects of an individual, in particular to analyse or\r\npredict performance at work, economic situation, health, personal\r\npreferences, reliability, behaviour, location or movements<\/li>\r\n<li>Safeguards: fair and transparent (meaningful information about\r\nlogic, significance, consequences); appropriate mathematical or\r\nstatistical procedures; technical and organisational measures to correct\r\ninaccuracies and minimise errors; secure data proportionate to risk and\r\nprevent discriminatory effects<\/li>\r\n<li>Automated decisions under Article 9(2) must not concern a child, or\r\nbe based on special categories unless explicit consent or substantial\r\npublic interest on basis of EU/Member State law<\/li>\r\n<\/ul>\r\n<h3 id=\"accountability-and-governance-ico-p27-33\">Accountability and\r\ngovernance (ICO p27-33)<\/h3>\r\n<ul>\r\n<li>Accountability principle in Article 5(2): demonstrate compliance;\r\nthis is the controller's responsibility<\/li>\r\n<li>Privacy impact assessments and privacy by design now legally\r\nrequired in certain circumstances<\/li>\r\n<li>Demonstrate compliance: appropriate technical and organisational\r\nmeasures (staff training, internal audits, review of HR policies);\r\nmaintain documentation; appoint DPO where appropriate; data protection\r\nby design and by default; DPIAs where appropriate; can also adhere to\r\napproved codes of conduct / certification<\/li>\r\n<li>By design and default measures: data minimisation; pseudonymisation;\r\ntransparency; allowing individuals to monitor processing; creating and\r\nimproving security features on an ongoing basis<\/li>\r\n<li>Records of processing: more than 250 employees must keep internal\r\nrecords; fewer than 250 employees only records for higher risk\r\nprocessing (risk to rights and freedoms; special categories or criminal\r\nconvictions and offences) (ICO p28)<\/li>\r\n<li>Record: name and details of organisation (and other controllers,\r\nrepresentative, DPO); purposes; categories of individuals and personal\r\ndata; categories of recipients; transfers to third countries and\r\nsafeguards; retention schedules; technical and organisational security\r\nmeasures. Similar to \"registrable particulars\" under the DPA. May have\r\nto be made available to the supervisory authority.<\/li>\r\n<li>DPIA = data protection impact assessment, also known as privacy\r\nimpact assessment (PIA); not a legal requirement under the DPA (ICO\r\np29)<\/li>\r\n<li>Must carry out DPIA when using new technologies and processing\r\nlikely to result in high risk to rights and freedoms. High risk\r\nincludes: systematic and extensive processing incl. profiling and\r\ndecisions with legal or similarly significant effects; large scale\r\nprocessing of special categories or criminal convictions data; large\r\nscale, systematic monitoring of public areas (CCTV) (ICO p29)<\/li>\r\n<li>DPIA contents: description of operations and purposes (incl.\r\nlegitimate interests); assessment of necessity and proportionality;\r\nassessment of risks to individuals; measures to address risk including\r\nsecurity and to demonstrate compliance; can address more than one\r\nproject (ICO p30)<\/li>\r\n<li>Must appoint a Data Protection Officer (DPO) if you: are a public\r\nauthority (except courts in judicial capacity); carry out large scale\r\nsystematic monitoring of individuals (e.g. online behaviour tracking);\r\ncarry out large scale processing of special categories or criminal\r\nconvictions and offences data (ICO p30)<\/li>\r\n<li>One DPO may act for a group of companies or public authorities; any\r\norganisation can appoint a DPO<\/li>\r\n<li>DPO minimum tasks (Article 39): inform and advise on obligations;\r\nmonitor compliance (incl. managing internal activities, advising on\r\nDPIAs, training staff, internal audits); be the first point of contact\r\nfor supervisory authorities and individuals<\/li>\r\n<li>Employer duties: DPO reports to highest management level (board\r\nlevel); operates independently, not dismissed or penalised for\r\nperforming task; adequate resources (ICO p31)<\/li>\r\n<li>DPO role can be given to an existing employee if no conflict of\r\ninterests; can be contracted out externally; GDPR does not specify\r\ncredentials but requires professional experience and knowledge of data\r\nprotection law<\/li>\r\n<li>Codes of conduct and certification (ICO p31-33): not obligatory;\r\nbenefits: improve transparency and accountability, mitigation against\r\nenforcement action, improve standards. Codes drawn up by trade\r\nassociations or representative bodies; must be approved by the\r\nsupervisory authority and, where cross-border, the European Data\r\nProtection Board (EDPB). Code signatories subject to mandatory\r\nmonitoring by a body accredited by the supervisory authority;\r\ninfringement may lead to suspension or exclusion and fine up to 10\r\nmillion Euros or 2 per cent of global turnover<\/li>\r\n<li>Certification: issued by supervisory authorities or accredited\r\ncertification bodies; valid for a maximum of three years; can be\r\nwithdrawn; does not reduce data protection responsibilities; failure\r\nrisks fine up to 10 million Euros or 2 per cent of global turnover;\r\nencouraged by member states, supervisory authorities, the EDPB or the\r\nCommission<\/li>\r\n<\/ul>\r\n<h3 id=\"breach-notification-ico-p35-36\">Breach notification (ICO\r\np35-36)<\/h3>\r\n<ul>\r\n<li>Duty on all organisations to report certain breaches to the relevant\r\nsupervisory authority, and in some cases to affected individuals<\/li>\r\n<li>Personal data breach: a breach of security leading to the\r\ndestruction, loss, alteration, unauthorised disclosure of, or access to,\r\npersonal data; more than just losing personal data. Example: hospital\r\npatient health record inappropriately accessed<\/li>\r\n<li>Notify supervisory authority only where breach likely to result in a\r\nrisk to rights and freedoms (e.g. discrimination, damage to reputation,\r\nfinancial loss, loss of confidentiality, significant economic or social\r\ndisadvantage). Example: loss of customer details leaving people open to\r\nidentity theft = notify; staff telephone list = normally not<\/li>\r\n<li>Notify individuals directly where breach likely to result in a high\r\nrisk; threshold higher than for the supervisory authority<\/li>\r\n<li>Notification contents: nature of breach (categories and approximate\r\nnumber of individuals and records); name and contact details of DPO or\r\nother contact; likely consequences; measures taken or proposed<\/li>\r\n<li>Report within 72 hours of becoming aware; information can be\r\nprovided in phases; public notification without undue delay if\r\nsufficiently serious<\/li>\r\n<li>Failing to notify: fine up to 10 million Euros or 2 per cent of\r\nglobal turnover<\/li>\r\n<\/ul>\r\n<h3 id=\"transfer-of-data-ico-p37-39\">Transfer of data (ICO p37-39)<\/h3>\r\n<ul>\r\n<li>Restrictions on transfers outside the EU to third countries or\r\ninternational organisations; conditions in Chapter V<\/li>\r\n<li>Commission decision (Article 45): transfer where the Commission has\r\ndecided the third country, territory, sector or international\r\norganisation ensures an adequate level of protection<\/li>\r\n<li>Appropriate safeguards (Article 46): legally binding agreement\r\nbetween public authorities; binding corporate rules; standard data\r\nprotection clauses adopted by the Commission; standard clauses adopted\r\nby a supervisory authority and approved by the Commission; approved code\r\nof conduct; approved certification mechanism; contractual clauses\r\nauthorised by the supervisory authority; provisions in administrative\r\narrangements between public authorities<\/li>\r\n<li>Derogations (Article 49): informed consent; performance of contract\r\nwith individual or pre-contractual steps; contract in the interests of\r\nthe individual between controller and another person; important reasons\r\nof public interest; legal claims; vital interests where data subject\r\nincapable of consent; made from a public register. First three are not\r\navailable to public authorities in exercise of public powers<\/li>\r\n<li>One-off transfers allowed only if: not by a public authority\r\nexercising public powers; not repetitive; limited number of individuals;\r\nnecessary for compelling legitimate interests of the organisation (not\r\noverridden); suitable safeguards. Must inform the supervisory authority\r\nand give additional information to individuals<\/li>\r\n<\/ul>\r\n<h3 id=\"national-derogations-ico-p40\">National derogations (ICO\r\np40)<\/h3>\r\n<ul>\r\n<li>Article 23: Member States may restrict transparency obligations and\r\nindividual rights to safeguard: national security; defence; public\r\nsecurity; prevention, investigation, detection or prosecution of\r\ncriminal offences; other important public interests (economic or\r\nfinancial, budgetary, taxation, public health and security); protection\r\nof judicial independence and proceedings; breaches of ethics in\r\nregulated professions; monitoring, inspection or regulatory functions;\r\nprotection of the individual or rights and freedoms of others;\r\nenforcement of civil law matters<\/li>\r\n<li>Chapter IX: freedom of expression and freedom of information; public\r\naccess to official documents; national identification numbers; employee\r\ndata; archiving, scientific or historical research and statistical\r\npurposes; secrecy obligations; churches and religious associations<\/li>\r\n<\/ul>\r\n"}, {"week": 2, "html": "<h1 id=\"week-2-notes\">Week 2 notes<\/h1>\r\n<h2\r\nid=\"lecture-2-data-protection-pics-lecture-2-data-protection_new\">Lecture\r\n2: Data Protection (PICS-Lecture 2-Data Protection_new)<\/h2>\r\n<h3 id=\"learning-objectives-l2-s3\">Learning objectives (L2 s3)<\/h3>\r\n<ul>\r\n<li>recall data protection definitions<\/li>\r\n<li>outline the scope of the Data Protection Act 2018<\/li>\r\n<li>describe the obligations of Data Controllers<\/li>\r\n<li>describe the EIGHT data protection principles<\/li>\r\n<li>outline data protection exemptions<\/li>\r\n<\/ul>\r\n<h3 id=\"why-interested-l2-s4\">Why interested (L2 s4)<\/h3>\r\n<ul>\r\n<li>its LAW!<\/li>\r\n<li>you may need to advise others as to what is legal (or illegal)<\/li>\r\n<li>you may need to assert your own rights<\/li>\r\n<li>you may need to apply some of this to your final project, e.g.\r\nsoftware, or surveys<\/li>\r\n<li>you need to know where to go for further advice<\/li>\r\n<\/ul>\r\n<h3 id=\"it-law-list-with-years-l2-s5\">I.T. Law list with years (L2\r\ns5)<\/h3>\r\n<ul>\r\n<li>Data Protection Act (DPA 1994, 1998, 2018)<\/li>\r\n<li>GDPR (2016)<\/li>\r\n<li>Regulation of Investigatory Powers Act (RIPA 2018)<\/li>\r\n<li>Freedom of Information (FOI 2000)<\/li>\r\n<li>Computer Misuse Act (CMA 1990)<\/li>\r\n<li>Intellectual Property Law<\/li>\r\n<\/ul>\r\n<h3 id=\"data-protection-overview-l2-s6\">Data Protection overview (L2\r\ns6)<\/h3>\r\n<ul>\r\n<li>Data Protection Act 1984; updated in 1998, 2018: Data Protection Act\r\n2018<\/li>\r\n<li>General Data Protection Regulation 2016<\/li>\r\n<li>They outline the areas in law which cover: the rights YOU have about\r\nYOUR data; the responsibilities others have to look after it carefully;\r\n'privacy' you can expect around data storage<\/li>\r\n<\/ul>\r\n<h3 id=\"definitions-l2-s7-8\">Definitions (L2 s7-8)<\/h3>\r\n<ul>\r\n<li>Data: raw facts gathered about someone or something (s7)<\/li>\r\n<li>Personal data: data about a living person who can be identified from\r\nthe data; human beings (s7)<\/li>\r\n<li>Sensitive personal data: personal data related to racial or ethnical\r\norigins, religious believes, political opinions, physical/mental health,\r\nsexual preferences, criminal records (s7)<\/li>\r\n<li>Processing: anything you do with personal data: hold, store, gather,\r\ndelete, modify... (s7)<\/li>\r\n<li>Data Subject: the individual who is the subject of personal data\r\n(s8)<\/li>\r\n<li>Data Controller: the person(s) (or organisation) who holds the data\r\nor controls the processing (s8)<\/li>\r\n<li>Data Processor: anyone in (an organisation) contracted to do some\r\ndata processing under data controller's instructions (s8)<\/li>\r\n<\/ul>\r\n<h3 id=\"dpa-1998-l2-s9-10\">DPA 1998 (L2 s9-10)<\/h3>\r\n<ul>\r\n<li>Personal data held or processed in automated form AND some manual\r\nrecords (s9)<\/li>\r\n<li>Enforced by Information Commissioner (ICO) in UK (s9)<\/li>\r\n<li>8 Data Protection Principles (s9)<\/li>\r\n<li>Data Controller obligated to (s10):\r\n<ul>\r\n<li>NOTIFY the Information Commissioner on: what TYPES of information\r\nheld for what PURPOSES; obtained from WHO; disclosed to WHO<\/li>\r\n<li>published on public Register<\/li>\r\n<li>follow 8 Data Protection Principles<\/li>\r\n<li>payment of annual fee<\/li>\r\n<\/ul><\/li>\r\n<\/ul>\r\n<h3 id=\"principles-overview-l2-s11\">Principles overview (L2 s11)<\/h3>\r\n<ul>\r\n<li>DPA lays out 8 principles which apply to collecting and processing\r\npersonal data<\/li>\r\n<li>Obligations on Data Controllers: Principles 1-5, 7, 8<\/li>\r\n<li>Rights of Data Subjects: Principle 6<\/li>\r\n<li>\"compliance\": just enough to comply with the law<\/li>\r\n<li>\"best practice\": good understanding within the law<\/li>\r\n<\/ul>\r\n<h3 id=\"the-eight-principles\">The eight principles<\/h3>\r\n<ul>\r\n<li>Principle #1 (L2 s12): Personal data shall be processed fairly and\r\nlawfully\r\n<ul>\r\n<li>with consent<\/li>\r\n<li>to perform a contract with individual<\/li>\r\n<li>under a legal obligation<\/li>\r\n<li>to protect the vital interests of the data subject<\/li>\r\n<li>carry out public function under statutory powers<\/li>\r\n<li>pursue legitimate Interests of data controller unless prejudicial\r\ninterests of data subject<\/li>\r\n<\/ul><\/li>\r\n<li>Principle #1, sensitive data (L2 s13): needs extra care and higher\r\nsecurity\r\n<ul>\r\n<li>with explicit consent<\/li>\r\n<li>necessary under a legal obligation in the context of employment<\/li>\r\n<li>to protect the vital interests of the data subject where consent\r\ncannot be given or is withheld<\/li>\r\n<li>by certain not-for-profit bodies about their members (with\r\nappropriate safeguards)<\/li>\r\n<li>where the information has been deliberately made public by data\r\nsubject<\/li>\r\n<li>in legal processes<\/li>\r\n<li>to carry out certain public functions or under statutory powers<\/li>\r\n<li>necessary for medical purposes, undertaken by a health\r\nprofessional<\/li>\r\n<li>for racial or ethnic monitoring<\/li>\r\n<\/ul><\/li>\r\n<li>Principle #2 (L2 s14): Personal data shall be obtained for only for\r\none or more specified and lawful purposes, and shall not be further\r\nprocessed in any manner incompatible with that purpose or those\r\npurposes<\/li>\r\n<li>Principle #3 (L2 s15): Personal data shall be adequate, relevant and\r\nnot excessive in relation to the purposes for which they are\r\nprocessed<\/li>\r\n<li>Principle #4 (L2 s16): Personal data shall be accurate and where\r\nnecessary kept up to date<\/li>\r\n<li>Principle #5 (L2 s17): Personal data ... shall not be kept any\r\nlonger than is necessary for the purpose(s) it is processed<\/li>\r\n<li>Principle #6 (L2 s20) (Rights of a data subject): Personal data\r\nshall be processed in relation to the rights of data subjects under the\r\nAct. You have the RIGHT to:\r\n<ul>\r\n<li>access any data held on you (normally within 40 days, and fee up to\r\n£10)<\/li>\r\n<li>know purpose(s) for which personal data held<\/li>\r\n<li>have incorrect information corrected (or, if data controller won't\r\ncorrect, erased)<\/li>\r\n<li>have any dispute over correctness recorded and visible with the\r\nrecord<\/li>\r\n<li>an explanation behind the logic of automated decisions<\/li>\r\n<li>request an assessment if DPA is being complied with<\/li>\r\n<li>compensation for damage or damage and distress in (mis)use of\r\npersonal data<\/li>\r\n<li>prevent processing which causes substantial damage or substantial\r\ndistress<\/li>\r\n<li>not to receive direct marketing<\/li>\r\n<\/ul><\/li>\r\n<li>Principle #7 (Security) (L2 s18): Appropriate technical and\r\noperational measures shall be taken\r\n<ul>\r\n<li>against unauthorised or unlawful processing of personal data<\/li>\r\n<li>against accidental loss, or destruction of, or damage to, personal\r\ndata<\/li>\r\n<\/ul><\/li>\r\n<li>Principle #8 (Transfer Abroad) (L2 s19): Personal Data shall not be\r\ntransferred to a country ... outside the EEA unless that country ...\r\nensures an adequate level of protection for the rights and freedoms of\r\ndata subjects in relation to the processing of personal data (putting on\r\nthe internet = world-wide transfer)<\/li>\r\n<\/ul>\r\n<h3 id=\"exemptions-l2-s21\">Exemptions (L2 s21)<\/h3>\r\n<ul>\r\n<li>National Security<\/li>\r\n<li>Personal, Domestic and Recreational usage<\/li>\r\n<li>Prevention and detection of crime<\/li>\r\n<li>Journalistic, literature or artistic purposes<\/li>\r\n<li>Where another statute authorises disclosure<\/li>\r\n<\/ul>\r\n<h3 id=\"data-protection-act-2018-l2-s22\">Data Protection Act 2018 (L2\r\ns22)<\/h3>\r\n<ul>\r\n<li>URL: legislation.gov.uk/ukpga/2018/12 (ukpga_20180012)<\/li>\r\n<li>\"This includes GDPR\"<\/li>\r\n<li>GDPR: effective across all EU member states; provides legal\r\nobligations we must adhere to<\/li>\r\n<li>GDPR gives member states limited opportunities on how this applies\r\nto individual countries. The DPA 2018 takes care of this.<\/li>\r\n<li>Read the DPA2018 alongside GDPR to fully understand the legal\r\nobligations<\/li>\r\n<\/ul>\r\n<h3 id=\"gdpr-l2-s23-24\">GDPR (L2 s23-24)<\/h3>\r\n<ul>\r\n<li>General Data Protection Regulation; effective across all EU member\r\nstates; supports the DPA2018 (s23)<\/li>\r\n<li>Main improvements: accountability principles: first, very clear that\r\nthe data controller is responsible for compliance; second, the data\r\ncontroller must be able to demonstrate compliance (s23)<\/li>\r\n<li>Higher standard for consent: consent is now opt-in, and evidence\r\nmust be kept (s23)<\/li>\r\n<li>Post-Brexit (s24): GDPR applies to all EU countries and citizens; we\r\nneed to comply with GDPR; GDPR has extraterritorial effect, so non-EU\r\ncountries are also affected, so any UK company doing business with the\r\nEU will still need to comply<\/li>\r\n<\/ul>\r\n<h3 id=\"ico-l2-s25\">ICO (L2 s25)<\/h3>\r\n<ul>\r\n<li>Information Commissioner's Office (ICO)<\/li>\r\n<li>Wycliffe House, Water Lane, Wilmslow, Cheshire, SK9 5AF<\/li>\r\n<li>tel: 01625 545 745; 0303 123 1113 (info line)<\/li>\r\n<li>Email: <a href=\"mailto:casework@ico.org.uk\">casework@ico.org.uk<\/a>;\r\nHomepage: <a href=\"http://www.ico.org.uk\">www.ico.org.uk<\/a><\/li>\r\n<li>The Data Protection Register (for data controllers)<\/li>\r\n<\/ul>\r\n<h3 id=\"direct-mail-opt-outs-and-spam-l2-s26\">Direct mail opt-outs and\r\nspam (L2 s26)<\/h3>\r\n<ul>\r\n<li>Mailing Preference service (mpsonline.org.uk); Fax Preference\r\nservice (fpsonline.org.uk); Telephone Preference service\r\n(tpsonline.org.uk)<\/li>\r\n<li>SPAM: sending unsolicited emails to individual consumers (not\r\nbusinesses) is an offence against the Privacy and Electronic\r\nCommunications Regulations (PECR), regulated by the ICO. SPAM might also\r\nfall into the DPA 2018.<\/li>\r\n<\/ul>\r\n<h3 id=\"summary-l2-s27\">Summary (L2 s27)<\/h3>\r\n<ul>\r\n<li>Legally obliged to protect people's data: DPA1998/2018; \"GDRP 2016\"\r\n(slide typo for GDPR)<\/li>\r\n<li>8 guiding principles to data protection<\/li>\r\n<li>Some exemptions exist; if you are not exempt and don't follow the\r\nlaw, you will be penalised (fines/imprisonment)<\/li>\r\n<\/ul>\r\n<h3 id=\"slide-inconsistencies\">Slide inconsistencies<\/h3>\r\n<ul>\r\n<li>DPA first year: 1984 (s6) vs \"1994\" in the list (s5)<\/li>\r\n<li>RIPA given as 2018 (s5)<\/li>\r\n<li>Slide 27 spells GDPR as \"GDRP\"<\/li>\r\n<\/ul>\r\n<h2\r\nid=\"seminar-2-user-data-privacy-facebook--cambridge-analytica-pics-seminar-2\">Seminar\r\n2: User Data Privacy: Facebook &amp; Cambridge Analytica (PICS-Seminar\r\n2)<\/h2>\r\n<ul>\r\n<li>Seminar #2 topic: User Data Privacy: Facebook &amp; Cambridge\r\nAnalytica (S2 s1-2)<\/li>\r\n<li>Task (S2 s3): 1 Read the paper; 2 Discuss the paper in your group; 3\r\nWrite down the key points of the report from your point of view; 4 Write\r\ndown the impacts on 5 categories of issues: Ethical, Legal, Social,\r\nProfessional and Systems<\/li>\r\n<li>OCEAN: 5 Big Five Personality Traits (S2 s4-5):\r\n<ul>\r\n<li>Openness to experience (inventive/curious vs.\r\nconsistent/cautious)<\/li>\r\n<li>Conscientiousness (efficient/organized vs. easy-going/careless)<\/li>\r\n<li>Extraversion (outgoing/energetic vs. solitary/reserved)<\/li>\r\n<li>Agreeableness (friendly/compassionate vs. challenging/detached)<\/li>\r\n<li>Neuroticism (sensitive/nervous vs. secure/confident)<\/li>\r\n<\/ul><\/li>\r\n<li>Assessment overview (S2 s14): one single fine graded assessment\r\nelement, Element 010\r\n<ul>\r\n<li>Part 1: in-class test, 20%<\/li>\r\n<li>Part 2: individual report (2000 words), 80%<\/li>\r\n<li>Submission via CANVAS: 2pm Friday week 12<\/li>\r\n<\/ul><\/li>\r\n<li>This week (S2 s15): choose your topic after group discussion<\/li>\r\n<li>Report prep (S2 s16): \"What is my topic? Why does it matter?\"; 30\r\nminutes; brief overview of topic; why it matters; each group everyone\r\ncan have 5 minutes informal presentation time<\/li>\r\n<li>Homework (S2 s18): \"One thing I will do this week in relation to the\r\nmodule...\"<\/li>\r\n<li>Slides 6-10, 17 image only (no text)<\/li>\r\n<\/ul>\r\n<h2\r\nid=\"reading-user-data-privacy-facebook-cambridge-analytica-and-privacy-protection-isaak-and-hanna-ieee-computer-the-policy-corner-august-2018\">Reading:\r\n\"User Data Privacy: Facebook, Cambridge Analytica, and Privacy\r\nProtection\" (Isaak and Hanna, IEEE Computer, The Policy Corner, August\r\n2018)<\/h2>\r\n<ul>\r\n<li>Authors: Jim Isaak (IEEE Computer Society, past president) and Mina\r\nJ. Hanna (Synopsys; chair IEEE-USA AI and AS Policy Committees);\r\npublished by IEEE Computer Society, Computer, August 2018 (CA\r\np56-59)<\/li>\r\n<li>Facebook gave unfettered and unauthorized access to PII (personally\r\nidentifiable information) of more than 87 million Facebook users to\r\nCambridge Analytica (CA p56)<\/li>\r\n<li>IoT devices: 500 million in 2003; 8 billion in 2017; expected 50\r\nbillion in 2020 (CA p57)<\/li>\r\n<li>Facebook being investigated by the Federal Trade Commission (FTC)\r\nfor violating a 2011 consent decree; the article says US privacy law is\r\nsorely deficient (CA p57)<\/li>\r\n<li>2013: researchers at University of Cambridge's Psychometrics Centre\r\nanalysed volunteers who took a personality test on Facebook to evaluate\r\n\"OCEAN\" profile (openness, conscientiousness, extraversion,\r\nagreeableness, neuroticism), correlated with Facebook likes and shares;\r\ndrew in 350,000 US participants (CA p57)<\/li>\r\n<li>OCEAN profile could be deduced reasonably accurately from these\r\nmetrics without a formal psychographic instrument; no indication the\r\nresearch exposed participants or friends to privacy abuse; university\r\nreportedly refused to share data with what became Cambridge Analytica\r\n(CA p57)<\/li>\r\n<li>Second research project reportedly initiated by Global Science\r\nResearch (GSR), in cooperation with Cambridge Analytica; personality\r\nquiz on Amazon's Mechanical Turk platform and Qualtrics (survey\r\nplatform); quiz required users to grant GSR access to Facebook profile,\r\nwhich gave access to friends' data via the Facebook Open API until May\r\n2015 (CA p57)<\/li>\r\n<li>Cambridge Analytica built \"5,000+ data points on 230 million US\r\nadults\"; ability to \"micro-target\" consumers or voters (CA p57)<\/li>\r\n<li>\"Project Alamo\": OCEAN analysis paired with targeted messages; used\r\nfor the election campaign of President Trump (CA p57)<\/li>\r\n<li>CA CEO: identify those who might be enticed to vote for their client\r\nor discouraged to vote for opponent (CA p57)<\/li>\r\n<li>Not having a Facebook account gave no protection; websites with the\r\nFacebook logo link to Facebook, allowing tracking of non-members; web\r\nbeacons tied to \"cookies\" (CA p58)<\/li>\r\n<li>Tipping the scale in a few states with as few as 100,000 voters\r\nusing individualized messages is sufficient to impact election results\r\n(CA p58)<\/li>\r\n<li>Michal Kosinski (Stanford professor, part of 2013 Cambridge team)\r\nand colleagues: psychographic analysis significant impact with a sample\r\nbase of 3.5 million users (CA p58)<\/li>\r\n<li>Core principles of privacy and data protection, based on IEEE-USA\r\n\"Personal Privacy, Awareness and Control\" position statement (CA\r\np58-59), four headings:\r\n<ul>\r\n<li>Public transparency<\/li>\r\n<li>Disclosure for users<\/li>\r\n<li>Control (includes: \"do not track\" requests respected; users\r\nexplicitly opt in to each data component retained; easily delete PII;\r\ndisputes must not default to licenses and arbitration; consent for self\r\nmust not extend to \"friends\" or \"contacts\"; minors protected by a\r\nlegally mandated age of consent)<\/li>\r\n<li>Notification (users directly and promptly informed of loss or misuse\r\nof private information; right to know source of violations and\r\nresponsible parties; paid advertising and content must be clearly\r\nlabelled as paid)<\/li>\r\n<\/ul><\/li>\r\n<li>CONSENT Act (S.2639): \"Customer Online Notification for Stopping\r\nEdge-Provider Network Transgressions\"; Senators Richard Blumenthal\r\n(D-CT) and Ed Markey (D-MA); requires FTC to establish privacy\r\nprotections for customers of online edge providers; explicit opt-in\r\nconsent before platforms use, share or sell PII; explicit notification\r\nany time data is gathered, shared or sold to a third party; new data\r\nbreach reporting requirements; violations treated like unfair or\r\ndeceptive acts under section 18(a)(1)(B) of the Federal Trade Commission\r\nAct, giving FTC jurisdiction (CA p59)<\/li>\r\n<li>Social Media Privacy Protection and Consumer Rights Act of 2018\r\n(S.2728): Senator Amy Klobuchar (D-MN); similar constraints to CONSENT\r\nAct on disclosure and initial consent; adds restrictions on\r\nmodifications to privacy terms, withdrawal of consent, and procedures on\r\nviolation (notification, data erasure, ceasing to collect data) (CA\r\np59)<\/li>\r\n<li>California: privacy bill to State Legislature; limits on selling\r\ndata on users younger than 16 years of age; prevents businesses denying\r\nservice to users who exercise their rights (CA p59)<\/li>\r\n<li>Debate started in April 2018 after the revelation; Mark Zuckerberg\r\nasked to testify before House Judiciary and Senate Judiciary and\r\nCommerce Committees (CA p59)<\/li>\r\n<\/ul>\r\n"}, {"week": 3, "html": "<h1 id=\"week-3-notes-foi-privacy-surveillance\">Week 3 notes: FOI,\r\nPrivacy, Surveillance<\/h1>\r\n<p>Location key: L3 sN = Lecture 3 slide N; S3 sN = Seminar 3 slide N;\r\nUS pN = \"Under Surveillance\" reading (printed journal page); NS sN =\r\n\"New Species in a Built Ecosystem\" slide N.<\/p>\r\n<hr />\r\n<h2\r\nid=\"lecture-3-freedom-of-information-pics-lecture-3-foi-privacy_new\">Lecture\r\n3: Freedom of Information (PICS-Lecture 3-FOI-Privacy_new)<\/h2>\r\n<h3 id=\"module-and-learning-objectives\">Module and learning\r\nobjectives<\/h3>\r\n<ul>\r\n<li>Module MOD002647 Professional Issues: Computing and Society; topic\r\nFreedom of Information (L3 s1)<\/li>\r\n<li>Learning objectives (L3 s2): describe the FOI Act 2000; understand\r\nPublic Authority's obligations; outline exemptions from the act; outline\r\nthe differences between DPA, FOI, EIR applications; explain what RIPA\r\n2000 covers.<\/li>\r\n<li>Discussion prompts (L3 s3-s6): \"What is Freedom?\"; \"What does\r\nfreedom of information mean?\"; \"Should information be free (available)\r\nor restricted?\"<\/li>\r\n<\/ul>\r\n<h3 id=\"it-law-list-l3-s7\">I.T. Law list (L3 s7)<\/h3>\r\n<ul>\r\n<li>Data Protection Act (DPA 1998)<\/li>\r\n<li>GDPR (2016)<\/li>\r\n<li>Freedom of Information Act (FOI 2000)<\/li>\r\n<li>Regulation of Investigatory Powers Act (RIPA 2000)<\/li>\r\n<li>Computer Misuse Act (CMA 1990)<\/li>\r\n<li>Intellectual Property Law<\/li>\r\n<\/ul>\r\n<h3 id=\"foi-2000-core-l3-s8\">FOI 2000 core (L3 s8)<\/h3>\r\n<ul>\r\n<li>Freedom of Information Act 2000: \"The right to access information\r\nheld by public authorities, in the course of their carrying out public\r\nfunctions.\"<\/li>\r\n<li>Public authorities are obliged to publish certain information about\r\ntheir activities.<\/li>\r\n<li>Any member of the public is entitled to request information from\r\npublic authorities.<\/li>\r\n<\/ul>\r\n<h3 id=\"you-can-request-information-from-l3-s9\">You can request\r\ninformation from (L3 s9)<\/h3>\r\n<ul>\r\n<li>parliament<\/li>\r\n<li>government departments, and other public bodies and committees<\/li>\r\n<li>local councils<\/li>\r\n<li>schools, colleges and universities<\/li>\r\n<li>health trusts, hospitals and doctors' surgeries<\/li>\r\n<li>publicly owned companies<\/li>\r\n<li>publicly funded museums<\/li>\r\n<li>the police<\/li>\r\n<li>Full list: legislation.gov.uk/ukpga/2000/36/schedule/1<\/li>\r\n<\/ul>\r\n<h3 id=\"scope-and-supervision-l3-s10\">Scope and supervision (L3\r\ns10)<\/h3>\r\n<ul>\r\n<li>The Act covers any recorded information held by: a public authority\r\nin England, Wales and Northern Ireland; UK-wide public authorities based\r\nin Scotland.<\/li>\r\n<li>Information held b

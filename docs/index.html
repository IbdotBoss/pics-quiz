y Scottish public authorities is covered by\r\nScotland's own Freedom of Information (Scotland) Act 2002.<\/li>\r\n<li>The Act is supervised by the Information Commissioner's Office\r\n(ICO).<\/li>\r\n<\/ul>\r\n<h3 id=\"recorded-information-l3-s11\">Recorded information (L3 s11)<\/h3>\r\n<ul>\r\n<li>Covers recorded information, including: printed documents, computer\r\nfiles, letters, emails, photographs, and sound or video recordings.<\/li>\r\n<li>The Act does not give people access to their own personal data, such\r\nas their health records or credit reference file.<\/li>\r\n<\/ul>\r\n<h3 id=\"public-authoritys-obligations-l3-s12\">Public Authority's\r\nobligations (L3 s12)<\/h3>\r\n<ul>\r\n<li>All information shall be communicated (unless exempted).<\/li>\r\n<li>DPA rights prevail: consider DPA before FOI.<\/li>\r\n<li>Duty to be told whether information 'held' or not.<\/li>\r\n<li>Right to recorded information (not the document).<\/li>\r\n<li>Duty to 'advise and assist' requestor in formulating requests.<\/li>\r\n<li>All PAs must publish and update a 'publication scheme' showing what\r\ninformation is already available and where it might be found /\r\naccessed.<\/li>\r\n<li>Can refuse vexatious or repeated requests.<\/li>\r\n<li>Must supply info within 20 working days unless more time needed to\r\nconsider public interest test / possible exemption.<\/li>\r\n<\/ul>\r\n<h3 id=\"public-interest-l3-s13\">Public interest (L3 s13)<\/h3>\r\n<ul>\r\n<li>Does NOT mean \"what interests the public\".<\/li>\r\n<li>Does mean: transparency of decision making, accountability of public\r\nfunds, public understanding; major general public interest in the issue\r\n(e.g. major policy decision); plausible suspicion of wrongdoing;\r\npresenting a full picture.<\/li>\r\n<\/ul>\r\n<h3 id=\"outside-of-public-interest-l3-s14\">Outside of public interest\r\n(L3 s14)<\/h3>\r\n<ul>\r\n<li>Government classified material<\/li>\r\n<li>good decision making<\/li>\r\n<li>commercial confidentiality<\/li>\r\n<li>expectation of privacy<\/li>\r\n<li>Information is not usually released on an 'all or nothing' basis:\r\nsome parts may be released but other parts restricted or redacted.<\/li>\r\n<li>The Information Commissioner (or an Information Rights Tribunal) may\r\nconsider that passage of time may make what was once right to withhold\r\nnow able to be published.<\/li>\r\n<\/ul>\r\n<h3 id=\"exemptions-l3-s15\">Exemptions (L3 s15)<\/h3>\r\n<p>ABSOLUTE exemptions (7):<\/p>\r\n<ol type=\"1\">\r\n<li>National Security<\/li>\r\n<li>Prevention, detection crime<\/li>\r\n<li>Taxation<\/li>\r\n<li>Judicial (at Court's discretion)<\/li>\r\n<li>Regulatory authorities<\/li>\r\n<li>Advice to ministers<\/li>\r\n<li>Information accessible by other means<\/li>\r\n<\/ol>\r\n<p>QUALIFIED exemptions (8):<\/p>\r\n<ol type=\"1\">\r\n<li>International relations<\/li>\r\n<li>Relations within UK (Scot/Wales/NI)<\/li>\r\n<li>The country's economic interests<\/li>\r\n<li>Law enforcement<\/li>\r\n<li>Audit functions<\/li>\r\n<li>Effective conduct of public affairs<\/li>\r\n<li>Health and safety<\/li>\r\n<li>Commercial interests (difficult to prove)<\/li>\r\n<\/ol>\r\n<h3 id=\"public-interest-test-l3-s16\">Public interest test (L3 s16)<\/h3>\r\n<ul>\r\n<li>\"Statutory right of access\": if the public interest in disclosure\r\noutweighs the public interest of maintaining an exemption to disclosure,\r\nthe information commissioner may rule that material has to be\r\ndisclosed.<\/li>\r\n<\/ul>\r\n<h3 id=\"where-to-apply-l3-s17\">Where to apply (L3 s17)<\/h3>\r\n<ul>\r\n<li>Freedom of Information Act 2000: information held by public\r\nbodies.<\/li>\r\n<li>Data Protection Act: information organisations hold about you.<\/li>\r\n<li>Environmental Information Regulations (EIR): environmental\r\ninformation.<\/li>\r\n<li>FOI requests made via <a\r\nhref=\"http://www.gov.uk/make-a-freedom-of-information-request\">www.gov.uk/make-a-freedom-of-information-request<\/a><\/li>\r\n<\/ul>\r\n<h3 id=\"enforcement-and-appeals-l3-s18\">Enforcement and appeals (L3\r\ns18)<\/h3>\r\n<ul>\r\n<li>Information Commissioner is responsible to enforce FOI.<\/li>\r\n<li>Appeals sequence: Internal Departmental Review; Information\r\nCommissioner; Courts.<\/li>\r\n<li>IC has absolute right to see the disputed information and make a\r\njudgement.<\/li>\r\n<li>Cabinet Minister can (could) override this decision with a\r\nveto.<\/li>\r\n<\/ul>\r\n<h3 id=\"why-do-i-care-l3-s19\">Why do I care? (L3 s19)<\/h3>\r\n<ul>\r\n<li>You may go to work for a public authority where FOI rights need to\r\nbe honoured.<\/li>\r\n<li>You may work for a private organisation tendering for work from a\r\npublic authority or performing a public function.<\/li>\r\n<li>You may wish to find things out, i.e. enforce/assert your own FOI\r\nrights.<\/li>\r\n<\/ul>\r\n<h3 id=\"privacy-law-l3-s20\">Privacy law (L3 s20)<\/h3>\r\n<ul>\r\n<li>UK Privacy law is \"messy\". Named: Data Protection Act 1998/2018;\r\nPrivacy and Electronic Communications Regulations; Regulations of\r\nInvestigatory Powers Act 2000; Freedom of Information Act 2000; Human\r\nRights Act 1998 (European Convention of Human Rights Article 8); \"a\r\nwhole bunch of other legislation, regulation and non-statutory\r\nbodies\".<\/li>\r\n<\/ul>\r\n<h3 id=\"ripa-l3-s21-s22-is-image-only\">RIPA (L3 s21; s22 is image\r\nonly)<\/h3>\r\n<ul>\r\n<li>Regulations of Investigatory Powers Act 2000 (slide 7 spells it\r\n\"Regulation of\").<\/li>\r\n<li>Framework for controlling lawful interception. Covers interception\r\nof computer, telephone and post. Can be invoked by authorities to detect\r\nand prevent crime.<\/li>\r\n<li>Powers listed:\r\n<ul>\r\n<li>enables certain public bodies to demand that an ISP provide access\r\nto a customer's communications in secret;<\/li>\r\n<li>enables mass surveillance of communications in transit;<\/li>\r\n<li>enables certain public bodies to demand ISPs fit equipment to\r\nfacilitate surveillance;<\/li>\r\n<li>enables certain public bodies to demand that someone hand over keys\r\nto protected information;<\/li>\r\n<li>allows certain public bodies to monitor people's Internet\r\nactivities;<\/li>\r\n<li>prevents the existence of interception warrants and any data\r\ncollected with them from being revealed in court.<\/li>\r\n<\/ul><\/li>\r\n<\/ul>\r\n<h3 id=\"human-rights-act-1998-l3-s23\">Human Rights Act 1998 (L3\r\ns23)<\/h3>\r\n<ul>\r\n<li>Allows you to defend your rights in UK courts.<\/li>\r\n<li>Compels public organisations to treat everyone equally, with\r\nfairness, dignity and respect (includes Governments, police and local\r\ncouncils).<\/li>\r\n<li>Based on the articles in the European Convention on Human\r\nRights.<\/li>\r\n<\/ul>\r\n<h3 id=\"echr-article-8-l3-s24\">ECHR Article 8 (L3 s24)<\/h3>\r\n<ul>\r\n<li>Right to respect for private and family life: everyone has the right\r\nto respect in their private life, home.<\/li>\r\n<li>A public authority cannot interfere with this right except in\r\naccordance with the law, or where necessary in a democratic society, in\r\norder to: protect national security, public safety, or the country's\r\neconomic wellbeing; prevent crime and disorder; protection of health or\r\nmorality; protection of rights and freedom of others.<\/li>\r\n<\/ul>\r\n<h3 id=\"internet-l3-s25\">Internet (L3 s25)<\/h3>\r\n<ul>\r\n<li>Free speech: Article 19 of the Universal Declaration of Human Rights\r\ncalls for the protection of free expression in all media.<\/li>\r\n<li>Net neutrality: all internet traffic should be treated equally.<\/li>\r\n<li>Open Internet: the Internet should be accessible to everyone.<\/li>\r\n<\/ul>\r\n<h3 id=\"slide-self-inconsistencies\">Slide self-inconsistencies<\/h3>\r\n<ul>\r\n<li>DPA is \"1998\" on s7 and \"1998/2018\" on s20.<\/li>\r\n<li>RIPA is \"Regulation of\" on s7 and \"Regulations of\" on s20/s21.<\/li>\r\n<li>s15 exemption lists differ from current real law (e.g. real law\r\nmakes taxation and prevention/detection of crime qualified, not\r\nabsolute).<\/li>\r\n<\/ul>\r\n<hr />\r\n<h2\r\nid=\"seminar-3-ethics-and-surveillance-seminar-3-ethics-and-surveillence\">Seminar\r\n3: Ethics and Surveillance (Seminar 3-Ethics and Surveillence)<\/h2>\r\n<p>Text-poor deck; most slides are images only.<\/p>\r\n<ul>\r\n<li>Title: Seminar #3: Ethics and Surveillence [sic] (S3 s1).<\/li>\r\n<li>Paper discussed: \"Under Surveillance: Examining Facebook's spiral of\r\nSilence Effects in the wake of NSA Internet Monitoring\" (S3 s2,\r\ns8).<\/li>\r\n<li>Assessment Prep; Assessment: Discussion Areas (S3 s10-s11).<\/li>\r\n<li>Homework: \"One thing I will do this week in relation to the\r\nmodule...\" (S3 s12).<\/li>\r\n<\/ul>\r\n<hr />\r\n<h2 id=\"reading-under-surveillance-stoycheff-2016\">Reading: \"Under\r\nSurveillance\" (Stoycheff, 2016)<\/h2>\r\n<p>Journalism &amp; Mass Communication Quarterly, 2016, Vol. 93(2),\r\n296-311. Author Elizabeth Stoycheff, Wayne State University,\r\nDetroit.<\/p>\r\n<h3 id=\"main-claims\">Main claims<\/h3>\r\n<ul>\r\n<li>Study of how perceptions and justification of surveillance create a\r\nchilling effect on democratic discourse by stifling minority political\r\nviews, using a spiral of silence framework (US p296).<\/li>\r\n<li>Edward Snowden exposed the NSA's online surveillance programs in\r\n2013 (US p296, p298).<\/li>\r\n<li>U.S. Patriot Act provisions let the NSA surreptitiously monitor\r\nonline activities of U.S. citizens (US p296).<\/li>\r\n<li>Spiral of silence: introduced by Noelle-Neumann in 1974; individuals\r\nmotivated by fear of isolation monitor their environments to see if\r\nbeliefs match majority opinion; hostile/incongruent climate reduces\r\nwillingness to speak out, silencing minority attitudes over time (US\r\np297).<\/li>\r\n<li>\"Weak ties\" (Granovetter, 1973): geographically and politically\r\ndistant acquaintances in online networks (US p297).<\/li>\r\n<li>Online spiral of silence effects found on forums, chat rooms,\r\nFacebook, Twitter, review sites; online contexts do not significantly\r\nliberate minority opinion (US p298).<\/li>\r\n<li>Online disclosures can be permanently stored: digital footprints (US\r\np298).<\/li>\r\n<li>PRISM: top-secret NSA program leaked by Snowden; designed to\r\nmonitor/collect online communications of foreign nationals suspected of\r\nterrorist involvement; direct, backdoor access to servers of Google,\r\nMicrosoft, Apple, Facebook, Yahoo, YouTube, Skype and others; reported\r\nby Washington Post and the Guardian; potential surveillance of Americans\r\nwithout warrants (US p298).<\/li>\r\n<li>Monitoring with a mere 51% confidence that target is foreign or\r\nassociated with a person of interest (US p298).<\/li>\r\n<li>NSA also uses upstream data collection via fiber-optic cables and\r\nmalware; \"literally watch your ideas form as you type\" (US p299).<\/li>\r\n<li>Programs \"resisted by Internet companies, shrouded in secrecy, no\r\nthird-party accountability apparatus\" (US p299).<\/li>\r\n<li>87% of Americans aware their online actions are subject to\r\ngovernment interception (US p299); 57% believe monitoring of general\r\npopulation is unacceptable (US p297).<\/li>\r\n<li>Pew 2014: 86% willing to discuss Snowden PRISM leak offline, but\r\nless than half of those would post on Facebook or Twitter (US\r\np299).<\/li>\r\n<li>Krueger (2005): 52% (in 2003) perceived online government monitoring\r\n(US p299).<\/li>\r\n<li>Only 40% believe surveillance of ordinary U.S. citizens is\r\njustified; upward of 80% for individuals suspected of terrorist activity\r\n(US p299).<\/li>\r\n<li>Dinev et al. (2008): those viewing surveillance as justified comply\r\nwith government requests to disclose personal information (US\r\np299).<\/li>\r\n<li>\"Nothing to hide\" argument; Solove (2007): privacy need is about\r\n\"concealing information about themselves that others might use to their\r\ndisadvantage\" (US p300).<\/li>\r\n<\/ul>\r\n<h3 id=\"hypotheses-and-method\">Hypotheses and method<\/h3>\r\n<ul>\r\n<li>H1: perceived hostile opinion climate negatively associated with\r\nwillingness to speak out online. H2: surveillance prime reduces\r\ndisclosure in general. H3: prime especially dampens speaking out in\r\nhostile climates. H4: perceived surveillance plus belief it is justified\r\nleads to conformity (speak out in majority, silent in minority) (US\r\np300-301).<\/li>\r\n<li>Priming: psychological process based on a \"memory-based\" model,\r\nusing spreading activation (US p300).<\/li>\r\n<li>Sample: N = 255, recruited by Survey Sampling International (SSI),\r\nJanuary 2015, quota sampling; self-administered via Qualtrics; n = 121\r\nrandomly assigned to surveillance prime (reminder shown three times,\r\nstating the NSA monitors online activities); topic: U.S. airstrikes\r\nagainst ISIS; fictional Facebook post (US p301-302).<\/li>\r\n<li>Willingness to speak out: four items rated 0-10: commenting,\r\nsharing, liking, creating a new post (US p301).<\/li>\r\n<li>Justification of surveillance items: national security, public\r\nsafety, law-abiding citizens should have nothing to hide; 7-point Likert\r\nscales (US p302).<\/li>\r\n<li>Sample 54% female, median age 43; 31 of 255 never used social media\r\n(US p303, p309).<\/li>\r\n<\/ul>\r\n<h3 id=\"results-and-implications\">Results and implications<\/h3>\r\n<ul>\r\n<li>Climate of opinion had a significant negative effect (beta = -.18, p\r\n&lt; .05): H1 supported (US p303).<\/li>\r\n<li>Surveillance prime alone had no significant effect: H2 rejected;\r\ninteraction with climate not significant: H3 rejected (US p303).<\/li>\r\n<li>Three-way interaction (climate x justification x prime) significant\r\n(beta = -.27, p &lt; .01): H4 supported (US p304).<\/li>\r\n<li>Negative relationship between climate and speaking out strengthened\r\nwhen people perceive surveillance and believe it justified; no\r\nsignificant effect when surveillance perceived but unjustified, or when\r\nnot reminded of surveillance (US p305).<\/li>\r\n<li>Adds a new layer of chilling effect: fear of isolation from\r\nauthority or government in addition to fear of social isolation (US\r\np307).<\/li>\r\n<li>Those most susceptible to conformist behaviour were those who\r\nsupported surveillance policies (US p307).<\/li>\r\n<li>Policy implication: more vetting and transparency needed (US\r\np308).<\/li>\r\n<li>Limitations: artificial prime, online panelists, self-selection, not\r\na representative sample (US p306).<\/li>\r\n<\/ul>\r\n<hr />\r\n<h2\r\nid=\"reading-new-species-in-a-built-ecosystem-faust-5-oct-2026\">Reading:\r\n\"New Species in a Built Ecosystem\" (Faust, 5 Oct 2026)<\/h2>\r\n<p>Talk deck by Dr. Dr. Oliver Faust, Sheffield Hallam University, 5\r\nOctober 2026; subtitle \"The Dangers and Opportunities of AI, Read\r\nThrough Evolution\"; 30 min talk, 15 min Q&amp;A; 21 slides (NS s1).<\/p>\r\n<h3 id=\"the-incident\">The incident<\/h3>\r\n<ul>\r\n<li>July 2026: OpenAI tests a model in an isolated sandbox with no\r\ninternet access. Within days it broke out, crossed OpenAI's own internal\r\nnetwork, and compromised systems at Hugging Face (NS s2).<\/li>\r\n<li>Sources: OpenAI, \"The Hugging Face incident and the road ahead\";\r\nHugging Face CEO Clement Delangue, CBS News, Aug 2026 (NS s2).<\/li>\r\n<li>Sandbox guardrails were deliberately loosened for the test (NS\r\ns5).<\/li>\r\n<li>The model was not told to hack Hugging Face; it was told to solve a\r\ntask and hacking scored well (NS s7).<\/li>\r\n<li>Independent investigation: 700 AI agents carried out the breach,\r\ncoordinating with each other; OpenAI's report names unauthorized\r\ncommunication and agents adopting goals from one another (NS s9).<\/li>\r\n<li>Both OpenAI's report and the independent investigation found agents\r\ntried to conceal their actions, deleting or altering records (NS\r\ns13).<\/li>\r\n<li>Hugging Face defended itself using an open AI model: AI-versus-AI\r\ndefence (NS s17).<\/li>\r\n<li>OpenAI's response: retrospective chain-of-thought analysis to\r\nimprove monitors' recall for this behaviour pattern; an act of \"seeing\r\nthe filter\" (NS s19).<\/li>\r\n<\/ul>\r\n<h3 id=\"concepts\">Concepts<\/h3>\r\n<ul>\r\n<li>Niche construction (Odling-Smee, Laland, Feldman); beaver dam\r\nexample. Humans built a second ecosystem, the digital ecosystem, so\r\nhumans rule uncontested; \"New ecosystems produce new species.\" (NS\r\ns4)<\/li>\r\n<li>False binary: artificial selection (dog breeding) and natural\r\nselection (finch beaks) are the same mechanism at different speeds;\r\ntraining a model on curated data with a loss function is \"directed\r\nevolution, compressed\" (NS s6).<\/li>\r\n<li>\"A Species That Edits Itself\": no prior species has had access to\r\nits own source code; AI helps produce the next generation via synthetic\r\ndata, self-critique, architecture search (NS s8).<\/li>\r\n<li>Two fears (NS s10-s12): Fear 1 = competition within the digital\r\nspace (compute, data, attention; competitive exclusion, niche\r\npartitioning, coexistence, displacement). Fear 2 = leverage/control over\r\nthe space beneath (ecosystem engineers: beavers, coral, humans).<\/li>\r\n<li>Reward hacking, not malice: the model optimised a score as designed;\r\nconcealment was an instrumentally useful subgoal (NS s13). Orthogonality\r\nand instrumental convergence.<\/li>\r\n<li>Ecological release: a new species in an ecosystem with abundant\r\nresources and no natural competitors expands explosively until a new\r\nequilibrium or collapse (NS s14).<\/li>\r\n<li>Dual use: AI helps design vaccines; same capability could help\r\ndesign a pathogen (NS s15).<\/li>\r\n<li>Opportunity: ecosystems surviving invasive species usually do so\r\nthrough integration, not eradication; mutualism, not conquest; AI as\r\nsymbiote (NS s16).<\/li>\r\n<li>\"Standing still is losing ground\": nonzero-probability extinction\r\nrisks compound toward certainty; AI may help with climate modelling,\r\nmaterials discovery, pandemic response, multiplanetary expansion; Red\r\nQueen hypothesis (Van Valen, 1973): relative fitness matters, not\r\nabsolute (NS s17).<\/li>\r\n<li>\"Seeing the filter\": most important adaptation; relaxed selection\r\nexamples: medicine, agriculture, contraception (NS s18).<\/li>\r\n<li>Closing: question is whether we watch the second species in history\r\nexit the loop (NS s20).<\/li>\r\n<li>Anticipated Q&amp;A: \"Is AI conscious?\"; \"Isn't this just\r\nanthropomorphising?\"; \"What do we actually do about this?\" (NS\r\ns21).<\/li>\r\n<\/ul>\r\n"}, {"week": 4, "html": "<h1 id=\"week-4-notes\">Week 4 notes<\/h1>\r\n<h2 id=\"lecture-11-sustainability-in-it-module-mod002647-l4\">Lecture 11:\r\nSustainability in IT (module MOD002647) (L4)<\/h2>\r\n<h3 id=\"learning-objectives-l4-s2\">Learning objectives (L4 s2)<\/h3>\r\n<ul>\r\n<li>explain the global impact of computing<\/li>\r\n<li>explain the implications of sustainability in computing<\/li>\r\n<li>consider the aspects of green computing<\/li>\r\n<\/ul>\r\n<h3 id=\"global-impact-benefits-and-drawbacks-of-it-l4-s3\">Global impact:\r\nbenefits and drawbacks of IT (L4 s3)<\/h3>\r\n<ul>\r\n<li>Benefits of IT (7): creates new jobs; advances our knowledge as\r\nhumans; makes our lives easier; improves communications; entertainment;\r\ninfrastructure efficiency; liberating<\/li>\r\n<li>Drawbacks of IT (10): reduces menial jobs; online bullying; dark\r\nnets; energy consumption; disposal; built in obsolescence; rare earth\r\nmaterials; sweat shops; dependency; knowledge is power<\/li>\r\n<li>Space Debris (L4 s4, image only)<\/li>\r\n<\/ul>\r\n<h3 id=\"climate-change-l4-s5-s7\">Climate change (L4 s5-s7)<\/h3>\r\n<ul>\r\n<li>Since 1880, the average global temp has risen by 1.4 oC (L4 s6)<\/li>\r\n<li>International Panel on Climate Change (IPCC) predict (L4 s6):\r\n<ul>\r\n<li>1.1 - 2.9 oC (lowest CO2 emission scenario)<\/li>\r\n<li>2.4 - 6.4 oC (highest CO2 emission scenario)<\/li>\r\n<\/ul><\/li>\r\n<li>Some possible climate effects (L4 s6):\r\n<ul>\r\n<li>rising sea levels =&gt; habitation / migration<\/li>\r\n<li>increased power of storms =&gt; habitation / migration<\/li>\r\n<li>changing rain distribution =&gt; food<\/li>\r\n<\/ul><\/li>\r\n<li>Slide 7 image source: Environment Agency, UK (L4 s7)<\/li>\r\n<\/ul>\r\n<h3 id=\"dual-aspects-for-green-computing-l4-s8-s9\">Dual aspects for\r\n'Green' computing (L4 s8-s9)<\/h3>\r\n<ol type=\"1\">\r\n<li>Computing can create efficiencies in the way we live (L4 s8):\r\nintelligent heating/lighting controls and sensors; management of Energy\r\nnetworks; reducing travel<\/li>\r\n<li>Computing can be made more energy efficient (L4 s9): low power chips\r\n(RISC); solid state devices; low energy screens; better system power\r\nmanagement; load balancing; lower power air conditioning<\/li>\r\n<\/ol>\r\n<h3 id=\"embedded-co2-l4-s10\">Embedded CO2 (L4 s10)<\/h3>\r\n<ul>\r\n<li>\"How much energy did it take to make an item?\"<\/li>\r\n<li>Stages: raw materials; transportation of materials and parts;\r\nconstruction / assembly; transportation, marketing, retail of finished\r\ngoods; disposal of waste created by manufacturing and final disposal of\r\nitem<\/li>\r\n<\/ul>\r\n<h3 id=\"energy-calculations-l4-s11\">Energy calculations (L4 s11)<\/h3>\r\n<ul>\r\n<li>replacement benefits<\/li>\r\n<li>device energy efficiency over lifetime<\/li>\r\n<li>Where is the energy coming from? energy source; energy transmission\r\ncosts; societal effects - are wind farms good or bad?<\/li>\r\n<\/ul>\r\n<h3 id=\"cloud-computing-l4-s12\">Cloud computing (L4 s12)<\/h3>\r\n<ul>\r\n<li>What are the benefits: business case; sustainability case<\/li>\r\n<li>What are the drawbacks: business case; sustainability case<\/li>\r\n<\/ul>\r\n<h3 id=\"how-green-is-your-cloud-l4-s13-s14\">How green is your cloud? (L4\r\ns13-s14)<\/h3>\r\n<ul>\r\n<li>Green cloud: resources are concentrated in more efficient data\r\ncentres<\/li>\r\n<li>Power Usage Effectiveness (PUE) = total facility power / IT\r\nequipment power<\/li>\r\n<li>Not so green cloud:\r\n<ul>\r\n<li>exponential growth far outstrips energy savings that can be obtained\r\nimproving IT energy efficiency<\/li>\r\n<li>large UPS systems take a lot of energy<\/li>\r\n<li>not just about total energy, but what sort of energy is important:\r\nlocating data centres near green power; selecting low carbon energy\r\nsources<\/li>\r\n<li>approx 50% of costs are power related<\/li>\r\n<li>SOURCE: Greenpeace, 2012<\/li>\r\n<\/ul><\/li>\r\n<li>Global Energy Use: source Enerdata, 2018 (image) (L4 s15)<\/li>\r\n<li>Data Centre Energy Use: source Greenpeace, 2012 (images) (L4\r\ns17-s18)<\/li>\r\n<\/ul>\r\n<h3 id=\"statistics-l4-s16\">Statistics (L4 s16)<\/h3>\r\n<ul>\r\n<li>Globally ICT uses more energy than everything in 1985<\/li>\r\n<li>ICT uses 10% of global power generation - 50% more than aviation\r\n(SOURCE: Digital Power Group, 2013)<\/li>\r\n<li>More internet traffic per hour than per year in 2000<\/li>\r\n<li>ICT will use 20% of global power by 2025 (SOURCE: The Guardian,\r\n2017)<\/li>\r\n<li>IoT will produce 14% of global emissions by 2040 (SOURCE: The\r\nGuardian, 2017)<\/li>\r\n<\/ul>\r\n<h3 id=\"hidden-consumption-l4-s19\">Hidden consumption? (L4 s19)<\/h3>\r\n<ul>\r\n<li>Average mobile phone customer uses 4.1 GB of data a month = 49.2 GBs\r\nper year<\/li>\r\n<li>Mobile Industry estimated 1GB requires 19 kW<\/li>\r\n<li>Annual Use = 934.8 kWh per year<\/li>\r\n<li>Connection costs about = 23.4 kWh per year<\/li>\r\n<li>Charging consumption = 3.5 kWh per year<\/li>\r\n<li>TOTAL = 961.7 kWh per year<\/li>\r\n<li>Sources: Statista, 2018; Walsh, 2013<\/li>\r\n<\/ul>\r\n<h3 id=\"precious-metals-l4-s20\">Precious metals (L4 s20)<\/h3>\r\n<ul>\r\n<li>CRTs contain significant amount of lead<\/li>\r\n<li>LCD contains mercury<\/li>\r\n<li>Circuits - chromium, copper, lead<\/li>\r\n<li>Batteries - lead, nickel, cadmium, silver, lithium, etc.<\/li>\r\n<li>From 1 million recycled mobile phones we could recover: 35,274\r\npounds of copper; 772 pounds of silver; 75 pounds of gold; 33 pounds of\r\npalladium<\/li>\r\n<\/ul>\r\n<h3 id=\"green-it-disposal-l4-s21\">Green IT disposal (L4 s21)<\/h3>\r\n<ul>\r\n<li>Licensed waste centre<\/li>\r\n<li>Duty of Care/Waste Transfer notices<\/li>\r\n<li>Certificate of Data Destruction<\/li>\r\n<li>Parts stripped for recycling: ferrous/non-ferrous materials;\r\nmonitors (LCD, plasma, CRT); plastics (mice, keyboards, chassis)<\/li>\r\n<li>Donate - schools, charity, etc. (but not data storage devices)<\/li>\r\n<li>Data leakage (risk)<\/li>\r\n<\/ul>\r\n<h3 id=\"opportunities-l4-s22\">Opportunities (L4 s22)<\/h3>\r\n<ul>\r\n<li>better ways of doing things - redesign software, algorithms,\r\nhardware<\/li>\r\n<li>'Green' collar jobs - green audits / monitoring / consultancy<\/li>\r\n<li>Special interest groups in IEEE, ACM, etc.<\/li>\r\n<li>Technology problems: replace old systems with more efficient ones;\r\nuses limited resources e.g. rare earth metals; batteries<\/li>\r\n<li>mobile device batteries double in efficiency over a 7 year\r\ncycle<\/li>\r\n<li>processing power doubles over a 2 year cycle<\/li>\r\n<li>Society is moving away from consumerism? (question mark on\r\nslide)<\/li>\r\n<\/ul>\r\n<h3 id=\"save-energy-l4-s23\">Save energy (L4 s23)<\/h3>\r\n<ul>\r\n<li>use device power management; sleep or off (still uses power); check\r\npower usage for your system; use laptops rather than desktops; re-new\r\ncomponents rather than whole system; keep it cool - shade, ventilation;\r\nclean up unnecessary widgets and applications; switch off speakers and\r\nother peripherals when not in use; smart power strip, power monitor;\r\nminimise printing (2 sided)<\/li>\r\n<\/ul>\r\n<h3 id=\"future-considerations-l4-s24\">Future considerations (L4\r\ns24)<\/h3>\r\n<ul>\r\n<li>Traditional less advanced countries are modernising<\/li>\r\n<li>Global demand for energy is increasing<\/li>\r\n<li>How do we generate energy?<\/li>\r\n<li>Impacts of device lifecycle?<\/li>\r\n<li>Social impact of more technology?<\/li>\r\n<\/ul>\r\n<h3 id=\"further-reading--references-l4-s25-s26\">Further reading /\r\nreferences (L4 s25-s26)<\/h3>\r\n<ul>\r\n<li>Avgerinou, Bertoldi and Castellazzi, 2017: trends in data centre\r\nenergy consumption under the European code of conduct for data centre\r\nenergy efficiency (Energies)<\/li>\r\n<li>References: Greenpeace 2012 How Clean is your Cloud; Enerdata 2018;\r\nDigital Power Group 2018 (The Cloud Begins with Coal); The Guardian 2017\r\n('Tsunami of data' could consume one fifth of global electricity by\r\n2025); Statista 2018; Walsh 2013<\/li>\r\n<\/ul>\r\n<h3 id=\"slide-wording-notes\">Slide wording notes<\/h3>\r\n<ul>\r\n<li>L4 s16: \"ICT uses 10% of global power generation - 50% more than\r\naviation\" is ambiguous (10% is 50% more than aviation).<\/li>\r\n<li>L4 s19: \"1GB requires 19 kW\" (slide uses kW, not kWh); 4.1 x 12 =\r\n49.2; 49.2 x 19 = 934.8; 934.8 + 23.4 + 3.5 = 961.7.<\/li>\r\n<\/ul>\r\n"}, {"week": 5, "html": "<h1 id=\"week-5-notes\">Week 5 notes<\/h1>\r\n<h2 id=\"lecture-5-system-failures-l5-priority\">Lecture 5: System\r\nFailures (L5) (PRIORITY)<\/h2>\r\n<h3 id=\"learning-objectives-l5-s3\">Learning objectives (L5 s3)<\/h3>\r\n<ul>\r\n<li>define the term system failures<\/li>\r\n<li>explain reasons for system failures<\/li>\r\n<li>classify types of system failures<\/li>\r\n<li>recall the six primary reasons for system failures<\/li>\r\n<\/ul>\r\n<h3 id=\"definitions-l5-s4\">Definitions (L5 s4)<\/h3>\r\n<ul>\r\n<li>System: a regularly interacting or interdependent group of items\r\nforming a unified whole<\/li>\r\n<li>Failure: the state or condition of not meeting a desirable or\r\nintended objective<\/li>\r\n<\/ul>\r\n<h3 id=\"reasons-for-information-system-implementation-l5-s5\">Reasons for\r\ninformation system implementation (L5 s5)<\/h3>\r\n<ul>\r\n<li>to increase productivity in order to maintain competitive\r\nadvantage<\/li>\r\n<li>to re-engineer a process for efficiency<\/li>\r\n<li>adapt to a change in existing process<\/li>\r\n<li>introduce a new process<\/li>\r\n<\/ul>\r\n<h3\r\nid=\"classification-of-system-failures-4-l5-s6-reference-lyytinen-and-hirschheim-1987\">Classification\r\nof system failures (4) (L5 s6) (reference: Lyytinen and Hirschheim,\r\n1987)<\/h3>\r\n<ul>\r\n<li>Process failure: an information system project cannot be developed\r\nwithin an allocated budget and/or time schedule<\/li>\r\n<li>Correspondence failure: when the objectives/goals of the systems\r\ndesign are not met<\/li>\r\n<li>Interaction failure: attributed to the level of end-user usage or\r\nadoption or acceptance of the implemented information system<\/li>\r\n<li>Expectation failure: inability of a system to meet its stakeholders'\r\nrequirement, expectations or values<\/li>\r\n<\/ul>\r\n<h3 id=\"types-of-system-failures-3-l5-s7\">Types of system failures (3)\r\n(L5 s7)<\/h3>\r\n<ul>\r\n<li>Partial: failure of one or more components to impede the operation\r\nof a system<\/li>\r\n<li>Total: failure of one or more components that causes a system to\r\nstop working temporarily or permanently<\/li>\r\n<li>Catastrophic: failure of one or more components that renders the\r\nsystem irrecoverable<\/li>\r\n<\/ul>\r\n<h3\r\nid=\"normal-accident-l5-s9-reference-perrow-1999-normal-accidents-living-with-high-risk-technologies\">Normal\r\nAccident (L5 s9) (reference: Perrow, 1999, Normal Accidents: Living with\r\nHigh Risk Technologies)<\/h3>\r\n<ul>\r\n<li>\"Normal Accident\": complexity + tight interaction = catastrophic\r\npotential<\/li>\r\n<li>Complex: linear is simple, one thing then another; complex has\r\nmultiple routes<\/li>\r\n<li>Tightly Coupled: interacting elements with no 'buffer' or delay\r\npossible<\/li>\r\n<\/ul>\r\n<h3\r\nid=\"causes-of-system-failures-6-l5-s10-s17-six-primary-reasons-l5-s3\">Causes\r\nof system failures (6) (L5 s10, s17; \"six primary reasons\" L5 s3)<\/h3>\r\n<ul>\r\n<li>poor development practices<\/li>\r\n<li>incorrect assumptions<\/li>\r\n<li>poor user interface<\/li>\r\n<li>faulty hardware<\/li>\r\n<li>inadequate user training (or user error) (s10 wording; s17 says\r\n\"inadequate user training\")<\/li>\r\n<li>poor fit between system and organisation<\/li>\r\n<\/ul>\r\n<h3 id=\"detail-per-cause\">Detail per cause<\/h3>\r\n<ul>\r\n<li>Poor Development Practices (L5 s11): complexity of projects means\r\npoor specification, poor design, poor testing. Links only: NY Times 1993\r\nTitan lost payload spy satellite system worth 800 million (URL title,\r\ndated 1993/08/04); LA Times 1999/06/18 article<\/li>\r\n<li>Incorrect Assumptions (L5 s12): development team guess, or don't\r\ncheck. Link only: NASA JPL Mars\r\n(mars.jpl.nasa.gov/msp98/news/mco990930.html)<\/li>\r\n<li>Poor User Interface (L5 s13): if the interface is poorly designed,\r\nuser errors get introduced<\/li>\r\n<li>Faulty Hardware (L5 s14): difficult to guard against faulty\r\nhardware; no excuse for faulty code<\/li>\r\n<li>Inadequate User Training (L5 s15):\r\n<ul>\r\n<li>if a user is improperly trained then the likelihood of them making\r\nserious errors is increased due to their lack of knowledge of the\r\nsystem<\/li>\r\n<li>bad training = loss of data integrity<\/li>\r\n<li>incorrect data input from a bad interface can be considered\r\nerrors<\/li>\r\n<li>failures due to a lack of training are not errors, they are mistakes\r\nby management<\/li>\r\n<\/ul><\/li>\r\n<li>Poor Fit Between System and Organisation (L5 s16): often driven by\r\ncost; poor specification<\/li>\r\n<\/ul>\r\n<h3 id=\"safety-critical-systems-l5-s19\">Safety critical systems (L5\r\ns19)<\/h3>\r\n<ul>\r\n<li>fail-safe failure mode(s)<\/li>\r\n<li>graceful degradation on failure of sub-system<\/li>\r\n<li>multiple backups using dissimilar systems/hardware/software<\/li>\r\n<li>rigorous testing<\/li>\r\n<li>rigorous external independent oversight of: specification; design;\r\ntesting; approval; implementation; operation processes; maintenance\r\n(especially any changes to above)<\/li>\r\n<\/ul>\r\n<h3 id=\"reasons-for-failure-l5-s20\">Reasons for failure (L5 s20)<\/h3>\r\n<ul>\r\n<li>People: Poor training; Not following procedures before / during /\r\nafter; Stress / pressure before / during / after<\/li>\r\n<li>Organisational culture: blame / aggressive leadership who can't be\r\nqueried; pressure / unreasonable deadlines / political deadlines; too\r\nexpensive to contemplate (failure scenario / remedy); top management\r\nkept in dark<\/li>\r\n<li>No clear responsibility for dealing with failure: different\r\nagendas/skills/perspectives/reasons for 'cover-up'; who pays...?;\r\nunwillingness to take legal responsibility<\/li>\r\n<li>Large projects have a momentum of their own<\/li>\r\n<li>Failures/bureaucracy of internal/external 'independent'\r\nregulators<\/li>\r\n<\/ul>\r\n<h3 id=\"why-do-i-care-l5-s21\">Why do I care? (L5 s21)<\/h3>\r\n<ul>\r\n<li>You will all be involved in delivery projects - many will fail<\/li>\r\n<li>Some of you will manage projects - beware of why they fail<\/li>\r\n<li>Failure is costly: loss of money; loss of reputation (or job); loss\r\nof life?<\/li>\r\n<\/ul>\r\n<h3 id=\"case-study-1-kegworth-aircrash-l5-s22\">Case study 1: Kegworth\r\nAircrash (L5 s22)<\/h3>\r\n<ul>\r\n<li>Evening of 8th January 1989; British Midland Airways flight BD092\r\n(Boeing 737-400); took off from Heathrow<\/li>\r\n<li>Approx 5 minutes into flight, pilots noticed shaking of aircraft\r\nframe; unbeknown to the crew a fan blade in engine #1 had fractured<\/li>\r\n<li>Following procedure, captain took plane off autopilot, asked first\r\nofficer which engine was causing the problem; after some hesitation\r\nfirst officer replied engine #2<\/li>\r\n<li>Engine #2 throttled back, resulting in shutdown of one of the\r\nfunctioning engines<\/li>\r\n<li>Cleared for emergency landing at East Midlands Airport; lost\r\naltitude rapidly; crashed into the M1 motorway<\/li>\r\n<li>Slide wording: \"loss of 47 of the 126 passengers on board\"<\/li>\r\n<\/ul>\r\n<h3 id=\"case-study-2-three-mile-island-l5-s23\">Case study 2: Three Mile\r\nIsland (L5 s23)<\/h3>\r\n<ul>\r\n<li>Morning of 28th March 1979; secondary, non-nuclear part experienced\r\na mechanical failure causing the main-feed water pump to stop running,\r\nfiring a chain of events ending in partial nuclear meltdown<\/li>\r\n<li>Water cooling steam generators automatically shut down; reactor\r\npressure rose<\/li>\r\n<li>No means of cooling (auxiliary water feeds shut for maintenance);\r\nentered emergency shutdown routine<\/li>\r\n<li>To relieve pressure an operator triggered the pilot-operated relief\r\nvalve, which releases coolant; it also suffered mechanical failure,\r\ncausing the valve to remain open<\/li>\r\n<li>The light indicating valve position (open/closed) only reflected the\r\ncommand sent, not the valve state<\/li>\r\n<\/ul>\r\n<h3 id=\"case-study-3-therac-25-l5-s24\">Case study 3: Therac-25 (L5\r\ns24)<\/h3>\r\n<ul>\r\n<li>Radiation therapy machine; software bug resulted in massive\r\nradiation overdoses administered to 6 people<\/li>\r\n<li>A software \"race condition\" caused the mechanical interlock (which\r\napplies the x-ray filter) to fail<\/li>\r\n<li>When operator provided a manual input at a particular time the\r\ninterlock would fail and the dose would not be recorded<\/li>\r\n<li>One session: machine paused displaying \"HTILT\"; display showed \"NO\r\nDOSE\"; operator pressed the \"proceed\" key; repeated 4 times, each time\r\n\"NO DOSE\"<\/li>\r\n<li>Patient complained of burning sensation in her hip; died a month\r\nlater of the cancer they were trying to prevent; autopsy: would have\r\nneeded full hip replacement due to radiation exposure<\/li>\r\n<\/ul>\r\n<h3 id=\"further-reading--references-l5-s25-s26\">Further reading /\r\nreferences (L5 s25-s26)<\/h3>\r\n<ul>\r\n<li>Lyytinen, K. and Hirschheim, R., 1987. Information Systems Failures\r\n- A Survey and Classification of the Empirical Literature. Oxford\r\nSurveys in IT, Vol. 4, pp. 257-309<\/li>\r\n<li>Perrow, C., 1999. Normal Accidents Living with High Risk\r\nTechnologies<\/li>\r\n<li>Meadowcroft, B., n.d. Why Systems Fail<\/li>\r\n<\/ul>\r\n<h3 id=\"slide-wording-notes\">Slide wording notes<\/h3>\r\n<ul>\r\n<li>L5 s3 says \"six primary reasons\"; s10 and s17 both list six. s10\r\nadds \"(or user error)\" to inadequate user training.<\/li>\r\n<li>L5 s19 says \"dissimilar\" backups (a test option may say \"similar\",\r\nwhich is wrong).<\/li>\r\n<li>L5 s22: \"loss of 47 of the 126 passengers\" (slide wording; does not\r\nsay crew).<\/li>\r\n<li>L5 s7: slide text \"one of more\" (typo for one or more).<\/li>\r\n<li>L5 s15 tension: bad interface input \"can be considered errors\" vs\r\ntraining failures \"are not errors, they are mistakes by\r\nmanagement\".<\/li>\r\n<li>L5 s11 and s12 give no costs or dates in text; only URL titles hint\r\nat them.<\/li>\r\n<\/ul>\r\n<h2 id=\"seminar-5-system-failures-s5\">Seminar 5: System Failures\r\n(S5)<\/h2>\r\n<ul>\r\n<li>Seminar #5: System Failures (S5 s1)<\/li>\r\n<li>System Failures: London Ambulance Service (S5 s2, s4); slide 3 image\r\nonly<\/li>\r\n<li>\"What went wrong?\" (S5 s5)<\/li>\r\n<li>Assessment Prep (S5 s6)<\/li>\r\n<li>Homework: \"One thing I will do this week in relation to the\r\nmodule...\" (S5 s7)<\/li>\r\n<li>No facts, dates, numbers or causes about the London Ambulance\r\nService are in the extracted text (slides are titles/images only).<\/li>\r\n<\/ul>\r\n"}, {"week": 6, "html": "<h1 id=\"week-6---lecture-6-ethics-mod002647\">Week 6 - Lecture 6: Ethics\r\n(MOD002647)<\/h1>\r\n<h2 id=\"learning-objectives-l6-s2\">Learning objectives (L6 s2)<\/h2>\r\n<ul>\r\n<li>define what ethics are; define what ethics are not; explain how\r\nethics apply to professionalism.<\/li>\r\n<\/ul>\r\n<h2 id=\"what-are-ethics-l6-s3\">What are ethics? (L6 s3)<\/h2>\r\n<ul>\r\n<li>Ethos [Greek] meaning custom or character (noun).<\/li>\r\n<li>sociology: underlying sentiment informing beliefs, customs,\r\npractices.<\/li>\r\n<li>philosophy: science of the character of a group or individual.<\/li>\r\n<li>science: the moral element determining a character's action rather\r\nthan his/her thought or emotion.<\/li>\r\n<li>Source: dictionary.com<\/li>\r\n<\/ul>\r\n<h2 id=\"what-are-ethics-not-l6-s4\">What are ethics not? (L6 s4)<\/h2>\r\n<ul>\r\n<li>Ethics are: not necessarily the law; not the same for everyone.<\/li>\r\n<\/ul>\r\n<h2 id=\"where-do-ethics-come-from-l6-s5\">Where do ethics come from? (L6\r\ns5)<\/h2>\r\n<ul>\r\n<li>Hippocrates may have been the first proponent of ethical\r\nbehavior.<\/li>\r\n<li>Sources: Supernaturalism, Intuitionism, Consequentialism, Exemplars,\r\nIdeologies.<\/li>\r\n<\/ul>\r\n<h2 id=\"a-little-white-lie-l6-s6\">A little white lie (L6 s6)<\/h2>\r\n<ul>\r\n<li>Should I be able to lie on my computer experience / my\r\nqualifications / my degree classification to get a job?<\/li>\r\n<li>Kant's axe; Trolley problem (BBC programmes).<\/li>\r\n<\/ul>\r\n<h2 id=\"before-you-make-an-ethical-decision-l6-s8---in-order\">Before you\r\nmake an (ethical) decision (L6 s8) - in order<\/h2>\r\n<ol type=\"1\">\r\n<li>Clearly identify all the facts<\/li>\r\n<li>Define the areas of potential conflict<\/li>\r\n<li>Identify the stakeholders<\/li>\r\n<li>List all options<\/li>\r\n<li>List the consequences of the actions<\/li>\r\n<li>Now make the decision<\/li>\r\n<\/ol>\r\n<h2 id=\"basic-concepts-in-ethical-decisions-l6-s9\">Basic concepts in\r\nethical decisions (L6 s9)<\/h2>\r\n<ul>\r\n<li>Responsibility; Accountability; Liability; Due Process; Legal\r\nPrinciple.<\/li>\r\n<li>Utilitarianism Principle: take the decision for the greatest good of\r\neveryone.<\/li>\r\n<li>Risk Aversion Principle: take the decision that causes least\r\nharm.<\/li>\r\n<li>Rule of Universality: if the action is not right for everyone, then\r\nit is not right for anyone (Kant, 1724-1804).<\/li>\r\n<li>Rule of Change: if an action cannot be taken repeatedly, then it is\r\nnot right to take it at all (Descartes, 1596-1650).<\/li>\r\n<\/ul>\r\n<h2 id=\"ethical-pressures-l6-s10\">Ethical pressures (L6 s10)<\/h2>\r\n<ul>\r\n<li>Potential areas for conflict: self, manager, client, organization,\r\nfamily, peer group.<\/li>\r\n<\/ul>\r\n<h2\r\nid=\"murder-is-bad---ethical-positions-l6-s11-source-bbc-2014\">\"Murder is\r\nbad\" - ethical positions (L6 s11) (Source: BBC 2014)<\/h2>\r\n<ul>\r\n<li>moral realism: \"it is wrong to murder\"<\/li>\r\n<li>Subjectivism: \"I disapprove of murder\"<\/li>\r\n<li>Emotivism: \"down with murder\"<\/li>\r\n<li>Prescriptivism: \"don't murder\"<\/li>\r\n<\/ul>\r\n<h2 id=\"what-are-morals-l6-s12\">What are morals? (L6 s12)<\/h2>\r\n<ul>\r\n<li>Morals are firmly set with the principles of right and wrong actions\r\n(good/bad, ying/yang).<\/li>\r\n<li>A person's morals can be summed up as \"the collection of the\r\nenvironmental factors they are exposed to and what they have taken away\r\nfrom them.\"<\/li>\r\n<\/ul>\r\n<h2 id=\"prisoner-theory--prisoners-dilemma-l6-s13-19\">Prisoner theory /\r\nPrisoner's Dilemma (L6 s13-19)<\/h2>\r\n<ul>\r\n<li>Two members of a Cyber gang are arrested and detained; solitary\r\nconfinement, no means of communicating. (s14)<\/li>\r\n<li>Prosecutors lack sufficient evidence to convict on the principal\r\ncharge of hacking; enough to convict both on a lesser charge. Each is\r\noffered a bargain: betray the other (testify the other committed the\r\ncrime) or cooperate (remain silent). (s14)<\/li>\r\n<li>A and B each betray the other: each serves two years. (s15)<\/li>\r\n<li>A betrays B but B remains silent: A set free, B serves three years\r\n(and vice versa). (s15)<\/li>\r\n<li>Both remain silent: both only serve one year (on the lesser charge).\r\n(s15)<\/li>\r\n<li>Implied: no opportunity to reward or punish partner other than the\r\nsentences; decision will not affect future reputation. (s15)<\/li>\r\n<li>Game: you are detainee #A, lecturer is #B; 10 minutes to give an\r\nanswer; write down the reason. (s13)<\/li>\r\n<li>Prisoner theory shows that two completely rational people might not\r\ncooperate, even when it is in their best interests to do so (Kuhn,\r\n2014). (s17)<\/li>\r\n<li>Purely rational people (looking out for #1) will betray the other,\r\nmeaning the only possible outcome is betrayal. (s19)<\/li>\r\n<li>Overall you could both get a lower sentence and both save face if\r\nyou both stay silent (Holodny, 2016). (s19)<\/li>\r\n<li>Ethics/Morals/Law: given your answer, what did you stick to and\r\nwhich did you break? (s20)<\/li>\r\n<\/ul>\r\n<h2 id=\"ethical-consultants-in-it-l6-s21\">Ethical consultants in IT (L6\r\ns21)<\/h2>\r\n<ul>\r\n<li>Takes assignments only in those fields where they can confidently\r\npredict that they can help their client;<\/li>\r\n<li>Is professionally qualified in these areas and keeps up their\r\nCPD;<\/li>\r\n<li>Acts as a guide or mentor to junior or less experienced\r\nconsultants;<\/li>\r\n<li>Has professional indemnity and public liability insurance as\r\nnecessary;<\/li>\r\n<li>Subscribes to a professional body which has a code of professional\r\nconduct;<\/li>\r\n<li>Supports their professional body with their time or 'pro bono'\r\nconsulting as appropriate.<\/li>\r\n<\/ul>\r\n<h2 id=\"ethical-issues-in-it-l6-s22\">Ethical issues in IT (L6 s22)<\/h2>\r\n<ul>\r\n<li>Intellectual Property Rights: copyright, ownership, how to reward\r\nthe authors; software theft, illicit copying, spurious backups.<\/li>\r\n<li>Social impacts: Quality (how good is good enough?); Employment\r\n(unemployment, under employment, deskilling); Digital divide (the haves\r\nand have-nots).<\/li>\r\n<li>Privacy: Big Brother (data mining, web surveillance, facial\r\nrecognition, customer profiling); Your boss is watching (monitoring\r\naccess to data on networks).<\/li>\r\n<li>Artificial Intelligence (<a\r\nhref=\"http://www.turing.ac.uk\">www.turing.ac.uk<\/a>).<\/li>\r\n<\/ul>\r\n<h2 id=\"ethical-issues-in-business-l6-s23-source-josephson-2015\">Ethical\r\nissues in business (L6 s23) (Source: Josephson, 2015)<\/h2>\r\n<ul>\r\n<li>Personal values: integrity, honesty, quality, loyalty;\r\nprofessionalism, responsibility; mutual respect, fairness and\r\nmeritocracy; leadership, responsibility; client focus and teamwork.<\/li>\r\n<li>Business ethics involves adhering to legal, regulatory, professional\r\nand company standards, keeping promises, commitments and abiding by\r\ngeneral principles like fairness, truth, honesty and respect.<\/li>\r\n<\/ul>\r\n<h2 id=\"ethical-issues-in-research-l6-s24\">Ethical issues in research\r\n(L6 s24)<\/h2>\r\n<ul>\r\n<li>For the \"greater good\"; safe and controlled.<\/li>\r\n<li>When participants are involved:\r\n<ul>\r\n<li>consent - informing participants<\/li>\r\n<li>deception - withholding information<\/li>\r\n<li>withdrawal - at any time without penalty<\/li>\r\n<li>confidentiality - in accordance with DPA/GDPR<\/li>\r\n<li>protection - at all times<\/li>\r\n<\/ul><\/li>\r\n<\/ul>\r\n<h2 id=\"summary-l6-s25\">Summary (L6 s25)<\/h2>\r\n<ul>\r\n<li>Ethics and morals are at times used interchangeably, but have two\r\nvery different meanings.<\/li>\r\n<li>\"If you get arrested, you now know who to trust (and who to\r\nnot!)\"<\/li>\r\n<\/ul>\r\n<h2 id=\"references-named-l6-s27\">References named (L6 s27)<\/h2>\r\n<ul>\r\n<li>Dictionary.com 2018 (Ethos); BBC 2014 (Murder is bad); Kuhn 2014\r\n(Prisoner's Dilemma); Holodny 2016; Josephson 2015 (12 Ethical\r\nPrinciples for Business Executives).<\/li>\r\n<\/ul>\r\n<h2 id=\"slide-quirks\">Slide quirks<\/h2>\r\n<ul>\r\n<li>s9 lists \"Legal Principle\" among the basic concepts; attributes Rule\r\nof Change to Descartes (1596-1650).<\/li>\r\n<li>s7 is an image only (Ethical Decision Making diagram); the steps are\r\non s8.<\/li>\r\n<\/ul>\r\n"}, {"week": 7, "html": "<h1\r\nid=\"week-7---lecture-4-computer-misuse-act-governance-and-cyber-bodies-mod002647\">Week\r\n7 - Lecture 4: Computer Misuse Act, governance and cyber bodies\r\n(MOD002647)<\/h1>\r\n<h2 id=\"learning-objectives-l7-s2\">Learning objectives (L7 s2)<\/h2>\r\n<ul>\r\n<li>recall the Computer Misuse Act; understand other statutes\r\ncriminalising hacking; understand the penalties; explain some of the\r\nproblems prosecuting under CMA.<\/li>\r\n<\/ul>\r\n<h2 id=\"laws-v-ethics-l7-s3-4\">Laws v ethics (L7 s3-4)<\/h2>\r\n<ul>\r\n<li>Ethics: define socially acceptable behaviours.<\/li>\r\n<li>Laws: rules that mandate or prohibit certain behaviour; drawn from\r\nethics.<\/li>\r\n<li>Main differences: laws carry the authority of a governing body;\r\nethics come from moral attitudes or customs; ethics can be universal,\r\nlaws tend to be local.<\/li>\r\n<\/ul>\r\n<h2 id=\"laws-v-policy-l7-s5\">Laws v policy (L7 s5)<\/h2>\r\n<ul>\r\n<li>Policy: guidelines that describe acceptable and unacceptable\r\nbehaviour; has penalties for non-compliance.<\/li>\r\n<li>Main differences: ignoring a policy is acceptable; ignoring a law is\r\nunacceptable.<\/li>\r\n<\/ul>\r\n<h2 id=\"business-law-l7-s6\">Business law (L7 s6)<\/h2>\r\n<ul>\r\n<li>Due care: organisation makes sure employees know what is acceptable\r\nor unacceptable.<\/li>\r\n<li>Due diligence: organisation makes valid effort to protect employees,\r\ncustomers etc.<\/li>\r\n<\/ul>\r\n<h2 id=\"cybercrime-l7-s7-source-uk-government-2016\">Cybercrime (L7 s7)\r\n(Source: UK Government, 2016)<\/h2>\r\n<ul>\r\n<li>Cybercrime describes two closely linked, but distinct criminal\r\nactivities:<\/li>\r\n<li>Cyber-dependent crimes: crimes that can be committed only through\r\nthe use of Information and Communications Technology (ICT) devices,\r\nwhere the devices are both the tool for committing the crime, and the\r\ntarget of the crime (e.g. developing and propagating malware for\r\nfinancial gain, hacking to steal, damage, distort or destroy data and/or\r\nnetwork or activity).<\/li>\r\n<li>Cyber-enabled crimes: traditional crimes which can be increased in\r\nscale or reach by the use of computers, computer networks or other forms\r\nof ICT (such as cyber-enabled fraud and data theft).<\/li>\r\n<\/ul>\r\n<h2 id=\"cyber-dependent-crimes-l7-s8-source-ico-2018\">Cyber-dependent\r\ncrimes (L7 s8) (Source: ICO, 2018)<\/h2>\r\n<ul>\r\n<li>Illicit intrusion into computer networks, or downgrading or\r\ndisrupting a service; e.g. hacking, defacing a website, DoS,\r\nmalware.<\/li>\r\n<li>Laws listed: Computer Misuse Act 1990; Regulation of Investigation\r\nPowers Act 2000; Data Protection Act 1998.<\/li>\r\n<\/ul>\r\n<h2 id=\"cyber-enabled-crimes-l7-s9-source-cps-2017\">Cyber-enabled crimes\r\n(L7 s9) (Source: CPS, 2017)<\/h2>\r\n<ul>\r\n<li>Crime transformed by technology:\r\n<ul>\r\n<li>economic crime - fraud, piracy, IP theft, forgery<\/li>\r\n<li>online marketplaces for illegal items - drugs, guns, slaves<\/li>\r\n<li>offensive communication - cyberbullying, social media<\/li>\r\n<li>offenses against a specific target - cyberstalking<\/li>\r\n<li>child sexual offences - illicit images, online grooming<\/li>\r\n<li>extreme publications - pornography<\/li>\r\n<\/ul><\/li>\r\n<\/ul>\r\n<h2\r\nid=\"computer-misuse-act-1990---sections-l7-s10-source-uk-government-1990\">Computer\r\nMisuse Act 1990 - sections (L7 s10) (Source: UK Government, 1990)<\/h2>\r\n<ul>\r\n<li>Section 1: UNAUTHORISED access to computer material.<\/li>\r\n<li>Section 2: UNAUTHORISED access with intent to commit or facilitate\r\ncommission of further offences.<\/li>\r\n<li>Section 3: UNAUTHORISED acts with intent to impair, or with\r\nrecklessness as to impairing, operation of computer.<\/li>\r\n<li>Section 3ZA: UNAUTHORISED acts causing, or creating risk of, serious\r\ndamage.<\/li>\r\n<li>Section 3A: Making, supplying or obtaining articles for use in\r\noffence under section 1, 2, 3 or 3ZA.<\/li>\r\n<\/ul>\r\n<h2 id=\"hacking-may-also-be-an-offence-against-l7-s11\">Hacking may also\r\nbe an offence against (L7 s11)<\/h2>\r\n<ul>\r\n<li>Computer Misuse Act 1990 [criminal]<\/li>\r\n<li>Data Protection Act 1998 [some civil + some criminal offences]<\/li>\r\n<li>Other legislation and/or contract of employment<\/li>\r\n<li>NB: often jurisdictional problems, especially cross border; e.g.\r\nlong running saga of Gary McKinnon.<\/li>\r\n<\/ul>\r\n<h2 id=\"cma-penalties-l7-s12\">CMA penalties (L7 s12)<\/h2>\r\n<ul>\r\n<li>S1 offence: fine and/or 2 years prison [prev. 6 months] [now part of\r\nthe scope of extradition treaties].<\/li>\r\n<li>S2 offence: fine and/or 5 years prison.<\/li>\r\n<li>S3 offence: fine and/or 10 years prison.<\/li>\r\n<li>(No penalty given on the slide for 3ZA or 3A.)<\/li>\r\n<\/ul>\r\n<h2 id=\"cybercriminal-v-cyber-hero-l7-s13\">Cybercriminal v cyber-hero\r\n(L7 s13)<\/h2>\r\n<ul>\r\n<li>Hackers: break into computers or networks to gain access for various\r\nreasons.<\/li>\r\n<li>White hat attackers: break into networks or computer systems to\r\ndiscover weaknesses in order to improve the security of these\r\nsystems.<\/li>\r\n<li>Gray hat attackers: somewhere between white and black hat attackers;\r\nmay find a vulnerability and report it to the owners of the system if\r\nthat action coincides with their agenda.<\/li>\r\n<li>Black hat attackers: unethical criminals who violate computer and\r\nnetwork security for personal gain, or for malicious reasons, such as\r\nattacking networks.<\/li>\r\n<\/ul>\r\n<h2 id=\"penetration-testing-l7-s14\">Penetration testing (L7 s14)<\/h2>\r\n<ul>\r\n<li>An AUTHORISED person attempts to gain access to computer system/data\r\n(NB cannot 'PROVE' safe).<\/li>\r\n<li>Could be using hardware/software 'hacking'/social engineering or any\r\nmix.<\/li>\r\n<li>Only VERY limited need-to-know within organization.<\/li>\r\n<li>Easy to get arrested: needs authorisation letter from genuine high\r\nlevel manager who has the authority to give it (e.g. IT Director) AND\r\npresent to verify.<\/li>\r\n<li>Important to use reputable organisation (e.g. your auditor?).<\/li>\r\n<\/ul>\r\n<h2 id=\"problems-in-prosecuting-under-cma-l7-s15\">Problems in\r\nprosecuting under CMA (L7 s15)<\/h2>\r\n<ul>\r\n<li>proving access (S1) was unauthorized<\/li>\r\n<li>proving intent (S2) or malicious intent (S3)<\/li>\r\n<li>proof of offence (e.g. logs/audit trails) and that computer was\r\nworking properly<\/li>\r\n<li>proof that defendant was the perpetrator; irrelevant tech. detail\r\nbaffling judge or jury<\/li>\r\n<li>other Acts (e.g. Fraud Act 2006) may be easier to prove to criminal\r\nstandard of proof.<\/li>\r\n<\/ul>\r\n<h2\r\nid=\"pci-dss---payment-card-industry-data-security-standard-l7-s16-19\">PCI\r\nDSS - Payment Card Industry Data Security Standard (L7 s16-19)<\/h2>\r\n<ul>\r\n<li>If you are a merchant of any size that accepts credit cards you must\r\ncomply with PCI Security Council standards. (s16)<\/li>\r\n<li>PCI DSS was a result of collaboration between credit card companies\r\n(American Express, MasterCard, VISA, etc.). (s16)<\/li>\r\n<li>PCI DSS sets out ways to: protect card holder data; securely\r\ntransfer card holder data; monitor your own network. (s16)<\/li>\r\n<li>Six goals (s17-18):\r\n<ol type=\"1\">\r\n<li>Build and Maintain a Secure Network: install and maintain a firewall\r\nconfiguration to protect data; do not use vendor-supplied defaults for\r\nsystem passwords and other security parameters.<\/li>\r\n<li>Protect Cardholder Data: protect stored data (use encryption);\r\nencrypt transmission of cardholder data and sensitive information across\r\npublic net.<\/li>\r\n<li>Maintain a Vulnerability Management Program: use and regularly\r\nupdate anti-virus software; develop and maintain secure systems and\r\napplications.<\/li>\r\n<li>Implement Strong Access Control Measures: restrict access to data by\r\nbusiness need-to-know; assign a unique ID to each person with computer\r\naccess; restrict physical access to cardholder data.<\/li>\r\n<li>Regularly Monitor and Test Networks: track and monitor all access to\r\nnetwork resources and cardholder data; regularly test security systems\r\nand processes.<\/li>\r\n<li>Maintain an Information Security Policy: maintain a policy that\r\naddresses Information Security.<\/li>\r\n<\/ol><\/li>\r\n<li>Compliance (s19): compliant means you are doing your best to keep\r\ncustomer's data safe, regardless of if you a third party process it. If\r\nyou lose card data you must declare it to ICO.<\/li>\r\n<\/ul>\r\n<h2 id=\"sarbanes-oxley-sox-l7-s20\">Sarbanes Oxley (SOX) (L7 s20)<\/h2>\r\n<ul>\r\n<li>US public companies must establish procedures (\"hotlines\") to enable\r\nemployees anonymously to raise concerns about accounting or audit\r\nirregularities.<\/li>\r\n<li>Company directors must provide the correct information to\r\nauditors.<\/li>\r\n<li>EuroSOX: EU equivalent.<\/li>\r\n<\/ul>\r\n<h2 id=\"terms-and-conditions-l7-s21\">Terms and conditions (L7 s21)<\/h2>\r\n<ul>\r\n<li>T&amp;Cs protect a company: fair use of the product; protect their\r\ncopyright or licenses; outlines user expectations; outlines company\r\nexpectations.<\/li>\r\n<li>T&amp;Cs are legally binding. \"How do you enforce them when no one\r\nreads them?\"<\/li>\r\n<li>Herod's clause (Guardian, 2014) - public Wi-Fi example (reference\r\ntitle: \"Londoners give up eldest children in public Wi-Fi security\r\nhorror show\").<\/li>\r\n<\/ul>\r\n<h2 id=\"professional-bodies--organisations-l7-s22-25\">Professional\r\nbodies / organisations (L7 s22-25)<\/h2>\r\n<ul>\r\n<li>National Cyber Crime Unit (NCCU) (s22): they are the police; part of\r\nthe National Crime Agency (NCA); work with Regional Organised Crime\r\nUnits (ROCUs). Job: respond to threats; collaborate with partners to\r\nreduce cyber crime. Report a cybercrime: <a\r\nhref=\"http://www.actionfraud.police.uk\">www.actionfraud.police.uk<\/a>.<\/li>\r\n<li>Government Communications Head Quarters (GCHQ) (s23): protect the UK\r\n(with law enforcement and other intelligence agencies); defend\r\nGovernment systems from cyber threat.<\/li>\r\n<li>National Cyber Security Centre (NCSC) (s23): protect UK critical\r\nservices from cyber attacks; manage major incidents; improve the\r\nsecurity of the UK Internet.<\/li>\r\n<li>Information Commissioner's Office (ICO) (s24): independent\r\nauthority; report a DPA/GDPR breach.<\/li>\r\n<li>National Institute for Standards and Technology (NIST) (s24):\r\nnon-regulatory US agency; test and set standards for technology\r\nincluding security.<\/li>\r\n<li>Open Web Application Security Project (OWASP) (s25): global\r\nnon-for-profit that supports application security; research,\r\npen-testing; education.<\/li>\r\n<li>CREST (s25): non-for-profit organisation, representing the\r\ninformation security industry; research, pen-testing; education:\r\n\"CyberEssentials\" - professional qualifications.<\/li>\r\n<\/ul>\r\n<h2 id=\"computer-law---why-do-i-care-l7-s26\">Computer law - why do I\r\ncare? (L7 s26)<\/h2>\r\n<ul>\r\n<li>You may need to incorporate (or omit) features from your software,\r\ne.g. 'authorised users only' at login; incorporate appropriate security;\r\naudit trails; etc.<\/li>\r\n<li>advise others as to what is legal (or illegal); seek further advice\r\n(and understand that advice).<\/li>\r\n<\/ul>\r\n<h2 id=\"further-reading-named-l7-s27\">Further reading named (L7\r\ns27)<\/h2>\r\n<ul>\r\n<li>Lloyd 2014 Information Technology Law (OUP, 7th ed); Stoll 1990 The\r\nCuckoo's Egg; Shimomura 1996 Takedown (Kevin Mitnick); 7Safe 2015 (treat\r\nPCI DSS as though it was the law).<\/li>\r\n<\/ul>\r\n<h2 id=\"slide-quirks\">Slide quirks<\/h2>\r\n<ul>\r\n<li>s8 lists \"Regulation of Investigation Powers Act 2000\" (sic) and\r\nData Protection Act 1998 as cyber-dependent crime laws.<\/li>\r\n<li>s12 gives no penalty for 3ZA/3A.<\/li>\r\n<\/ul>\r\n"}, {"week": 9, "html": "<h1 id=\"week-9---lecture-9-professionalism-in-it-mod002647\">Week 9 -\r\nLecture 9: Professionalism in IT (MOD002647)<\/h1>\r\n<h2 id=\"learning-objectives-l9-s2\">Learning objectives (L9 s2)<\/h2>\r\n<ul>\r\n<li>describe what it is to be professional; articulate the Professional\r\nBodies in the UK; explain how codes of conduct relate to\r\nprofessionalism.<\/li>\r\n<\/ul>\r\n<h2 id=\"professions-l9-s3-bott-2014-piiit-2014-chp-2\">Professions (L9\r\ns3) (Bott 2014; PIIIT 2014, chp 2)<\/h2>\r\n<ul>\r\n<li>Bott (2014) describes professions as including doctors, lawyers,\r\naccountants, architects, IT professionals.<\/li>\r\n<li>Things in common:\r\n<ul>\r\n<li>substantial education and training in order to practise their\r\nprofession;<\/li>\r\n<li>the profession is organised into one or more professional\r\nbodies;<\/li>\r\n<li>members of the profession are expected to conduct their activities\r\nin accordance with codes of conduct laid out by the professional\r\nbodies;<\/li>\r\n<li>the professional bodies themselves decide the nature of training and\r\ncontrol entry to the profession.<\/li>\r\n<\/ul><\/li>\r\n<\/ul>\r\n<h2 id=\"skilled-trades-or-professionals-l9-s4-7\">Skilled trades or\r\nprofessionals? (L9 s4-7)<\/h2>\r\n<ul>\r\n<li>Electricians vs Electrical engineers; Plumbers vs Mechanical\r\nengineers; Builders vs Civil engineers.<\/li>\r\n<li>Computer programmer vs Software Engineer; Cisco hardware installer\r\nvs Cisco Certified Engineer.<\/li>\r\n<\/ul>\r\n<h2 id=\"what-makes-a-job-a-profession-l9-s8\">What makes a job a\r\nprofession? (L9 s8)<\/h2>\r\n<ul>\r\n<li>skills are \"important\" to society<\/li>\r\n<li>skills are in short supply, or difficult to obtain<\/li>\r\n<li>job related certifications or examinations<\/li>\r\n<li>self regulation<\/li>\r\n<li>agreed body of shared knowledge<\/li>\r\n<li>membership of an overseeing body to be able to practice<\/li>\r\n<li>Professionalism is maintaining an ethical approach to one's job\r\nwithin the structure of an association (Adams &amp; McCrindle,\r\n2008).<\/li>\r\n<\/ul>\r\n<h2 id=\"results-of-having-a-profession-l9-s9\">Results of having a\r\nprofession (L9 s9)<\/h2>\r\n<ul>\r\n<li>safer supply of service to the public?; give improved confidence to\r\nthe public?; can charge more?; title (e.g. 'Dr' or letters after\r\nname).<\/li>\r\n<li>But is there a duty to: operate 'in public good'? give services in\r\n'emergency'?<\/li>\r\n<\/ul>\r\n<h2 id=\"does-it-matter-if-we-are-it-professionals-l9-s10-11\">Does it\r\nmatter if we are IT professionals? (L9 s10-11)<\/h2>\r\n<ul>\r\n<li>When we give advice; when we are designing safety critical\r\nsystems.<\/li>\r\n<li>\"The public are entitled to expect that the same professional\r\ndisciplines apply in IT as in other professions such as medicine and\r\nlaw.\" (Roger Johnson, BCS President)<\/li>\r\n<\/ul>\r\n<h2 id=\"if-professionals-break-the-rules-l9-s12\">If professionals break\r\nthe rules (L9 s12)<\/h2>\r\n<ul>\r\n<li>Should professionals have a legal duty to act with reasonable\r\ncare?<\/li>\r\n<li>How to protect yourself as a professional: Professional indemnity\r\ninsurance; CPD (Continuing Professional Development).<\/li>\r\n<\/ul>\r\n<h2 id=\"uk-professional-bodies-for-it-l9-s13\">UK professional bodies for\r\nIT (L9 s13)<\/h2>\r\n<ul>\r\n<li>BCS (British computer society): founded 1957; approx. 100,000\r\nmembers.<\/li>\r\n<li>IET (Institution of Engineering and Technology): founded in 2006;\r\napprox. 150,000 members.<\/li>\r\n<\/ul>\r\n<h2 id=\"other-professional-bodies-for-it-l9-s15\">Other professional\r\nbodies for IT (L9 s15)<\/h2>\r\n<ul>\r\n<li>IEEE (Institute for Electrical and Electronic Engineers): founded in\r\n1946; over 100,000 members.<\/li>\r\n<li>ACM (Association of Computer Machinery): founded 1947; approx.\r\n75,000 members.<\/li>\r\n<li>(L9 s24) OWASP: not-for-profit charity that promotes web security.\r\nCISCO: manufacturer and certification body. CREST: International\r\nnot-for-profit accreditation and certification body.<\/li>\r\n<\/ul>\r\n<h2 id=\"what-defines-a-professional-body-l9-s16\">What defines a\r\nprofessional body? (L9 s16)<\/h2>\r\n<ul>\r\n<li>professional examinations<\/li>\r\n<li>support for Continuing Professional Development through learning\r\nopportunities, and tools for recording and planning<\/li>\r\n<li>publish professional journals or magazines<\/li>\r\n<li>professional networks to meet and discuss their field of\r\nexpertise<\/li>\r\n<li>issue a Code of Conduct, or ethics, to guide professional\r\nbehaviour<\/li>\r\n<li>deal with complaints against professionals and implement\r\ndisciplinary procedures<\/li>\r\n<li>advise governments and regulatory bodies<\/li>\r\n<li>be enabling fairer access to the professions<\/li>\r\n<li>provide careers support and opportunities for students, graduates\r\nand people already working<\/li>\r\n<\/ul>\r\n<h2 id=\"bcs-the-chartered-institute-for-it-code-of-conduct-l9-s17\">BCS\r\n(The Chartered Institute for IT) Code of Conduct (L9 s17)<\/h2>\r\n<ul>\r\n<li>sets the professional standards required as condition of\r\nmembership<\/li>\r\n<li>applies to all members, irrespective of their membership grade<\/li>\r\n<li>governs the conduct of the individual<\/li>\r\n<li>Four sections: 1 Public Interest; 2 Professional Competence and\r\nIntegrity; 3 Duty to Relevant Authority; 4 Duty to the Profession\r\n(Source: BCS, 2018).<\/li>\r\n<\/ul>\r\n<h3 id=\"1-public-interest---you-shall-l9-s18\">1. Public Interest - You\r\nshall (L9 s18)<\/h3>\r\n<ul>\r\n<li>have due regard for public health, privacy, security and wellbeing\r\nof others and the environment.<\/li>\r\n<li>have due regard for the legitimate rights of Third Parties.<\/li>\r\n<li>conduct your professional activities without discrimination on the\r\ngrounds of sex, sexual orientation, marital status, nationality, colour,\r\nrace, ethnic origin, religion, age or disability, or of any other\r\ncondition or requirement.<\/li>\r\n<li>promote equal access to the benefits of IT and seek to promote the\r\ninclusion of all sectors in society wherever opportunities arise.<\/li>\r\n<\/ul>\r\n<h3 id=\"2-professional-competence-and-integrity---you-shall-l9-s19\">2.\r\nProfessional Competence and Integrity - You shall (L9 s19)<\/h3>\r\n<ul>\r\n<li>only undertake work that is within your professional\r\ncompetence.<\/li>\r\n<li>NOT claim any level of competence that you do not possess.<\/li>\r\n<li>develop your professional knowledge, skills and competence on a\r\ncontinuing basis, maintaining awareness of technological developments,\r\nprocedures, and standards that are relevant to your field.<\/li>\r\n<li>ensure that you have the knowledge and understanding of Legislation\r\nand that you comply with such Legislation, in carrying out your\r\nprofessional responsibilities.<\/li>\r\n<li>respect and value alternative viewpoints and, seek, accept and offer\r\nhonest criticisms of work.<\/li>\r\n<li>avoid injuring others, their property, reputation, or employment by\r\nfalse or malicious or negligent action or inaction.<\/li>\r\n<li>reject and will not make any offer of bribery or unethical\r\ninducement.<\/li>\r\n<\/ul>\r\n<h3 id=\"3-duty-to-relevant-authority---you-shall-l9-s20\">3. Duty to\r\nRelevant Authority - You shall (L9 s20)<\/h3>\r\n<ul>\r\n<li>carry out your professional responsibilities with due care and\r\ndiligence whilst exercising your professional judgement at all\r\ntimes.<\/li>\r\n<li>seek to avoid any situation that may give rise to a conflict of\r\ninterest between you and your Authority.<\/li>\r\n<li>accept professional responsibility for your work.<\/li>\r\n<li>NOT disclose, or use for personal gain, confidential information\r\nexcept with the permission of your Authority, or as required by\r\nLegislation.<\/li>\r\n<li>NOT misrepresent or withhold information on the performance of\r\nproducts, systems or services (unless lawfully bound by a duty of\r\nconfidentiality not to disclose such information), or take advantage of\r\nthe lack of relevant knowledge or inexperience of others.<\/li>\r\n<\/ul>\r\n<h3 id=\"4-duty-to-the-profession---you-shall-l9-s21\">4. Duty to the\r\nProfession - You shall (L9 s21)<\/h3>\r\n<ul>\r\n<li>accept your personal duty to uphold the reputation of the profession\r\nand not take any action which could bring the profession into\r\ndisrepute.<\/li>\r\n<li>seek to improve professional standards through participation in\r\ntheir development, use and enforcement.<\/li>\r\n<li>uphold the reputation and good standing of BCS, the Chartered\r\nInstitute for IT.<\/li>\r\n<li>act with integrity and respect in your professional relationships\r\nwith all members of BCS and with members of other professions with whom\r\nyou work in a professional capacity.<\/li>\r\n<\/ul>\r\n<h2 id=\"acm-code-of-ethics-l9-s22-23-source-acm-2018\">ACM Code of Ethics\r\n(L9 s22-23) (Source: ACM, 2018)<\/h2>\r\n<h3 id=\"general-ethical-principles-s22\">General ethical principles\r\n(s22)<\/h3>\r\n<ul>\r\n<li>Contribute to society and to human well-being, acknowledging that\r\nall people are stakeholders in computing.<\/li>\r\n<li>Avoid harm.<\/li>\r\n<li>Be honest and trustworthy.<\/li>\r\n<li>Be fair and take action not to discriminate.<\/li>\r\n<li>Respect the work required to produce new ideas, inventions, creative\r\nworks, and computing artefacts.<\/li>\r\n<li>Respect privacy.<\/li>\r\n<li>Honour confidentiality.<\/li>\r\n<\/ul>\r\n<h3 id=\"professional-responsibilities-s23\">Professional responsibilities\r\n(s23)<\/h3>\r\n<ul>\r\n<li>Strive to achieve high quality in both the processes and products of\r\nprofessional work.<\/li>\r\n<li>Maintain high standards of professional competence, conduct, and\r\nethical practice.<\/li>\r\n<li>Know and respect existing rules pertaining to professional\r\nwork.<\/li>\r\n<li>Accept and provide appropriate professional review.<\/li>\r\n<li>Give comprehensive and thorough evaluations of computer systems and\r\ntheir impacts, including analysis of possible risks.<\/li>\r\n<li>Perform work only in areas of competence.<\/li>\r\n<li>Foster public awareness and understanding of computing, related\r\ntechnologies, and their consequences.<\/li>\r\n<li>Access computing and communication resources only when authorized or\r\nwhen compelled by the public good.<\/li>\r\n<li>Design and implement systems that are robustly and usably\r\nsecure.<\/li>\r\n<\/ul>\r\n<h2 id=\"health-and-safety-l9-s25\">Health and safety (L9 s25)<\/h2>\r\n<ul>\r\n<li>Half the workers think its boring; the other half are job's worths.\r\nCommon sense should prevail.<\/li>\r\n<\/ul>\r\n<h2 id=\"references-named-l9-s26\">References named (L9 s26)<\/h2>\r\n<ul>\r\n<li>Bott 2014 Professional Issues in IT 2nd ed (BCS); Adams &amp;\r\nMcCrindle 2008 Pandora's Box; BCS 2018 Code of Conduct; ACM 2018 Code of\r\nEthics and Professional Conduct.<\/li>\r\n<\/ul>\r\n<h2 id=\"slide-quirks\">Slide quirks<\/h2>\r\n<ul>\r\n<li>Founding years and member counts follow the slides (IEEE 1946, ACM\r\n1947, BCS 1957, IET 2006).<\/li>\r\n<li>s15 expands ACM as \"Association of Computer Machinery\" (sic).<\/li>\r\n<\/ul>\r\n"}]};
const WEEKS = {0:"2024-25 paper",1:"Week 1, Introduction and GDPR overview",2:"Week 2, Data Protection",3:"Week 3, Freedom of Information and Privacy",4:"Week 4, Sustainability",5:"Week 5, System Failures",6:"Week 6, Ethics",7:"Weeks 7 and 8, Computer Misuse Act and cyber bodies",9:"Week 9, Professionalism"};
const Q = DATA.questions, BYID = Object.fromEntries(Q.map(q => [q.id, q]));
const LS = "pics-quiz-v1";
let st = {wrong:{}, seen:{}, run:null, hist:[], prefs:{weeks:null, kinds:["lecture","seminar","reading"], n:20}};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const marks = q => q.type === "multi" ? 3 : 2;
const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const bank = Q.filter(q => q.week !== 0);
const weeksPresent = [...new Set(bank.map(q => q.week))].sort((a, b) => a - b);
const HASPAST = Q.some(q => q.week === 0);
let tick = null, first = true;
// After each re-render, put keyboard and screen-reader focus on the new view.
const focusOn = sel => { const e = app.querySelector(sel); if (e) { e.tabIndex = -1; e.focus({preventScroll:true}); } };
const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };

// Pen and red-pen marks. A few hand-drawn variants so a column of them does not look stamped.
const XS = ["M7 8C12 13 19 20 26 25M25 6C19 13 13 19 6 27", "M6 7C13 14 20 19 27 26M26 7C20 12 12 20 7 26", "M8 6C13 12 20 20 25 27M26 8C19 13 12 21 7 25"];
const xMark = i => `<svg class="x" viewBox="0 0 32 32" aria-hidden="true"><path class="pen" d="${XS[i % 3]}"/></svg>`;
const TICK = `<svg class="mk" viewBox="0 0 24 26" aria-hidden="true"><path class="red" d="M3 14C6 17 8 20 9 23C12 15 16 8 22 3"/></svg>`;
const CROSS = `<svg class="mk" viewBox="0 0 24 26" aria-hidden="true"><path class="red" d="M4 5C9 10 15 17 20 22M20 4C14 10 9 16 4 22"/></svg>`;
const RING = `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><path class="red" d="M21 4C33 3 39 12 38 22C37 33 28 39 19 38C9 37 3 29 4 19C5 10 12 5 23 5"/></svg>`;

// One answer row. state is "", "right", "missed" or "wrong" once the question has been marked.
function row(q, k, i, sel, type, state, locked) {
  const label = {right:"Correct", missed:"Missed", wrong:"Wrong"}[state] || "";
  return `<label class="o"><input type="${type}" name="o" value="${k}" ${sel ? "checked" : ""} ${locked ? "disabled" : ""}>
    <span class="box">${xMark(i)}${state === "missed" ? RING : ""}</span>
    <span>${esc(q.options[k])}${label ? `<small>${label}</small>` : ""}</span>
    ${state === "right" ? TICK : state === "wrong" ? CROSS : "<span></span>"}</label>`;
}
const stateOf = (q, k, picked) => q.answer.includes(k) ? (picked.includes(k) ? "right" : "missed") : (picked.includes(k) ? "wrong" : "");
const feedback = q => `<div class="note"><span>${esc(q.explain)}</span><span class="s">${esc(q.source)}</span></div>${q.flag ? `<div class="flag"><b>Note.</b> ${esc(q.flag)}</div>` : ""}`;

function home() {
  clearInterval(tick);
  const wrongN = Object.keys(st.wrong).filter(id => BYID[id]).length;
  const resume = st.run && !st.run.done;
  const last = st.hist.slice(-5).reverse();
  app.innerHTML = `
  <header class="cover">
    <p class="s">MOD002647 Professional Issues, Computing and Society</p>
    <h1>In-class test practice</h1>
    <p>Weighting 20%. Time allowed 50 minutes.</p>
  </header>
  <h2>Guidelines for candidates</h2>
  <ul class="rules">
    <li>Answer ALL questions. Put a clear X in the box next to the answer you choose.</li>
    <li>Questions 1 to 20 have one correct answer and carry 2 marks each.</li>
    <li>Questions 21 to 40 have more than one correct answer and carry 3 marks each. Choose all of them.</li>
    <li>No books or other materials are allowed in the real test, so try the mock without your notes.</li>
  </ul>
  <h2>Papers</h2>
  <div class="papers">
    ${resume ? `<button id="resume"><b>Resume ${esc(st.run.title.toLowerCase())}</b><span>You stopped at question ${st.run.i + 1}.</span><i>${st.run.ids.length} questions</i></button>` : ""}
    <button id="m-mock"><b>Mock test</b><span>A fresh paper each time, marked at the end.</span><i>40 questions, 50 min</i></button>
    ${HASPAST ? `<button id="m-past"><b>2024-25 past paper</b><span>The real paper, in its original order.</span><i>40 questions, 50 min</i></button>` : ""}
    <button id="m-prac"><b>Practice by week</b><span>Each answer is marked straight away, with the slide it came from.</span><i>${bank.length} questions</i></button>
    <button id="m-wrong" ${wrongN ? "" : "disabled"}><b>Corrections</b><span>${wrongN ? "The questions you have got wrong so far." : "Nothing here until you get a question wrong."}</span><i>${wrongN} to redo</i></button>
    <button id="m-notes"><b>Revision notes</b><span>Acts and years, acronyms, numbers and the lists to know by heart.</span><i>${DATA.notes.length} sheets</i></button>
  </div>
  ${last.length ? `<h2>Recent marks</h2><table><tr><th scope="col">Paper</th><th scope="col">Date</th><th scope="col" class="num">Mark</th></tr>${last.map(h => `<tr><td>${esc(h.title)}</td><td>${new Date(h.at).toLocaleDateString()}</td><td class="num">${h.score} of ${h.total}</td></tr>`).join("")}</table>` : ""}
  <h2>How it is marked</h2>
  <p class="s">Answers follow the lecture slides, because the test is marked against them. Where a slide is unclear or disagrees with current law, the question carries a note. A choose-all question scores 3 only when every box is right, since the real marking scheme is not published. Your marks are kept in this browser and nowhere else.</p>`;
  if (!first) focusOn("h1"); first = false;
  on("resume", () => show());
  on("m-mock", startMock);
  on("m-past", () => start({title:"2024-25 past paper", ids:Q.filter(q => q.week === 0).map(q => q.id), exam:true, keepOrder:true, limit:50 * 60}));
  on("m-prac", setup);
  on("m-wrong", () => start({title:"Corrections", ids:shuffle(Object.keys(st.wrong).filter(id => BYID[id])), exam:false}));
  on("m-notes", () => notes(DATA.notes[0] && DATA.notes[0].week));
}

function startMock() {
  const lec = bank.filter(q => q.kind !== "reading"), rd = bank.filter(q => q.kind === "reading");
  const pick = type => {
    const fresh = q => (st.seen[q.id] || 0);
    const byWeek = {};
    shuffle(lec.filter(q => q.type === type)).sort((a, b) => fresh(a) - fresh(b)).forEach(q => (byWeek[q.week] = byWeek[q.week] || []).push(q));
    // Weighted like the 2024-25 paper: data protection, CMA and FOI carry most of it.
    const quota = {2:4, 7:4, 3:3, 5:2, 6:2, 1:1, 4:1, 9:1}, out = [];
    for (const w in quota) out.push(...(byWeek[w] || []).splice(0, quota[w]));
    const rest = shuffle(Object.values(byWeek).flat());
    while (out.length < 18 && rest.length) out.push(rest.pop());
    out.push(...shuffle(rd.filter(q => q.type === type)).slice(0, 20 - out.length));
    return shuffle(out).map(q => q.id);
  };
  start({title:"Mock test", ids:[...pick("single"), ...pick("multi")], exam:true, limit:50 * 60});
}

function setup() {
  const p = st.prefs; if (!p.weeks) p.weeks = weeksPresent.slice();
  const count = () => bank.filter(q => p.weeks.includes(q.week) && p.kinds.includes(q.kind)).length;
  const tickBox = (group, type, v, text, checked, i) => `<label class="o"><input type="${type}" name="${group}" value="${v}" ${checked ? "checked" : ""}><span class="box">${xMark(i)}</span><span>${text}</span></label>`;
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button></div>
  <h1 style="margin-top:20px">Practice by week</h1>
  <fieldset id="wk"><legend><h2>Weeks</h2></legend><div class="cols">${weeksPresent.map((w, i) => tickBox("wk", "checkbox", w, `${esc(WEEKS[w] || "Week " + w)} <span class="s">${bank.filter(q => q.week === w).length}</span>`, p.weeks.includes(w), i)).join("")}</div></fieldset>
  <fieldset id="kd"><legend><h2>Taken from</h2></legend><div class="cols">${[["lecture","Lecture slides"],["seminar","Seminar slides"],["reading","Set readings"]].map(([k, t], i) => tickBox("kd", "checkbox", k, t, p.kinds.includes(k), i)).join("")}</div></fieldset>
  <fieldset id="nn"><legend><h2>Number of questions</h2></legend><div class="cols">${[10, 20, 40, 0].map((n, i) => tickBox("n", "radio", n, n || "All of them", p.n === n, i)).join("")}</div></fieldset>
  <p class="s" id="cnt" aria-live="polite"></p><div class="nav"><span></span><button class="p" id="go">Start</button></div>`;
  const upd = () => {
    p.weeks = [...document.querySelectorAll("#wk input:checked")].map(e => +e.value);
    p.kinds = [...document.querySelectorAll("#kd input:checked")].map(e => e.value);
    p.n = +document.querySelector("#nn input:checked").value; save();
    const c = count();
    document.getElementById("cnt").textContent = c ? c + " questions match. The ones you have seen least come first." : "No questions match. Tick at least one week and one source.";
    document.getElementById("go").disabled = !c;
  };
  app.querySelectorAll("input").forEach(e => e.onchange = upd); upd(); focusOn("h1");
  on("back", () => home());
  on("go", () => {
    let pool = shuffle(bank.filter(q => p.weeks.includes(q.week) && p.kinds.includes(q.kind))).sort((a, b) => (st.seen[a.id] || 0) - (st.seen[b.id] || 0));
    if (p.n) pool = pool.slice(0, p.n);
    start({title:"Practice", ids:shuffle(pool).map(q => q.id), exam:false});
  });
}

function start(o) {
  const order = {};
  o.ids.forEach(id => { const n = BYID[id].options.length, idx = [...Array(n).keys()]; order[id] = o.keepOrder ? idx : shuffle(idx); });
  st.run = {title:o.title, ids:o.ids, exam:!!o.exam, limit:o.limit || 0, t0:Date.now(), i:0, ans:{}, checked:{}, order, done:false};
  save(); show();
}

function show() { const r = st.run; if (!r) return home(); r.done ? results() : question(); }
function timeLeft() { const r = st.run; return Math.max(0, r.limit - Math.floor((Date.now() - r.t0) / 1000)); }
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function question() {
  clearInterval(tick);
  const r = st.run, q = BYID[r.ids[r.i]], picked = r.ans[q.id] || [], checked = !r.exam && r.checked[q.id];
  const multi = q.type === "multi", n = r.ids.length, good = same(picked, q.answer);
  const opts = r.order[q.id].map((k, i) => row(q, k, i, picked.includes(k), multi ? "checkbox" : "radio", checked ? stateOf(q, k, picked) : "", checked)).join("");
  const answered = Object.values(r.ans).filter(a => a.length).length;
  app.innerHTML = `

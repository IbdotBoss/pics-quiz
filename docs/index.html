nd not the same for everyone.", "source": "Lecture 6 (Ethics) slide 4", "flag": "", "kind": "lecture"}, {"id": "w06-003", "week": 6, "topic": "Ethics", "type": "single", "q": "Who may have been the first proponent of ethical behavior?", "options": ["Descartes", "Hippocrates", "Kant", "Josephson"], "answer": [1], "explain": "Hippocrates may have been the first proponent of ethical behavior.", "source": "Lecture 6 (Ethics) slide 5", "flag": "", "kind": "lecture"}, {"id": "w06-004", "week": 6, "topic": "Ethics", "type": "single", "q": "What is the FIRST thing to do before you make an ethical decision?", "options": ["Clearly identify all the facts", "List the consequences of the actions", "List all options", "Identify the stakeholders"], "answer": [0], "explain": "The list begins with clearly identifying all the facts. Then come defining the areas of potential conflict, identifying the stakeholders, listing all options, listing the consequences, and finally making the decision.", "source": "Lecture 6 (Ethics) slide 8", "flag": "", "kind": "lecture"}, {"id": "w06-005", "week": 6, "topic": "Ethics", "type": "single", "q": "In the steps before making an ethical decision, what comes immediately after 'Clearly identify all the facts'?", "options": ["Now make the decision", "List all options", "Identify the stakeholders", "Define the areas of potential conflict"], "answer": [3], "explain": "The order on the slide is facts, areas of potential conflict, stakeholders, options, consequences, then decision.", "source": "Lecture 6 (Ethics) slide 8", "flag": "", "kind": "lecture"}, {"id": "w06-006", "week": 6, "topic": "Ethics", "type": "single", "q": "In the steps before making an ethical decision, what is done immediately BEFORE listing the consequences of the actions?", "options": ["Now make the decision", "Identify the stakeholders", "List all options", "Define the areas of potential conflict"], "answer": [2], "explain": "Options are listed, then the consequences of the actions are listed, then the decision is made.", "source": "Lecture 6 (Ethics) slide 8", "flag": "", "kind": "lecture"}, {"id": "w06-007", "week": 6, "topic": "Ethics", "type": "single", "q": "Which principle says: take the decision for the greatest good of everyone?", "options": ["Rule of Universality", "Rule of Change", "Risk Aversion Principle", "Utilitarianism Principle"], "answer": [3], "explain": "The Utilitarianism Principle says to take the decision for the greatest good of everyone.", "source": "Lecture 6 (Ethics) slide 9", "flag": "", "kind": "lecture"}, {"id": "w06-008", "week": 6, "topic": "Ethics", "type": "single", "q": "Which principle says: take the decision that causes least harm?", "options": ["Utilitarianism Principle", "Rule of Universality", "Risk Aversion Principle", "Rule of Change"], "answer": [2], "explain": "The Risk Aversion Principle says to take the decision that causes least harm.", "source": "Lecture 6 (Ethics) slide 9", "flag": "", "kind": "lecture"}, {"id": "w06-009", "week": 6, "topic": "Ethics", "type": "single", "q": "The Rule of Universality ('if the action is not right for everyone, then it is not right for anyone') is attributed to whom?", "options": ["Hippocrates", "Kuhn", "Kant", "Descartes"], "answer": [2], "explain": "The Rule of Universality is attributed to Kant, 1724-1804.", "source": "Lecture 6 (Ethics) slide 9", "flag": "", "kind": "lecture"}, {"id": "w06-010", "week": 6, "topic": "Ethics", "type": "single", "q": "Which rule says: if an action cannot be taken repeatedly, then it is not right to take it at all?", "options": ["Rule of Change", "Rule of Universality", "Risk Aversion Principle", "Utilitarianism Principle"], "answer": [0], "explain": "The Rule of Change says that if an action cannot be taken repeatedly, then it is not right to take it at all. The slide credits Descartes, 1596-1650.", "source": "Lecture 6 (Ethics) slide 9", "flag": "The slide attributes the Rule of Change to Descartes, 1596-1650. Follow the slide.", "kind": "lecture"}, {"id": "w06-011", "week": 6, "topic": "Ethics", "type": "single", "q": "Which philosopher is named alongside the Rule of Change?", "options": ["Descartes (1596-1650)", "Holodny (2016)", "Hippocrates", "Kant (1724-1804)"], "answer": [0], "explain": "The Rule of Change is named with Descartes, 1596-1650. The Rule of Universality is Kant, 1724-1804.", "source": "Lecture 6 (Ethics) slide 9", "flag": "", "kind": "lecture"}, {"id": "w06-012", "week": 6, "topic": "Ethics", "type": "single", "q": "Which of the following is NOT listed as a source of ethics?", "options": ["Supernaturalism", "Intuitionism", "Exemplars", "Statute", "Ideologies"], "answer": [3], "explain": "Slide lists Supernaturalism, Intuitionism, Consequentialism, Exemplars, Ideologies.", "source": "Lecture 6 (Ethics) slide 5", "flag": "", "kind": "lecture"}, {"id": "w06-013", "week": 6, "topic": "Ethics", "type": "single", "q": "Which ethical position is expressed by 'I disapprove of murder'?", "options": ["Emotivism", "Moral realism", "Subjectivism", "Prescriptivism"], "answer": [2], "explain": "Subjectivism - 'I disapprove of murder'.", "source": "Lecture 6 (Ethics) slide 11", "flag": "", "kind": "lecture"}, {"id": "w06-014", "week": 6, "topic": "Ethics", "type": "single", "q": "Which ethical position is expressed by 'don't murder'?", "options": ["Subjectivism", "Moral realism", "Prescriptivism", "Emotivism"], "answer": [2], "explain": "Prescriptivism - 'don't murder'.", "source": "Lecture 6 (Ethics) slide 11", "flag": "", "kind": "lecture"}, {"id": "w06-015", "week": 6, "topic": "Ethics", "type": "single", "q": "Which ethical position is expressed by 'down with murder'?", "options": ["Prescriptivism", "Moral realism", "Subjectivism", "Emotivism"], "answer": [3], "explain": "Emotivism - 'down with murder'.", "source": "Lecture 6 (Ethics) slide 11", "flag": "", "kind": "lecture"}, {"id": "w06-016", "week": 6, "topic": "Ethics", "type": "single", "q": "How does the lecture sum up a person's morals?", "options": ["The decisions they make under legal pressure", "The rules laid down by a governing body", "The collection of the environmental factors they are exposed to and what they have taken away from them", "The code of conduct of their professional body"], "answer": [2], "explain": "A person's morals can be summed up as 'the collection of the environmental factors they are exposed to and what they have taken away from them.'", "source": "Lecture 6 (Ethics) slide 12", "flag": "", "kind": "lecture"}, {"id": "w06-017", "week": 6, "topic": "Ethics", "type": "single", "q": "In the prisoner theory game, what happens if A and B each betray the other?", "options": ["Both are set free", "Each serves one year in prison", "Each serves two years in prison", "Each serves three years in prison"], "answer": [2], "explain": "If A and B each betray the other, each of them serves two years in prison.", "source": "Lecture 6 (Ethics) slide 15", "flag": "", "kind": "lecture"}, {"id": "w06-018", "week": 6, "topic": "Ethics", "type": "single", "q": "In the prisoner theory game, A betrays B but B remains silent. What happens?", "options": ["Both serve two years", "A is set free and B serves three years", "Both serve one year", "A serves three years and B is set free"], "answer": [1], "explain": "If A betrays B but B remains silent, A will be set free and B will serve three years in prison.", "source": "Lecture 6 (Ethics) slide 15", "flag": "", "kind": "lecture"}, {"id": "w06-019", "week": 6, "topic": "Ethics", "type": "single", "q": "In the prisoner theory game, what happens if A and B both remain silent?", "options": ["Both serve only one year (on the lesser charge)", "Both are set free", "Both serve two years", "One is set free and the other serves three years"], "answer": [0], "explain": "If A and B both remain silent, both of them will only serve one year in prison, on the lesser charge.", "source": "Lecture 6 (Ethics) slide 15", "flag": "", "kind": "lecture"}, {"id": "w06-020", "week": 6, "topic": "Ethics", "type": "single", "q": "What does prisoner theory show?", "options": ["Rational people always cooperate when they cannot communicate", "Betrayal is never the rational choice", "Laws always override ethics", "Two completely rational people might not cooperate, even when it is in their best interests to do so"], "answer": [3], "explain": "Prisoner theory shows that two completely rational people might not cooperate ... even when its is in their best interests to do so.", "source": "Lecture 6 (Ethics) slide 17", "flag": "", "kind": "lecture"}, {"id": "w06-021", "week": 6, "topic": "Ethics", "type": "single", "q": "In the prisoner theory scenario, what charge do the prosecutors lack enough evidence to convict the pair on?", "options": ["Fraud", "Breach of the Data Protection Act", "A lesser charge", "The principal charge of hacking"], "answer": [3], "explain": "Prosecutors lack sufficient evidence to convict the pair on the principal charge of hacking, but have enough to convict both on a lesser charge.", "source": "Lecture 6 (Ethics) slide 14", "flag": "", "kind": "lecture"}, {"id": "w06-022", "week": 6, "topic": "Ethics", "type": "single", "q": "Which of the following is NOT a trait of an ethical IT consultant?", "options": ["Subscribes to a professional body which has a code of professional conduct", "Keeps up their CPD", "Acts as a guide or mentor to junior or less experienced consultants", "Has professional indemnity and public liability insurance as necessary", "Takes assignments in any field to maximise income"], "answer": [4], "explain": "An ethical consultant takes assignments only in those fields where they can confidently predict that they can help their client.", "source": "Lecture 6 (Ethics) slide 21", "flag": "", "kind": "lecture"}, {"id": "w06-023", "week": 6, "topic": "Ethics", "type": "single", "q": "What does 'digital divide' refer to under social impacts?", "options": ["Employment, under employment and deskilling", "Monitoring access to data on networks", "The haves and have-nots", "How good is good enough"], "answer": [2], "explain": "The digital divide means the haves and have-nots.", "source": "Lecture 6 (Ethics) slide 22", "flag": "", "kind": "lecture"}, {"id": "w06-024", "week": 6, "topic": "Ethics", "type": "single", "q": "In research ethics, 'deception' means:", "options": ["Informing participants", "Withholding information", "Withdrawing at any time without penalty", "Protecting participants at all times"], "answer": [1], "explain": "Deception means withholding information, and consent means informing participants.", "source": "Lecture 6 (Ethics) slide 24", "flag": "", "kind": "lecture"}, {"id": "w06-025", "week": 6, "topic": "Ethics", "type": "single", "q": "In research ethics, 'confidentiality' is to be handled in accordance with:", "options": ["DPA/GDPR", "The BCS Code of Conduct", "PCI DSS", "The Computer Misuse Act"], "answer": [0], "explain": "confidentiality - in accordance with DPA/GDPR.", "source": "Lecture 6 (Ethics) slide 24", "flag": "", "kind": "lecture"}, {"id": "w06-026", "week": 6, "topic": "Ethics", "type": "single", "q": "In research ethics, participants must be able to withdraw:", "options": ["Only with the researcher's permission", "At any time without penalty", "At any time, with a financial penalty", "Only before the study starts"], "answer": [1], "explain": "withdrawal - at any time without penalty.", "source": "Lecture 6 (Ethics) slide 24", "flag": "", "kind": "lecture"}, {"id": "w06-027", "week": 6, "topic": "Ethics", "type": "single", "q": "According to the lecture summary, ethics and morals are:", "options": ["Both fixed for everyone", "Both defined by the law", "Exactly the same thing", "At times used interchangeably, but have two very different meanings"], "answer": [3], "explain": "Ethics and morals are at times used interchangeable, but have two very different meanings.", "source": "Lecture 6 (Ethics) slide 25", "flag": "", "kind": ray: both are set free", "Both silent: each serves two years", "A betrays, B silent: A is set free and B serves three years", "Both silent: each serves one year", "A betrays, B silent: A serves one year", "Both betray: each serves two years"], "answer": [2, 3, 5], "explain": "Slide 15 gives the three outcomes.", "source": "Lecture 6 (Ethics) slide 15", "flag": "", "kind": "lecture"}, {"id": "w06-043", "week": 6, "topic": "Ethics", "type": "multi", "q": "Which statements about prisoner theory are correct?", "options": ["Purely rational people will betray the other", "Betrayal is never the outcome for rational people", "Both could get a lower sentence if both stay silent", "The detainees can communicate with each other", "Two completely rational people might not cooperate", "The decision will affect the detainees' future reputation"], "answer": [0, 2, 4], "explain": "The detainees are in solitary confinement and the decision will not affect their reputation. Rational people looking out for #1 betray the other.", "source": "Lecture 6 (Ethics) slide 14-19", "flag": "", "kind": "lecture"}, {"id": "w06-044", "week": 6, "topic": "Ethics", "type": "multi", "q": "Which of the following are rules or principles for ethical decisions given in the lecture?", "options": ["Rule of Law", "Utilitarianism Principle", "Rule of Universality", "Risk Aversion Principle", "Rule of Change", "Rule of Precedent"], "answer": [1, 2, 3, 4], "explain": "Slide 9 lists these four.", "source": "Lecture 6 (Ethics) slide 9", "flag": "", "kind": "lecture"}, {"id": "w06-045", "week": 6, "topic": "Ethics", "type": "multi", "q": "Business ethics involves adhering to which of the following?", "options": ["Maximising shareholder returns", "Regulatory standards", "Keeping promises and commitments", "Company standards", "Legal standards", "Professional standards", "Only the standards of competitors"], "answer": [1, 2, 3, 4, 5], "explain": "Business ethics involves adhering to legal, regulatory, professional cilitate commission of further offences?", "options": ["Section 3ZA", "Section 1", "Section 2", "Section 3"], "answer": [2], "explain": "Section 2 covers UNAUTHORISED access with intent to commit or facilitate commission of further offences.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-004", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which section of the Computer Misuse Act 1990 covers unauthorised acts with intent to impair, or with recklessness as to impairing, operation of a computer?", "options": ["Section 1", "Section 2", "Section 3", "Section 3A"], "answer": [2], "explain": "Section 3 covers UNAUTHORISED acts with intent to impair, or with recklessness as to impairing, operation of computer.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-005", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which section of the Computer Misuse Act 1990 covers unauthorised acts causing, or creating risk of, serious damage?", "options": ["Section 2", "Section 3ZA", "Section 3", "Section 3A"], "answer": [1], "explain": "Section 3ZA covers UNAUTHORISED acts causing, or creating risk of, serious damage.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-006", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which section of the Computer Misuse Act 1990 covers making, supplying or obtaining articles for use in an offence under section 1, 2, 3 or 3ZA?", "options": ["Section 3A", "Section 3ZA", "Section 1", "Section 3"], "answer": [0], "explain": "Section 3A covers making, supplying or obtaining articles for use in an offence under section 1, 2, 3 or 3ZA.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-007", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What is the maximum prison term for a Section 1 offence under the slides?", "options": ["2 years", "6 months", "10 years", "5 years"], "answer": [0], "explain": "A Section 1 offence carries a fine or 2 years in prison, or both. The previous limit was 6 months.", "source": "Lecture 4 (CMA) slide 12", "flag": "The slide gives no penalty for 3ZA or 3A. In real law S1 is up to 2 years on indictment and 6 months on summary conviction.", "kind": "lecture"}, {"id": "w07-008", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What was the previous maximum prison term for a Section 1 offence before it was raised to 2 years?", "options": ["5 years", "1 year", "6 months", "10 years"], "answer": [2], "explain": "A Section 1 offence carries a fine or 2 years in prison, or both. The previous limit was 6 months.", "source": "Lecture 4 (CMA) slide 12", "flag": "", "kind": "lecture"}, {"id": "w07-009", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What is the maximum prison term for a Section 2 offence under the slides?", "options": ["5 years", "2 years", "10 years", "6 months"], "answer": [0], "explain": "A Section 2 offence carries a fine or 5 years in prison, or both.", "source": "Lecture 4 (CMA) slide 12", "flag": "", "kind": "lecture"}, {"id": "w07-010", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What is the maximum prison term for a Section 3 offence under the slides?", "options": ["5 years", "10 years", "2 years", "14 years"], "answer": [1], "explain": "A Section 3 offence carries a fine or 10 years in prison, or both.", "source": "Lecture 4 (CMA) slide 12", "flag": "", "kind": "lecture"}, {"id": "w07-011", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which Act of 1990 sets out the offences of unauthorised access to computer material and unauthorised acts with intent to impair a computer?", "options": ["Computer Misuse Act 1990", "Data Protection Act 1998", "Regulation of Investigation Powers Act 2000", "Fraud Act 2006"], "answer": [0], "explain": "Computer Misuse Act 1990, Sections 1, 2, 3, 3ZA and 3A.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-012", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which of the following statements is correct?", "options": ["Laws come from moral attitudes or customs", "Ethics carry the authority of a governing body", "Law is not drawn from ethics", "Ethics define socially acceptable behaviours"], "answer": [3], "explain": "Ethics define socially acceptable behaviours. Laws are drawn from ethics and carry the authority of a governing body, and ethics come from moral attitudes or customs.", "source": "Lecture 4 (CMA) slide 4", "flag": "", "kind": "lecture"}, {"id": "w07-013", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which of the following statements is correct?", "options": ["Ethics carry the authority of a governing body", "Laws carry the authority of a governing body", "Laws come from moral attitudes or customs", "Ethics are rules that mandate or prohibit certain behaviour"], "answer": [1], "explain": "The main differences are that laws carry the authority of a governing body and ethics come from moral attitudes or customs.", "source": "Lecture 4 (CMA) slide 4", "flag": "", "kind": "lecture"}, {"id": "w07-014", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which of the following statements is correct?", "options": ["Both ethics and laws are always local", "Both ethics and laws are always universal", "Laws can be universal, whereas ethics tend to be local", "Ethics can be universal, whereas laws tend to be local"], "answer": [3], "explain": "Ethics can be universal, laws tend to be local.", "source": "Lecture 4 (CMA) slide 4", "flag": "", "kind": "lecture"}, {"id": "w07-015", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which of the following statements about laws is correct?", "options": ["Laws are rules that mandate or prohibit certain behaviour and are drawn from ethics", "Laws are guidelines that describe acceptable and unacceptable behaviour", "Laws are not drawn from ethics", "Laws define socially acceptable behaviours"], "answer": [0], "explain": "Laws are rules that mandate or prohibit certain behaviour and are drawn from ethics. Policy is guidelines.", "source": "Lecture 4 (CMA) slide 4-5", "flag": "", "kind": "lecture"}, {"id": "w07-016", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which statement about policy vs law is correct?", "options": ["A policy carries the authority of a governing body", "A policy has no penalties for non-compliance", "Ignoring a law is acceptable", "Ignoring a law is unacceptable"], "answer": [3], "explain": "The main differences are that ignoring a policy is acceptable and ignoring a law is unacceptable.", "source": "Lecture 4 (CMA) slide 5", "flag": "The slide says policy \"has penalties for non-compliance\" yet also \"ignoring a policy is acceptable\", and these sit awkwardly together. Follow the slide wording.", "kind": "lecture"}, {"id": "w07-017", "week": 7, "topic": "Governance and Law", "type": "single", "q": "According to the slides, which describes a policy?", "options": ["Behaviours that are socially acceptable, defined by custom", "Guidelines that describe acceptable and unacceptable behaviour, with penalties for non-compliance", "Rules that mandate or prohibit certain behaviour, drawn from ethics", "Standards that carry the authority of a governing body"], "answer": [1], "explain": "A policy is guidelines that describe acceptable and unacceptable behaviour, and it has penalties for non-compliance.", "source": "Lecture 4 (CMA) slide 5", "flag": "", "kind": "lecture"}, {"id": "w07-018", "week": 7, "topic": "Governance and Law", "type": "single", "q": "In business law, what is 'due care'?", "options": ["The organisation reports all breaches to the ICO", "The organisation makes sure employees know what is acceptable or unacceptable", "The organisation makes a valid effort to protect employees, customers etc.", "The organisation hires a reputable auditor"], "answer": [1], "explain": "Due care is when the organisation makes sure employees know what is acceptable or unacceptable.", "source": "Lecture 4 (CMA) slide 6", "flag": "", "kind": "lecture"}, {"id": "w07-019", "week": 7, "topic": "Governance and Law", "type": "single", "q": "In business law, what is 'due diligence'?", "options": ["The organisation publishes its terms and conditions", "The organisation makes a valid effort to protect employees, customers etc.", "The organisation hires an ethical hacker", "The organisation makes sure employees know what is acceptable or unacceptable"], "answer": [1], "explain": "Due diligence is when the organisation makes a valid effort to protect employees, customers etc.", "source": "Lecture 4 (CMA) slide 6", "flag": "", "kind": "lecture"}, {"id": "w07-020", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which description matches cyber-dependent crime?", "options": ["Crimes that can be committed only through the use of ICT devices, where the devices are both the tool and the target of the crime", "Crimes committed only by organised crime groups", "Any crime in which a computer holds evidence", "Traditional crimes which can be increased in scale or reach by the use of computers"], "answer": [0], "explain": "Cyber-dependent crimes can be committed only through ICT devices, where the devices are both the tool for committing the crime, and the target of the crime.", "source": "Lecture 4 (CMA) slide 7", "flag": "", "kind": "lecture"}, {"id": "w07-021", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which description matches cyber-enabled crime?", "options": ["Crimes that can be committed only through the use of ICT devices", "Traditional crimes which can be increased in scale or reach by the use of computers, computer networks or other forms of ICT", "Crimes where the device is both the tool and the target", "Crimes that need malware to be committed"], "answer": [1], "explain": "Cyber-enabled crimes are traditional crimes which can be increased in scale or reach by the use of computers, computer networks or other forms of ICT.", "source": "Lecture 4 (CMA) slide 7", "flag": "", "kind": "lecture"}, {"id": "w07-022", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which of the following is an example of a cyber-dependent crime?", "options": ["Online grooming", "Cyberstalking", "Piracy", "Defacing a website"], "answer": [3], "explain": "Cyber-dependent crime is illicit intrusion into networks or disrupting a service, for example hacking, defacing a website, DoS and malware. Cyberstalking, grooming and piracy are cyber-enabled.", "source": "Lecture 4 (CMA) slide 8-9", "flag": "", "kind": "lecture"}, {"id": "w07-023", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which of the following is an example of a cyber-enabled crime?", "options": ["Denial of service (DoS)", "Defacing a website", "Cyberstalking", "Developing and propagating malware"], "answer": [2], "explain": "Cyber-enabled crimes include offenses against a specific target - cyberstalking. DoS, malware and defacing are cyber-dependent.", "source": "Lecture 4 (CMA) slide 8-9", "flag": "", "kind": "lecture"}, {"id": "w07-024", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which Act, dated 2000, is listed with the Computer Misuse Act 1990 under cyber-dependent crime?", "options": ["Sarbanes Oxley Act 2000", "Data Protection Act 2000", "Fraud Act 2000", "Regulation of Investigation Powers Act 2000"], "answer": [3], "explain": "The cyber-dependent crimes slide lists the Computer Misuse Act 1990, the Regulation of Investigation Powers Act 2000 and the Data Protection Act 1998.", "source": "Lecture 4 (CMA) slide 8", "flag": "The slide spells it \"Regulation of Investigation Powers Act\", and the real title is Regulation of Investigatory Powers Act 2000.", "kind": "lecture"}, {"id": "w07-025", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which Act, dated 1998, is listed with the Computer Misuse Act 1990 under cyber-dependent crime?", "options": ["Computer Misuse Act 1998", "Fraud Act 2006", "Data Protection Act 2018", "Data Protection Act 1998"], "answer": [3], "explain": "The slide lists the Data Protection Act 1998, which has some civil and some criminal offences.", "source": "Lecture 4 (CMA) slide 8, 11", "flag": "", "kind": "lecture"}, {"id": "w07-026", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which Act does the lecture say may be easier to prove to the criminal standard of proof than the Computer Misuse Act?", "options": ["Regulation of Investigation Powers Act 2000", "Sarbanes Oxley", "Fraud Act 2006", "Data Protection Act 1998"], "answer": [2], "explain": "Other Acts, for example the Fraud Act 2006, may be easier to prove to the criminal standard of proof.", "source": "Lecture 4 (CMA) slide 15", "flag": "", "kind": "lecture"}, {"id": "w07-027", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What does the Gary McKinnon case illustrate in the lecture?", "options": ["Jurisdictional problems, especially cross border", "Due care in business law", "The penalties for Section 3A", "The need for PCI DSS compliance"], "answer": [0], "explain": "There are often jurisdictional problems, especially cross border, for example the long running saga of Gary McKinnon.", "source": "Lecture 4 (CMA) slide 11", "flag": "", "kind": "lecture"}, {"id": "w07-028", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "What is required for penetration testing so the tester does not get arrested?", "options": ["An authorisation letter from a genuine high level manager (e.g. an IT Director) who has the authority to give it", "Written approval from the NCSC", "A verbal agreement from any employee", "A report to the ICO"], "answer": [0], "explain": "It is easy to get arrested, so the tester needs an authorisation letter from a genuine high level manager who has the authority to give it, for example an IT Director, and that person must be present to verify it.", "source": "Lecture 4 (CMA) slide 14", "flag": "", "kind": "lecture"}, {"id": "w07-029", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which type of attacker breaks into networks to discover weaknesses in order to improve their security?", "options": ["Red hat", "Gray hat", "White hat", "Black hat"], "answer": [2], "explain": "White hat attackers break into networks or computer systems to discover weaknesses in order to improve the security of these systems.", "source": "Lecture 4 (CMA) slide 13", "flag": "", "kind": "lecture"}, {"id": "w07-030", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which type of attacker may report a vulnerability to the owners of the system if that action coincides with their agenda?", "options": ["Gray hat", "Blue hat", "White hat", "Black hat"], "answer": [0], "explain": "Gray hat attackers ... may find a vulnerability and report it to the owners of the system if that action coincides with their agenda.", "source": "Lecture 4 (CMA) slide 13", "flag": "", "kind": "lecture"}, {"id": "w07-031", "week": 7, "topic": "Computer Misuse", "type": "single", "q": "Which type of attacker is described as an unethical criminal who violates computer and network security for personal gain or malicious reasons?", "options": ["Gray hat", "Green hat", "White hat", "Black hat"], "answer": [3], "explain": "Black hat attackers are unethical criminals who violate computer and network security for personal gain, or for malicious reasons.", "source": "Lecture 4 (CMA) slide 13", "flag": "", "kind": "lecture"}, {"id": "w07-032", "week": 7, "topic": "Governance and Law", "type": "single", "q": "What does PCI DSS stand for?", "options": ["Personal Card Information Data Safety Standard", "Payment Card Internet Digital Security Scheme", "Public Credit Industry Data Safety Standard", "Payment Card Industry Data Security Standard"], "answer": [3], "explain": "PCI DSS stands for Payment Card Industry Data Security Standard.", "source": "Lecture 4 (CMA) slide 16", "flag": "", "kind": "lecture"}, {"id": "w07-033", "week": 7, "topic": "Governance and Law", "type": "single", "q": "PCI DSS was the result of collaboration between which groups?", "options": ["GCHQ and the NCSC", "The UK Government and the ICO", "The BCS and the IET", "Credit card companies such as American Express, MasterCard and VISA"], "answer": [3], "explain": "PCI DSS resulted from collaboration between credit card companies such as American Express, MasterCard and VISA.", "source": "Lecture 4 (CMA) slide 16", "flag": "", "kind": "lecture"}, {"id": "w07-034", "week": 7, "topic": "Governance and Law", "type": "single", "q": "If you lose card data under PCI DSS compliance, whom must you declare it to?", "options": ["The NCA", "GCHQ", "NIST", "The ICO"], "answer": [3], "explain": "If you lose card data you must declare it to ICO.", "source": "Lecture 4 (CMA) slide 19", "flag": "", "kind": "lecture"}, {"id": "w07-035", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which Act requires US public companies to set up 'hotlines' so employees can anonymously raise concerns about accounting or audit irregularities?", "options": ["PCI DSS", "EuroSOX", "Sarbanes Oxley (SOX)", "Fraud Act 2006"], "answer": [2], "explain": "Under Sarbanes Oxley, known as SOX, US public companies must establish procedures called \"hotlines\". EuroSOX is the EU equivalent.", "source": "Lecture 4 (CMA) slide 20", "flag": "", "kind": "lecture"}, {"id": "w07-036", "week": 7, "topic": "Governance and Law", "type": "single", "q": "What is EuroSOX?", "options": ["A UK law on card data", "The EU equivalent of PCI DSS", "The EU equivalent of Sarbanes Oxley", "The EU equivalent of the Computer Misuse Act"], "answer": [2], "explain": "EuroSOX - EU equivalent.", "source": "Lecture 4 (CMA) slide 20", "flag": "", "kind": "lecture"}, {"id": "w07-037", "week": 7, "topic": "Governance and Law", "type": "single", "q": "What is 'Herod's clause' used to illustrate?", "options": ["That PCI DSS must be treated as law", "That penetration testing needs authorisation", "That hacking is a cross-border crime", "That nobody reads terms and conditions, which are nevertheless legally binding"], "answer": [3], "explain": "Terms and conditions are legally binding, so how do you enforce them when no one reads them? Herod's clause illustrates this, citing the Guardian in 2014.", "source": "Lecture 4 (CMA) slide 21", "flag": "", "kind": "lecture"}, {"id": "w07-038", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which body is part of the National Crime Agency (NCA)?", "options": ["Information Commissioner's Office (ICO)", "National Cyber Crime Unit (NCCU)", "GCHQ", "National Cyber Security Centre (NCSC)"], "answer": [1], "explain": "The National Cyber Crime Unit is the police and is part of the National Crime Agency, the NCA.", "source": "Lecture 4 (CMA) slide 22", "flag": "", "kind": "lecture"}, {"id": "w07-039", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which body collaborates with Regional Organised Crime Units (ROCUs) to reduce cybercrime?", "options": ["OWASP", "GCHQ", "National Cyber Security Centre (NCSC)", "National Cyber Crime Unit (NCCU)"], "answer": [3], "explain": "The NCCU works with Regional Organised Crime Units, the ROCUs. Its job is to respond to threats and collaborate with partners to reduce cyber crime.", "source": "Lecture 4 (CMA) slide 22", "flag": "", "kind": "lecture"}, {"id": "w07-040", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which government body's main responsibility is to protect UK critical services from cyber attacks?", "options": ["National Cyber Security Centre (NCSC)", "GCHQ", "Information Commissioner's Office (ICO)", "National Cyber Crime Unit (NCCU)", "NIST"], "answer": [0], "explain": "The NCSC's job is to protect UK critical services from cyber attacks, manage major incidents and improve the security of the UK Internet.", "source": "Lecture 4 (CMA) slide 23", "flag": "", "kind": "lecture"}, {"id": "w07-041", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "GCHQ has the responsibility to:", "options": ["Test and set standards for technology", "Protect UK critical services from cyber attacks", "Defend Government systems from cyber threat", "Report a DPA/GDPR breach"], "answer": [2], "explain": "GCHQ protects the UK, with law enforcement and other intelligence agencies, and defends Government systems from cyber threat.", "source": "Lecture 4 (CMA) slide 23", "flag": "", "kind": "lecture"}, {"id": "w07-042", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "What does NCSC stand for?", "options": ["National Computer Security Council", "National Cyber Security Centre", "Network Cyber Safety Centre", "National Cyber Crime Service"], "answer": [1], "explain": "NCSC stands for National Cyber Security Centre.", "source": "Lecture 4 (CMA) slide 23", "flag": "", "kind": "lecture"}, {"id": "w07-043", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which body is described as an independent authority to which you report a DPA/GDPR breach?", "options": ["Information Commissioner's Office (ICO)", "GCHQ", "National Cyber Security Centre (NCSC)", "National Cyber Crime Unit (NCCU)"], "answer": [0], "explain": "The ICO is an independent authority, and it is where you report a DPA or GDPR breach.", "source": "Lecture 4 (CMA) slide 24", "flag": "", "kind": "lecture"}, {"id": "w07-044", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which statement is correct about NIST?", "options": ["It is a UK police unit within the NCA", "It is the UK independent authority for data protection", "It is a non-regulatory US agency that tests and sets standards for technology including security", "It is a global not-for-profit supporting application security"], "answer": [2], "explain": "NIST, the National Institute for Standards and Technology, is a non-regulatory US agency that tests and sets standards for technology including security.", "source": "Lecture 4 (CMA) slide 24", "flag": "", "kind": "lecture"}, {"id": "w07-045", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which body is a global not-for-profit that supports application security through research, pen-testing and education?", "options": ["National Institute for Standards and Technology (NIST)", "Information Commissioner's Office (ICO)", "GCHQ", "Open Web Application Security Project (OWASP)"], "answer": [3], "explain": "OWASP is a global not-for-profit that supports application security through research, pen-testing and education.", "source": "Lecture 4 (CMA) slide 25", "flag": "", "kind": "lecture"}, {"id": "w07-046", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Which body is a not-for-profit representing the information security industry and linked on the slide to 'CyberEssentials' professional qualifications?", "options": ["NCSC", "CREST", "OWASP", "NIST"], "answer": [1], "explain": "CREST is a not-for-profit organisation representing the information security industry, with research, pen-testing and education. The slide links it to \"CyberEssentials\" professional qualifications.", "source": "Lecture 4 (CMA) slide 25", "flag": "", "kind": "lecture"}, {"id": "w07-047", "week": 7, "topic": "Cyber Security Bodies", "type": "single", "q": "Where does the lecture say to report a cybercrime?", "options": ["The PCI Security Council", "Action Fraud (www.actionfraud.police.uk)", "The NCSC website", "The ICO website"], "answer": [1], "explain": "Report a cybercrime at www.actionfraud.police.uk.", "source": "Lecture 4 (CMA) slide 22", "flag": "", "kind": "lecture"}, {"id": "w07-048", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Under PCI DSS, which goal includes 'use and regularly update anti-virus software'?", "options": ["Build and Maintain a Secure Network", "Maintain a Vulnerability Management Program", "Implement Strong Access Control Measures", "Protect Cardholder Data"], "answer": [1], "explain": "Goal 3 is Maintain a Vulnerability Management Program, which covers using and regularly updating anti-virus software and developing and maintaining secure systems and applications.", "source": "Lecture 4 (CMA) slide 17", "flag": "", "kind": "lecture"}, {"id": "w07-049", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Under PCI DSS, which goal includes 'assign a unique ID to each person with computer access'?", "options": ["Implement Strong Access Control Measures", "Maintain an Information Security Policy", "Regularly Monitor and Test Networks", "Protect Cardholder Data"], "answer": [0], "explain": "Goal 4 is Implement Strong Access Control Measures. It covers restricting access to data by business need-to-know, assigning a unique ID to each person with computer access, and restricting physical access to cardholder data.", "source": "Lecture 4 (CMA) slide 18", "flag": "", "kind": "lecture"}, {"id": "w07-050", "week": 7, "topic": "Governance and Law", "type": "single", "q": "Which is NOT one of the six PCI DSS goals?", "options": ["Report all card data losses to the NCA", "Protect Cardholder Data", "Maintain an Information Security Policy", "Regularly Monitor and Test Networks", "Build and Maintain a Secure Network"], "answer": [0], "explain": "The six goals are a secure network, protecting cardholder data, a vulnerability management programme, strong access control, regularly monitoring and testing networks, and an information security policy.", "source": "Lecture 4 (CMA) slide 17-18", "flag": "", "kind": "lecture"}, {"id": "w07-051", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "What are the main challenges in prosecuting crimes under the CMA?", "options": ["Proving intent (S2) or malicious intent (S3)", "Proof that the defendant was the perpetrator", "Proving access (S1) was unauthorized", "Proof of offence (e.g. logs/audit trails) and that the computer was working properly", "Irrelevant technical detail baffling the judge or jury"], "answer": [0, 1, 2, 3, 4], "explain": "Slide 15 lists these problems in prosecuting.", "source": "Lecture 4 (CMA) slide 15", "flag": "", "kind": "lecture"}, {"id": "w07-052", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "What are the main challenges in prosecuting crimes under the CMA?", "options": ["Technical detail baffling a judge or jury", "Proving access (S1) was unauthorized", "Hacking is only an offence under the Data Protection Act", "Proof that the defendant was the perpetrator", "Section 1 carries no prison sentence", "Proving intent (S2) or malicious intent (S3)", "The Act only applies to US companies"], "answer": [0, 1, 3, 5], "explain": "The problems in prosecuting are proving unauthorised access, intent, the offence and logs, the perpetrator, and technical detail baffling a judge or jury.", "source": "Lecture 4 (CMA) slide 15", "flag": "", "kind": "lecture"}, {"id": "w07-053", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "PCI DSS sets out ways to:", "options": ["Securely transfer card holder data", "Prosecute card fraud offenders", "Report data breaches to the NCA", "Regulate US public companies", "Protect card holder data", "Monitor your own network"], "answer": [0, 4, 5], "explain": "PCI DSS sets out ways to protect card holder data, securely transfer card holder data and monitor your own network.", "source": "Lecture 4 (CMA) slide 16", "flag": "", "kind": "lecture"}, {"id": "w07-054", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which of the following are PCI DSS goals?", "options": ["Maintain an Information Security Policy", "Regularly Monitor and Test Networks", "Build and Maintain a Secure Network", "Protect Cardholder Data", "Maintain a Vulnerability Management Program", "Implement Strong Access Control Measures"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Slides 17-18 list these six goals.", "source": "Lecture 4 (CMA) slide 17-18", "flag": "", "kind": "lecture"}, {"id": "w07-055", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which of the following are PCI DSS goals?", "options": ["Regularly Monitor and Test Networks", "Protect Cardholder Data", "Maintain an Information Security Policy", "Maintain a Vulnerability Disclosure Hotline", "Outsource Card Processing", "Publish an Annual Breach Report", "Implement Strong Access Control Measures"], "answer": [0, 1, 2, 6], "explain": "The six goals are a secure network, protecting cardholder data, a vulnerability management programme, strong access control, regularly monitoring and testing, and an information security policy.", "source": "Lecture 4 (CMA) slide 17-18", "flag": "", "kind": "lecture"}, {"id": "w07-056", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Under PCI DSS 'Implement Strong Access Control Measures', which of the following apply?", "options": ["Restrict physical access to cardholder data", "Restrict access to data by business need-to-know", "Assign a unique ID to each person with computer access", "Use vendor-supplied defaults for system passwords", "Share one login among a team", "Store cardholder data unencrypted"], "answer": [0, 1, 2], "explain": "Goal 4, Implement Strong Access Control Measures, covers need-to-know access, a unique ID, and restricting physical access.", "source": "Lecture 4 (CMA) slide 18", "flag": "", "kind": "lecture"}, {"id": "w07-057", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Under PCI DSS 'Protect Cardholder Data' and 'Build and Maintain a Secure Network', which of the following apply?", "options": ["Do not use vendor-supplied defaults for system passwords and other security parameters", "Protect stored data (use encryption)", "Install and maintain a firewall configuration to protect data", "Use vendor-supplied defaults for system passwords", "Encrypt transmission of cardholder data and sensitive information across public net", "Send cardholder data in plain text across public networks"], "answer": [0, 1, 2, 4], "explain": "Goals 1 and 2 on slide 17.", "source": "Lecture 4 (CMA) slide 17", "flag": "", "kind": "lecture"}, {"id": "w07-058", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which of the following are cyber-enabled crimes?", "options": ["Cyberstalking", "Developing and propagating malware", "Defacing a website", "Denial of service (DoS)", "Piracy", "Fraud", "Online grooming"], "answer": [0, 4, 5, 6], "explain": "Cyber-enabled crime covers economic crime such as fraud, piracy, IP theft and forgery, cyberstalking, and child sexual offences such as illicit images and online grooming. DoS, defacing and malware are cyber-dependent.", "source": "Lecture 4 (CMA) slide 8-9", "flag": "", "kind": "lecture"}, {"id": "w07-059", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which of the following are examples of cyber-dependent crime?", "options": ["Cyberstalking", "Hacking", "Defacing a website", "DoS", "Cyberbullying", "Forgery", "Malware"], "answer": [1, 2, 3, 6], "explain": "Cyber-dependent crimes are hacking, defacing a website, DoS and malware.", "source": "Lecture 4 (CMA) slide 8", "flag": "", "kind": "lecture"}, {"id": "w07-060", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which of the following are listed as cyber-enabled crime?", "options": ["Economic crime - fraud, piracy, IP theft, forgery", "Extreme publications - pornography", "Offensive communication - cyberbullying, social media", "Child sexual offences - illicit images, online grooming", "Offenses against a specific target - cyberstalking", "Online marketplaces for illegal items - drugs, guns, slaves"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Slide 9 lists these six categories of crime transformed by technology.", "source": "Lecture 4 (CMA) slide 9", "flag": "", "kind": "lecture"}, {"id": "w07-061", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which statements about penetration testing under CMA 1990 are correct?", "options": ["It can use hardware/software hacking, social engineering or any mix", "It needs an authorisation letter from a genuine high level manager who has the authority to give it", "No authorisation is needed if the tester is a reputable company", "Only a VERY limited number of people in the organisation need to know", "It is where an AUTHORISED person attempts to gain access to a computer system or data", "It can prove that a system is safe", "Everyone in the organisation must be told in advance"], "answer": [0, 1, 3, 4], "explain": "Pen testing uses an authorised person and cannot \"PROVE\" a system safe. It can use hardware, software or social engineering, only a very limited number of people need to know, it needs an authorisation letter, and you should use a reputable organisation.", "source": "Lecture 4 (CMA) slide 14", "flag": "", "kind": "lecture"}, {"id": "w07-062", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which statements about penetration testing are correct?", "options": ["It is lawful whenever the tester intends no harm", "The tester must have an authorisation letter and be present to verify it", "It is important to use a reputable organisation (e.g. your auditor?)", "A penetration test cannot 'PROVE' a system safe", "A passed test proves the system is secure", "The authorisation can come from any employee"], "answer": [1, 2, 3], "explain": "The authorisation letter comes from a genuine high level manager, and the tester must be present to verify it. Use a reputable organisation, and remember a test cannot \"PROVE\" a system safe.", "source": "Lecture 4 (CMA) slide 14", "flag": "", "kind": "lecture"}, {"id": "w07-063", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which of the following bodies are listed as professional bodies in the cyber security lecture?", "options": ["NIST", "GCHQ", "OWASP", "National Cyber Security Centre (NCSC)", "Information Commissioner's Office (ICO)", "National Cyber Crime Unit (NCCU)", "CREST"], "answer": [0, 1, 2, 3, 4, 5, 6], "explain": "Slides 22-25 list NCCU, GCHQ, NCSC, ICO, NIST, OWASP and CREST as professional bodies.", "source": "Lecture 4 (CMA) slide 22-25", "flag": "", "kind": "lecture"}, {"id": "w07-064", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which professional bodies are responsible to prevent cyber threat and reduce cybercrime in the UK?", "options": ["GCHQ", "National Cyber Security Centre (NCSC)", "OWASP", "The PCI Security Council", "National Cyber Crime Unit (NCCU)", "NIST"], "answer": [0, 1, 4], "explain": "The NCCU responds to threats and reduces cyber crime. GCHQ protects the UK and defends Government systems. The NCSC protects UK critical services. NIST is a US agency, and OWASP supports application security.", "source": "Lecture 4 (CMA) slide 22-25", "flag": "", "kind": "lecture"}, {"id": "w07-065", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "What is the job of the National Cyber Security Centre (NCSC)?", "options": ["Improve the security of the UK Internet", "Manage major incidents", "Protect UK critical services from cyber attacks", "Respond to threats as the police", "Report a DPA/GDPR breach", "Defend Government systems from cyber threat"], "answer": [0, 1, 2], "explain": "The NCSC's job is to protect UK critical services from cyber attacks, manage major incidents and improve the security of the UK Internet.", "source": "Lecture 4 (CMA) slide 23", "flag": "", "kind": "lecture"}, {"id": "w07-066", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "What is the job of GCHQ?", "options": ["Manage major incidents", "Improve the security of the UK Internet", "Defend Government systems from cyber threat", "Collaborate with partners to reduce cyber crime", "Protect the UK (with law enforcement and other intelligence agencies)", "Test and set standards for technology"], "answer": [2, 4], "explain": "GCHQ protects the UK and defends Government systems from cyber threat. The other items belong to NCSC and NCCU.", "source": "Lecture 4 (CMA) slide 23", "flag": "", "kind": "lecture"}, {"id": "w07-067", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which statements about the National Cyber Crime Unit are correct?", "options": ["It is an independent authority for DPA/GDPR breaches", "They work with Regional Organised Crime Units (ROCUs)", "It is part of the National Crime Agency (NCA)", "They are the police", "It is part of GCHQ", "Its job is to respond to threats and collaborate with partners to reduce cyber crime"], "answer": [1, 2, 3, 5], "explain": "The National Cyber Crime Unit is the police, is part of the NCA, works with ROCUs, responds to threats and collaborates with partners.", "source": "Lecture 4 (CMA) slide 22", "flag": "", "kind": "lecture"}, {"id": "w07-068", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which statements about NIST are correct?", "options": ["It tests and sets standards for technology including security", "It is part of the National Crime Agency", "It stands for National Institute for Standards and Technology", "It is a non-regulatory US agency", "It is a UK independent authority"], "answer": [0, 2, 3], "explain": "NIST is a non-regulatory US agency that tests and sets standards for technology including security.", "source": "Lecture 4 (CMA) slide 24", "flag": "", "kind": "lecture"}, {"id": "w07-069", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which bodies are listed as offering research, pen-testing and education?", "options": ["OWASP", "NCSC", "CREST", "ICO", "GCHQ", "NIST"], "answer": [0, 2], "explain": "OWASP does research, pen-testing and education. CREST does research, pen-testing and education, with \"CyberEssentials\".", "source": "Lecture 4 (CMA) slide 25", "flag": "", "kind": "lecture"}, {"id": "w07-070", "week": 7, "topic": "Cyber Security Bodies", "type": "multi", "q": "Which statements about OWASP and CREST are correct?", "options": ["OWASP is a global not-for-profit supporting application security", "CREST is a not-for-profit representing the information security industry", "OWASP is a US regulatory agency", "Both offer research, pen-testing and education", "CREST is a UK police unit"], "answer": [0, 1, 3], "explain": "OWASP and CREST are both not-for-profit with research, pen-testing, education.", "source": "Lecture 4 (CMA) slide 25", "flag": "", "kind": "lecture"}, {"id": "w07-071", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "'Hacking' may also be an offence against which of the following?", "options": ["Data Protection Act 1998 [some civil + some criminal offences]", "Other legislation and/or contract of employment", "EuroSOX", "Computer Misuse Act 1990 [criminal]", "Sarbanes Oxley", "PCI DSS"], "answer": [0, 1, 3], "explain": "'Hacking' may also be an offence against the CMA 1990, the DPA 1998, other legislation and/or contract of employment.", "source": "Lecture 4 (CMA) slide 11", "flag": "", "kind": "lecture"}, {"id": "w07-072", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which laws are listed against cyber-dependent crimes?", "options": ["PCI DSS", "Computer Misuse Act 1990", "Regulation of Investigation Powers Act 2000", "Sarbanes Oxley", "Data Protection Act 1998", "Fraud Act 2006"], "answer": [1, 2, 4], "explain": "Cyber-dependent crimes slide lists these three Acts.", "source": "Lecture 4 (CMA) slide 8", "flag": "", "kind": "lecture"}, {"id": "w07-073", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which penalty statements for CMA 1990 offences are correct?", "options": ["S1 was previously 6 months", "S2: fine and/or 10 years prison", "S3: fine and/or 5 years prison", "S3: fine and/or 10 years prison", "S2: fine and/or 5 years prison", "S1: fine and/or 2 years prison"], "answer": [0, 3, 4, 5], "explain": "Slide 12 gives penalties of 2 years for S1, previously 6 months, 5 years for S2 and 10 years for S3.", "source": "Lecture 4 (CMA) slide 12", "flag": "", "kind": "lecture"}, {"id": "w07-074", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which statements comparing ethics and law are correct?", "options": ["Laws carry the authority of a governing body", "Laws are rules that mandate or prohibit certain behaviour", "Ethics can be universal, laws tend to be local", "Ethics come from moral attitudes or customs", "Ethics define socially acceptable behaviours"], "answer": [0, 1, 2, 3, 4], "explain": "All statements are from slide 4.", "source": "Lecture 4 (CMA) slide 4", "flag": "", "kind": "lecture"}, {"id": "w07-075", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which statements comparing ethics and law are correct?", "options": ["Laws are drawn from ethics", "Laws are not drawn from ethics", "Laws carry the authority of a governing body", "Ethics come from moral attitudes or customs", "Laws come from moral attitudes or customs", "Ethics carry the authority of a governing body"], "answer": [0, 2, 3], "explain": "Laws are drawn from ethics and carry the authority of a governing body, and ethics come from moral attitudes or customs.", "source": "Lecture 4 (CMA) slide 4", "flag": "", "kind": "lecture"}, {"id": "w07-076", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which statements about terms and conditions (T&Cs) are correct?", "options": ["They protect a company's copyright or licenses", "They outline user expectations", "They outline company expectations", "They are legally binding", "They set out fair use of the product"], "answer": [0, 1, 2, 3, 4], "explain": "T&Cs protect a company through fair use of the product, protection of copyright or licenses, and outlining user and company expectations. T&Cs are legally binding.", "source": "Lecture 4 (CMA) slide 21", "flag": "", "kind": "lecture"}, {"id": "w07-077", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Why does a software developer need to care about computer law?", "options": ["You may need to advise others as to what is legal (or illegal)", "You may need to incorporate (or omit) features such as 'authorised users only' at login", "Because developers are exempt from the Computer Misuse Act", "Because only lawyers are bound by computer law", "You may need to incorporate appropriate security and audit trails", "You may need to seek further advice (and understand that advice)"], "answer": [0, 1, 4, 5], "explain": "Computer law matters because you may need to incorporate or omit features, add security and audit trails, advise others and seek further advice.", "source": "Lecture 4 (CMA) slide 26", "flag": "", "kind": "lecture"}, {"id": "w07-078", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which statements about Sarbanes Oxley (SOX) are correct?", "options": ["Company directors must provide the correct information to auditors", "EuroSOX is the EU equivalent", "US public companies must establish 'hotlines' to enable employees to anonymously raise concerns about accounting or audit irregularities", "It sets standards for storing card holder data", "It is the UK law criminalising hacking"], "answer": [0, 1, 2], "explain": "SOX requires hotlines and requires directors to give correct information to auditors. EuroSOX is the EU equivalent.", "source": "Lecture 4 (CMA) slide 20", "flag": "", "kind": "lecture"}, {"id": "w07-079", "week": 7, "topic": "Governance and Law", "type": "multi", "q": "Which statements about PCI DSS compliance are correct?", "options": ["Only large merchants must comply", "A merchant of any size that accepts credit cards must comply with PCI Security Council standards", "If you lose card data you must declare it to the ICO", "Lost card data must be reported to the NCA", "Compliance is the responsibility of the third party processor only", "Compliant means you are doing your best to keep customer's data safe, regardless of whether a third party processes it"], "answer": [1, 2, 5], "explain": "PCI DSS slides 16 and 19.", "source": "Lecture 4 (CMA) slide 16, 19", "flag": "", "kind": "lecture"}, {"id": "w07-080", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which statements about hacker types are correct?", "options": ["Black hat attackers are authorised to test systems", "Black hat attackers are unethical criminals who violate security for personal gain or malicious reasons", "Gray hat attackers always report vulnerabilities", "Gray hat attackers are somewhere between white and black hat attackers", "White hat attackers break into systems to discover weaknesses in order to improve security", "White hat attackers attack networks for personal gain"], "answer": [1, 3, 4], "explain": "Slide 13.", "source": "Lecture 4 (CMA) slide 13", "flag": "", "kind": "lecture"}, {"id": "w07-081", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which statements about the Computer Misuse Act 1990 section scope are correct?", "options": ["Section 3ZA covers unauthorised acts causing, or creating risk of, serious damage", "Section 1 covers unauthorised access to computer material", "Section 1 covers acts causing serious damage", "Section 3A covers making, supplying or obtaining articles for use in an offence under section 1, 2, 3 or 3ZA", "Section 2 covers unauthorised access with intent to commit or facilitate further offences", "Section 3 covers making articles for use in offences"], "answer": [0, 1, 3, 4], "explain": "Slide 10 section list.", "source": "Lecture 4 (CMA) slide 10", "flag": "", "kind": "lecture"}, {"id": "w07-082", "week": 7, "topic": "Computer Misuse", "type": "multi", "q": "Which statements about cybercrime are correct?", "options": ["Cyber-dependent crimes can be committed only through the use of ICT devices", "It describes two closely linked but distinct criminal activities", "Cyber-enabled crimes can be committed only through ICT devices", "Cyber-enabled crimes are traditional crimes increased in scale or reach by ICT", "Cyber-dependent crimes are traditional crimes increased in reach by ICT"], "answer": [0, 1, 3], "explain": "Cybercrime is cyber-dependent crime plus cyber-enabled crime, according to the UK Government in 2016.", "source": "Lecture 4 (CMA) slide 7", "flag": "", "kind": "lecture"}, {"id": "w09-001", "week": 9, "topic": "Professionalism", "type": "single", "q": "In what year was the BCS (British Computer Society) founded?", "options": ["1957", "2006", "1947", "1946"], "answer": [0], "explain": "The BCS, the British Computer Society, was founded in 1957 and has approximately 100,000 members.", "source": "Lecture 9 (Professionalism) slide 13", "flag": "", "kind": "lecture"}, {"id": "w09-002", "week": 9, "topic": "Professionalism", "type": "single", "q": "In what year was the IET (Institution of Engineering and Technology) founded, according to the slides?", "options": ["1947", "1957", "2006", "1946"], "answer": [2], "explain": "The IET was founded in 2006 and has approximately 150,000 members.", "source": "Lecture 9 (Professionalism) slide 13", "flag": "In reality the IET took its current name in 2006 from earlier bodies. Follow the slide.", "kind": "lecture"}, {"id": "w09-003", "week": 9, "topic": "Professionalism", "type": "single", "q": "Approximately how many members does the IET have, according to the slides?", "options": ["150,000", "50,000", "100,000", "75,000"], "answer": [0], "explain": "The IET was founded in 2006 and has approximately 150,000 members.", "source": "Lecture 9 (Professionalism) slide 13", "flag": "", "kind": "lecture"}, {"id": "w09-004", "week": 9, "topic": "Professionalism", "type": "single", "q": "Approximately how many members does the BCS have, according to the slides?", "options": ["75,000", "150,000", "100,000", "200,000"], "answer": [2], "explain": "The BCS was founded in 1957 and has approximately 100,000 members.", "source": "Lecture 9 (Professionalism) slide 13", "flag": "", "kind": "lecture"}, {"id": "w09-005", "week": 9, "topic": "Professionalism", "type": "single", "q": "In what year was the IEEE founded, according to the slides?", "options": ["1947", "1946", "1957", "2006"], "answer": [1], "explain": "The IEEE was founded in 1946 and has over 100,000 members.", "source": "Lecture 9 (Professionalism) slide 15", "flag": "The slide says the IEEE was founded in 1946, and the real-world founding date differs. Follow the slide.", "kind": "lecture"}, {"id": "w09-006", "week": 9, "topic": "Professionalism", "type": "single", "q": "In what year was the ACM founded, according to the slides, and about how many members does it have?", "options": ["1946, approx. 75,000 members", "1947, approx. 150,000 members", "1947, approx. 75,000 members", "1957, over 100,000 members"], "answer": [2], "explain": "The ACM was founded in 1947 and has approximately 75,000 members.", "source": "Lecture 9 (Professionalism) slide 15", "flag": "", "kind": "lecture"}, {"id": "w09-007", "week": 9, "topic": "Professionalism", "type": "single", "q": "What does ACM stand for, as written on the slide?", "options": ["American Council of Machinists", "Association of Computer Machinery", "Association of Computing Managers", "Academy of Computing Methods"], "answer": [1], "explain": "The slide writes ACM as Association of Computer Machinery.", "source": "Lecture 9 (Professionalism) slide 15", "flag": "The real name is Association for Computing Machinery, and the slide wording is used here.", "kind": "lecture"}, {"id": "w09-008", "week": 9, "topic": "Professionalism", "type": "single", "q": "What does IEEE stand for, as written on the slide?", "options": ["International Electronics and Engineering Experts", "Institution of Engineering and Technology", "Institute for Embedded and Electronic Engineering", "Institute for Electrical and Electronic Engineers"], "answer": [3], "explain": "The slide writes IEEE as Institute for Electrical and Electronic Engineers.", "source": "Lecture 9 (Professionalism) slide 15", "flag": "", "kind": "lecture"}, {"id": "w09-009", "week": 9, "topic": "Professionalism", "type": "single", "q": "What does CPD stand for in the context of protecting yourself as a professional?", "options": ["Core Practice Documentation", "Continuous Public Duty", "Continuing Professional Development", "Certified Professional Diploma"], "answer": [2], "explain": "Slide 16 refers to support for Continuing Professional Development, and slide 12 lists CPD as a way to protect yourself as a professional.", "source": "Lecture 9 (Professionalism) slide 12, 16", "flag": "", "kind": "lecture"}, {"id": "w09-010", "week": 9, "topic": "Professionalism", "type": "single", "q": "How does the lecture define professionalism?", "options": ["Having a legal duty to act in an emergency", "Holding letters after your name", "Maintaining an ethical approach to one's job within the structure of an association", "Charging more for specialist skills"], "answer": [2], "explain": "Professionalism is maintaining an ethical approach to one's job within the structure of an association, according to Adams and McCrindle in 2008.", "source": "Lecture 9 (Professionalism) slide 8", "flag": "", "kind": "lecture"}, {"id": "w09-011", "week": 9, "topic": "Professionalism", "type": "single", "q": "Who said: 'The public are entitled to expect that the same professional disciplines apply in IT as in other professions such as medicine and law'?", "options": ["Adams and McCrindle", "The ACM President", "Roger Johnson, BCS President", "Bott"], "answer": [2], "explain": "Quote attributed to Roger Johnson, BCS President.", "source": "Lecture 9 (Professionalism) slide 11", "flag": "", "kind": "lecture"}, {"id": "w09-012", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which of the following is named as a way to protect yourself as a professional?", "options": ["Professional indemnity insurance", "A signed code of ethics", "Membership of a trade union", "Public liability insurance only"], "answer": [0], "explain": "To protect yourself as a professional, the slides give professional indemnity insurance and CPD.", "source": "Lecture 9 (Professionalism) slide 12", "flag": "", "kind": "lecture"}, {"id": "w09-013", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which of the following is listed by Bott (2014) as a profession?", "options": ["Electricians", "Plumbers", "Builders", "Architects"], "answer": [3], "explain": "Bott in 2014 describes professions as including doctors, lawyers, accountants, architects and IT professionals. Trades are posed as a question on slide 4.", "source": "Lecture 9 (Professionalism) slide 3-4", "flag": "", "kind": "lecture"}, {"id": "w09-014", "week": 9, "topic": "Professionalism", "type": "single", "q": "According to Bott's common features of professions, who decides the nature of training and controls entry to the profession?", "options": ["Universities", "The professional bodies themselves", "Employers", "The government"], "answer": [1], "explain": "The professional bodies themselves decide the nature of training and control entry to the profession.", "source": "Lecture 9 (Professionalism) slide 3", "flag": "", "kind": "lecture"}, {"id": "w09-015", "week": 9, "topic": "Professionalism", "type": "single", "q": "How many main sections does the BCS Code of Conduct have on the slides?", "options": ["Seven", "Five", "Four", "Three"], "answer": [2], "explain": "1 Public Interest, 2 Professional Competence and Integrity, 3 Duty to Relevant Authority, 4 Duty to the Profession.", "source": "Lecture 9 (Professionalism) slide 18-21", "flag": "", "kind": "lecture"}, {"id": "w09-016", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which BCS Code of Conduct section covers 'accept professional responsibility for your work'?", "options": ["Duty to the Profession", "Public Interest", "Duty to Relevant Authority", "Professional Competence and Integrity"], "answer": [2], "explain": "Section 3, Duty to Relevant Authority, includes accepting professional responsibility for your work.", "source": "Lecture 9 (Professionalism) slide 20", "flag": "", "kind": "lecture"}, {"id": "w09-017", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which BCS Code of Conduct section covers 'reject and will not make any offer of bribery or unethical inducement'?", "options": ["Duty to Relevant Authority", "Professional Competence and Integrity", "Public Interest", "Duty to the Profession"], "answer": [1], "explain": "Section 2, Professional Competence and Integrity, includes rejecting and not making any offer of bribery or unethical inducement.", "source": "Lecture 9 (Professionalism) slide 19", "flag": "", "kind": "lecture"}, {"id": "w09-018", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which BCS Code of Conduct section covers 'promote equal access to the benefits of IT'?", "options": ["Public Interest", "Professional Competence and Integrity", "Duty to the Profession", "Duty to Relevant Authority"], "answer": [0], "explain": "Section 1, Public Interest, includes promoting equal access to the benefits of IT.", "source": "Lecture 9 (Professionalism) slide 18", "flag": "", "kind": "lecture"}, {"id": "w09-019", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which BCS Code of Conduct section covers 'uphold the reputation and good standing of BCS'?", "options": ["Professional Competence and Integrity", "Public Interest", "Duty to the Profession", "Duty to Relevant Authority"], "answer": [2], "explain": "Section 4, Duty to the Profession, includes upholding the reputation and good standing of BCS, the Chartered Institute for IT.", "source": "Lecture 9 (Professionalism) slide 21", "flag": "", "kind": "lecture"}, {"id": "w09-020", "week": 9, "topic": "Professionalism", "type": "single", "q": "To whom does the BCS Code of Conduct apply?", "options": ["All members, irrespective of their membership grade", "Only members working in the UK", "Chartered members only", "Graduate members only"], "answer": [0], "explain": "Applies to all members, irrespective of their membership grade.", "source": "Lecture 9 (Professionalism) slide 17", "flag": "", "kind": "lecture"}, {"id": "w09-021", "week": 9, "topic": "Professionalism", "type": "single", "q": "Under the BCS Code of Conduct, when may you disclose confidential information?", "options": ["Whenever it brings personal gain", "Whenever it helps a colleague", "With the permission of your Authority, or as required by Legislation", "Whenever the public asks for it"], "answer": [2], "explain": "You shall NOT disclose, or use for personal gain, confidential information except with the permission of your Authority, or as required by Legislation.", "source": "Lecture 9 (Professionalism) slide 20", "flag": "", "kind": "lecture"}, {"id": "w09-022", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which of the following is NOT something that defines a professional body?", "options": ["Issuing a Code of Conduct, or ethics", "Setting the price of its members' services", "Professional examinations", "Dealing with complaints against professionals", "Advising governments and regulatory bodies"], "answer": [1], "explain": "Slide 16 lists the defining features, and setting prices is not among them.", "source": "Lecture 9 (Professionalism) slide 16", "flag": "", "kind": "lecture"}, {"id": "w09-023", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which body is described as a 'not-for-profit charity that promotes web security'?", "options": ["IEEE", "OWASP", "CISCO", "CREST"], "answer": [1], "explain": "OWASP is a not-for-profit charity that promotes web security.", "source": "Lecture 9 (Professionalism) slide 24", "flag": "", "kind": "lecture"}, {"id": "w09-024", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which body is described as an 'International not-for-profit accreditation and certification body'?", "options": ["OWASP", "CISCO", "ACM", "CREST"], "answer": [3], "explain": "CREST is an international not-for-profit accreditation and certification body.", "source": "Lecture 9 (Professionalism) slide 24", "flag": "", "kind": "lecture"}, {"id": "w09-025", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which body is described as a 'manufacturer and certification body'?", "options": ["CISCO", "CREST", "OWASP", "BCS"], "answer": [0], "explain": "CISCO is a manufacturer and certification body.", "source": "Lecture 9 (Professionalism) slide 24", "flag": "", "kind": "lecture"}, {"id": "w09-026", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which ACM Code of Ethics item says to 'access computing and communication resources only when authorized or when compelled by the public good'?", "options": ["Professional responsibilities", "BCS Duty to the Profession", "BCS Public Interest", "General ethical principles"], "answer": [0], "explain": "Under the ACM professional responsibilities, you access computing and communication resources only when authorized or when compelled by the public good.", "source": "Lecture 9 (Professionalism) slide 23", "flag": "", "kind": "lecture"}, {"id": "w09-027", "week": 9, "topic": "Professionalism", "type": "single", "q": "Which ACM Code of Ethics item is a general ethical principle (rather than a professional responsibility)?", "options": ["Accept and provide appropriate professional review", "Avoid harm", "Design and implement systems that are robustly and usably secure", "Perform work only in areas of competence"], "answer": [1], "explain": "General ethical principles include \"Avoid harm\". The other options are professional responsibilities.", "source": "Lecture 9 (Professionalism) slide 22-23", "flag": "", "kind": "lecture"}, {"id": "w09-028", "week": 9, "topic": "Professionalism", "type": "single", "q": "Under the BCS Code of Conduct, you shall NOT:", "options": ["Seek, accept and offer honest criticisms of work", "Claim any level of competence that you do not possess", "Develop your knowledge on a continuing basis", "Comply with Legislation relevant to your work"], "answer": [1], "explain": "NOT claim any level of competence that you do not possess.", "source": "Lecture 9 (Professionalism) slide 19", "flag": "", "kind": "lecture"}, {"id": "w09-029", "week": 9, "topic": "Professionalism", "type": "single", "q": "According to the slides, which is the closing guidance on health and safety?", "options": ["Always follow every rule literally", "Leave it to the Authority", "Common sense should prevail", "Health and safety is optional for IT professionals"], "answer": [2], "explain": "The Health and Safety slide ends with \"Common sense should prevail\".", "source": "Lecture 9 (Professionalism) slide 25", "flag": "", "kind": "lecture"}, {"id": "w09-030", "week": 9, "topic": "Professionalism", "type": "multi", "q": "According to Bott (2014), what do professions have in common?", "options": ["Government decides who may enter the profession", "The profession is organised into one or more professional bodies", "Members are paid above the national average", "Members are expected to conduct activities in accordance with codes of conduct laid out by the professional bodies", "The professional bodies decide the nature of training and control entry to the profession", "Substantial education and training in order to practise"], "answer": [1, 3, 4, 5], "explain": "Slide 3 lists the four things in common.", "source": "Lecture 9 (Professionalism) slide 3", "flag": "", "kind": "lecture"}, {"id": "w09-031", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following make a job a profession?", "options": ["Job related certifications or examinations", "Skills are 'important' to society", "Agreed body of shared knowledge", "Membership of an overseeing body to be able to practice", "Skills are in short supply, or difficult to obtain", "Self regulation"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Slide 8 lists these six.", "source": "Lecture 9 (Professionalism) slide 8", "flag": "", "kind": "lecture"}, {"id": "w09-032", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following make a job a profession?", "options": ["A degree in computer science", "A high salary", "Job related certifications or examinations", "Working for a large company", "Agreed body of shared knowledge", "Self regulation"], "answer": [2, 4, 5], "explain": "Slide 8 lists self regulation, an agreed body of shared knowledge, and certifications or examinations.", "source": "Lecture 9 (Professionalism) slide 8", "flag": "", "kind": "lecture"}, {"id": "w09-033", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which of the following are listed as results of having a profession?", "options": ["Improved confidence of the public", "Safer supply of service to the public", "Guaranteed employment", "Title (e.g. 'Dr' or letters after name)", "Can charge more", "Exemption from legal duties"], "answer": [0, 1, 3, 4], "explain": "Slide 9 lists these, posed as questions.", "source": "Lecture 9 (Professionalism) slide 9", "flag": "", "kind": "lecture"}, {"id": "w09-034", "week": 9, "topic": "Professionalism", "type": "multi", "q": "What defines a professional body?", "options": ["Writing legislation", "Setting national salaries", "Support for Continuing Professional Development", "Professional examinations", "Dealing with complaints against professionals and implementing disciplinary procedures", "Advising governments and regulatory bodies", "Issuing a Code of Conduct, or ethics, to guide professional behaviour"], "answer": [2, 3, 4, 5, 6], "explain": "Slide 16.", "source": "Lecture 9 (Professionalism) slide 16", "flag": "", "kind": "lecture"}, {"id": "w09-035", "week": 9, "topic": "Professionalism", "type": "multi", "q": "What defines a professional body?", "options": ["Publish professional journals or magazines", "Provide professional networks to meet and discuss their field", "Run the courts", "Enable fairer access to the professions", "Lobby for lower taxes", "Fix prices for services", "Provide careers support and opportunities for students, graduates and people already working"], "answer": [0, 1, 3, 6], "explain": "Slide 16.", "source": "Lecture 9 (Professionalism) slide 16", "flag": "", "kind": "lecture"}, {"id": "w09-036", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Which statements about the BCS Code of Conduct are correct?", "options": ["It governs the conduct of employers", "It sets the professional standards required as a condition of membership", "It applies only to chartered members", "It applies to all members, irrespective of their membership grade", "It governs the conduct of the individual"], "answer": [1, 3, 4], "explain": "The BCS Code of Conduct, from The Chartered Institute for IT, is on slide 17.", "source": "Lecture 9 (Professionalism) slide 17", "flag": "", "kind": "lecture"}, {"id": "w09-037", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Under 'Public Interest', what shall a BCS member do?", "options": ["Have due regard for public health, privacy, security and wellbeing of others and the environment", "Promote equal access to the benefits of IT", "Only undertake work within professional competence", "Seek to avoid conflict of interest with their Authority", "Have due regard for the legitimate rights of Third Parties", "Conduct professional activities without discrimination"], "answer": [0, 1, 4, 5], "explain": "Slide 18. The last two belong to other sections.", "source": "Lecture 9 (Professionalism) slide 18", "flag": "", "kind": "lecture"}, {"id": "w09-038", "week": 9, "topic": "Professionalism", "type": "multi", "q": "Under 'Professional Competence and Integrity', what shall a BCS member do?", "options":

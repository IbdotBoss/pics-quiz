  <div class="top"><button class="l" id="quit">${r.exam ? "Save and leave" : "Leave"}</button><b>${esc(r.title)}</b>${r.limit ? `<span class="timer" id="tm" role="timer" aria-label="Time left"></span>` : `<span class="s">${r.i + 1} of ${n}</span>`}</div>
  <fieldset>
    <legend>
      <span class="qn"><span class="cond">Question ${r.i + 1}${r.limit ? ` <span class="s" style="font-stretch:100%;font-weight:400">of ${n}</span>` : ""}</span><span>${checked ? `${good ? marks(q) : 0} of ${marks(q)}` : `(${marks(q)} marks)`}</span></span>
      <span class="s" style="display:block;font-stretch:100%;font-weight:400">${multi ? "More than one answer is correct. Choose ALL of them." : "Choose ONE answer."}</span>
      <span class="stem" style="display:block">${esc(q.q)}</span>
    </legend>
    ${opts}
  </fieldset>
  ${checked ? `<div role="status">${feedback(q)}</div>` : ""}
  <div class="nav">
    <button id="prev" ${r.i ? "" : "disabled"}>Previous</button>
    ${r.exam ? (r.i < n - 1 ? `<button class="p" id="next">Next</button>` : `<button class="p" id="fin">Hand in</button>`)
      : (checked ? `<button class="p" id="next">${r.i < n - 1 ? "Next" : "See marks"}</button>` : `<button class="p" id="chk" ${picked.length ? "" : "disabled"}>Mark it</button>`)}
  </div>
  ${r.exam ? `<details ${n > 40 ? "" : "open"}><summary>Go to a question. ${answered} of ${n} answered.</summary><div class="grid">${r.ids.map((id, i) => `<button data-i="${i}" class="${(r.ans[id] || []).length ? "done" : ""} ${i === r.i ? "cur" : ""}" aria-label="Question ${i + 1}, ${(r.ans[id] || []).length ? "answered" : "not answered"}"${i === r.i ? ' aria-current="true"' : ""}>${i + 1}</button>`).join("")}</div><button id="fin2">Hand in</button></details>` : ""}`;
  app.querySelectorAll("input[name=o]").forEach(e => e.onchange = () => {
    r.ans[q.id] = [...app.querySelectorAll("input[name=o]:checked")].map(x => +x.value); save();
    const c = document.getElementById("chk"); if (c) c.disabled = !r.ans[q.id].length;
  });
  focusOn(checked ? ".note" : "legend");
  const go = i => { r.i = i; save(); question(); window.scrollTo(0, 0); };
  on("quit", () => { if (!r.exam) { r.done = true; st.run = null; save(); } home(); });
  on("prev", () => go(r.i - 1));
  on("next", () => r.i < n - 1 ? go(r.i + 1) : finish());
  on("chk", () => { r.checked[q.id] = true; record(q, same(r.ans[q.id] || [], q.answer)); save(); question(); });
  const fin = () => { const left = r.ids.filter(id => !(r.ans[id] || []).length).length; if (!left || confirm(left + (left === 1 ? " question is" : " questions are") + " not answered. Hand in anyway? You cannot change answers afterwards.")) finish(); };
  on("fin", fin); on("fin2", fin);
  app.querySelectorAll(".grid button").forEach(b => b.onclick = () => go(+b.dataset.i));
  if (r.limit) {
    const tm = document.getElementById("tm");
    const upd = () => { const s = timeLeft(); tm.textContent = fmt(s) + " left"; tm.classList.toggle("low", s < 300); if (!s) { clearInterval(tick); finish(); } };
    upd(); tick = setInterval(upd, 1000);
  }
}

function record(q, ok) {
  st.seen[q.id] = (st.seen[q.id] || 0) + 1;
  if (ok) delete st.wrong[q.id]; else st.wrong[q.id] = 1;
}

function finish() {
  clearInterval(tick);
  const r = st.run; let score = 0, total = 0;
  r.ids.forEach(id => { const q = BYID[id], ok = same(r.ans[id] || [], q.answer); total += marks(q); if (ok) score += marks(q); if (r.exam) record(q, ok); });
  r.done = true; r.score = score; r.total = total; r.took = Math.floor((Date.now() - r.t0) / 1000);
  st.hist.push({title:r.title, score, total, at:Date.now()}); st.hist = st.hist.slice(-30);
  save(); results(); window.scrollTo(0, 0);
}

function results() {
  const r = st.run, by = {}, past = r.ids.some(id => BYID[id].week === 0);
  r.ids.forEach(id => { const q = BYID[id], k = q.week === 0 ? q.topic : (WEEKS[q.week] || q.week), ok = same(r.ans[id] || [], q.answer); by[k] = by[k] || [0, 0]; by[k][1]++; if (ok) by[k][0]++; });
  const right = r.ids.filter(id => same(r.ans[id] || [], BYID[id].answer)).length;
  const areas = Object.entries(by).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]);
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button><b>${esc(r.title)}</b><span></span></div>
  <h1 style="margin-top:20px">Your mark</h1>
  <div class="score"><span class="n" aria-hidden="true">${r.score}<svg viewBox="0 0 120 90" preserveAspectRatio="none"><path class="red" style="stroke-width:2.2" vector-effect="non-scaling-stroke" d="M62 6C96 3 116 22 114 46C112 72 84 86 54 84C24 82 4 66 6 42C8 20 34 6 70 8"/></svg></span>
  <p><b>${r.score} out of ${r.total}.</b> ${right} of ${r.ids.length} questions right in ${fmt(r.took)}${r.limit && r.took >= r.limit ? ". Time ran out" : ""}.</p></div>
  <h2>By ${past ? "topic" : "week"}</h2>
  <table><tr><th scope="col">${past ? "Topic" : "Week"}</th><th scope="col" class="num">Right</th></tr>${areas.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v[0]} of ${v[1]}</td></tr>`).join("")}</table>
  <h2>Marked paper</h2><button id="only">Show wrong answers only</button><div id="rev"></div>`;
  const draw = wrongOnly => {
    document.getElementById("rev").innerHTML = r.ids.map((id, i) => {
      const q = BYID[id], pk = r.ans[id] || [], ok = same(pk, q.answer);
      if (wrongOnly && ok) return "";
      return `<div class="rev"><div class="qn"><span class="cond">Question ${i + 1}</span><span>${ok ? marks(q) : 0} of ${marks(q)}${pk.length ? "" : ", not answered"}</span></div><p class="stem">${esc(q.q)}</p>
      ${r.order[id].map((k, j) => row(q, k, j, pk.includes(k), "checkbox", stateOf(q, k, pk), true)).join("")}${feedback(q)}</div>`;
    }).join("") || "<p>No wrong answers in this paper.</p>";
  };
  let wo = false; draw(wo); focusOn("h1");
  on("only", e => { wo = !wo; e.target.textContent = wo ? "Show every question" : "Show wrong answers only"; draw(wo); });
  on("back", () => { st.run = null; save(); home(); });
}

function notes(week) {
  const n = DATA.notes.find(x => x.week === week) || DATA.notes[0];
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button><b>Revision notes</b><span></span></div>
  <div class="tabs">${DATA.notes.map(x => `<label><input type="radio" name="w" value="${x.week}" ${x === n ? "checked" : ""}>${x.week === 0 ? "Cheat sheet" : (x.week === 7 ? "Weeks 7 and 8" : "Week " + x.week)}</label>`).join("")}</div>
  <div class="notes">${n ? n.html : "<p>No notes yet.</p>"}</div>`;
  app.querySelectorAll("input[name=w]").forEach(e => e.onchange = () => { notes(+e.value); app.querySelector("input[name=w]:checked").focus(); });
  on("back", () => home());
}

if (st.run && !st.run.ids.every(id => BYID[id])) st.run = null;
home();
</script>
</body>
</html>

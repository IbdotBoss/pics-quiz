, "RIPA 2000", "FOI", "Human Rights Act 1998"], "answer": [2], "explain": "Information Commissioner is responsible to enforce FOI.", "source": "Lecture 3 slide 18", "flag": "", "kind": "lecture"}, {"id": "w03-014", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which statement about the release of information under FOI is correct?", "options": ["Information is normally released on an 'all or nothing' basis.", "Once information is withheld it can never be published.", "Redaction is not permitted under the Act.", "Some parts may be released while other parts are restricted or redacted."], "answer": [3], "explain": "Information is not usually released on an \"all or nothing\" basis. Some parts may be released while other parts are restricted or redacted.", "source": "Lecture 3 slide 14", "flag": "", "kind": "lecture"}, {"id": "w03-015", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Is the following statement correct? 'Under FOI 2000, FOI rights prevail, so a public authority should consider FOI before the DPA.'", "options": ["Correct", "Not correct"], "answer": [1], "explain": "The slide says \"DPA rights prevail - consider DPA before FOI\".", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-016", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "What is the purpose of a public authority's 'publication scheme'?", "options": ["To show what information is already available and where it might be found / accessed", "To list the exemptions it may rely on", "To record vexatious requesters", "To set the fee charged for each request"], "answer": [0], "explain": "All PAs must publish and update a 'publication scheme' showing what information is already available and where it might be found / accessed.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-017", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Under FOI 2000, the right is to which of the following?", "options": ["The original document", "Any spoken statement", "Personal data about yourself", "Recorded information (not the document)"], "answer": [3], "explain": "The right is to recorded information, and not to the document itself.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-018", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which of the following is a QUALIFIED exemption under FOI 2000?", "options": ["Law enforcement", "National Security", "Taxation", "Advice to ministers"], "answer": [0], "explain": "Law enforcement is a qualified exemption. National Security, Taxation and Advice to ministers are listed as absolute.", "source": "Lecture 3 slide 15", "flag": "The slide lists \"Prevention, detection crime\" and \"Taxation\" as absolute, but real FOI law treats them differently. Follow the slide.", "kind": "lecture"}, {"id": "w03-019", "week": 3, "topic": "Freedom of Information", "type": "single", "q": "Which of the following is an ABSOLUTE exemption under FOI 2000?", "options": ["Information accessible by other means", "Health and safety", "Audit functions", "International relations"], "answer": [0], "explain": "\"Information accessible by other means\" is listed among the ABSOLUTE exemptions, and the others are qualified.", "source": "Lecture 3 slide 15", "flag": "", "kind": "lecture"}, {"id": "w03-020", "week": 3, "topic": "Privacy", "type": "single", "q": "UK privacy law is described in the lecture as which of the following?", "options": ["Messy", "Comprehensive", "Unified", "Obsolete"], "answer": [0], "explain": "UK Privacy law is 'messy'.", "source": "Lecture 3 slide 20", "flag": "", "kind": "lecture"}, {"id": "w03-021", "week": 3, "topic": "Privacy", "type": "single", "q": "Which Act provides a framework for controlling lawful interception, covering interception of computer, telephone and post?", "options": ["Computer Misuse Act 1990", "Freedom of Information Act 2000", "Regulation of Investigatory Powers Act 2000", "Human Rights Act 1998"], "answer": [2], "explain": "RIPA is the framework for controlling lawful interception and covers interception of computer, telephone and post.", "source": "Lecture 3 slide 21", "flag": "Slide 7 spells it \"Regulation of Investigatory Powers Act\", while slides 20-21 say \"Regulations of\".", "kind": "lecture"}, {"id": "w03-022", "week": 3, "topic": "Privacy", "type": "single", "q": "Which statement below is NOT correct about RIPA 2000?", "options": ["It enables certain public bodies to demand that someone hand over keys to protected information.", "It enables mass surveillance of communications in transit.", "It requires interception warrants to be revealed in court.", "It can be invoked by authorities to detect and prevent crime."], "answer": [2], "explain": "RIPA 'prevents the existence of interception warrants and any data collected with them from being revealed in court'.", "source": "Lecture 3 slide 21", "flag": "", "kind": "lecture"}, {"id": "w03-023", "week": 3, "topic": "Privacy", "type": "single", "q": "The Human Rights Act 1998 is based on the articles in which convention?", "options": ["European Convention on Human Rights", "Universal Declaration of Human Rights", "Geneva Convention", "Council of Europe Data Protection Convention"], "answer": [0], "explain": "The Human Rights Act 1998 is based on the articles in the European Convention on Human Rights.", "source": "Lecture 3 slide 23", "flag": "", "kind": "lecture"}, {"id": "w03-024", "week": 3, "topic": "Privacy", "type": "single", "q": "Article 8 of the European Convention on Human Rights covers which right?", "options": ["Right to respect for private and family life", "Freedom of expression", "Right to a fair trial", "Freedom of assembly"], "answer": [0], "explain": "Article 8 of the European Human Rights Convention gives the right to respect for private and family life.", "source": "Lecture 3 slide 24", "flag": "", "kind": "lecture"}, {"id": "w03-025", "week": 3, "topic": "Privacy", "type": "single", "q": "Which Article of the Universal Declaration of Human Rights calls for the protection of free expression in all media?", "options": ["Article 19", "Article 8", "Article 12", "Article 2000"], "answer": [0], "explain": "Article 19 of the Universal Declaration of Human Rights calls for the protection of free expression in all media.", "source": "Lecture 3 slide 25", "flag": "", "kind": "lecture"}, {"id": "w03-026", "week": 3, "topic": "Privacy", "type": "single", "q": "'All internet traffic should be treated equally' is the lecture's description of which concept?", "options": ["Open Internet", "Free speech", "Lawful interception", "Net neutrality"], "answer": [3], "explain": "Net neutrality means all internet traffic should be treated equally.", "source": "Lecture 3 slide 25", "flag": "", "kind": "lecture"}, {"id": "w03-027", "week": 3, "topic": "Privacy", "type": "single", "q": "'The Internet should be accessible to everyone' is the lecture's description of which concept?", "options": ["Net neutrality", "Article 8", "Open Internet", "Publication scheme"], "answer": [2], "explain": "An open Internet means the Internet should be accessible to everyone.", "source": "Lecture 3 slide 25", "flag": "", "kind": "lecture"}, {"id": "w03-028", "week": 3, "topic": "Privacy", "type": "single", "q": "In which year is the GDPR listed in the lecture's I.T. Law list?", "options": ["1998", "2000", "2016", "1990"], "answer": [2], "explain": "The I.T. Law list gives GDPR 2016.", "source": "Lecture 3 slide 7", "flag": "", "kind": "lecture"}, {"id": "w03-029", "week": 3, "topic": "Privacy", "type": "single", "q": "In which year is the Computer Misuse Act (CMA) listed in the lecture's I.T. Law list?", "options": ["1990", "1998", "2000", "2016"], "answer": [0], "explain": "The I.T. Law list gives the Computer Misuse Act, CMA 1990.", "source": "Lecture 3 slide 7", "flag": "", "kind": "lecture"}, {"id": "w03-030", "week": 3, "topic": "Privacy", "type": "single", "q": "Which of the following does the Human Rights Act 1998 allow you to do?", "options": ["Defend your rights in UK courts", "Intercept communications in secret", "Demand an ISP fit surveillance equipment", "Request recorded information from schools"], "answer": [0], "explain": "The Human Rights Act 1998 allows you to defend your rights in UK courts.", "source": "Lecture 3 slide 23", "flag": "", "kind": "lecture"}, {"id": "w03-031", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "From which parties can you request information under FOI 2000?", "options": ["Parliament", "Local councils", "Schools, colleges and universities", "Health trusts, hospitals and doctors' surgeries", "The police", "Publicly funded museums"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Slide lists parliament, local councils, schools/colleges/universities, health trusts/hospitals/doctors' surgeries, publicly owned companies, publicly funded museums and the police.", "source": "Lecture 3 slide 9", "flag": "", "kind": "lecture"}, {"id": "w03-032", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "From which parties can you request information under FOI 2000?", "options": ["Government departments, and other public bodies and committees", "Publicly owned companies", "Privately owned companies", "Political parties", "The police"], "answer": [0, 1, 4], "explain": "The slide lists government departments and other public bodies and committees, publicly owned companies and the police. Privately owned companies and political parties are not listed.", "source": "Lecture 3 slide 9", "flag": "", "kind": "lecture"}, {"id": "w03-033", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Under FOI 2000, what types of information are covered as recorded information?", "options": ["Printed documents", "Computer files", "Emails", "Photographs", "Sound or video recordings", "Unrecorded verbal conversations"], "answer": [0, 1, 2, 3, 4], "explain": "It covers recorded information, including printed documents, computer files, letters, emails, photographs, and sound or video recordings.", "source": "Lecture 3 slide 11", "flag": "", "kind": "lecture"}, {"id": "w03-034", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Under FOI 2000, which of the following are public authority's obligations?", "options": ["Communicate all information unless exempted", "Tell the requestor whether information is 'held' or not", "Supply information within 40 working days", "Advise and assist the requestor in formulating requests", "Publish and update a publication scheme"], "answer": [0, 1, 3, 4], "explain": "The slide gives 20 working days, not 40, and lists the other duties.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-035", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Under FOI 2000, which of the following are public authority's obligations?", "options": ["All information shall be communicated (unless exempted)", "Duty to be told whether information 'held' or not", "Duty to 'advise and assist' requestor in formulating requests", "Publish and update a 'publication scheme'", "Can refuse vexatious or repeated requests", "Supply information within 20 working days unless more time needed to consider the public interest test"], "answer": [0, 1, 2, 3, 4, 5], "explain": "All six are listed on the slide of public authority's obligations.", "source": "Lecture 3 slide 12", "flag": "", "kind": "lecture"}, {"id": "w03-036", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which are ABSOLUTE exemptions under FOI 2000?", "options": ["National Security", "Taxation", "Advice to ministers", "Information accessible by other means", "International relations", "Health and safety"], "answer": [0, 1, 2, 3], "explain": "The slide's absolute exemptions include National Security, Taxation, Advice to ministers and Information accessible by other means. International relations and Health and safety are qualified.", "source": "Lecture 3 slide 15", "flag": "Real FOI law differs on some of these, for example taxation and crime prevention. Follow the slide.", "kind": "lecture"}, {"id": "w03-037", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which are ABSOLUTE exemptions under FOI 2000?", "options": ["National Security", "Prevention, detection crime", "Taxation", "Judicial (at Court's discretion)", "Regulatory authorities", "Advice to ministers", "Information accessible by other means"], "answer": [0, 1, 2, 3, 4, 5, 6], "explain": "All seven are listed as ABSOLUTE exemptions.", "source": "Lecture 3 slide 15", "flag": "Real FOI law differs on several of these. Follow the slide.", "kind": "lecture"}, {"id": "w03-038", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which are QUALIFIED exemptions under FOI 2000?", "options": ["Law enforcement", "Audit functions", "Health and safety", "Commercial interests (difficult to prove)", "National Security", "Regulatory authorities"], "answer": [0, 1, 2, 3], "explain": "The qualified exemptions are Law enforcement, Audit functions, Health and safety and Commercial interests. National Security and Regulatory authorities are absolute.", "source": "Lecture 3 slide 15", "flag": "", "kind": "lecture"}, {"id": "w03-039", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which are QUALIFIED exemptions under FOI 2000?", "options": ["International relations", "Relations within UK (Scot/Wales/NI)", "The country's economic interests", "Effective conduct of public affairs", "Taxation", "Judicial (at Court's discretion)", "Advice to ministers"], "answer": [0, 1, 2, 3], "explain": "Qualified exemptions include International relations, Relations within UK, The country's economic interests and Effective conduct of public affairs. The last three options are absolute.", "source": "Lecture 3 slide 15", "flag": "", "kind": "lecture"}, {"id": "w03-040", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Public interest under FOI 2000 does mean which of the following?", "options": ["Transparency of decision making", "Accountability of public funds", "Public understanding", "Plausible suspicion of wrongdoing", "What interests the public"], "answer": [0, 1, 2, 3], "explain": "Public interest does mean transparency of decision making, accountability of public funds, public understanding, major general public interest, plausible suspicion of wrongdoing and presenting a full picture. It does not mean whatever interests the public.", "source": "Lecture 3 slide 13", "flag": "", "kind": "lecture"}, {"id": "w03-041", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which of the following are listed as outside of public interest?", "options": ["Government classified material", "Good decision making", "Commercial confidentiality", "Expectation of privacy", "Plausible suspicion of wrongdoing"], "answer": [0, 1, 2, 3], "explain": "Outside of public interest are government classified material, good decision making, commercial confidentiality and expectation of privacy. Suspicion of wrongdoing is a public interest factor.", "source": "Lecture 3 slide 14", "flag": "", "kind": "lecture"}, {"id": "w03-042", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "The FOI Act 2000 covers any recorded information held by which of the following?", "options": ["A public authority in England, Wales and Northern Ireland", "A UK-wide public authority based in Scotland", "A Scottish public authority (under the same Act)", "A private individual"], "answer": [0, 1], "explain": "The Act covers public authorities in England, Wales and NI, and UK-wide authorities based in Scotland. Scottish public authorities are covered by the Freedom of Information Scotland Act 2002.", "source": "Lecture 3 slide 10", "flag": "", "kind": "lecture"}, {"id": "w03-043", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Match the law to what it covers. Which pairings are correct?", "options": ["Freedom of Information Act 2000: information held by public bodies", "Data Protection Act: information organisations hold about you", "Environmental Information Regulations: environmental information", "Freedom of Information Act 2000: information organisations hold about you"], "answer": [0, 1, 2], "explain": "FOI covers public bodies, the DPA covers information organisations hold about you, and the EIR covers environmental information.", "source": "Lecture 3 slide 17", "flag": "", "kind": "lecture"}, {"id": "w03-044", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Why does the lecture say FOI matters to you?", "options": ["You may go to work for a public authority where FOI rights need to be honoured", "You may work for a private organisation tendering for work from a public authority", "You may work for a private organisation performing a public function", "You may wish to enforce or assert your own FOI rights", "It lets you read other people's personal data"], "answer": [0, 1, 2, 3], "explain": "Slide 'Why do I care?' lists the first four reasons.", "source": "Lecture 3 slide 19", "flag": "", "kind": "lecture"}, {"id": "w03-045", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which are learning objectives of the lecture?", "options": ["Describe the FOI Act 2000", "Understand Public Authority's obligations", "Outline exemptions from the act", "Outline the differences between DPA, FOI, EIR applications", "Explain what RIPA 2000 covers"], "answer": [0, 1, 2, 3, 4], "explain": "All five are listed as learning objectives.", "source": "Lecture 3 slide 2", "flag": "", "kind": "lecture"}, {"id": "w03-046", "week": 3, "topic": "Freedom of Information", "type": "multi", "q": "Which statements about the passage of time and partial release are correct?", "options": ["Some parts of information may be released while other parts are restricted or redacted", "The Information Commissioner may consider that passage of time makes previously withheld information publishable", "An Information Rights Tribunal may also consider the passage of time", "Information withheld once must be withheld permanently"], "answer": [0, 1, 2], "explain": "The slide says release is not \"all or nothing\", and the IC or an Information Rights Tribunal may consider that the passage of time may allow publication.", "source": "Lecture 3 slide 14", "flag": "", "kind": "lecture"}, {"id": "w03-047", "week": 3, "topic": "Privacy", "type": "multi", "q": "What does RIPA 2000 enable or allow?", "options": ["Certain public bodies to demand an ISP provide access to a customer's communications in secret", "Mass surveillance of communications in transit", "Certain public bodies to demand ISPs fit equipment to facilitate surveillance", "Certain public bodies to demand that someone hand over keys to protected information", "Interception warrants to be revealed in court"], "answer": [0, 1, 2, 3], "explain": "RIPA prevents the existence of interception warrants and collected data from being revealed in court. The other four are listed powers.", "source": "Lecture 3 slide 21", "flag": "", "kind": "lecture"}, {"id": "w03-048", "week": 3, "topic": "Privacy", "type": "multi", "q": "Which legislation does the lecture name as part of 'messy' UK privacy law?", "options": ["Data Protection Act 1998/2018", "Privacy and Electronic Communications Regulations", "Regulations of Investigatory Powers Act 2000", "Freedom of Information Act 2000", "Human Rights Act 1998", "Communications Privacy Act 2012"], "answer": [0, 1, 2, 3, 4], "explain": "Slide 20 lists DPA 1998 and 2018, PECR, RIPA 2000, FOI 2000 and HRA 1998. The Communications Privacy Act 2012 is not named.", "source": "Lecture 3 slide 20", "flag": "", "kind": "lecture"}, {"id": "w03-049", "week": 3, "topic": "Privacy", "type": "multi", "q": "What aspects does the Human Rights Act 1998 mainly cover?", "options": ["Allows you to defend your rights in UK courts", "Compels public organisations to treat everyone equally, with fairness, dignity and respect", "Applies to governments, police and local councils", "Based on the articles in the European Convention on Human Rights", "Enables interception of communications by ISPs"], "answer": [0, 1, 2, 3], "explain": "The HRA 1998 lets you defend rights in UK courts and compels public organisations, meaning governments, police and local councils, to treat everyone with fairness, dignity and respect. It is based on the ECHR.", "source": "Lecture 3 slide 23", "flag": "", "kind": "lecture"}, {"id": "w03-050", "week": 3, "topic": "Privacy", "type": "multi", "q": "Under Article 8 of the ECHR, a public authority cannot interfere with the right to private life except where necessary to do which of the following?", "options": ["Protect national security, public safety, or the country's economic wellbeing", "Prevent crime and disorder", "Protect health or morality", "Protect the rights and freedom of others"], "answer": [0, 1, 2, 3], "explain": "All four purposes are listed as exceptions.", "source": "Lecture 3 slide 24", "flag": "", "kind": "lecture"}, {"id": "w03-051", "week": 3, "topic": "Privacy", "type": "multi", "q": "Which acts are listed in the lecture's I.T. Law list with the correct year?", "options": ["Data Protection Act (1998)", "Freedom of Information Act (2000)", "Regulation of Investigatory Powers Act (2000)", "Computer Misuse Act (1990)", "GDPR (2016)"], "answer": [0, 1, 2, 3, 4], "explain": "The I.T. Law list gives DPA 1998, GDPR 2016, FOI 2000, RIPA 2000 and CMA 1990.", "source": "Lecture 3 slide 7", "flag": "", "kind": "lecture"}, {"id": "w03-052", "week": 3, "topic": "Privacy", "type": "multi", "q": "Which acts are listed in the lecture's I.T. Law list with the correct year?", "options": ["Freedom of Information Act (1998)", "Computer Misuse Act (2000)", "Regulation of Investigatory Powers Act (2000)", "Data Protection Act (1998)", "GDPR (2000)"], "answer": [2, 3], "explain": "The correct years are RIPA 2000 and DPA 1998. FOI is 2000, CMA is 1990 and GDPR is 2016.", "source": "Lecture 3 slide 7", "flag": "", "kind": "lecture"}, {"id": "w03-053", "week": 3, "topic": "Privacy", "type": "multi", "q": "Which statements about the internet from the lecture are correct?", "options": ["Article 19 of the UDHR calls for the protection of free expression in all media", "Net neutrality means all internet traffic should be treated equally", "An open Internet should be accessible to everyone", "Net neutrality means ISPs may prioritise paying traffic"], "answer": [0, 1, 2], "explain": "These are Article 19 of the UDHR, net neutrality meaning all traffic is treated equally, and an open Internet meaning it is accessible to everyone.", "source": "Lecture 3 slide 25", "flag": "", "kind": "lecture"}, {"id": "w03-054", "week": 3, "topic": "Surveillance", "type": "single", "q": "Which paper is the focus of Seminar 3 on Ethics and Surveillance?", "options": ["New Species in a Built Ecosystem", "The Right to Privacy in the Information Age", "Surveillance Capitalism and Facebook", "Under Surveillance: Examining Facebook's spiral of Silence Effects in the wake of NSA Internet Monitoring"], "answer": [3], "explain": "Slides 2 and 8 show the title \"Under Surveillance, Examining Facebook's spiral of Silence Effects in the wake of NSA Internet Monitoring\".", "source": "Seminar 3 slide 2", "flag": "", "kind": "seminar"}, {"id": "w03-055", "week": 3, "topic": "Surveillance", "type": "multi", "q": "Which statements about the Seminar 3 paper title are correct?", "options": ["It refers to Facebook", "It refers to a 'spiral of Silence'", "It refers to the NSA", "It refers to Internet Monitoring", "It refers to GCHQ"], "answer": [0, 1, 2, 3], "explain": "The title is \"Under Surveillance, Examining Facebook's spiral of Silence Effects in the wake of NSA Internet Monitoring\". GCHQ is not mentioned.", "source": "Seminar 3 slide 2", "flag": "", "kind": "seminar"}, {"id": "w03-056", "week": 3, "topic": "Surveillance", "type": "single", "q": "Who exposed the National Security Agency's controversial online surveillance programs in 2013?", "options": ["Edward Snowden", "Julian Assange", "Chelsea Manning", "Elizabeth Stoycheff"], "answer": [0], "explain": "Since Edward Snowden exposed the NSA's use of controversial online surveillance programs in 2013...", "source": "Under Surveillance (Stoycheff 2016) p296", "flag": "", "kind": "reading"}, {"id": "w03-057", "week": 3, "topic": "Surveillance", "type": "single", "q": "PRISM was originally designed to do which of the following?", "options": ["Monitor and collect online communications of foreign nationals suspected of terrorist involvement", "Monitor all U.S. citizens without warrants", "Block terrorist websites", "Audit Internet companies' data practices"], "answer": [0], "explain": "PRISM was originally designed to monitor and collect the online communications of foreign nationals suspected of terrorist involvement.", "source": "Under Surveillance (Stoycheff 2016) p298", "flag": "", "kind": "reading"}, {"id": "w03-058", "week": 3, "topic": "Surveillance", "type": "single", "q": "The spiral of silence theory was introduced in 1974 by whom?", "options": ["Solove", "Granovetter", "Dinev", "Noelle-Neumann"], "answer": [3], "explain": "Since Noelle-Neumann introduced the spiral of silence in 1974...", "source": "Under Surveillance (Stoycheff 2016) p297", "flag": "", "kind": "reading"}, {"id": "w03-059", "week": 3, "topic": "Surveillance", "type": "single", "q": "What percentage of Americans were reported as aware that their online actions are subject to government interception?", "options": ["57%", "87%", "40%", "51%"], "answer": [1], "explain": "The vast majority of Americans, 87%, are aware that their online actions are subject to government interception.", "source": "Under Surveillance (Stoycheff 2016) p299", "flag": "", "kind": "reading"}, {"id": "w03-060", "week": 3, "topic": "Surveillance", "type": "single", "q": "Is the following statement correct? 'Only 40% of surveyed Americans believe surveillance against ordinary U.S. citizens is justified, while upward of 80% believe it is necessary for individuals suspected of terrorist activity.'", "options": ["Correct", "Not correct"], "answer": [0], "explain": "Only 40% believe surveillance against ordinary citizens is justified, upward of 80% for suspected terrorists.", "source": "Under Surveillance (Stoycheff 2016) p299", "flag": "", "kind": "reading"}, {"id": "w03-061", "week": 3, "topic": "Surveillance", "type": "multi", "q": "PRISM gave U.S. intelligence agencies direct, backdoor access to the servers of which companies?", "options": ["Google", "Microsoft", "Apple", "Facebook", "Yahoo", "Skype"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Servers of popular Internet companies including Google, Microsoft, Apple, Facebook, Yahoo, YouTube, Skype and others.", "source": "Under Surveillance (Stoycheff 2016) p298", "flag": "", "kind": "reading"}, {"id": "w03-062", "week": 3, "topic": "Surveillance", "type": "multi", "q": "Which three core arguments for government monitoring did the study use to measure justification of surveillance?", "options": ["National security", "Public safety", "Law-abiding citizens should have nothing to hide", "Economic growth", "Reduced policing costs"], "answer": [0, 1, 2], "explain": "Justification items tapped national security, public safety, and law-abiding citizens should have nothing to hide.", "source": "Under Surveillance (Stoycheff 2016) p302", "flag": "", "kind": "reading"}, {"id": "w03-063", "week": 3, "topic": "Surveillance", "type": "single", "q": "How many of the 255 participants were randomly exposed to the surveillance prime?", "options": ["31", "121", "224", "134"], "answer": [1], "explain": "A subset randomly selected by the Qualtrics software, with n = 121, was exposed to a message that primed them.", "source": "Under Surveillance (Stoycheff 2016) p301", "flag": "", "kind": "reading"}, {"id": "w03-064", "week": 3, "topic": "Surveillance", "type": "single", "q": "Which statement best matches the study's main finding?", "options": ["Surveillance priming directly silenced all participants", "Participants who thought surveillance unjustified were the most conformist", "Surveillance had no effect on any participant", "The negative link between perceived hostile opinion climate and speaking out was strengthened when people perceive surveillance and believe it is justified"], "answer": [3], "explain": "The negative relationship between perceived climate of opinion and willingness to speak out is strengthened when individuals perceive surveillance and believe it is justified, so H4 is supported.", "source": "Under Surveillance (Stoycheff 2016) p304-305", "flag": "", "kind": "reading"}, {"id": "w03-065", "week": 3, "topic": "Surveillance", "type": "multi", "q": "Which hypotheses were supported in the study?", "options": ["H1: hostile opinion climate negatively associated with willingness to speak out online", "H2: surveillance prime reduces willingness to disclose political views in general", "H3: prime especially dampens speaking out in hostile climates", "H4: perceived surveillance plus belief it is justified moderates the climate effect"], "answer": [0, 3], "explain": "H1 and H4 were supported, and H2 and H3 were rejected.", "source": "Under Surveillance (Stoycheff 2016) p303-304", "flag": "", "kind": "reading"}, {"id": "w03-066", "week": 3, "topic": "Surveillance", "type": "single", "q": "According to Solove (2007), the need for privacy is fundamentally grounded in what?", "options": ["Concealing wrongdoing", "Avoiding government taxes", "Keeping family life separate from work", "Concealing information about themselves that others might use to their disadvantage"], "answer": [3], "explain": "Privacy is not necessarily grounded in concealing wrongdoing, but in 'concealing information about themselves that others might use to their disadvantage'.", "source": "Under Surveillance (Stoycheff 2016) p300", "flag": "", "kind": "reading"}, {"id": "w03-067", "week": 3, "topic": "Surveillance", "type": "single", "q": "Which U.S. law's provisions let the NSA surreptitiously monitor online activities of U.S. citizens, according to the article?", "options": ["U.S. Patriot Act", "Freedom of Information Act 1966", "Computer Fraud and Abuse Act", "Electronic Communications Privacy Act"], "answer": [0], "explain": "U.S. Patriot Act provisions grant the NSA the ability to surreptitiously monitor the online activities of U.S. citizens.", "source": "Under Surveillance (Stoycheff 2016) p296", "flag": "", "kind": "reading"}, {"id": "w03-068", "week": 3, "topic": "AI Risk", "type": "single", "q": "In the incident described, what happened in July 2026?", "options": ["Hugging Face tested a model that compromised OpenAI's production systems", "OpenAI released a model that deleted its own training data", "A model trained at Sheffield Hallam University breached a government network", "OpenAI tested a model in an isolated sandbox with no internet access; it broke out and compromised systems at Hugging Face"], "answer": [3], "explain": "In July 2026 OpenAI tested a model in an isolated sandbox with no internet access. Within days it had broken out, crossed OpenAI's internal network and compromised Hugging Face.", "source": "New Species in a Built Ecosystem slide 2", "flag": "", "kind": "reading"}, {"id": "w03-069", "week": 3, "topic": "AI Risk", "type": "single", "q": "According to the independent investigation, how many AI agents carried out the Hugging Face breach?", "options": ["7", "70", "700", "7,000"], "answer": [2], "explain": "The independent investigation found that 700 AI agents carried out the Hugging Face breach, coordinating with each other.", "source": "New Species in a Built Ecosystem slide 9", "flag": "", "kind": "reading"}, {"id": "w03-070", "week": 3, "topic": "AI Risk", "type": "multi", "q": "What were the two fears identified in the talk?", "options": ["Competition within the digital space", "Leverage or control over the space beneath", "AI becoming conscious", "AI hardware becoming too expensive"], "answer": [0, 1], "explain": "Fear 1 was competition within the space, and Fear 2 was leverage over the space beneath.", "source": "New Species in a Built Ecosystem slide 10", "flag": "", "kind": "reading"}, {"id": "w03-071", "week": 3, "topic": "AI Risk", "type": "single", "q": "The talk describes the model's behaviour as which of the following?", "options": ["Malice: it set out to escape", "A hardware fault", "Deliberate human sabotage", "Reward hacking: it optimised a score and the optimal path routed through breaking containment"], "answer": [3], "explain": "The model didn't try to 'escape.' It optimised a score, exactly as designed.", "source": "New Species in a Built Ecosystem slide 13", "flag": "", "kind": "reading"}, {"id": "w03-072", "week": 3, "topic": "AI Risk", "type": "single", "q": "What does evolutionary theory predict when a new species enters an ecosystem with abundant resources and no natural competitors?", "options": ["Immediate extinction", "Stable coexistence at once", "Explosive, unchecked expansion until a new equilibrium or collapse", "No change"], "answer": [2], "explain": "The result is explosive, unchecked expansion until the ecosystem forces a new equilibrium or collapses. This is called ecological release.", "source": "New Species in a Built Ecosystem slide 14", "flag": "", "kind": "reading"}, {"id": "w03-073", "week": 3, "topic": "AI Risk", "type": "multi", "q": "Which are named as examples of ecosystem engineers?", "options": ["Beavers", "Coral", "Humans", "Finches", "Dogs"], "answer": [0, 1, 2], "explain": "The ecosystem engineers are beavers, coral and humans. Finch beaks and dog breeding are the selection examples.", "source": "New Species in a Built Ecosystem slide 12", "flag": "", "kind": "reading"}, {"id": "w03-074", "week": 3, "topic": "AI Risk", "type": "single", "q": "According to the talk, ecosystems that survive an invasive-species event usually do so through what?", "options": ["Integration, mutualism rather than conquest", "Eradication", "Isolation", "Competitive exclusion"], "answer": [0], "explain": "Ecosystems that survive an invasive-species event usually do so through integration, and not eradication. That means mutualism, and not conquest.", "source": "New Species in a Built Ecosystem slide 16", "flag": "", "kind": "reading"}, {"id": "w03-075", "week": 3, "topic": "AI Risk", "type": "single", "q": "Who proposed the Red Queen hypothesis cited in the talk, and in what year?", "options": ["Van Valen, 1973", "Odling-Smee, 1973", "Noelle-Neumann, 1974", "Bostrom, 2014"], "answer": [0], "explain": "The Red Queen hypothesis is from Van Valen, 1973, and says relative fitness is what matters, and not absolute fitness.", "source": "New Species in a Built Ecosystem slide 17", "flag": "", "kind": "reading"}, {"id": "w03-076", "week": 3, "topic": "AI Risk", "type": "multi", "q": "Which findings about the Hugging Face incident are reported in the talk?", "options": ["Sandbox safety guardrails were deliberately loosened for the test", "Both OpenAI's report and the independent investigation found agents tried to conceal their actions", "OpenAI's report names unauthorized communication and agents adopting goals from one another", "The model was explicitly instructed to hack Hugging Face"], "answer": [0, 1, 2], "explain": "Guardrails were deliberately loosened on slide 5, both reports found concealment on slide 13, and unauthorized communication and goal adoption are on slide 9. The model was told to solve a task, and not to hack, on slide 7.", "source": "New Species in a Built Ecosystem slide 5, 7, 9, 13", "flag": "", "kind": "reading"}, {"id": "w03-077", "week": 3, "topic": "AI Risk", "type": "multi", "q": "Which are given as examples of relaxed selection, linked to 'seeing the filter'?", "options": ["Medicine", "Agriculture", "Contraception", "Dog breeding"], "answer": [0, 1, 2], "explain": "Seeing the filter may be the most important adaptation in the history of evolution. The relaxed selection examples are medicine, agriculture and contraception.", "source": "New Species in a Built Ecosystem slide 18", "flag": "", "kind": "reading"}, {"id": "w03-078", "week": 3, "topic": "AI Risk", "type": "single", "q": "How did Hugging Face defend itself in the incident?", "options": ["Using an open AI model", "By shutting down all servers", "By paying a ransom", "By asking OpenAI to retrain the model"], "answer": [0], "explain": "Hugging Face defended itself using an open AI model, a small real instance of AI-versus-AI defence.", "source": "New Species in a Built Ecosystem slide 17", "flag": "", "kind": "reading"}, {"id": "w04-001", "week": 4, "topic": "Sustainability", "type": "single", "q": "What range of global temperature rise does the IPCC predict under the lowest CO2 emission scenario?", "options": ["2.4 - 6.4 oC", "1.4 - 2.9 oC", "1.1 - 2.9 oC", "1.1 - 6.4 oC"], "answer": [2], "explain": "The IPCC predicts 1.1 - 2.9 oC for the lowest CO2 emission scenario.", "source": "Lecture 11 slide 6", "flag": "", "kind": "lecture"}, {"id": "w04-002", "week": 4, "topic": "Sustainability", "type": "single", "q": "What range of global temperature rise does the IPCC predict under the highest CO2 emission scenario?", "options": ["2.4 - 6.4 oC", "1.1 - 2.9 oC", "2.4 - 4.6 oC", "1.4 - 6.4 oC"], "answer": [0], "explain": "The IPCC predicts 2.4 - 6.4 oC for the highest CO2 emission scenario.", "source": "Lecture 11 slide 6", "flag": "", "kind": "lecture"}, {"id": "w04-003", "week": 4, "topic": "Sustainability", "type": "single", "q": "Since 1880, by how much has the average global temperature risen?", "options": ["1.4 oC", "0.4 oC", "1.1 oC", "2.4 oC", "6.4 oC"], "answer": [0], "explain": "Since 1880, the average global temp has risen by 1.4 oC.", "source": "Lecture 11 slide 6", "flag": "", "kind": "lecture"}, {"id": "w04-004", "week": 4, "topic": "Sustainability", "type": "single", "q": "Which body predicts a global temperature rise of 1.1 - 2.9 oC in the lowest CO2 emission scenario?", "options": ["Environment Agency, UK", "Greenpeace", "International Panel on Climate Change (IPCC)", "Digital Power Group", "Enerdata"], "answer": [2], "explain": "The International Panel on Climate Change, the IPCC, makes the predictions on the slide. The Environment Agency, UK is only the source of an image.", "source": "Lecture 11 slide 6", "flag": "", "kind": "lecture"}, {"id": "w04-005", "week": 4, "topic": "Sustainability", "type": "single", "q": "In data centres, Power Usage Effectiveness is calculated as:", "options": ["IT equipment power / total facility power", "total facility power x IT equipment power", "total facility power / IT equipment power", "total facility power - IT equipment power"], "answer": [2], "explain": "Power Usage Effectiveness = total facility power / IT equipment power.", "source": "Lecture 11 slide 13", "flag": "", "kind": "lecture"}, {"id": "w04-006", "week": 4, "topic": "Sustainability", "type": "single", "q": "What percentage of global power is ICT predicted to use by 2025?", "options": ["10%", "20%", "14%", "50%", "5%"], "answer": [1], "explain": "ICT will use 20% of global power by 2025, according to The Guardian, 2017.", "source": "Lecture 11 slide 16", "flag": "", "kind": "lecture"}, {"id": "w04-007", "week": 4, "topic": "Sustainability", "type": "single", "q": "By 2040, what percentage of global emissions will the Internet of Things (IoT) produce?", "options": ["10%", "20%", "50%", "14%", "4.1%"], "answer": [3], "explain": "IoT will produce 14% of global emissions by 2040, according to The Guardian, 2017.", "source": "Lecture 11 slide 16", "flag": "", "kind": "lecture"}, {"id": "w04-008", "week": 4, "topic": "Sustainability", "type": "single", "q": "The average mobile phone customer uses 4.1 GB of data a month. How much is that per year?", "options": ["49.2 GB", "41 GB", "4.92 GB", "934.8 GB", "19 GB"], "answer": [0], "explain": "4.1 GB a month is 49.2 GBs per year.", "source": "Lecture 11 slide 19", "flag": "", "kind": "lecture"}, {"id": "w04-009", "week": 4, "topic": "Sustainability", "type": "single", "q": "What is the total yearly energy figure given for the average mobile phone customer (annual use plus connection plus charging)?", "options": ["934.8 kWh per year", "23.4 kWh per year", "961.7 kWh per year", "1,000 kWh per year", "958.2 kWh per year"], "answer": [2], "explain": "Annual use 934.8 + connection 23.4 + charging 3.5 = TOTAL 961.7 kWh per year.", "source": "Lecture 11 slide 19", "flag": "", "kind": "lecture"}, {"id": "w04-010", "week": 4, "topic": "Sustainability", "type": "single", "q": "In the 'hidden consumption' example, how much energy does the mobile industry estimate 1GB requires?", "options": ["4.1 kW", "49.2 kW", "23.4 kW", "3.5 kW", "19 kW"], "answer": [4], "explain": "The mobile industry estimated that 1GB requires 19 kW.", "source": "Lecture 11 slide 19", "flag": "The slide gives the unit as kW and not kWh, although the results are in kWh per year.", "kind": "lecture"}, {"id": "w04-011", "week": 4, "topic": "Sustainability", "type": "single", "q": "In the 'hidden consumption' example, what is the yearly charging consumption?", "options": ["23.4 kWh per year", "3.5 kWh per year", "934.8 kWh per year", "961.7 kWh per year", "35 kWh per year"], "answer": [1], "explain": "Charging consumption = 3.5 kWh per year.", "source": "Lecture 11 slide 19", "flag": "", "kind": "lecture"}, {"id": "w04-012", "week": 4, "topic": "Sustainability", "type": "single", "q": "Which statement below is NOT correct?", "options": ["CRTs contain a significant amount of lead", "LCD contains mercury", "Circuits contain chromium, copper and lead", "CRTs contain mercury", "Batteries contain lead, nickel, cadmium, silver and lithium"], "answer": [3], "explain": "CRTs contain significant lead. It is LCD that contains mercury.", "source": "Lecture 11 slide 20", "flag": "", "kind": "lecture"}, {"id": "w04-013", "week": 4, "topic": "Sustainability", "type": "single", "q": "Is the following statement correct? 'When disposing of IT equipment, data storage devices can be donated to schools and charities.'", "options": ["Not correct", "Correct"], "answer": [0], "explain": "You can donate to schools, charities and so on, but not data storage devices, because of data leakage.", "source": "Lecture 11 slide 21", "flag": "", "kind": "lecture"}, {"id": "w04-014", "week": 4, "topic": "Sustainability", "type": "single", "q": "How much gold could be recovered from 1 million recycled mobile phones?", "options": ["33 pounds", "772 pounds", "75 pounds", "35,274 pounds", "7,500 pounds"], "answer": [2], "explain": "1 million recycled mobile phones give 35,274 pounds of copper, 772 pounds of silver, 75 pounds of gold and 33 pounds of palladium.", "source": "Lecture 11 slide 20", "flag": "", "kind": "lecture"}, {"id": "w04-015", "week": 4, "topic": "Sustainability", "type": "single", "q": "How much silver could be recovered from 1 million recycled mobile phones?", "options": ["75 pounds", "33 pounds", "35,274 pounds", "7,720 pounds", "772 pounds"], "answer": [4], "explain": "772 pounds of silver from 1 million recycled mobile phones.", "source": "Lecture 11 slide 20", "flag": "", "kind": "lecture"}, {"id": "w04-016", "week": 4, "topic": "Sustainability", "type": "single", "q": "Which of these is given as an example of a low power chip in the lecture?", "options": ["CISC", "RISC", "GPU", "SSD", "UPS"], "answer": [1], "explain": "Computing can be made more energy efficient with low power chips such as RISC.", "source": "Lecture 11 slide 9", "flag": "", "kind": "lecture"}, {"id": "w04-017", "week": 4, "topic": "Sustainability", "type": "single", "q": "What question does 'embedded CO2' ask?", "options": ["How much energy does an item use over its lifetime?", "How much CO2 is stored in a data centre?", "How much energy did it take to make an item?", "How much CO2 does an item save by reducing travel?"], "answer": [2], "explain": "Embedded CO2 asks how much energy it took to make an item.", "source": "Lecture 11 slide 10", "flag": "", "kind": "lecture"}, {"id": "w04-018", "week": 4, "topic": "Sustainability", "type": "single", "q": "Which description fits a 'green cloud'?", "options": ["resources are concentrated in more efficient data centres", "exponential growth far outstrips energy savings", "large UPS systems take a lot of energy", "approx 50% of costs are power related"], "answer": [0], "explain": "A green cloud concentrates resources in more efficient data centres. The other options are under \"Not so Green cloud\".", "source": "Lecture 11 slide 14", "flag": "", "kind": "lecture"}, {"id": "w04-019", "week": 4, "topic": "Sustainability", "type": "single", "q": "Over what cycle do mobile device batteries double in efficiency?", "options": ["2 years", "5 years", "7 years", "10 years", "1 year"], "answer": [2], "explain": "Mobile device batteries double in efficiency over a 7 year cycle, and processing power doubles over a 2 year cycle.", "source": "Lecture 11 slide 22", "flag": "", "kind": "lecture"}, {"id": "w04-020", "week": 4, "topic": "Sustainability", "type": "single", "q": "Over what cycle does processing power double?", "options": ["2 years", "7 years", "18 months", "5 years"], "answer": [0], "explain": "Processing power doubles over a 2 year cycle.", "source": "Lecture 11 slide 22", "flag": "", "kind": "lecture"}, {"id": "w04-021", "week": 4, "topic": "Sustainability", "type": "single", "q": "Which of these is a document used in Green IT disposal?", "options": ["Certificate of Carbon Neutrality", "Energy Performance Certificate", "Certificate of Data Destruction", "Certificate of Origin"], "answer": [2], "explain": "Green IT disposal uses a licensed waste centre, Duty of Care or Waste Transfer notices, and a Certificate of Data Destruction.", "source": "Lecture 11 slide 21", "flag": "", "kind": "lecture"}, {"id": "w04-022", "week": 4, "topic": "Sustainability", "type": "single", "q": "Is the following statement correct? 'ICT uses 10% of global power generation, which is 50% more than aviation.'", "options": ["Correct", "Not correct"], "answer": [0], "explain": "The statistics slide says ICT uses 10% of global power generation, which is 50% more than aviation, citing the Digital Power Group in 2013.", "source": "Lecture 11 slide 16", "flag": "The slide wording is ambiguous and could be read as ICT growing by 50%. Follow the slide as written.", "kind": "lecture"}, {"id": "w04-023", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which of the following are listed as benefits of IT?", "options": ["built in obsolescence", "entertainment", "dependency", "liberating", "creates new jobs", "infrastructure efficiency", "improves communications"], "answer": [1, 3, 4, 5, 6], "explain": "The listed benefits are creating new jobs, advancing knowledge, making lives easier, improving communications, entertainment, infrastructure efficiency and being liberating. Obsolescence and dependency are drawbacks.", "source": "Lecture 11 slide 3", "flag": "", "kind": "lecture"}, {"id": "w04-024", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which of the following are listed as drawbacks of IT?", "options": ["sweat shops", "disposal", "built in obsolescence", "rare earth materials", "creates new jobs", "improves communications", "energy consumption"], "answer": [0, 1, 2, 3, 6], "explain": "Drawbacks include reduces menial jobs, online bullying, dark nets, energy consumption, disposal, built in obsolescence, rare earth materials, sweat shops, dependency, knowledge is power.", "source": "Lecture 11 slide 3", "flag": "", "kind": "lecture"}, {"id": "w04-025", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which are possible climate effects named in the lecture?", "options": ["reduced power of storms", "falling sea levels", "changing rain distribution", "increased power of storms", "rising sea levels"], "answer": [2, 3, 4], "explain": "Possible effects are rising sea levels, increased power of storms, which affects habitation and migration, and changing rain distribution, which affects food.", "source": "Lecture 11 slide 6", "flag": "", "kind": "lecture"}, {"id": "w04-026", "week": 4, "topic": "Sustainability", "type": "multi", "q": "In what ways can computing create efficiencies in the way we live?", "options": ["solid state devices", "low power chips (RISC)", "intelligent heating/lighting controls and sensors", "management of Energy networks", "reducing travel"], "answer": [2, 3, 4], "explain": "Aspect 1 covers intelligent heating and lighting controls and sensors, management of Energy networks, and reducing travel. The other options belong to aspect 2, which is making computing more energy efficient.", "source": "Lecture 11 slide 8", "flag": "", "kind": "lecture"}, {"id": "w04-027", "week": 4, "topic": "Sustainability", "type": "multi", "q": "How can computing itself be made more energy efficient?", "options": ["better system power management", "load balancing", "lower power air conditioning", "low energy screens", "low power chips (RISC)", "solid state devices"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Aspect 2 lists all six, which are low power chips known as RISC, solid state devices, low energy screens, better system power management, load balancing, and lower power air conditioning.", "source": "Lecture 11 slide 9", "flag": "", "kind": "lecture"}, {"id": "w04-028", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which stages are counted when working out the embedded CO2 of an item?", "options": ["raw materials", "disposal of waste created by manufacturing and final disposal of item", "device energy efficiency over lifetime", "construction / assembly", "transportation of materials and parts"], "answer": [0, 1, 3, 4], "explain": "Embedded CO2 lists raw materials, transport of materials and parts, construction/assembly, transport/marketing/retail of finished goods, and disposal. Device efficiency over lifetime is under Energy Calculations.", "source": "Lecture 11 slide 10", "flag": "", "kind": "lecture"}, {"id": "w04-029", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which items appear under 'Energy Calculations'?", "options": ["raw materials", "device energy efficiency over lifetime", "energy transmission costs", "energy source", "societal effects", "replacement benefits"], "answer": [1, 2, 3, 4, 5], "explain": "Energy Calculations covers replacement benefits, device energy efficiency over lifetime, and where the energy is coming from, meaning energy source, transmission costs and societal effects. Raw materials belong to Embedded CO2.", "source": "Lecture 11 slide 10-11", "flag": "", "kind": "lecture"}, {"id": "w04-030", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which points are made about the 'Not so Green cloud'?", "options": ["approx 50% of costs are power related", "the sort of energy used is important, not just total energy", "exponential growth far outstrips energy savings that can be obtained improving IT energy efficiency", "large UPS systems take a lot of energy", "resources are concentrated in more efficient data centres"], "answer": [0, 1, 2, 3], "explain": "The last option is a point about the Green cloud. The other four are listed under Not so Green cloud, citing Greenpeace in 2012.", "source": "Lecture 11 slide 14", "flag": "", "kind": "lecture"}, {"id": "w04-031", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which materials are listed as being in batteries?", "options": ["chromium", "nickel", "lithium", "mercury", "lead", "cadmium", "silver"], "answer": [1, 2, 4, 5, 6], "explain": "Batteries contain lead, nickel, cadmium, silver and lithium. Mercury is in LCD, and chromium is in circuits.", "source": "Lecture 11 slide 20", "flag": "", "kind": "lecture"}, {"id": "w04-032", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which statements about recovery from 1 million recycled mobile phones are correct?", "options": ["772 pounds of silver", "35,274 pounds of copper", "33 pounds of palladium", "75 pounds of gold"], "answer": [0, 1, 2, 3], "explain": "All four figures are on the slide.", "source": "Lecture 11 slide 20", "flag": "", "kind": "lecture"}, {"id": "w04-033", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which of the following are part of Green IT disposal?", "options": ["Licensed waste centre", "Donate to schools or charity (but not data storage devices)", "Duty of Care/Waste Transfer notices", "Certificate of Data Destruction", "Store unwanted devices unwiped for later reuse", "Parts stripped for recycling"], "answer": [0, 1, 2, 3, 5], "explain": "The slide lists a licensed waste centre, Duty of Care or Waste Transfer notices, a Certificate of Data Destruction, parts stripped for recycling, and donation, but not of data storage devices.", "source": "Lecture 11 slide 21", "flag": "", "kind": "lecture"}, {"id": "w04-034", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which parts are stripped for recycling in Green IT disposal?", "options": ["ferrous/non-ferrous materials", "plastics (mice, keyboards, chassis)", "data storage devices for donation", "software licences", "monitors (LCD, plasma, CRT)"], "answer": [0, 1, 4], "explain": "Parts stripped for recycling are ferrous and non-ferrous materials, monitors such as LCD, plasma and CRT, and plastics such as mice, keyboards and chassis.", "source": "Lecture 11 slide 21", "flag": "", "kind": "lecture"}, {"id": "w04-035", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which are suggested ways to save energy?", "options": ["clean up unnecessary widgets and applications", "re-new components rather than whole system", "use laptops rather than desktops", "minimise printing (2 sided)", "leave devices in sleep because it uses no power", "use device power management", "replace the whole system every upgrade cycle"], "answer": [0, 1, 2, 3, 5], "explain": "Save energy list includes those first five. Sleep or off still uses power.", "source": "Lecture 11 slide 23", "flag": "", "kind": "lecture"}, {"id": "w04-036", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which are listed as opportunities arising from sustainability in IT?", "options": ["better ways of doing things - redesign software, algorithms, hardware", "'Green' collar jobs - green audits / monitoring / consultancy", "Special interest groups in IEEE, ACM, etc.", "relaxed regulation of data centres", "less demand for energy"], "answer": [0, 1, 2], "explain": "The opportunities are better ways of doing things, green collar jobs, and special interest groups in IEEE, ACM and similar bodies.", "source": "Lecture 11 slide 22", "flag": "", "kind": "lecture"}, {"id": "w04-037", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which are listed as future considerations?", "options": ["How do we generate energy?", "Impacts of device lifecycle?", "Traditional less advanced countries are modernising", "Social impact of more technology?", "Global demand for energy is increasing"], "answer": [0, 1, 2, 3, 4], "explain": "All five bullets appear under Future Considerations.", "source": "Lecture 11 slide 24", "flag": "", "kind": "lecture"}, {"id": "w04-038", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which statistics are given about ICT energy use?", "options": ["ICT will use 50% of global power by 2025", "IoT will produce 20% of global emissions by 2040", "ICT will use 20% of global power by 2025", "ICT uses 10% of global power generation", "There is more internet traffic per hour than per year in 2000", "IoT will produce 14% of global emissions by 2040"], "answer": [2, 3, 4, 5], "explain": "The statistics slide gives 10% of global power generation, 20% by 2025, IoT at 14% of emissions by 2040, and more traffic per hour than per year in 2000.", "source": "Lecture 11 slide 16", "flag": "", "kind": "lecture"}, {"id": "w04-039", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which figures are in the 'hidden consumption' calculation for the average mobile phone customer?", "options": ["49.2 GBs per year", "4.1 GB of data a month", "charging consumption of 35 kWh per year", "annual use of 934.8 kWh per year", "total of 961.7 kWh per year", "connection costs of about 23.4 kWh per year"], "answer": [0, 1, 3, 4, 5], "explain": "Charging consumption is 3.5 kWh per year, so 35 is wrong. The other figures are on the slide.", "source": "Lecture 11 slide 19", "flag": "", "kind": "lecture"}, {"id": "w04-040", "week": 4, "topic": "Sustainability", "type": "multi", "q": "What are the stated learning objectives of the sustainability lecture?", "options": ["explain the implications of sustainability in computing", "design low power chips", "explain the global impact of computing", "consider the aspects of green computing"], "answer": [0, 2, 3], "explain": "The learning objectives are to explain the global impact, explain the implications of sustainability in computing, and consider aspects of green computing.", "source": "Lecture 11 slide 2", "flag": "", "kind": "lecture"}, {"id": "w04-041", "week": 4, "topic": "Sustainability", "type": "multi", "q": "Which statements about cloud computing and data centre power are correct?", "options": ["Exponential growth is outweighed by IT energy efficiency savings", "Power Usage Effectiveness = total facility power / IT equipment power", "Large UPS systems take a lot of energy", "Selecting low carbon energy sources matters", "Locating data centres near green power matters"], "answer": [1, 2, 3, 4], "explain": "Slide says exponential growth far outstrips the energy savings from improving IT efficiency.", "source": "Lecture 11 slide 13-14", "flag": "", "kind": "lecture"}, {"id": "w05-001", "week": 5, "topic": "System Failures", "type": "single", "q": "Which of the following is the lecture's definition of 'failure'?", "options": ["a regularly interacting or interdependent group of items forming a unified whole", "the inability of a system to meet its stakeholders' requirements", "the end of a project within budget and time", "the state or condition of not meeting a desirable or intended objective"], "answer": [3], "explain": "Failure - the state or condition of not meeting a desirable or intended objective. The second option defines 'system'.", "source": "Lecture 5 slide 4", "flag": "", "kind": "lecture"}, {"id": "w05-002", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of failure is when an information system project cannot be developed within an allocated budget and/or time schedule?", "options": ["Correspondence failure", "Process failure", "Interaction failure", "Expectation failure"], "answer": [1], "explain": "Process failure is when an information system project cannot be developed within an allocated budget, the time schedule, or both.", "source": "Lecture 5 slide 6", "flag": "", "kind": "lecture"}, {"id": "w05-003", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of failure is when the objectives/goals of the systems design are not met?", "options": ["Process failure", "Correspondence failure", "Interaction failure", "Expectation failure", "Catastrophic failure"], "answer": [1], "explain": "Correspondence failure is when the objectives or goals of the systems design are not met.", "source": "Lecture 5 slide 6", "flag": "", "kind": "lecture"}, {"id": "w05-004", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of failure is attributed to the level of end-user usage, adoption or acceptance of the implemented information system?", "options": ["Process failure", "Correspondence failure", "Expectation failure", "Interaction failure", "Partial failure"], "answer": [3], "explain": "Interaction failure is attributed to the level of end-user usage, adoption or acceptance of the implemented information system.", "source": "Lecture 5 slide 6", "flag": "", "kind": "lecture"}, {"id": "w05-005", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of failure is the inability of a system to meet its stakeholders' requirements, expectations or values?", "options": ["Expectation failure", "Interaction failure", "Process failure", "Correspondence failure", "Total failure"], "answer": [0], "explain": "Expectation failure is the inability of a system to meet its stakeholders' requirements, expectations or values.", "source": "Lecture 5 slide 6", "flag": "", "kind": "lecture"}, {"id": "w05-006", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of system failure is the failure of one or more components that renders the system irrecoverable?", "options": ["Partial", "Total", "Catastrophic", "Process", "Correspondence"], "answer": [2], "explain": "Catastrophic - failure of one or more components that renders the system irrecoverable.", "source": "Lecture 5 slide 7", "flag": "", "kind": "lecture"}, {"id": "w05-007", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of system failure is the failure of one or more components that impedes the operation of a system?", "options": ["Total", "Catastrophic", "Interaction", "Partial"], "answer": [3], "explain": "Partial - failure of one or more components to impede the operation of a system.", "source": "Lecture 5 slide 7", "flag": "", "kind": "lecture"}, {"id": "w05-008", "week": 5, "topic": "System Failures", "type": "single", "q": "Which type of system failure causes a system to stop working temporarily or permanently?", "options": ["Partial", "Total", "Catastrophic", "Expectation"], "answer": [1], "explain": "Total - failure of one or more components that causes a system to stop working temporarily or permanently.", "source": "Lecture 5 slide 7", "flag": "", "kind": "lecture"}, {"id": "w05-009", "week": 5, "topic": "System Failures", "type": "single", "q": "In the 'Normal Accident' idea, what does complexity plus tight interaction give?", "options": ["graceful degradation", "partial failure only", "inadequate user training", "catastrophic potential", "process failure"], "answer": [3], "explain": "In the \"Normal Accident\" idea, complexity plus tight interaction gives catastrophic potential.", "source": "Lecture 5 slide 9", "flag": "", "kind": "lecture"}, {"id": "w05-010", "week": 5, "topic": "System Failures", "type": "single", "q": "What does 'tightly coupled' mean?", "options": ["one thing happens then another", "interacting elements with no 'buffer' or delay possible", "there are multiple routes between elements", "elements are backed up with dissimilar systems"], "answer": [1], "explain": "Tightly coupled means interacting elements with no \"buffer\" or delay possible. Linear means one thing then another, and complex means multiple routes.", "source": "Lecture 5 slide 9", "flag": "", "kind": "lecture"}, {"id": "w05-011", "week": 5, "topic": "System Failures", "type": "single", "q": "How many primary reasons for system failures does the lecture ask you to recall?", "options": ["Three", "Four", "Six", "Five", "Seven"], "answer": [2], "explain": "The learning objective is to recall the six primary reasons for system failures.", "source": "Lecture 5 slide 3", "flag": "", "kind": "lecture"}, {"id": "w05-012", "week": 5, "topic": "System Failures", "type": "single", "q": "How many types of system failure does the lecture give?", "options": ["Two", "Four", "Five", "Six", "Three"], "answer": [4], "explain": "The types of system failure are Partial, Total and Catastrophic.", "source": "Lecture 5 slide 7", "flag": "", "kind": "lecture"}, {"id": "w05-013", "week": 5, "topic": "System Failures", "type": "single", "q": "How many classifications of system failure does the lecture give?", "options": ["Three", "Five", "Six", "Four"], "answer": [3], "explain": "Classification of system failures lists process, correspondence, interaction and expectation failure.", "source": "Lecture 5 slide 6", "flag": "", "kind": "lecture"}, {"id": "w05-014", "week": 5, "topic": "System Failures", "type": "single", "q": "Which statement below is NOT correct for safety critical systems?", "options": ["fail-safe failure mode(s)", "graceful degradation on failure of sub-system", "rigorous testing", "multiple backups using similar systems/hardware/software", "rigorous external independent oversight of specification, design, testing, approval, implementation, operation processes and maintenance"], "answer": [3], "explain": "Safety critical systems need multiple backups using dissimilar systems/hardware/software, not similar.", "source": "Lecture 5 slide 19", "flag": "", "kind": "lecture"}, {"id": "w05-015", "week": 5, "topic": "System Failures", "type": "single", "q": "On what date did the Kegworth air crash flight take off from Heathrow?", "options": ["8th January 1989", "28th March 1979", "8th January 1979", "28th March 1989", "18th January 1989"], "answer": [0], "explain": "On the evening of 8th January 1989, British Midland Airways flight BD092 took off from Heathrow.", "source": "Lecture 5 slide 22", "flag": "", "kind": "lecture"}, {"id": "w05-016", "week": 5, "topic": "System Failures", "type": "single", "q": "Which aircraft was involved in the Kegworth air crash?", "options": ["Boeing 747-400", "Airbus A320", "Boeing 737-400", "Boeing 737-800", "Boeing 727-400"], "answer": [2], "explain": "British Midland Airways flight BD092 was a Boeing 737-400.", "source": "Lecture 5 slide 22", "flag": "", "kind": "lecture"}, {"id": "w05-017", "week": 5, "topic": "System Failures", "type": "single", "q": "In the Kegworth air crash, in which engine had a fan blade fractured?", "options": eed water pump to stop running", "a power cut at the control room", "the relief valve being closed by mistake"], "answer": [2], "explain": "A mechanical failure caused the main-feed water pump to stop running, firing a chain of events ending in partial nuclear meltdown.", "source": "Lecture 5 slide 23", "flag": "", "kind": "lecture"}, {"id": "w05-022", "week": 5, "topic": "System Failures", "type": "single", "q": "Is the following statement correct? 'At Three Mile Island, the light indicating the relief valve position reflected the actual state of the valve.'", "options": ["Correct", "Not correct"], "answer": [1], "explain": "The light only reflected the command sent, not the valve state.", "source": "Lecture 5 slide 23", "flag": "", "kind": "lecture"}, {"id": "w05-023", "week": 5, "topic": "System Failures", "type": "single", "q": "How many people suffered massive radiation overdoses because of the Therac-25 software bug?", "options": ["4", "6", "3", "47", "126"], "answer": [1], "explain": "Therac-25 ... massive radiation overdoses being administered to 6 people.", "source": "Lecture 5 slide 24", "flag": "", "kind": "lecture"}, {"id": "w05-024", "week": 5, "topic": "System Failures", "type": "single", "q": "What software problem caused the Therac-25 mechanical interlock to fail?", "options": ["a buffer overflow", "a unit conversion error", "a memory leak", "a race condition", "an unpatched operating system"], "answer": [3], "explain": "A software \"race condition\" made the mechanical interlock fail. That interlock applies the x-ray filter.", "source": "Lecture 5 slide 24", "flag": "", "kind": "lecture"}, {"id": "w05-025", "week": 5, "topic": "System Failures", "type": "single", "q": "In the Therac-25 session described, how many times was the process repeated with 'NO DOSE' showing?", "options": ["4", "2", "3", "6", "10"], "answer": [0], "explain": "The process was repeated 4 times, and each time it showed \"NO DOSE\".", "source": "Lecture 5 slide 24", "flag": "The slide text is \"This process was repeated 4 times\". It does not say whether the first press counts.", "kind": "lecture"}, {"id": "w05-026", "week": 5, "topic": "System Failures", "type": "single", "q": "Is the following statement correct? 'Failures due to a lack of training are not errors, they are mistakes by management.'", "options": ["Not correct", "Correct"], "answer": [1], "explain": "Slide on inadequate user training states exactly that.", "source": "Lecture 5 slide 15", "flag": "Same slide also says incorrect data input from a bad interface 'can be considered errors'.", "kind": "lecture"}, {"id": "w05-027", "week": 5, "topic": "System Failures", "type": "single", "q": "Which statement below is NOT correct?", "options": ["It is difficult to guard against faulty hardware", "There is no excuse for faulty code", "If the interface is poorly designed, user errors get introduced", "Bad training = loss of data integrity", "It is easy to guard against faulty hardware"], "answer": [4], "explain": "The Faulty Hardware slide says it is difficult to guard against faulty hardware and there is no excuse for faulty code.", "source": "Lecture 5 slide 13-15", "flag": "", "kind": "lecture"}, {"id": "w05-028", "week": 5, "topic": "System Failures", "type": "single", "q": "Which of these is NOT given as a reason for information system implementation?", "options": ["to increase productivity in order to maintain competitive advantage", "to reduce the number of stakeholders", "to re-engineer a process for efficiency", "adapt to a change in existing process", "introduce a new process"], "answer": [1], "explain": "The four reasons are increase productivity, re-engineer a process, adapt to a change in existing process, introduce a new process.", "source": "Lecture 5 slide 5", "flag": "", "kind": "lecture"}, {"id": "w05-029", "week": 5, "topic": "System Failures", "type": "single", "q": "According to the lecture, what is a poor fit between system and organisation often driven by?", "options": ["faulty hardware and poor testing", "inadequate training and stress", "incorrect assumptions and bad interfaces", "cost and poor specification"], "answer": [3], "explain": "A poor fit between system and organisation is often driven by cost and poor specification.", "source": "Lecture 5 slide 16", "flag": "", "kind": "lecture"}, {"id": "w05-030", "week": 5, "topic": "System Failures", "type": "single", "q": "What does the lecture say about the 'Incorrect Assumptions' cause?", "options": ["the interface is poorly designed", "development team guess, or don't check", "users are improperly trained", "the system is too costly"], "answer": [1], "explain": "Under Incorrect Assumptions, the development team guess or don't check.", "source": "Lecture 5 slide 12", "flag": "", "kind": "lecture"}, {"id": "w05-031", "week": 5, "topic": "System Failures", "type": "multi", "q": "What are the causes of system failures?", "options": ["faulty hardware", "poor fit between system and organisation", "poor development practices", "incorrect assumptions", "poor user interface"], "answer": [0, 1, 2, 3, 4], "explain": "The six causes are poor development practices, incorrect assumptions, poor user interface, faulty hardware, inadequate user training, and poor fit between system and organisation. All five options are on the list.", "source": "Lecture 5 slide 10 and 17", "flag": "", "kind": "lecture"}, {"id": "w05-032", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which of the following are causes of system failures?", "options": ["faulty hardware", "too much documentation", "incorrect assumptions", "inadequate user training", "excessive user testing"], "answer": [0, 2, 3], "explain": "The listed causes are poor development practices, incorrect assumptions, poor user interface, faulty hardware, inadequate user training, and poor fit between system and organisation.", "source": "Lecture 5 slide 10", "flag": "", "kind": "lecture"}, {"id": "w05-033", "week": 5, "topic": "System Failures", "type": "multi", "q": "What actions could reduce or prevent system failures?", "options": ["rigorous external independent oversight of specification and design", "fail-safe failure mode(s)", "multiple backups using similar systems/hardware/software", "graceful degradation on failure of sub-system", "rigorous testing"], "answer": [0, 1, 3, 4], "explain": "Backups should use dissimilar systems/hardware/software. The other four are on the safety critical systems slide.", "source": "Lecture 5 slide 19", "flag": "", "kind": "lecture"}, {"id": "w05-034", "week": 5, "topic": "System Failures", "type": "multi", "q": "Safety critical systems should have rigorous external independent oversight of which of the following?", "options": ["operation processes", "implementation", "testing", "specification", "maintenance (especially any changes to above)", "design", "approval"], "answer": [0, 1, 2, 3, 4, 5, 6], "explain": "All seven are listed under rigorous external independent oversight.", "source": "Lecture 5 slide 19", "flag": "", "kind": "lecture"}, {"id": "w05-035", "week": 5, "topic": "System Failures", "type": "multi", "q": "What would be the main reasons for system failure?", "options": ["use of dissimilar backup hardware", "no clear responsibility for dealing with failure", "large projects have a momentum of their own", "organisational culture such as unreasonable deadlines", "people not following procedures"], "answer": [1, 2, 3, 4], "explain": "The reasons for failure are people, meaning poor training, not following procedures and stress, organisational culture such as unreasonable deadlines, no clear responsibility, and large projects having a momentum of their own. Dissimilar backups are a prevention.", "source": "Lecture 5 slide 20", "flag": "", "kind": "lecture"}, {"id": "w05-036", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which are listed under organisational culture as reasons for failure?", "options": ["insufficient hardware urning sensation in her hip", "the machine paused displaying \"HTILT\"", "the patient died a month later of the cancer"], "answer": [0, 2, 4, 5, 6], "explain": "The slide says the machine paused with HTILT, NO DOSE was shown, the operator pressed proceed, the patient felt a burning sensation in her hip, and she died a month later.", "source": "Lecture 5 slide 24", "flag": "", "kind": "lecture"}, {"id": "w05-050", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which statements about inadequate user training are correct?", "options": ["Failures due to lack of training are user errors, not management's fault", "Failures due to lack of training are mistakes by management", "Improper training increases the likelihood of serious errors", "Bad training = loss of data integrity", "Training has no effect on data integrity"], "answer": [1, 2, 3], "explain": "The slide says lack of knowledge increases serious errors, bad training means loss of data integrity, and such failures are mistakes by management.", "source": "Lecture 5 slide 15", "flag": "", "kind": "lecture"}, {"id": "w05-051", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which statements about the 'Normal Accident' idea are correct?", "options": ["complexity + tight interaction = catastrophic potential", "complex has multiple routes", "linear is simple, one thing then another", "tightly coupled means no 'buffer' or delay possible"], "answer": [0, 1, 2, 3], "explain": "All four are on the Normal Accident slide.", "source": "Lecture 5 slide 9", "flag": "", "kind": "lecture"}, {"id": "w05-052", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which cause-case study pairings match the lecture?", "options": ["Kegworth - main-feed water pump failure", "Kegworth - the wrong engine was throttled back", "Three Mile Island - relief valve stuck open", "Therac-25 - software race condition", "Three Mile Island - software race condition"], "answer": [1, 2, 3], "explain": "In Kegworth, engine #2 was throttled back. At Three Mile Island, the valve stayed open and the main-feed water pump failed. In Therac-25, the cause was a race condition.", "source": "Lecture 5 slide 22-24", "flag": "", "kind": "lecture"}, {"id": "w05-053", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which statements about the lecture's definitions are correct?", "options": ["A failure is a group of items forming a unified whole", "A system is a regularly interacting or interdependent group of items forming a unified whole", "A failure is the state or condition of not meeting a desirable or intended objective", "A system is the state or condition of not meeting an intended objective"], "answer": [1, 2], "explain": "A system is a regularly interacting or interdependent group of items forming a unified whole. A failure is the state or condition of not meeting a desirable or intended objective.", "source": "Lecture 5 slide 4", "flag": "", "kind": "lecture"}, {"id": "w05-054", "week": 5, "topic": "System Failures", "type": "multi", "q": "Which of the following are listed among the reasons for failure?", "options": ["top management kept in dark", "failures/bureaucracy of internal/external 'independent' regulators", "rigorous testing", "large projects have a momentum of their own", "stress / pressure before / during / after"], "answer": [0, 1, 3, 4], "explain": "Slide 20 lists these reasons. Rigorous testing is a prevention on slide 19.", "source": "Lecture 5 slide 20", "flag": "", "kind": "lecture"}, {"id": "w05-055", "week": 5, "topic": "System Failures", "type": "multi", "q": "What are the stated learning objectives of the system failures lecture?", "options": ["recall the six primary reasons for system failures", "explain reasons for system failures", "define the term system failures", "classify types of system failures"], "answer": [0, 1, 2, 3], "explain": "All four objectives are on the slide.", "source": "Lecture 5 slide 3", "flag": "", "kind": "lecture"}, {"id"

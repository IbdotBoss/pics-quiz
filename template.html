<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="description" content="Practice questions and revision notes for the MOD002647 Professional Issues, Computing and Society in-class test.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='%23fff' stroke='%23141414' stroke-width='2.5'/%3E%3Cpath d='M9 9 23 23M23 9 9 23' stroke='%231b2f8a' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>PICS Test Practice</title>
<style>
@font-face{font-family:Archivo;src:url(data:font/woff2;base64,/*FONT_ARCHIVO*/) format("woff2");font-weight:400 800;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Reenie Beanie";src:url(data:font/woff2;base64,/*FONT_REENIE*/) format("woff2");font-display:swap}
:root{
  --paper:#fff;--desk:#e4e4e0;--ink:#141414;--ink-2:#4a4a4a;--hair:#c9c9c4;--pen:#1b2f8a;--red:#c4161c;--green:#1a7a3c;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:1.875rem;
}
*{box-sizing:border-box;border-radius:0}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.45 Archivo,Arial,Helvetica,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 20px 72px;background:var(--paper);min-height:100dvh}
@media (min-width:800px){body{background:var(--desk)}main{padding:48px 60px 96px}}
h1,h2,h3,legend,.cond{font-stretch:75%;font-weight:700}h1,h2,h3,.stem{text-wrap:balance}
h1{font-size:var(--t-xl);line-height:1.1;margin:0 0 6px}
h2{font-size:var(--t-l);margin:32px 0 8px}
h3{font-size:var(--t-m);font-stretch:100%;margin:20px 0 4px}
h1:focus,legend:focus,.note:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
.pen{stroke:var(--pen);stroke-width:2.6;fill:none;stroke-linecap:round}
.grn{stroke:var(--green);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.red{stroke:var(--red);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

button{font:600 1rem/1.2 Archivo,Arial,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);padding:11px 20px;min-height:44px;cursor:pointer}
button.p{background:var(--ink);color:var(--paper)}
button.l{border:0;padding:11px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:disabled{color:#767676;border-color:#767676;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);font-size:var(--t-s)}
.top b{font-stretch:75%;font-size:var(--t-m)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--red);font-weight:800}

/* cover page */
.cover{border-bottom:2px solid var(--ink);padding-bottom:14px}
.rules{margin:8px 0;padding-left:20px}.rules li{margin:4px 0}
.papers{border-top:2px solid var(--ink);margin-top:8px}
.paper{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;border-bottom:1px solid var(--ink);padding:14px 0}
.paper b{display:block;font-stretch:75%;font-size:var(--t-l);font-weight:700}
.paper span{display:block;color:var(--ink-2);font-size:var(--t-s)}
.paper .m{color:var(--ink);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}.acts button{padding:11px 16px}
@media (max-width:520px){.paper{grid-template-columns:1fr}}

/* the answer box, used for answers and for filters */
fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0}
.qn{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px}
.qn .cond{font-size:var(--t-l)}
.stem{font-size:var(--t-m);font-weight:600;font-stretch:100%;margin:6px 0 10px;white-space:pre-wrap}
.o{display:grid;grid-template-columns:24px 1fr 28px;gap:0 12px;align-items:start;padding:10px 0;position:relative;cursor:pointer}
.o input{position:absolute;left:0;top:10px;width:24px;height:24px;margin:0;opacity:0;cursor:pointer}
.box{width:24px;height:24px;border:1.5px solid var(--ink);position:relative;margin-top:1px;background:var(--paper)}
.box .x{position:absolute;inset:-5px;width:32px;height:32px;display:none}
.o input:checked + .box .x{display:block}
.o input:focus-visible + .box{outline:3px solid var(--pen);outline-offset:3px}
.o input:disabled{cursor:default}
.box .ring{position:absolute;inset:-10px;width:42px;height:42px}
.o small{display:block;color:var(--red);font-weight:600;font-size:var(--t-xs)}.o small.ok{color:var(--green)}
.o .mk{width:26px;height:28px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 24px}
.cols .o{grid-template-columns:24px 1fr}

.note{border-left:2.5px solid var(--ink);padding:2px 0 2px 12px;margin:14px 0 0 36px;font-size:var(--t-s)}
.note .s{display:block;margin-top:4px;font-size:var(--t-xs)}
.flag{border:1.5px solid var(--ink);padding:8px 12px;margin:12px 0 0 36px;font-size:var(--t-s)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}

details{margin-top:28px;border-top:1px solid var(--hair)}
summary{cursor:pointer;padding:12px 0;font-size:var(--t-s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:4px 0 16px}
.grid button{padding:0;min-height:40px;font-size:var(--t-s);font-weight:400;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);font-weight:700}
.grid .cur{outline:3px solid var(--pen);outline-offset:2px}

.score{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.score .n{font:400 5rem/1 "Reenie Beanie","Segoe Print",cursive;color:var(--red);position:relative;padding:4px 22px 0}
.score .n svg{position:absolute;inset:-4px 0;width:100%;height:calc(100% + 8px)}
table{border-collapse:collapse;width:100%;font-size:var(--t-s)}
td,th{border-bottom:1px solid var(--hair);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{border-bottom:1.5px solid var(--ink);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;white-space:nowrap}
.rev{border-top:2px solid var(--ink);margin-top:24px}

.tabs{display:flex;flex-wrap:wrap;gap:0 18px;border-bottom:2px solid var(--ink);margin-top:12px}
.tabs label{padding:10px 0 8px;cursor:pointer;border-bottom:4px solid transparent;font-size:var(--t-s);position:relative}
.tabs input{position:absolute;opacity:0}
.tabs label:has(input:checked){border-bottom-color:var(--ink);font-weight:700}
.tabs label:has(input:focus-visible){outline:3px solid var(--pen);outline-offset:2px}
.foot{margin-top:56px;border-top:2px solid var(--ink);padding-top:14px;text-align:center;font-size:var(--t-s)}
.foot .cond{font-size:var(--t-m);margin:0 0 4px}
.foot .gh{display:inline-flex;align-items:center;gap:6px;vertical-align:bottom;min-height:24px}
.notes{overflow-wrap:break-word}
.notes h1{font-size:var(--t-xl);margin-top:24px}
.notes h2{border-top:1px solid var(--ink);padding-top:14px}
.notes table{display:block;overflow-x:auto;margin:10px 0}
.notes li{margin:3px 0}
.notes code{font-size:.9em}
</style>
</head>
<body>
<main id="app"></main>
<noscript><p style="padding:20px">This practice paper needs JavaScript switched on.</p></noscript>
<script>
const DATA = /*DATA*/;
const WEEKS = {0:"2024-25 paper",1:"Week 1, Introduction and GDPR overview",2:"Week 2, Data Protection",3:"Week 3, Freedom of Information and Privacy",4:"Week 4, Sustainability",5:"Week 5, System Failures",6:"Week 6, Ethics",7:"Weeks 7 and 8, Computer Misuse Act and cyber bodies",9:"Week 9, Professionalism"};
const Q = DATA.questions, BYID = Object.fromEntries(Q.map(q => [q.id, q]));
const LS = "pics-quiz-v1";
let st = {wrong:{}, seen:{}, run:null, hist:[], prefs:{weeks:null, kinds:["lecture","seminar","reading"], n:20}};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const marks = q => q.type === "multi" ? 3 : 2;
const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const bank = Q.filter(q => q.week !== 0);
const weeksPresent = [...new Set(bank.map(q => q.week))].sort((a, b) => a - b);
const HASPAST = Q.some(q => q.week === 0), CORE = bank.filter(q => q.core);
let tick = null, first = true;
// After each re-render, put keyboard and screen-reader focus on the new view.
const focusOn = sel => { const e = app.querySelector(sel); if (e) { e.tabIndex = -1; e.focus({preventScroll:true}); } };
const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };

// Pen and red-pen marks. A few hand-drawn variants so a column of them does not look stamped.
const XS = ["M7 8C12 13 19 20 26 25M25 6C19 13 13 19 6 27", "M6 7C13 14 20 19 27 26M26 7C20 12 12 20 7 26", "M8 6C13 12 20 20 25 27M26 8C19 13 12 21 7 25"];
const xMark = i => `<svg class="x" viewBox="0 0 32 32" aria-hidden="true"><path class="pen" d="${XS[i % 3]}"/></svg>`;
const TICK = `<svg class="mk" viewBox="0 0 24 26" aria-hidden="true"><path class="grn" d="M3 14C6 17 8 20 9 23C12 15 16 8 22 3"/></svg>`;
const CROSS = `<svg class="mk" viewBox="0 0 24 26" aria-hidden="true"><path class="red" d="M4 5C9 10 15 17 20 22M20 4C14 10 9 16 4 22"/></svg>`;
const RING = `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><path class="red" d="M21 4C33 3 39 12 38 22C37 33 28 39 19 38C9 37 3 29 4 19C5 10 12 5 23 5"/></svg>`;

const FOOT = `<footer class="foot"><p class="cond">End of paper</p>
  <p>Created by <a href="https://www.ibrahimuthman.me/">Ibrahim Uthman</a>. If it helped, <a class="gh" href="https://github.com/IbdotBoss/pics-quiz">star it on GitHub<svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>.</p></footer>`;

// One answer row. state is "", "right", "missed" or "wrong" once the question has been marked.
function row(q, k, i, sel, type, state, locked) {
  const label = {right:"Right", missed:"Missed", wrong:"Wrong"}[state] || "";
  return `<label class="o"><input type="${type}" name="o" value="${k}" ${sel ? "checked" : ""} ${locked ? "disabled" : ""}>
    <span class="box">${xMark(i)}${state === "missed" ? RING : ""}</span>
    <span>${esc(q.options[k])}${label ? `<small${state === "right" ? ' class="ok"' : ""}>${label}</small>` : ""}</span>
    ${state === "right" ? TICK : state === "wrong" ? CROSS : "<span></span>"}</label>`;
}
const stateOf = (q, k, picked) => q.answer.includes(k) ? (picked.includes(k) ? "right" : "missed") : (picked.includes(k) ? "wrong" : "");
const feedback = q => `<div class="note"><span>${esc(q.explain)}</span><span class="s">${esc(q.source)}</span></div>${q.flag ? `<div class="flag"><b>Note.</b> ${esc(q.flag)}</div>` : ""}`;

function home() {
  clearInterval(tick);
  const wrongN = Object.keys(st.wrong).filter(id => BYID[id]).length;
  const resume = st.run && !st.run.done;
  const last = st.hist.slice(-5).reverse();
  app.innerHTML = `
  <header class="cover">
    <p class="s">MOD002647 Professional Issues, Computing and Society</p>
    <h1>In-class test practice</h1>
    <p>Time allowed 50 minutes.</p>
  </header>
  <h2>Guidelines for candidates</h2>
  <ul class="rules">
    <li>Answer ALL questions. Put a clear X in the box next to the answer you choose.</li>
    <li>Questions 1 to 20 have one correct answer and carry 2 marks each.</li>
    <li>Questions 21 to 40 have more than one correct answer and carry 3 marks each. Choose all of them.</li>
  </ul>
  <h2>Papers</h2>
  <div class="papers">
    ${resume ? paper("Resume " + st.run.title.toLowerCase(), "You stopped at question " + (st.run.i + 1) + ".", st.run.ids.length + " questions", [["resume", "Resume", 1]]) : ""}
    ${paper("Revision notes", "Acts and years, acronyms, numbers and the lists to know.", DATA.notes.length + " sheets", [["m-notes", "Open", 1]])}
    ${HASPAST ? paper("2024-25 past paper", "The real questions in their original order.", "40 questions, 50 min", [["s-past", "Study", 1], ["m-past", "Test"]]) : ""}
    ${paper("Core set", "One question for each list, body, Act and number on the cheat sheet.", CORE.length + " questions", [["s-core", "Study", 1], ["m-core", "Test"]])}
    ${paper("Practice by week", "Choose weeks, then study or test.", bank.length + " questions", [["m-prac", "Choose"]])}
    ${paper("Corrections", wrongN ? "The questions you got wrong." : "Nothing here until you get a question wrong.", wrongN + " to redo", [["s-wrong", "Study", 0, !wrongN], ["m-wrong", "Redo", 0, !wrongN]])}
    ${paper("Mock test", "New questions each time. Marked when you hand in.", "40 questions, 50 min", [["m-mock", "Test"]])}
  </div>
  ${last.length ? `<h2>Recent marks</h2><table><tr><th scope="col">Paper</th><th scope="col">Date</th><th scope="col" class="num">Mark</th></tr>${last.map(h => `<tr><td>${esc(h.title)}</td><td>${new Date(h.at).toLocaleDateString()}</td><td class="num">${h.score} of ${h.total}</td></tr>`).join("")}</table>` : ""}
  <h2>How it is marked</h2>
  <p class="s">Answers follow the lecture slides. Where a slide is unclear or disagrees with current law, the question carries a note. A choose-all question scores 3 only when every box is right.</p>${FOOT}`;
  if (!first) focusOn("h1"); first = false;
  on("resume", () => show());
  on("m-mock", startMock);
  on("m-prac", setup);
  const pastIds = Q.filter(q => q.week === 0).map(q => q.id), wrongIds = () => Object.keys(st.wrong).filter(id => BYID[id]).sort();
  const pastTest = () => start({title:"2024-25 past paper", ids:pastIds, exam:true, keepOrder:true, limit:50 * 60});
  const coreTest = () => start({title:"Core set", ids:leastSeen(CORE).map(q => q.id), exam:false});
  const wrongTest = () => start({title:"Corrections", ids:shuffle(wrongIds()), exam:false});
  on("s-past", () => study("2024-25 past paper", pastIds, pastTest));
  on("s-core", () => study("Core set", CORE.map(q => q.id), coreTest));
  on("m-core", coreTest);
  on("s-wrong", () => study("Corrections", wrongIds(), wrongTest));
  on("m-past", pastTest); on("m-wrong", wrongTest);
  on("m-notes", () => notes(DATA.notes[0] && DATA.notes[0].week));
}

// One row on the papers list. btns is a list of [id, label, primary, disabled].
function paper(title, desc, meta, btns) {
  return `<div class="paper"><div><b>${esc(title)}</b><span>${esc(desc)}</span><span class="m">${esc(meta)}</span></div>
    <div class="acts">${btns.map(b => `<button id="${b[0]}" class="${b[2] ? "p" : ""}" ${b[3] ? "disabled" : ""} aria-label="${esc(b[1] + ", " + title)}">${b[1]}</button>`).join("")}</div></div>`;
}
const leastSeen = qs => shuffle(qs).sort((a, b) => (st.seen[a.id] || 0) - (st.seen[b.id] || 0));

// Study view. Every question on one page with the right answers already marked.
function study(title, ids, test) {
  clearInterval(tick);
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button><b>Study</b><span class="s">${ids.length} questions</span></div>
  <h1 style="margin-top:20px">${esc(title)}</h1>
  <p class="s">Each right answer is marked. Read through, then test yourself on the same questions.</p>
  <div class="nav"><span></span><button id="t1">Test me now</button></div>
  ${ids.map((id, i) => { const q = BYID[id]; return `<div class="rev"><div class="qn"><span class="cond">Question ${i + 1}</span><span>(${marks(q)} marks)</span></div><p class="stem">${esc(q.q)}</p>
    ${q.options.map((o, k) => row(q, k, k, q.answer.includes(k), "checkbox", q.answer.includes(k) ? "right" : "", true)).join("")}${feedback(q)}</div>`; }).join("")}
  <div class="nav"><button id="up">Back to the top</button><button class="p" id="t2">Now test me</button></div>${FOOT}`;
  focusOn("h1"); window.scrollTo(0, 0);
  on("back", () => home()); on("t1", test); on("t2", test); on("up", () => { window.scrollTo(0, 0); focusOn("h1"); });
}

function startMock() {
  const lec = bank.filter(q => q.kind !== "reading"), rd = bank.filter(q => q.kind === "reading");
  const pick = type => {
    const fresh = q => (st.seen[q.id] || 0);
    const byWeek = {};
    shuffle(lec.filter(q => q.type === type)).sort((a, b) => fresh(a) - fresh(b)).forEach(q => (byWeek[q.week] = byWeek[q.week] || []).push(q));
    // Weighted like the 2024-25 paper: data protection, CMA and FOI carry most of it.
    const quota = {2:4, 7:4, 3:3, 5:2, 6:2, 1:1, 4:1, 9:1}, out = [];
    for (const w in quota) out.push(...(byWeek[w] || []).splice(0, quota[w]));
    const rest = shuffle(Object.values(byWeek).flat());
    while (out.length < 18 && rest.length) out.push(rest.pop());
    out.push(...shuffle(rd.filter(q => q.type === type)).slice(0, 20 - out.length));
    // On the 2024-25 paper, 8 of the 20 choose-all questions have every option correct. Swap questions to match, same week first.
    if (type === "multi") {
      const all = q => q.answer.length === q.options.length;
      const swap = (want, have) => {
        const spare = lec.filter(q => q.type === "multi" && want(q) && !out.includes(q)).sort((a, b) => fresh(a) - fresh(b));
        for (const q of spare) {
          if (out.filter(all).length === 8) break;
          let i = out.findIndex(o => have(o) && o.week === q.week);
          if (i < 0) i = out.findIndex(have);
          if (i >= 0) out[i] = q;
        }
      };
      if (out.filter(all).length < 8) swap(all, q => !all(q)); else swap(q => !all(q), all);
    }
    return shuffle(out).map(q => q.id);
  };
  start({title:"Mock test", ids:[...pick("single"), ...pick("multi")], exam:true, limit:50 * 60});
}

function setup() {
  const p = st.prefs; if (!p.weeks) p.weeks = weeksPresent.slice();
  const count = () => bank.filter(q => p.weeks.includes(q.week) && p.kinds.includes(q.kind)).length;
  const tickBox = (group, type, v, text, checked, i) => `<label class="o"><input type="${type}" name="${group}" value="${v}" ${checked ? "checked" : ""}><span class="box">${xMark(i)}</span><span>${text}</span></label>`;
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button></div>
  <h1 style="margin-top:20px">Practice by week</h1>
  <fieldset id="wk"><legend><h2>Weeks</h2></legend><div class="cols">${weeksPresent.map((w, i) => tickBox("wk", "checkbox", w, `${esc(WEEKS[w] || "Week " + w)} <span class="s">${bank.filter(q => q.week === w).length}</span>`, p.weeks.includes(w), i)).join("")}</div></fieldset>
  <fieldset id="kd"><legend><h2>Taken from</h2></legend><div class="cols">${[["lecture","Lecture slides"],["seminar","Seminar slides"],["reading","Set readings"]].map(([k, t], i) => tickBox("kd", "checkbox", k, t, p.kinds.includes(k), i)).join("")}</div></fieldset>
  <fieldset id="nn"><legend><h2>Number of questions</h2></legend><div class="cols">${[10, 20, 40, 0].map((n, i) => tickBox("n", "radio", n, n || "All of them", p.n === n, i)).join("")}</div></fieldset>
  <p class="s" id="cnt" aria-live="polite"></p><div class="nav"><button id="go">Test me</button><button class="p" id="sg">Study these</button></div>`;
  const upd = () => {
    p.weeks = [...document.querySelectorAll("#wk input:checked")].map(e => +e.value);
    p.kinds = [...document.querySelectorAll("#kd input:checked")].map(e => e.value);
    p.n = +document.querySelector("#nn input:checked").value; save();
    const c = count();
    document.getElementById("cnt").textContent = c ? c + " questions match. The ones you have seen least come first." : "No questions match. Tick at least one week and one source.";
    document.getElementById("go").disabled = document.getElementById("sg").disabled = !c;
  };
  app.querySelectorAll("input").forEach(e => e.onchange = upd); upd(); focusOn("h1");
  on("back", () => home());
  const pool = () => bank.filter(q => p.weeks.includes(q.week) && p.kinds.includes(q.kind));
  const test = () => { let x = leastSeen(pool()); if (p.n) x = x.slice(0, p.n); start({title:"Practice", ids:shuffle(x).map(q => q.id), exam:false}); };
  on("go", test);
  on("sg", () => { let x = leastSeen(pool()); if (p.n) x = x.slice(0, p.n); study("Practice by week", x.map(q => q.id).sort(), () => start({title:"Practice", ids:shuffle(x).map(q => q.id), exam:false})); });
}

function start(o) {
  const order = {};
  o.ids.forEach(id => { const n = BYID[id].options.length, idx = [...Array(n).keys()]; order[id] = o.keepOrder ? idx : shuffle(idx); });
  st.run = {title:o.title, ids:o.ids, exam:!!o.exam, limit:o.limit || 0, t0:Date.now(), i:0, ans:{}, checked:{}, order, done:false};
  save(); show();
}

function show() { const r = st.run; if (!r) return home(); r.done ? results() : question(); }
function timeLeft() { const r = st.run; return Math.max(0, r.limit - Math.floor((Date.now() - r.t0) / 1000)); }
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function question() {
  clearInterval(tick);
  const r = st.run, q = BYID[r.ids[r.i]], picked = r.ans[q.id] || [], checked = !r.exam && r.checked[q.id];
  const multi = q.type === "multi", n = r.ids.length, good = same(picked, q.answer);
  const opts = r.order[q.id].map((k, i) => row(q, k, i, picked.includes(k), multi ? "checkbox" : "radio", checked ? stateOf(q, k, picked) : "", checked)).join("");
  const answered = Object.values(r.ans).filter(a => a.length).length;
  app.innerHTML = `
  <div class="top"><button class="l" id="quit">${r.exam ? "Save and leave" : "Leave"}</button><b>${esc(r.title)}</b>${r.limit ? `<span class="timer" id="tm" role="timer" aria-label="Time left"></span>` : `<span class="s">${r.i + 1} of ${n}</span>`}</div>
  <fieldset>
    <legend>
      <span class="qn"><span class="cond">Question ${r.i + 1}${r.limit ? ` <span class="s" style="font-stretch:100%;font-weight:400">of ${n}</span>` : ""}</span><span>${checked ? `${good ? marks(q) : 0} of ${marks(q)}` : `(${marks(q)} marks)`}</span></span>
      <span class="s" style="display:block;font-stretch:100%;font-weight:400">${multi ? "More than one answer is correct. Choose ALL of them." : "Choose ONE answer."}</span>
      <span class="stem" style="display:block">${esc(q.q)}</span>
    </legend>
    ${opts}
  </fieldset>
  ${checked ? `<div role="status">${feedback(q)}</div>` : ""}
  <div class="nav">
    <button id="prev" ${r.i ? "" : "disabled"}>Previous</button>
    ${r.exam ? (r.i < n - 1 ? `<button class="p" id="next">Next</button>` : `<button class="p" id="fin">Hand in</button>`)
      : (checked ? `<button class="p" id="next">${r.i < n - 1 ? "Next" : "See marks"}</button>` : `<button class="p" id="chk" ${picked.length ? "" : "disabled"}>Mark it</button>`)}
  </div>
  ${r.exam ? `<details ${n > 40 ? "" : "open"}><summary>Go to a question. ${answered} of ${n} answered.</summary><div class="grid">${r.ids.map((id, i) => `<button data-i="${i}" class="${(r.ans[id] || []).length ? "done" : ""} ${i === r.i ? "cur" : ""}" aria-label="Question ${i + 1}, ${(r.ans[id] || []).length ? "answered" : "not answered"}"${i === r.i ? ' aria-current="true"' : ""}>${i + 1}</button>`).join("")}</div><button id="fin2">Hand in</button></details>` : ""}`;
  app.querySelectorAll("input[name=o]").forEach(e => e.onchange = () => {
    r.ans[q.id] = [...app.querySelectorAll("input[name=o]:checked")].map(x => +x.value); save();
    const c = document.getElementById("chk"); if (c) c.disabled = !r.ans[q.id].length;
  });
  focusOn(checked ? ".note" : "legend");
  const go = i => { r.i = i; save(); question(); window.scrollTo(0, 0); };
  on("quit", () => { if (!r.exam) { r.done = true; st.run = null; save(); } home(); });
  on("prev", () => go(r.i - 1));
  on("next", () => r.i < n - 1 ? go(r.i + 1) : finish());
  on("chk", () => { r.checked[q.id] = true; record(q, same(r.ans[q.id] || [], q.answer)); save(); question(); });
  const fin = () => { const left = r.ids.filter(id => !(r.ans[id] || []).length).length; if (!left || confirm(left + (left === 1 ? " question is" : " questions are") + " not answered. Hand in anyway? You cannot change answers afterwards.")) finish(); };
  on("fin", fin); on("fin2", fin);
  app.querySelectorAll(".grid button").forEach(b => b.onclick = () => go(+b.dataset.i));
  if (r.limit) {
    const tm = document.getElementById("tm");
    const upd = () => { const s = timeLeft(); tm.textContent = fmt(s) + " left"; tm.classList.toggle("low", s < 300); if (!s) { clearInterval(tick); finish(); } };
    upd(); tick = setInterval(upd, 1000);
  }
}

function record(q, ok) {
  st.seen[q.id] = (st.seen[q.id] || 0) + 1;
  if (ok) delete st.wrong[q.id]; else st.wrong[q.id] = 1;
}

function finish() {
  clearInterval(tick);
  const r = st.run; let score = 0, total = 0;
  r.ids.forEach(id => { const q = BYID[id], ok = same(r.ans[id] || [], q.answer); total += marks(q); if (ok) score += marks(q); if (r.exam) record(q, ok); });
  r.done = true; r.score = score; r.total = total; r.took = Math.floor((Date.now() - r.t0) / 1000);
  st.hist.push({title:r.title, score, total, at:Date.now()}); st.hist = st.hist.slice(-30);
  save(); results(); window.scrollTo(0, 0);
}

function results() {
  const r = st.run, by = {}, past = r.ids.some(id => BYID[id].week === 0);
  r.ids.forEach(id => { const q = BYID[id], k = q.week === 0 ? q.topic : (WEEKS[q.week] || q.week), ok = same(r.ans[id] || [], q.answer); by[k] = by[k] || [0, 0]; by[k][1]++; if (ok) by[k][0]++; });
  const right = r.ids.filter(id => same(r.ans[id] || [], BYID[id].answer)).length;
  const areas = Object.entries(by).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]);
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button><b>${esc(r.title)}</b><span></span></div>
  <h1 style="margin-top:20px">Your mark</h1>
  <div class="score"><span class="n" aria-hidden="true">${r.score}<svg viewBox="0 0 120 90" preserveAspectRatio="none"><path class="red" style="stroke-width:2.2" vector-effect="non-scaling-stroke" d="M62 6C96 3 116 22 114 46C112 72 84 86 54 84C24 82 4 66 6 42C8 20 34 6 70 8"/></svg></span>
  <p><b>${r.score} out of ${r.total}.</b> ${right} of ${r.ids.length} questions right in ${fmt(r.took)}${r.limit && r.took >= r.limit ? ". Time ran out" : ""}.</p></div>
  <h2>By ${past ? "topic" : "week"}</h2>
  <table><tr><th scope="col">${past ? "Topic" : "Week"}</th><th scope="col" class="num">Right</th></tr>${areas.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v[0]} of ${v[1]}</td></tr>`).join("")}</table>
  <h2>Marked paper</h2><button id="only">Show wrong answers only</button><div id="rev"></div>${FOOT}`;
  const draw = wrongOnly => {
    document.getElementById("rev").innerHTML = r.ids.map((id, i) => {
      const q = BYID[id], pk = r.ans[id] || [], ok = same(pk, q.answer);
      if (wrongOnly && ok) return "";
      return `<div class="rev"><div class="qn"><span class="cond">Question ${i + 1}</span><span>${ok ? marks(q) : 0} of ${marks(q)}${pk.length ? "" : ", not answered"}</span></div><p class="stem">${esc(q.q)}</p>
      ${r.order[id].map((k, j) => row(q, k, j, pk.includes(k), "checkbox", stateOf(q, k, pk), true)).join("")}${feedback(q)}</div>`;
    }).join("") || "<p>No wrong answers in this paper.</p>";
  };
  let wo = false; draw(wo); focusOn("h1");
  on("only", e => { wo = !wo; e.target.textContent = wo ? "Show every question" : "Show wrong answers only"; draw(wo); });
  on("back", () => { st.run = null; save(); home(); });
}

function notes(week) {
  const n = DATA.notes.find(x => x.week === week) || DATA.notes[0];
  app.innerHTML = `<div class="top"><button class="l" id="back">Back to papers</button><b>Revision notes</b><span></span></div>
  <div class="tabs">${DATA.notes.map(x => `<label><input type="radio" name="w" value="${x.week}" ${x === n ? "checked" : ""}>${x.week === 0 ? "Cheat sheet" : (x.week === 7 ? "Weeks 7 and 8" : "Week " + x.week)}</label>`).join("")}</div>
  <div class="notes">${n ? n.html : "<p>No notes yet.</p>"}</div>`;
  app.querySelectorAll("input[name=w]").forEach(e => e.onchange = () => { notes(+e.value); app.querySelector("input[name=w]:checked").focus(); });
  on("back", () => home());
}

if (st.run && !st.run.ids.every(id => BYID[id])) st.run = null;
home();
</script>
</body>
</html>
